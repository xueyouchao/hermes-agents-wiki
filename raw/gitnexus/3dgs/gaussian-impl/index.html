, the import fails silently and `fast_ssim` / `FusedSSIMMap` will raise at call time. The pure-PyTorch `ssim` always works as a fallback.\n\n## Integration with the Codebase\n\n| Caller | Functions Used | Purpose |\n|--------|---------------|---------|\n| `train.py` (training loop) | `l1_loss`, `ssim` | Combined reconstruction loss: `L = (1 - λ)·L1 + λ·(1 - SSIM)` |\n| `train.py` (`training_report`) | `l1_loss` | Logging training metrics |\n| `metrics.py` (`evaluate`) | `ssim`, `l1_loss` | Computing final evaluation scores |\n\nThe typical training loss combines L1 and SSIM with a weighting parameter λ (commonly 0.2):\n\n```python\nLl1 = l1_loss(render, gt)\nloss = (1.0 - opt.lambda_dssim) * Ll1 + opt.lambda_dssim * (1.0 - ssim(render, gt))\n```\n\n## Implementation Details\n\n**Window creation and device handling:** `create_window` returns a `Variable`-wrapped tensor. `ssim` automatically moves the window to the same device and dtype as the input images, so no manual device management is needed.\n\n**Padding:** The convolution in `_ssim` uses `padding = window_size // 2`, ensuring the output SSIM map has the same spatial dimensions as the input images.\n\n**Gradient flow:** In `FusedSSIMMap.backward`, `img1` is saved via `.detach()` while `img2` is saved with gradients intact. Gradients propagate only through `img1` (the rendered image), which is the correct behavior during training where only the rendering needs gradient updates.","lpips-module":"# LPIPS Module\n\n# LPIPS Module\n\n## Overview\n\nThis module implements **Learned Perceptual Image Patch Similarity (LPIPS)**, a perceptual distance metric that quantifies how visually different two images are. Unlike pixel-level metrics (MSE, PSNR), LPIPS leverages deep feature representations from pretrained networks and a set of learned linear weights to produce a distance that correlates with human judgment of visual similarity.\n\nLower LPIPS values indicate greater perceptual similarity. A value of 0 means identical images.\n\n## Architecture\n\n```mermaid\ngraph TD\n    X[\"Input x\"] --> NET[\"Feature Network<br/>(AlexNet / SqueezeNet / VGG16)\"]\n    Y[\"Input y\"] --> NET\n    NET --> FX[\"Feature maps x\"]\n    NET --> FY[\"Feature maps y\"]\n    FX --> DIFF[\"Squared difference<br/>per layer\"]\n    FY --> DIFF\n    DIFF --> LIN[\"LinLayers<br/>(1×1 conv, frozen)\"]\n    LIN --> MEAN[\"Spatial mean pooling\"]\n    MEAN --> SUM[\"Sum across layers\"]\n    SUM --> OUT[\"LPIPS distance\"]\n```\n\n## Usage\n\n### Convenience Function\n\n```python\nimport torch\nfrom lpipsPyTorch import lpips\n\nx = torch.randn(1, 3, 64, 64)  # images in [-1, 1] or [0, 1] range\ny = torch.randn(1, 3, 64, 64)\n\ndistance = lpips(x, y, net_type='alex')  # scalar tensor\n```\n\nThis creates a temporary `LPIPS` criterion, moves it to the device of `x`, and computes the distance. For repeated evaluations, use the module directly to avoid re-instantiation.\n\n### Module Interface\n\n```python\nfrom lpipsPyTorch import LPIPS\n\ncriterion = LPIPS(net_type='vgg').to('cuda')\ndist1 = criterion(img_a, img_b)\ndist2 = criterion(img_c, img_d)  # reuses same instance\n```\n\n**Arguments:**\n\n| Parameter  | Type  | Default  | Description                                        |\n|------------|-------|----------|----------------------------------------------------|\n| `net_type` | `str` | `'alex'` | Feature backbone: `'alex'`, `'squeeze'`, or `'vgg'` |\n| `version`  | `str` | `'0.1'`  | LPIPS weight version. Currently only `'0.1'` is supported. |\n\n**Input tensors** `x` and `y` must share the same shape: `(N, 3, H, W)`.\n\n**Output** shape: `(N, 1, 1, 1)` — a per-sample scalar distance (use `.item()` or `.squeeze()` as needed).\n\n## How It Works\n\n### 1. Feature Extraction\n\nEach backbone network (`AlexNet`, `SqueezeNet`, `VGG16`) inherits from `BaseNet`, which:\n\n1. **Z-score normalizes** the input using per-channel statistics (mean and std registered as buffers). These are *not* standard ImageNet normalization values — they are specific to LPIPS.\n2. **Propagates** the input through the network's feature layers sequentially.\n3. **Extracts activations** at designated target layers, applying L2 channel-wise normalization via `normalize_activation` (divides each spatial position's channel vector by its L2 norm, with `eps=1e-10` for stability).\n4. **Stops early** once all target layers have been captured.\n\nAll backbone parameters are frozen (`requires_grad=False`).\n\n### 2. Target Layers and Channel Counts\n\n| Network     | Target Layer Indices | Channel List                              |\n|-------------|----------------------|-------------------------------------------|\n| `AlexNet`   | 2, 5, 8, 10, 12     | 64, 192, 384, 256, 256                    |\n| `SqueezeNet`| 2, 5, 8, 10, 11, 12, 13 | 64, 128, 256, 384, 384, 512, 512    |\n| `VGG16`     | 4, 9, 16, 23, 30    | 64, 128, 256, 512, 512                    |\n\nLayer indices correspond to positions in the `features` Sequential module of each torchvision model. The channel list (`n_channels_list`) reports the output channel dimension at each target layer and determines the architecture of the linear calibration layers.\n\n### 3. Learned Linear Calibration (`LinLayers`)\n\nFor each extracted feature layer, a `1×1` convolution maps from `n_channels → 1` with no bias. These layers:\n\n- Are initialized from **pretrained LPIPS weights** downloaded from the [original LPIPS repository](https://github.com/richzhang/PerceptualSimilarity) via `get_state_dict`.\n- Are **frozen** (`requires_grad=False`) — they encode the learned importance of each channel for perceptual distance.\n- Are wrapped in `nn.ModuleList` so they can be indexed in parallel with the feature list.\n\n### 4. Distance Computation\n\nThe `LPIPS.forward` method:\n\n```python\nfeat_x, feat_y = self.net(x), self.net(y)          # extract features\ndiff = [(fx - fy) ** 2 for fx, fy in zip(feat_x, feat_y)]  # squared diff per layer\nres = [l(d).mean((2, 3), True) for d, l in zip(diff, self.lin)]  # calibrate + spatial mean\nreturn torch.sum(torch.cat(res, 0), 0, True)       # sum across layers\n```\n\nStep by step:\n1. Extract multi-scale features from both images.\n2. Compute the **squared difference** at each layer.\n3. Apply the corresponding **linear calibration** (1×1 conv) and take the **spatial mean** (averaging over H and W dimensions).\n4. **Sum** the calibrated distances across all layers to produce the final scalar.\n\n## Weight Loading\n\n`get_state_dict` in `modules/utils.py` handles downloading and key remapping:\n\n- Downloads `.pth` files from `https://raw.githubusercontent.com/richzhang/PerceptualSimilarity/master/lpips/weights/v{version}/{net_type}.pth`\n- Maps to CPU when CUDA is unavailable.\n- Strips `lin` and `model.` prefixes from state dict keys to match the `LinLayers` module structure.\n\nWeights are cached by `torch.hub` after the first download.\n\n## Integration with External Code\n\nThe module is typically called from an evaluation pipeline:\n\n```\nmetrics.py  →  lpips()  (convenience function in __init__.py)\n```\n\nFor batch evaluation or integration into training loops, instantiate `LPIPS` once and reuse it to avoid repeated weight downloads and model construction overhead.\n\n## Notes\n\n- **Input range**: The z-score normalization in `BaseNet` applies fixed mean/std values. Ensure your input tensors are in a consistent range (the original LPIPS paper uses [−1, 1] via a `2x - 1` transform from [0, 1] inputs, but the hardcoded z-score values here suggest a specific expected distribution — verify compatibility with your data pipeline).\n- **No gradients through backbone**: Both the feature network and linear layers have `requires_grad=False`. To compute gradients through LPIPS (e.g., for perceptual loss optimization), you must re-enable gradients on the backbone via `net.set_requires_grad(True)` and on the linear layers by setting their parameters' `requires_grad` to `True`.\n- **Version support**: Only version `'0.1'` is implemented. Attempting other values raises an `AssertionError`.","other":"# Other\n\n# 3D Gaussian Splatting — Project Configuration, Evaluation & Extended Features\n\n## Overview\n\nThis module covers the top-level project infrastructure: the Conda environment definition, the evaluation and benchmarking framework, and the extended feature set added after the original publication. These components sit outside the core training/rendering pipeline but are essential for reproducibility, quality improvement, and measuring results against published baselines.\n\nThe codebase has four primary components that this documentation ties together:\n\n```mermaid\ngraph TD\n    A[Environment & Dependencies] --> B[Optimizer / train.py]\n    A --> C[SIBR Viewers]\n    B --> D[render.py / metrics.py]\n    D --> E[full_eval.py]\n    F[Extended Features] --> B\n    F --> D\n    G[convert.py] --> B\n```\n\n---\n\n## Environment Setup\n\nThe Conda environment is defined in `environment.yml` and pins specific versions for reproducibility:\n\n| Package | Version | Notes |\n|---------|---------|-------|\n| Python | 3.7.13 | Pinned |\n| PyTorch | 1.12.1 | Must match CUDA runtime |\n| torchvision | 0.13.1 | |\n| torchaudio | 0.12.1 | |\n| cudatoolkit | 11.6 | **Known issues with 11.6**; 11.8 recommended |\n| plyfile | — | PLY I/O for Gaussian models |\n| tqdm | — | Progress bars |\n\n### Pip-installed submodules\n\nThree local submodules are installed via pip from `submodules/`:\n\n- **`diff-gaussian-rasterization`** — The differentiable rasterizer. Swap to the `3dgs_accel` branch for the accelerated version (see [Training Speed Acceleration](#training-speed-acceleration)).\n- **`simple-knn`** — K-nearest neighbors used during initialization.\n- **`fused-ssim`** — Fused SSIM loss implementation for faster training.\n\nAdditional pip dependencies: `opencv-python`, `joblib`.\n\n### Creating the environment\n\n```shell\nconda env create --file environment.yml\nconda activate gaussian_splatting\n```\n\nTo avoid filling the system drive with Conda packages:\n\n```shell\nconda config --add pkgs_dirs <Drive>/<pkg_path>\nconda env create --file environment.yml --prefix <Drive>/<env_path>/gaussian_splatting\nconda activate <Drive>/<env_path>/gaussian_splatting\n```\n\n### Compatibility with newer stacks\n\nLimited testing confirms the codebase works with Python 3.8, PyTorch 2.0.0, and CUDA 12. The critical requirement is that PyTorch's CUDA runtime version matches the installed CUDA SDK with no major version mismatch.\n\n---\n\n## Evaluation Framework\n\n### Single-scene evaluation\n\nThree scripts run in sequence:\n\n```shell\npython train.py -s <dataset> --eval        # Train with held-out test set\npython render.py -m <model_path>            # Render train + test views\npython metrics.py -m <model_path>           # Compute L1, PSNR, SSIM, LPIPS\n```\n\n`render.py` auto-reads training parameters from the model directory. You can override `--source_path`, `--resolution`, `--white_background`, `--convert_SHs_python`, and `--convert_cov3D_python` on the command line.\n\n`metrics.py` accepts a space-separated list of model paths via `--model_paths / -m`.\n\n### Full benchmark evaluation\n\n`full_eval.py` reproduces the paper's evaluation across all three benchmark datasets:\n\n```shell\npython full_eval.py -m360 <mipnerf360> -tat <tanks_and_temples> -db <deep_blending>\n```\n\nKey flags:\n\n| Flag | Purpose |\n|------|---------|\n| `--skip_training` | Skip training; evaluate pre-trained models |\n| `--skip_rendering` | Skip rendering; compute metrics on existing images |\n| `--skip_metrics` | Skip metric computation |\n| `--output_path` | Output directory (default `./eval`) |\n\nWhen evaluating pre-trained models, specify their location with `-o` and provide source dataset paths. When computing metrics on pre-rendered evaluation images, source datasets are unnecessary.\n\nFull evaluation takes ~7 hours on an A6000.\n\n---\n\n## Extended Features\n\nThese features were integrated after the original release and are controlled via command-line flags during training and rendering.\n\n### Training Speed Acceleration\n\nReplaces the default rasterizer with the [Taming-3DGS](https://humansensinglab.github.io/taming-3dgs/) accelerated version and adds a fused SSIM loss.\n\n**Installation:**\n\n```bash\npip uninstall diff-gaussian-rasterization -y\ncd submodules/diff-gaussian-rasterization\nrm -r build\ngit checkout 3dgs_accel\npip install .\n```\n\n**Usage:**\n\n| `--optimizer_type` | Speedup | Notes |\n|--------------------|---------|-------|\n| `default` | ~1.6× | Drop-in replacement |\n| `sparse_adam` | ~2.7× | Sparse Adam optimizer |\n\nThe accelerated rasterizer has behavioral differences from the original. Quality metrics vary slightly depending on the optimizer choice and whether depth regularization or anti-aliasing are also enabled (see `results.md` for per-scene breakdowns).\n\n### Depth Regularization\n\nUses monocular depth maps as priors during optimization. Most effective on untextured regions (roads, walls) and for removing floating artifacts. Integrated from the [Hierarchical 3DGS](https://repo-sam.inria.fr/fungraph/hierarchical-3d-gaussians/) paper.\n\n**Setup for real-world datasets:**\n\n1. Clone [Depth Anything v2](https://github.com/DepthAnything/Depth-Anything-V2) and download the `depth_anything_v2_vitl.pth` weights to `checkpoints/`.\n2. Generate depth maps:\n   ```bash\n   python Depth-Anything-V2/run.py --encoder vitl --pred-only --grayscale \\\n       --img-path <input_images> --outdir <output_path>\n   ```\n3. Generate scale parameters:\n   ```bash\n   python utils/make_depth_scale.py --base_dir <colmap_path> --depths_dir <depths_path>\n   ```\n\n**Training flag:** `-d <path to depth maps>`\n\nFor synthetic datasets, depth maps can be produced directly without the above pipeline.\n\n**Quality impact:** Improves Deep Blending scenes significantly; effect varies on other datasets and can occasionally degrade results.\n\n### Exposure Compensation\n\nOptimizes a per-image 3×4 affine transform to handle exposure variations in \"in the wild\" captures (e.g., smartphone photos with auto-exposure). Based on the approach from [Hierarchical 3DGS](https://repo-sam.inria.fr/fungraph/hierarchical-3d-gaussians/).\n\n**Training flags:**\n\n```\n--exposure_lr_init 0.001\n--exposure_lr_final 0.0001\n--exposure_lr_delay_steps 5000\n--exposure_lr_delay_mult 0.001\n--train_test_exp\n```\n\nThe `--train_test_exp` flag changes the train/test split: the left half of test images is included in training (to optimize their exposure transforms), and only the right half is used for testing. **Metrics from this mode are not comparable to standard evaluation** because the split differs.\n\nExposure compensation is applied during training only; it is not applied during real-time navigation in the viewer.\n\n### Anti-aliasing\n\nIntegrates the EWA filter from [Mip Splatting](https://niujinshuchong.github.io/mip-splatting/) to reduce aliasing artifacts.\n\n**Training flag:** `--antialiasing`\n\n**Rendering flag:** `--antialiasing` (must match training setting)\n\n**Viewer:** Toggle anti-aliasing from the floating menu; enable it when viewing a model trained with `--antialiasing`.\n\n---\n\n## Feature Compatibility Matrix\n\nThe extended features are designed to be composable. The following combinations have been tested and benchmarked in `results.md`:\n\n| Feature | Default Rasterizer | Accelerated Rasterizer (default optimizer) | Accelerated Rasterizer (sparse_adam) |\n|---------|--------------------|---------------------------------------------|--------------------------------------|\n| Depth regularization | ✓ | ✓ | ✓ |\n| Anti-aliasing | ✓ | ✓ | ✓ |\n| Exposure compensation | ✓ | ✓ | ✓ |\n| Depth + Anti-aliasing | ✓ | ✓ | ✓ |\n| All three | ✓ | ✓ | ✓ |\n\nQuality metrics (PSNR, SSIM, LPIPS) for every combination across MipNeRF360, Tanks&Temples, and Deep Blending datasets are charted in `results.md`.\n\n---\n\n## Data Processing Pipeline\n\n### Expected COLMAP structure\n\n```\n<location>/\n├── images/\n│   ├── <image 0>\n│   ├── <image 1>\n│   └── ...\n└── sparse/\n    └── 0/\n        ├── cameras.bin\n        ├── images.bin\n        └── points3D.bin\n```\n\nCamera models must be `SIMPLE_PINHOLE` or `PINHOLE`.\n\n### Converting raw images\n\nPlace input images in `<location>/input/`, then:\n\n```shell\npython convert.py -s <location> [--resize]\n```\n\nThis runs COLMAP feature extraction, matching, and bundle adjustment, then performs image undistortion. With `--resize`, ImageMagick creates 1/2, 1/4, and 1/8 resolution copies.\n\nIf you already have COLMAP data (e.g., from an `OPENCV` camera model), place it in `<location>/distorted/` and skip matching:\n\n```shell\npython convert.py -s <location> --skip_matching [--resize]\n```\n\nKey `convert.py` flags:\n\n| Flag | Purpose |\n|------|---------|\n| `--no_gpu` | Disable GPU in COLMAP |\n| `--skip_matching` | Use existing COLMAP data |\n| `--camera` | Camera model for matching (default `OPENCV`) |\n| `--resize` | Create multi-resolution images |\n| `--colmap_executable` | Path to COLMAP (`.bat` on Windows) |\n| `--magick_executable` | Path to ImageMagick |\n\n---\n\n## Viewer Ecosystem\n\nTwo viewers are provided, both built on the [SIBR](https://sibr.gitlabpages.inria.fr/) framework.\n\n### Network Viewer (`SIBR_remoteGaussian_app`)\n\nConnects to a **running training process** for live visualization. Default connection: `localhost:6009`. Match `--ip` and `--port` between the optimizer and viewer if running on different machines.\n\nKey flags: `--path`, `--ip`, `--port`, `--rendering-size`, `--load_images`.\n\n### Real-Time Viewer (`SIBR_gaussianViewer_app`)\n\nLoads a **trained model** for interactive real-time rendering. Requires CUDA-capable GPU (Compute 7.0+).\n\n```shell\n./SIBR_gaussianViewer_app -m <path to trained model>\n```\n\nKey flags: `--model-path`, `--iteration`, `--path`, `--rendering-size`, `--load_images`, `--device`, `--no_interop`.\n\n**Performance tips:**\n- Disable V-Sync (system-wide and in the app's Display menu)\n- On multi-GPU systems, ensure the OpenGL/Display GPU matches the CUDA GPU\n- Use `--no_interop` on WSL2 with MESA software rendering\n\n### Top View\n\nAccessible via `Views > Top View` in either viewer. Renders the SfM point cloud alongside input camera positions and the user's current camera. Useful for verifying camera alignment and understanding spatial coverage.\n\nFeatures:\n- Navigate in FPS, trackball, or orbit mode\n- Snap to closest input camera from the Point view\n- Display ground-truth images at camera positions (requires `--load_images` / `--images-path`)\n- Fade between point cloud and ground-truth view\n- Toggle and scale meshes\n\n---\n\n## Training Configuration Reference\n\n### Core training parameters\n\n| Parameter | Default | Description |\n|-----------|---------|-------------|\n| `--iterations` | 30,000 | Total training iterations |\n| `--sh_degree` | 3 | Spherical harmonics order (max 3) |\n| `--resolution` / `-r` | auto | `1`=original, `2`=1/2, `4`=1/4, `8`=1/8; auto-downscales if width > 1.6K |\n| `--data_device` | `cuda` | Set to `cpu` to reduce VRAM on large datasets |\n| `--white_background` / `-w` | off | Use white background (for NeRF Synthetic) |\n\n### Learning rates\n\n| Parameter | Default |\n|-----------|---------|\n| `--position_lr_init` | 0.00016 |\n| `--position_lr_final` | 0.0000016 |\n| `--position_lr_max_steps` | 30,000 |\n| `--position_lr_delay_mult` | 0.01 |\n| `--feature_lr` | 0.0025 |\n| `--opacity_lr` | 0.05 |\n| `--scaling_lr` | 0.005 |\n| `--rotation_lr` | 0.001 |\n\n### Densification controls\n\n| Parameter | Default | Description |\n|-----------|---------|-------------|\n| `--densify_from_iter` | 500 | When densification starts |\n| `--densify_until_iter` | 15,000 | When densification stops |\n| `--densify_grad_threshold` | 0.0002 | 2D gradient threshold for splitting/cloning |\n| `--densification_interval` | 100 | Iterations between densification steps |\n| `--opacity_reset_interval` | 3,000 | Iterations between opacity resets |\n| `--percent_dense` | 0.01 | Scene extent percentage for forced densification |\n\n### Loss\n\n| Parameter | Default | Description |\n|-----------|---------|-------------|\n| `--lambda_dssim` | 0.2 | SSIM weight in combined loss (0–1) |\n\n### Debugging\n\n| Parameter | Default | Description |\n|-----------|---------|-------------|\n| `--debug` | off | Creates dump file on rasterizer failure |\n| `--debug_from` | 0 | Iteration after which debug mode activates (slow) |\n| `--convert_SHs_python` | off | Use PyTorch SH computation (for debugging) |\n| `--convert_cov3D_python` | off | Use PyTorch 3D covariance computation (for debugging) |\n\n---\n\n## Low-VRAM Training\n\nThe 24 GB requirement is for full-quality training. To reduce memory:\n\n- Increase `--densify_grad_threshold` (reduces point count)\n- Increase `--densification_interval` (less frequent densification)\n- Reduce `--densify_until_iter` (stop densification earlier)\n- Set `--test_iterations -1` to avoid memory spikes during testing\n- Set `--data_device cpu` to offload source images\n- Use `--resolution 2` or `--resolution 4` for smaller inputs\n\nAll of these trade quality for memory. A very high `--densify_grad_threshold` effectively disables densification entirely.\n\n---\n\n## Large-Scale Scene Tips\n\nFor extensive scenes (city-scale, driving datasets with extreme scale variation):\n\n- Reduce `--position_lr_init` (e.g., ×0.3 or ×0.1)\n- Reduce `--position_lr_final` proportionally\n- Reduce `--scaling_lr` (e.g., ×0.3)\n\nThe more extensive the scene, the lower these values should be to prevent Gaussians from overshooting during optimization.","overview":"# gaussian-splatting — Wiki\n\n# 3D Gaussian Splatting\n\nWelcome to the **3D Gaussian Splatting** codebase — an implementation of the SIGGRAPH 2023 paper for real-time radiance field rendering. The system represents scenes as collections of 3D Gaussian primitives with learnable positions, orientations, scales, opacities, and spherical harmonic color coefficients. Through differentiable rasterization and adaptive densification, it produces photorealistic novel-view synthesis at real-time frame rates.\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[Scene Management] --> B[Camera System]\n    A --> C[Gaussian Model]\n    A -.-> D[COLMAP I/O]\n    E[Training Pipeline] -->|optimize| C\n    E -->|sample views| A\n    E -->|render & compare| F[Rendering]\n    F -->|project Gaussians| C\n    E --> G[Loss Functions]\n    H[Rendering Pipeline] --> A\n    H --> F\n    I[Evaluation & Metrics] --> G\n```\n\n## End-to-End Flows\n\n### Preprocessing\n\nRaw photographs are converted into a COLMAP reconstruction using the [Conversion](conversion.md) script, which runs feature extraction, matching, sparse reconstruction, and image undistortion. The resulting dataset is read by [COLMAP I/O](colmap-io.md) during scene initialization.\n\n### Training\n\nThe [Training Pipeline](training-pipeline.md) is the heart of the system. It loads a [Scene](scene-management.md) (which builds [Cameras](camera-system.md) and an initial point cloud), initializes a [GaussianModel](gaussian-model.md), and enters an optimization loop. Each iteration randomly selects a training camera, calls [Rendering](rendering.md) to produce a rasterized image, computes a combined L1/SSIM loss via [Loss Functions](loss-functions.md), backpropagates, and periodically runs adaptive densification and pruning on the Gaussians. Trained models are saved as PLY files through the GaussianModel's serialization.\n\n### Rendering\n\nThe [Rendering Pipeline](rendering-pipeline.md) loads a trained checkpoint, reconstructs the scene and Gaussian model, then iterates over camera views to write rendered images to disk. Each view calls into the [Rendering](rendering.md) module, which evaluates spherical harmonics, computes Gaussian covariances, and feeds everything into the CUDA-accelerated `diff_gaussian_rasterization` rasterizer.\n\n### Evaluation\n\n[Evaluation & Metrics](evaluation-metrics.md) computes PSNR, SSIM, and LPIPS against ground-truth images. The [LPIPS Module](lpips-module.md) provides the perceptual distance metric, while SSIM reuse flows through [Loss Functions](loss-functions.md).\n\n## Supporting Modules\n\n- [Configuration & Parameters](configuration-parameters.md) — Declarative CLI argument system built on `ParamGroup` classes\n- [Graphics & Math Utilities](graphics-math-utilities.md) — Coordinate transforms, projection math, and spherical harmonics evaluation\n- [General Utilities](general-utilities.md) — Covariance helpers, learning-rate scheduling, image I/O, and filesystem operations\n\n## Getting Started\n\n1. **Environment**: Install the Conda environment defined in `environment.yml`, which pins CUDA-compatible PyTorch and all Python dependencies.\n2. **CUDA extensions**: Build the two required CUDA submodules — `diff_gaussian_rasterization` and `simple-knn` — following the instructions in the main repository.\n3. **Prepare data**: Run `convert.py` on a directory of images to produce a COLMAP dataset, or download the pre-processed [T&T+DB COLMAP dataset](https://repo-sam.inria.fr/fungraph/3d-gaussian-splatting/datasets/input/tandt_db.zip).\n4. **Train**: `python train.py -s <path-to-colmap-dataset>` — see [Configuration & Parameters](configuration-parameters.md) for all CLI options.\n5. **Render**: `python render.py -m <path-to-trained-model>`\n6. **Evaluate**: `python metrics.py -m <path-to-trained-model>`\n\nPre-trained models and evaluation images are available from the [project webpage](https://repo-sam.inria.fr/fungraph/3d-gaussian-splatting/) if you want to skip training and go straight to rendering or benchmarking.","rendering-pipeline":"# Rendering Pipeline\n\n# Rendering Pipeline (`render.py`)\n\n## Purpose\n\nOffline rendering script for a trained 3D Gaussian Splatting model. Given a trained checkpoint, it reconstructs the `Scene` and `GaussianModel`, iterates over camera views, and writes per-view rendered images and their corresponding ground-truth frames to disk. This is the primary tool for generating evaluation outputs and visual inspection of a trained model.\n\n## Execution Flow\n\n```mermaid\nflowchart TD\n    A[CLI entrypoint] --> B[safe_state]\n    A --> C[render_sets]\n    C --> D[Load GaussianModel]\n    C --> E[Load Scene]\n    C --> F{skip_train?}\n    F -->|No| G[render_set - train cameras]\n    F -->|Yes| H{skip_test?}\n    G --> H\n    H -->|No| I[render_set - test cameras]\n    H -->|Yes| J[Done]\n    I --> J\n    G --> K[render per view]\n    I --> K\n    K --> L[render - gaussian_renderer]\n    L --> M[Save .png to disk]\n```\n\n## Key Functions\n\n### `render_set`\n\n```python\ndef render_set(model_path, name, iteration, views, gaussians, pipeline, background, train_test_exp, separate_sh)\n```\n\nRenders every camera view in `views` and saves both the rendering and the ground-truth image.\n\n**Parameters:**\n\n| Parameter | Type | Description |\n|---|---|---|\n| `model_path` | `str` | Root model directory (output path base) |\n| `name` | `str` | Split name — `\"train\"` or `\"test\"`, used as a subdirectory |\n| `iteration` | `int` | Trained iteration number, embedded in the output path |\n| `views` | list | Camera objects from `Scene.getTrainCameras()` or `Scene.getTestCameras()` |\n| `gaussians` | `GaussianModel` | Loaded Gaussian model with trained parameters |\n| `pipeline` | `PipelineParams` | Rasterization pipeline configuration |\n| `background` | `torch.Tensor` | Background color tensor on CUDA (shape `[3]`) |\n| `train_test_exp` | `bool` | Whether exposure compensation is enabled |\n| `separate_sh` | `bool` | Whether to use separate spherical harmonics rendering |\n\n**Output structure:**\n```\n<model_path>/<name>/ours_<iteration>/\n├── renders/\n│   ├── 00000.png\n│   ├── 00001.png\n│   └── ...\n└── gt/\n    ├── 00000.png\n    ├── 00001.png\n    └── ...\n```\n\n**Behavior details:**\n\n- Runs entirely inside a `torch.no_grad()` context (inherited from `render_sets`).\n- Calls `render(view, gaussians, pipeline, background, ...)` and extracts the `\"render\"` key from the returned dict.\n- Ground truth is taken from `view.original_image[0:3, :, :]` — only the first 3 channels (RGB), dropping any alpha.\n- When `train_test_exp` is `True`, both the rendering and GT are **horizontally cropped to the right half** of the image (`[..., width // 2:]`). This supports the exposure compensation training mode where the left half is used for training and the right half for evaluation.\n\n### `render_sets`\n\n```python\ndef render_sets(dataset: ModelParams, iteration: int, pipeline: PipelineParams, skip_train: bool, skip_test: bool, separate_sh: bool)\n```\n\nTop-level orchestration function. Loads the model and scene, constructs the background tensor, then delegates to `render_set` for each requested split.\n\n**Key steps:**\n\n1. Instantiates a `GaussianModel` with `dataset.sh_degree`.\n2. Constructs a `Scene`, which automatically loads the trained Gaussians at the specified `iteration` (with `shuffle=False` for deterministic view ordering).\n3. Builds the `background` tensor — white `[1,1,1]` if `dataset.white_background`, otherwise black `[0,0,0]`.\n4. Calls `render_set` for train cameras (unless `skip_train`), then test cameras (unless `skip_test`).\n\n## Downstream Call Chain\n\nWhen `render_set` calls `render()` from `gaussian_renderer`, the following internal computations are triggered:\n\n| Called function | Module | Purpose |\n|---|---|---|\n| `get_exposure_from_name` | `scene/gaussian_model.py` | Retrieves per-camera exposure parameters when `train_test_exp` is active |\n| `get_covariance` | `scene/gaussian_model.py` | Computes 3D covariance matrices from the Gaussian's rotation and scale |\n| `eval_sh` | `utils/sh_utils.py` | Evaluates spherical harmonics coefficients for view-dependent color |\n\nThese are not called directly by `render.py` — they are invoked internally by `render()` during rasterization. Understanding this chain is important if you need to debug rendering artifacts related to covariance computation or color evaluation.\n\n## CLI Usage\n\n```bash\npython render.py -m <model_path> [--iteration N] [--skip_train] [--skip_test] [--quiet]\n```\n\n**Arguments:**\n\n| Argument | Default | Description |\n|---|---|---|\n| `-m` / `--model_path` | (required) | Path to the trained model directory |\n| `--iteration` | `-1` | Checkpoint iteration to load; `-1` loads the latest |\n| `--skip_train` | `False` | Skip rendering training views |\n| `--skip_test` | `False` | Skip rendering test views |\n| `--quiet` | `False` | Suppress non-essential output |\n\nAdditional `ModelParams` and `PipelineParams` are registered on the same parser and can be passed as needed (e.g., `--white_background`, `--sh_degree`).\n\n## Sparse Adam Availability\n\nThe module attempts to import `SparseGaussianAdam` from `diff_gaussian_rasterization` at load time:\n\n```python\ntry:\n    from diff_gaussian_rasterization import SparseGaussianAdam\n    SPARSE_ADAM_AVAILABLE = True\nexcept:\n    SPARSE_ADAM_AVAILABLE = False\n```\n\nThis flag is passed as the `separate_sh` argument to `render_sets`. When the sparse optimizer is available, spherical harmonics are rendered in a separate pass rather than bundled with the base color, which can improve visual quality for higher SH degrees. If the import fails, `SPARSE_ADAM_AVAILABLE` is `False` and SH is rendered jointly.\n\n## Important Notes\n\n- **No gradient computation**: The entire rendering loop runs under `torch.no_grad()`. This script is for inference/evaluation only.\n- **CUDA required**: The background tensor is created on `\"cuda\"`. The `render()` function and the Gaussian rasterizer also require CUDA.\n- **Image format**: Output images are saved via `torchvision.utils.save_image` as PNG. Values are expected in `[0, 1]` range.\n- **Half-image cropping**: The `train_test_exp` mode crops to the right half of the image. This is a specific evaluation protocol — if you modify this script for a different dataset, verify whether this cropping is appropriate.","rendering":"# Rendering\n\n# Rendering Module\n\n## Overview\n\nThe Rendering module is responsible for projecting 3D Gaussians onto 2D image planes and producing final rendered output. It wraps the CUDA-accelerated `diff_gaussian_rasterization` library, orchestrating the handoff between Gaussian model attributes and the differentiable rasterizer. A secondary component provides socket-based communication for interactive real-time viewing.\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[render] --> B[GaussianRasterizer]\n    A --> C[eval_sh]\n    A --> D[get_covariance]\n    A --> E[get_exposure_from_name]\n    F[network_gui] --> G[MiniCam]\n    F --> H[Socket I/O]\n    B --> I[GPU Rasterization]\n```\n\n---\n\n## Core Function: `render`\n\n**Signature:**\n```python\nrender(viewpoint_camera, pc: GaussianModel, pipe, bg_color: torch.Tensor,\n       scaling_modifier=1.0, separate_sh=False, override_color=None,\n       use_trained_exp=False)\n```\n\n### Parameters\n\n| Parameter | Type | Description |\n|---|---|---|\n| `viewpoint_camera` | Camera | Viewpoint providing FoV, image dimensions, view/projection matrices, and camera center |\n| `pc` | `GaussianModel` | The Gaussian scene model |\n| `pipe` | Pipeline config | Controls compute paths: `compute_cov3D_python`, `convert_SHs_python`, `debug`, `antialiasing` |\n| `bg_color` | `torch.Tensor` | Background color tensor — **must already reside on CUDA** |\n| `scaling_modifier` | `float` | Global scale multiplier applied to Gaussian sizes (default `1.0`) |\n| `separate_sh` | `bool` | If `True`, pass DC and higher-order SH coefficients separately to the rasterizer |\n| `override_color` | `torch.Tensor` or `None` | Precomputed RGB colors; bypasses all SH evaluation when provided |\n| `use_trained_exp` | `bool` | Apply per-image learned exposure correction |\n\n### Return Value\n\nReturns a dictionary:\n\n| Key | Shape | Description |\n|---|---|---|\n| `render` | `(3, H, W)` | Clamped `[0, 1]` rendered RGB image |\n| `viewspace_points` | `(N, 3)` | Screen-space positions with gradients enabled (for densification) |\n| `visibility_filter` | `(V, 1)` | Indices of Gaussians with `radii > 0` (visible on screen) |\n| `radii` | `(N,)` | Screen-space radii per Gaussian; zero means frustum-culled |\n| `depth` | `(1, H, W)` | Rendered depth image |\n\n### Execution Flow\n\nThe function proceeds through four decision stages:\n\n#### 1. Screen-Space Point Allocation\n\nA zero tensor matching `pc.get_xyz` is allocated on CUDA with `requires_grad=True` and `retain_grad()`. This captures 2D screen-space position gradients, which the training loop uses for Gaussian splitting/densification criteria.\n\n#### 2. Covariance Computation Path\n\nTwo mutually exclusive paths controlled by `pipe.compute_cov3D_python`:\n\n- **Python path** (`True`): Calls `pc.get_covariance(scaling_modifier)` to precompute the 3×3 covariance matrix on the CPU/Python side, passing `cov3D_precomp` to the rasterizer.\n- **GPU path** (`False`, default): Passes raw `scales` and `rotations` to the rasterizer, which computes covariance internally on the GPU.\n\nThe Python path is useful for debugging or custom covariance logic but is slower.\n\n#### 3. Color Computation Path\n\nThree mutually exclusive paths, evaluated in priority order:\n\n1. **`override_color` provided**: The supplied tensor is used directly as `colors_precomp`. All SH evaluation is skipped.\n2. **`pipe.convert_SHs_python`** (`True`): Evaluates spherical harmonics in Python:\n   - Reshapes `pc.get_features` into `(N, 3, (max_sh_degree+1)²)` view-dependent form\n   - Computes view directions: `dir_pp = pc.get_xyz - camera_center`, normalized\n   - Calls `eval_sh(active_sh_degree, shs_view, dir_pp_normalized)` from `utils.sh_utils`\n   - Applies `clamp_min(sh2rgb + 0.5, 0.0)` to convert SH coefficients to RGB\n3. **Default** (GPU SH evaluation): Passes `shs` (or `dc` + `shs` if `separate_sh=True`) to the rasterizer, which performs SH→RGB conversion on the GPU.\n\nThe `separate_sh` flag splits features into `pc.get_features_dc` (zeroth-order) and `pc.get_features_rest` (higher orders). This is required by certain rasterizer modes that handle DC terms differently.\n\n#### 4. Exposure Compensation\n\nWhen `use_trained_exp=True`, a per-image 3×3 color matrix and 3-vector bias are retrieved via `pc.get_exposure_from_name(viewpoint_camera.image_name)` and applied:\n\n```python\nrendered_image = torch.matmul(rendered_image.permute(1,2,0), exposure[:3,:3]).permute(2,0,1) + exposure[:3,3,None,None]\n```\n\nThis models affine color transforms per training image, useful for datasets with varying exposure.\n\n### Rasterizer Configuration\n\n`GaussianRasterizationSettings` is constructed from the camera:\n\n- `tanfovx` / `tanfovy`: Half-angle tangents derived from `viewpoint_camera.FoVx` / `FoVy`\n- `viewmatrix` / `projmatrix`: World-view and full projection transforms from the camera\n- `campos`: Camera center in world space (used for SH view directions)\n- `sh_degree`: Active SH degree from the model (`pc.active_sh_degree`)\n- `scale_modifier`: Passed through directly\n- `antialiasing`: Controlled by `pipe.antialiasing`\n\n---\n\n## Network GUI: `network_gui`\n\nProvides a TCP socket interface for an external real-time viewer (e.g., the SIBR viewer) to send camera parameters and receive rendered frames.\n\n### Connection Lifecycle\n\n1. **`init(wish_host, wish_port)`** — Binds a TCP listener on the specified host/port with a zero timeout (non-blocking accept).\n2. **`try_connect()`** — Non-blocking accept call; sets the connection to blocking mode once established.\n3. **`receive()`** — Reads a JSON message describing the camera and render options, returns parsed values.\n4. **`send(message_bytes, verify)`** — Sends arbitrary bytes followed by an ASCII verification string.\n\n### Message Protocol\n\nMessages are length-prefixed: 4 bytes (little-endian `int32`) for the payload length, followed by UTF-8 JSON.\n\n### `receive()` Return Values\n\nOn success, returns a tuple:\n\n| Position | Value | Description |\n|---|---|---|\n| 0 | `MiniCam` | Camera object constructed from received parameters |\n| 1 | `bool` | `do_training` — whether to continue training |\n| 2 | `bool` | `do_shs_python` — force Python-side SH evaluation |\n| 3 | `bool` | `do_rot_scale_python` — force Python-side covariance |\n| 4 | `bool` | `keep_alive` — keep the connection open |\n| 5 | `float` | `scaling_modifier` — Gaussian scale modifier |\n\nReturns `(None, None, None, None, None, None)` if resolution is zero (viewer closed).\n\n### Axis Convention Handling\n\nThe view and projection matrices received from the viewer have their Y and Z columns negated before construction of `MiniCam`:\n\n```python\nworld_view_transform[:,1] = -world_view_transform[:,1]\nworld_view_transform[:,2] = -world_view_transform[:,2]\n```\n\nThis converts from the viewer's coordinate convention (right-handed, Y-up) to the renderer's expected convention.\n\n---\n\n## Integration with the Codebase\n\n### Callers\n\n- **`train.py`** calls `render()` each training iteration to produce images and collect visibility/radius data for adaptive density control.\n- **`render.py`** calls `render()` via `render_set()` during evaluation to produce test/train/holdout images, including the exposure compensation path (`use_trained_exp=True`).\n\n### Dependencies on `GaussianModel`\n\nThe `render` function reads these properties from the `GaussianModel` instance:\n\n| Property | Used When |\n|---|---|\n| `get_xyz` | Always — 3D means |\n| `get_opacity` | Always — per-Gaussian opacity |\n| `get_scaling` | GPU covariance path |\n| `get_rotation` | GPU covariance path |\n| `get_features` | Default SH path |\n| `get_features_dc` / `get_features_rest` | `separate_sh=True` path |\n| `get_covariance(scaling_modifier)` | `pipe.compute_cov3D_python=True` |\n| `get_exposure_from_name(image_name)` | `use_trained_exp=True` |\n| `active_sh_degree` | Rasterizer settings |\n| `max_sh_degree` | Python SH reshape |\n\n### Dependency on `utils.sh_utils`\n\n`eval_sh` is called only in the Python SH conversion path (`pipe.convert_SHs_python=True`). It evaluates spherical harmonic basis functions given the active degree, SH coefficients, and normalized view directions.\n\n### Dependency on `diff_gaussian_rasterization`\n\nThe external CUDA extension provides `GaussianRasterizer` and `GaussianRasterizationSettings`. The rasterizer's `__call__` accepts keyword arguments for means, SHs/colors, opacities, scales, rotations, and optional precomputed covariances. It returns `(rendered_image, radii, depth_image)`.","scene-management":"# Scene Management\n\n# Scene Management\n\n## Overview\n\nThe Scene module is responsible for discovering, loading, and managing 3D reconstruction datasets. It detects the dataset format (COLMAP or NeRF Synthetic/Blender), parses camera parameters and initial point clouds, builds camera objects at multiple resolutions, and coordinates saving trained models. It acts as the bridge between raw dataset files on disk and the `GaussianModel` used during training and rendering.\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[Scene.__init__] --> B{Dataset type?}\n    B -->|sparse/ exists| C[readColmapSceneInfo]\n    B -->|transforms_train.json| D[readNerfSyntheticInfo]\n    C --> E[readColmapCameras]\n    C --> F[fetchPly / storePly]\n    C --> G[getNerfppNorm]\n    D --> H[readCamerasFromTransforms]\n    D --> F\n    D --> G\n    A --> I[cameraList_from_camInfos]\n    A --> J[load_ply / create_from_pcd]\n    K[Scene.save] --> L[save_ply]\n    K --> M[get_exposure_from_name]\n```\n\n## The `Scene` Class\n\n`Scene` is the primary entry point, instantiated once at the start of training or rendering.\n\n### Constructor\n\n```python\nScene(args: ModelParams, gaussians: GaussianModel, load_iteration=None, shuffle=True, resolution_scales=[1.0])\n```\n\n**Parameters:**\n\n| Parameter | Description |\n|---|---|\n| `args` | `ModelParams` containing `source_path`, `model_path`, `images`, `depths`, `eval`, `white_background`, `train_test_exp` |\n| `gaussians` | The `GaussianModel` instance to initialize or load into |\n| `load_iteration` | Which saved iteration to load. `None` starts fresh, `-1` auto-detects the latest via `searchForMaxIteration` |\n| `shuffle` | Randomly shuffle train/test camera lists for varied batching |\n| `resolution_scales` | List of downscaling factors (e.g. `[1.0, 0.5, 0.25]`) for multi-resolution rendering |\n\n**Initialization flow:**\n\n1. **Determine load iteration** — If `load_iteration` is set, resolve the checkpoint to load from. `-1` searches `point_cloud/` subdirectories for the highest iteration number.\n\n2. **Detect dataset format and load scene info** — Checks for `sparse/` directory (COLMAP) or `transforms_train.json` (Blender). Calls the corresponding reader via `sceneLoadTypeCallbacks`, producing a `SceneInfo` object.\n\n3. **Persist initial data** (only when not loading a checkpoint) — Copies the initial point cloud PLY to `<model_path>/input.ply` and writes all camera parameters to `<model_path>/cameras.json`.\n\n4. **Shuffle cameras** — If `shuffle=True`, randomly reorders train and test camera lists.\n\n5. **Compute scene extent** — Stores `cameras_extent` from `SceneInfo.nerf_normalization[\"radius\"]`, used downstream for density control and scaling.\n\n6. **Build camera objects** — For each resolution scale, calls `cameraList_from_camInfos` to convert `CameraInfo` records into renderable camera objects. Results are stored in `self.train_cameras` and `self.test_cameras`, keyed by scale factor.\n\n7. **Initialize or restore Gaussians** — If loading a checkpoint, calls `gaussians.load_ply(...)`. Otherwise, calls `gaussians.create_from_pcd(...)` using the scene's initial point cloud and camera extent.\n\n### `save(iteration)`\n\nSaves the current Gaussian model state:\n\n- Writes the point cloud to `point_cloud/iteration_<N>/point_cloud.ply`\n- Writes learned exposure values to `exposure.json`, mapping each image name to its exposure parameters\n\n### `getTrainCameras(scale=1.0)` / `getTestCameras(scale=1.0)`\n\nReturn the list of camera objects at the given resolution scale. Called by the training loop and rendering scripts.\n\n## Data Structures\n\n### `CameraInfo`\n\nA `NamedTuple` representing a single camera's metadata before it is converted into a renderable camera object.\n\n| Field | Type | Description |\n|---|---|---|\n| `uid` | `int` | Unique camera identifier |\n| `R` | `np.array` | 3×3 rotation matrix (transposed world-to-camera) |\n| `T` | `np.array` | 3×1 translation vector |\n| `FovY` | `np.array` | Vertical field of view in radians |\n| `FovX` | `np.array` | Horizontal field of view in radians |\n| `depth_params` | `dict` | Depth scaling parameters (COLMAP only), or `None` |\n| `image_path` | `str` | Path to the RGB image file |\n| `image_name` | `str` | Image filename (used as key for exposure mapping) |\n| `depth_path` | `str` | Path to depth map, or `\"\"` if unavailable |\n| `width` | `int` | Image width in pixels |\n| `height` | `int` | Image height in pixels |\n| `is_test` | `bool` | Whether this camera is held out for evaluation |\n\n### `SceneInfo`\n\nA `NamedTuple` aggregating all parsed scene data.\n\n| Field | Type | Description |\n|---|---|---|\n| `point_cloud` | `BasicPointCloud` | Initial 3D points, colors, and normals |\n| `train_cameras` | `list[CameraInfo]` | Training camera descriptors |\n| `test_cameras` | `list[CameraInfo]` | Test/evaluation camera descriptors |\n| `nerf_normalization` | `dict` | Contains `\"translate\"` and `\"radius\"` for scene normalization |\n| `ply_path` | `str` | Path to the initial point cloud PLY file |\n| `is_nerf_synthetic` | `bool` | `True` for Blender datasets, `False` for COLMAP |\n\n## Dataset Readers\n\nThe module supports two dataset formats, dispatched through `sceneLoadTypeCallbacks`:\n\n```python\nsceneLoadTypeCallbacks = {\n    \"Colmap\": readColmapSceneInfo,\n    \"Blender\": readNerfSyntheticInfo\n}\n```\n\n### COLMAP — `readColmapSceneInfo`\n\n```python\nreadColmapSceneInfo(path, images, depths, eval, train_test_exp, llffhold=8)\n```\n\nReads a COLMAP reconstruction from `sparse/0/`. Handles both binary (`.bin`) and text (`.txt`) formats for extrinsics, intrinsics, and 3D points.\n\n**Key behaviors:**\n\n- **Camera intrinsics**: Supports `SIMPLE_PINHOLE` and `PINHOLE` models only. Other distortion models are rejected with an assertion.\n- **Depth parameters**: If `depths` is non-empty, loads `sparse/0/depth_params.json` containing per-image scale factors. Computes a median scale across all images and attaches it to each entry.\n- **Train/test split**: When `eval=True`, uses an LLFF-style holdout (every `llffhold`-th image by sorted name, default 8) or reads `sparse/0/test.txt`. When `eval=False`, all cameras go to training. When `train_test_exp=True`, test cameras are also included in the training set for exposure learning.\n- **Point cloud**: Reads `sparse/0/points3D.ply`. If the PLY doesn't exist yet, converts from `points3D.bin` (or `.txt`) and caches the result via `storePly`.\n- **NeRF++ normalization**: Computed from training camera positions to determine scene bounding radius.\n\n### NeRF Synthetic (Blender) — `readNerfSyntheticInfo`\n\n```python\nreadNerfSyntheticInfo(path, white_background, depths, eval, extension=\".png\")\n```\n\nReads a Blender/NeRF synthetic dataset from `transforms_train.json` and `transforms_test.json`.\n\n**Key behaviors:**\n\n- **Coordinate conversion**: NeRF transform matrices use OpenGL conventions (Y up, Z back). The reader flips Y and Z axes (`c2w[:3, 1:3] *= -1`) to convert to COLMAP convention (Y down, Z forward).\n- **Alpha compositing**: Images are composited against a white or black background based on `white_background`, using the alpha channel.\n- **Field of view**: `camera_angle_x` from the JSON provides horizontal FoV; vertical FoV is derived from image dimensions via `fov2focal` and `focal2fov`.\n- **Point cloud**: Since synthetic datasets lack COLMAP data, a random point cloud of 100,000 points is generated within a cube of ±1.3 units. Colors are initialized from random spherical harmonics via `SH2RGB`.\n- **Train/test split**: When `eval=False`, test cameras are merged into the training set.\n\n### `readColmapCameras`\n\n```python\nreadColmapCameras(cam_extrinsics, cam_intrinsics, depths_params, images_folder, depths_folder, test_cam_names_list)\n```\n\nIterates over COLMAP extrinsics, matches each to its intrinsics entry, and builds a `CameraInfo` for each camera. Rotation is extracted via `qvec2rotmat` and transposed to match the storage convention expected by downstream code.\n\n### `readCamerasFromTransforms`\n\n```python\nreadCamerasFromTransforms(path, transformsfile, depths_folder, white_background, is_test, extension=\".png\")\n```\n\nParses a single NeRF `transforms_*.json` file. Each frame's `transform_matrix` is inverted to produce world-to-camera R and T. Images are opened to read dimensions and composited against the chosen background.\n\n## Utility Functions\n\n### `getNerfppNorm(cam_info)`\n\nComputes NeRF++ normalization parameters from a list of `CameraInfo` objects. For each camera, computes the world-space camera center by inverting the world-to-view matrix. Returns:\n\n```python\n{\"translate\": np.array, \"radius\": float}\n```\n\nWhere `translate` centers the cameras at the origin and `radius` is 1.1× the maximum distance from center to any camera. The `radius` value is stored as `Scene.cameras_extent` and used for density control and Gaussian scaling heuristics.\n\n### `fetchPly(path)` / `storePly(path, xyz, rgb)`\n\n- **`fetchPly`**: Reads a PLY file and returns a `BasicPointCloud` with positions, colors (normalized to [0,1]), and normals.\n- **`storePly`**: Writes positions and colors to a PLY file with zero-filled normals. Used to cache converted COLMAP point clouds and generated random point clouds.\n\n## Integration with the Codebase\n\nThe Scene module connects to several external components:\n\n| Component | Interaction |\n|---|---|\n| `GaussianModel` | Initialized via `create_from_pcd` or restored via `load_ply`; saved via `save_ply`; exposure queried via `get_exposure_from_name` |\n| `cameraList_from_camInfos` | Converts `CameraInfo` lists into renderable `Camera` objects at the requested resolution scale |\n| `camera_to_JSON` | Serializes camera parameters for the `cameras.json` output |\n| `searchForMaxIteration` | Finds the latest checkpoint iteration in the output directory |\n| `colmap_loader` | Low-level readers for COLMAP binary/text files (`read_extrinsics_binary`, `read_intrinsics_binary`, `read_points3D_binary`, etc.) |\n| `graphics_utils` | `focal2fov`, `fov2focal`, `getWorld2View2` for camera parameter conversions |\n| `sh_utils` | `SH2RGB` for converting random colors to spherical harmonics initialization |\n\n**Callers:** The training loop (`train.py`) constructs a `Scene`, calls `getTrainCameras()` each iteration, and calls `save()` periodically. The rendering script (`render.py`) calls `getTrainCameras()` and `getTestCameras()` to determine which views to render.\n\n## Directory Layout Expectations\n\n### COLMAP dataset\n```\n<source_path>/\n├── sparse/\n│   └── 0/\n│       ├── cameras.bin (or .txt)\n│       ├── images.bin  (or .txt)\n│       ├── points3D.bin (or .txt)\n│       └── depth_params.json  (optional, required if depths arg is set)\n├── images/  (or custom dir via args.images)\n└── depths/  (optional, via args.depths)\n```\n\n### NeRF Synthetic dataset\n```\n<source_path>/\n├── transforms_train.json\n├── transforms_test.json\n├── train/\n│   └── *.png\n├── test/\n│   └── *.png\n└── depths/  (optional)\n```\n\n### Output directory (model_path)\n```\n<model_path>/\n├── input.ply              (copy of initial point cloud)\n├── cameras.json           (serialized camera parameters)\n├── exposure.json          (learned exposure values, written on save)\n└── point_cloud/\n    └── iteration_<N>/\n        └── point_cloud.ply\n```","training-pipeline":"# Training Pipeline\n\n# Training Pipeline\n\nThe training pipeline orchestrates the full optimization loop for 3D Gaussian Splatting. It initializes the scene and Gaussian model, then iteratively renders random training views, computes a combined L1/SSIM loss (with optional depth regularization), backpropagates, and performs adaptive densification and pruning of Gaussians until convergence.\n\n## Architecture Overview\n\n```mermaid\nflowchart TD\n    A[CLI Argument Parsing] --> B[training]\n    B --> C[Initialize GaussianModel + Scene]\n    C --> D[Training Loop]\n    D --> E[Random Camera Selection]\n    E --> F[Render]\n    F --> G[Loss: L1 + SSIM + Depth]\n    G --> H[Backpropagation]\n    H --> I{Densification Window?}\n    I -->|Yes| J[densify_and_prune / reset_opacity]\n    I -->|No| K[Optimizer Step]\n    J --> K\n    K --> L{Testing/Saving Iteration?}\n    L -->|Yes| M[training_report / scene.save]\n    L -->|No| D\n```\n\n## Entry Point\n\nThe script is invoked directly. It parses three groups of structured parameters plus several standalone CLI flags:\n\n| Parameter Group | Class | Key Settings |\n|---|---|---|\n| `ModelParams` (`-m`) | Dataset path, SH degree, white background, train/test exposure | |\n| `OptimizationParams` (`-o`) | Iterations, learning rates, densification thresholds, optimizer type | |\n| `PipelineParams` (`-p`) | Debug mode, SH/cov3D Python computation flags | |\n\n**Standalone CLI arguments:**\n\n- `--ip` / `--port` — Network viewer address (default `127.0.0.1:6009`)\n- `--debug_from` — Enable pipeline debug from this iteration onward (default `-1`, disabled)\n- `--detect_anomaly` — Enable PyTorch anomaly detection\n- `--test_iterations` — Iterations at which to run validation (default `[7000, 30000]`)\n- `--save_iterations` — Iterations at which to save the model (default `[7000, 30000]`, final iteration always appended)\n- `--checkpoint_iterations` — Iterations at which to save full checkpoints\n- `--start_checkpoint` — Path to a `.pth` checkpoint to resume from\n- `--quiet` — Suppress non-essential output\n- `--disable_viewer` — Disable the network GUI viewer\n\n## Core Function: `training()`\n\n```python\ntraining(dataset, opt, pipe, testing_iterations, saving_iterations, checkpoint_iterations, checkpoint, debug_from)\n```\n\n### Initialization Phase\n\n1. **Optimizer validation** — If `opt.optimizer_type == \"sparse_adam\"` but the `diff_gaussian_rasterization` package isn't installed, the process exits immediately.\n2. **Output setup** — Calls `prepare_output_and_logger()` to create the output directory and initialize TensorBoard.\n3. **Model creation** — Instantiates `GaussianModel(dataset.sh_degree, opt.optimizer_type)` and `Scene(dataset, gaussians)`. The scene loads training/test cameras and point cloud data.\n4. **Training setup** — `gaussians.training_setup(opt)` configures all parameter groups and their optimizers.\n5. **Checkpoint restoration** — If `checkpoint` is provided, loads `(model_params, first_iter)` via `torch.load` and calls `gaussians.restore(model_params, opt)`.\n6. **Background** — White `[1,1,1]` if `dataset.white_background`, otherwise black `[0,0,0]`. Randomized when `opt.random_background` is enabled.\n\n### Training Loop\n\nEach iteration from `first_iter` to `opt.iterations` performs:\n\n#### 1. Network GUI Handling\nIf the viewer is connected, the loop processes incoming viewer requests (custom camera, SH/cov3D flags, scaling modifier) and sends back rendered images. The loop breaks back into training when `do_training` is true and the iteration hasn't stalled.\n\n#### 2. Learning Rate and SH Scheduling\n- `gaussians.update_learning_rate(iteration)` adjusts per-parameter learning rates each iteration.\n- Every 1000 iterations, `gaussians.oneupSHdegree()` increments the active spherical harmonics degree up to the configured maximum.\n\n#### 3. Camera Selection\nTraining cameras are consumed via random pop from a stack. When the stack is exhausted, it is refilled from `scene.getTrainCameras()`. This ensures each camera is seen roughly once per epoch while maintaining random ordering.\n\n#### 4. Rendering\n```python\nrender_pkg = render(viewpoint_cam, gaussians, pipe, bg,\n                    use_trained_exp=dataset.train_test_exp,\n                    separate_sh=SPARSE_ADAM_AVAILABLE)\n```\nKey outputs extracted from `render_pkg`:\n- `\"render\"` — the rendered image\n- `\"viewspace_points\"` — screen-space positions for densification gradient tracking\n- `\"visibility_filter\"` — boolean mask of visible Gaussians\n- `\"radii\"` — screen-space radii per Gaussian\n- `\"depth\"` — rendered inverse depth (used when depth regularization is active)\n\nIf the camera has an `alpha_mask`, it is applied to the rendered image before loss computation.\n\n#### 5. Loss Computation\n\nThe primary loss is a weighted combination of L1 and SSIM:\n\n```\nloss = (1 - λ_dssim) * L1 + λ_dssim * (1 - SSIM)\n```\n\nWhere `λ_dssim` is controlled by `opt.lambda_dssim`. SSIM is computed via `fused_ssim` (CUDA kernel) if available, falling back to the pure-Python `ssim()`.\n\n**Depth regularization** is applied when both the weight schedule returns a positive value and the camera has reliable depth (`viewpoint_cam.depth_reliable`):\n\n```python\nLl1depth = depth_l1_weight(iteration) * |render_invDepth - mono_invDepth| * depth_mask\n```\n\nThe weight schedule follows an exponential decay from `opt.depth_l1_weight_init` to `opt.depth_l1_weight_final` over `opt.iterations` steps, computed by `get_expon_lr_func()`.\n\n#### 6. Densification and Pruning\n\nActive only when `iteration < opt.densify_until_iter`:\n\n- **Statistics accumulation** — Every iteration calls `gaussians.add_densification_stats(viewspace_point_tensor, visibility_filter)` and tracks `max_radii2D` for visible Gaussians.\n- **Densify and prune** — Triggered when `iteration >= opt.densify_from_iter` and `iteration % opt.densification_interval == 0`. Calls `gaussians.densify_and_prune(opt.densify_grad_threshold, 0.005, scene.cameras_extent, size_threshold, radii)`. The `size_threshold` is set to `20` only after `opt.opacity_reset_interval` has passed; before that it is `None` (no size-based pruning).\n- **Opacity reset** — Triggered every `opt.opacity_reset_interval` iterations, or at `opt.densify_from_iter` when using white background. Calls `gaussians.reset_opacity()`.\n\n#### 7. Optimizer Step\n\nAfter backpropagation, two optimizer paths exist:\n\n- **SparseGaussianAdam** (`use_sparse_adam == True`) — Passes a visibility mask (`radii > 0`) and total Gaussian count to `optimizer.step(visible, radii.shape[0])`, enabling per-Gaussian sparse updates that skip invisible Gaussians.\n- **Standard Adam** — Calls `optimizer.step()` on all parameters.\n\nIn both cases, gradients are zeroed with `set_to_none=True`. The exposure optimizer (for train/test exposure compensation) is always stepped separately.\n\n#### 8. Checkpointing\n\nAt iterations listed in `checkpoint_iterations`, the full model state is saved:\n\n```python\ntorch.save((gaussians.capture(), iteration), f\"{scene.model_path}/chkpnt{iteration}.pth\")\n```\n\nAt iterations in `saving_iterations`, `scene.save(iteration)` writes the Gaussian point cloud to PLY (triggers `save_ply` → `construct_list_of_attributes` → `mkdir_p`).\n\n### Progress Tracking\n\nAn exponential moving average (EMA, α=0.4) of the total loss and depth loss is maintained for the tqdm progress bar, updated every 10 iterations.\n\n## `prepare_output_and_logger(args)`\n\nSets up the output directory and returns a TensorBoard `SummaryWriter` (or `None` if TensorBoard isn't installed).\n\n- If `args.model_path` is not set, it defaults to `./output/<OAR_JOB_ID or UUID prefix>`.\n- Creates the directory and writes a `cfg_args` file capturing all arguments as a `Namespace`.\n- Returns `None` with a warning if TensorBoard is unavailable.\n\n## `training_report()`\n\n```python\ntraining_report(tb_writer, iteration, Ll1, loss, l1_loss, elapsed,\n                 testing_iterations, scene, renderFunc, renderArgs, train_test_exp)\n```\n\nCalled every iteration. Performs two roles:\n\n**Per-iteration logging** (when `tb_writer` exists):\n- `train_loss_patches/l1_loss` — current L1 loss\n- `train_loss_patches/total_loss` — current total loss\n- `iter_time` — CUDA-measured iteration time in ms\n\n**Validation** (at iterations in `testing_iterations`):\n- Evaluates all test cameras and a sample of 5 training cameras (indices 5, 10, 15, 20, 25).\n- Computes per-view L1 and PSNR, averages per split, and logs to console and TensorBoard.\n- When `train_test_exp` is enabled, only the right half of each image is compared (exposure compensation is trained on the left half).\n- Logs an opacity histogram and total point count to TensorBoard.\n- Calls `torch.cuda.empty_cache()` before and after validation to manage VRAM.\n\n## Optional Features\n\n| Feature | Enabled By | Effect |\n|---|---|---|\n| **Sparse Adam optimizer** | `opt.optimizer_type == \"sparse_adam\"` + installed rasterizer | Only updates visible Gaussians each step; significant speedup for large scenes |\n| **Depth regularization** | `depth_l1_weight_init > 0` + cameras with `depth_reliable` | Monocular depth consistency loss with exponential weight decay |\n| **Exposure compensation** | `dataset.train_test_exp` | Trains per-image exposure parameters; validation uses right-half comparison |\n| **Random background** | `opt.random_background` | Samples a random RGB background each iteration instead of fixed black/white |\n| **Alpha masking** | Cameras with `alpha_mask` attribute | Masks rendered output before loss computation |\n| **Network viewer** | `--disable_viewer` not set | Live interactive rendering via `network_gui` on the configured IP/port |\n| **Pipeline debug** | `--debug_from <iter>` | Enables debug mode in `PipelineParams` from the specified iteration |\n\n## Resuming Training\n\nPass `--start_checkpoint <path>` to resume from a checkpoint file. The checkpoint must be a tuple `(model_params, iteration)` as produced by `gaussians.capture()`. The training loop resumes from `first_iter + 1` and preserves all optimizer state, Gaussian attributes, and accumulated densification statistics."};

        html += '<div class="nav-children">' + buildNavTree(node.children) + '</div>';
      }
      html += '</div>';
    }
    return html;
  }

  function escH(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function navigateTo(page) {
    activePage = page;
    location.hash = encodeURIComponent(page);

    var items = document.querySelectorAll('.nav-item');
    for (var i = 0; i < items.length; i++) {
      if (items[i].dataset.page === page) {
        items[i].classList.add('active');
      } else {
        items[i].classList.remove('active');
      }
    }

    var contentEl = document.getElementById('content');
    var md = PAGES[page];

    if (!md) {
      contentEl.innerHTML = '<div class="empty-state"><h2>Page not found</h2><p>' + escH(page) + '.md does not exist.</p></div>';
      return;
    }

    contentEl.innerHTML = marked.parse(md);

    // Rewrite .md links to hash navigation
    var links = contentEl.querySelectorAll('a[href]');
    for (var i = 0; i < links.length; i++) {
      var href = links[i].getAttribute('href');
      if (href && href.endsWith('.md') && href.indexOf('://') === -1) {
        var slug = href.replace(/\.md$/, '');
        links[i].setAttribute('href', '#' + encodeURIComponent(slug));
        (function(s) {
          links[i].addEventListener('click', function(e) {
            e.preventDefault();
            navigateTo(s);
          });
        })(slug);
      }
    }

    // Convert mermaid code blocks into mermaid divs
    var mermaidBlocks = contentEl.querySelectorAll('pre code.language-mermaid');
    for (var i = 0; i < mermaidBlocks.length; i++) {
      var pre = mermaidBlocks[i].parentElement;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = mermaidBlocks[i].textContent;
      pre.parentNode.replaceChild(div, pre);
    }
    try { mermaid.run({ querySelector: '.mermaid' }); } catch(e) {}

    window.scrollTo(0, 0);
    document.getElementById('sidebar').classList.remove('open');
  }
})();

</script>
</body>
</html>
