var PAGES = {"camera-system":"# Camera System\n\n# Camera System\n\n## Overview\n\nThe Camera System provides the geometric and photometric representation of input viewpoints for 3D Gaussian Splatting. It handles loading, resizing, and preprocessing of images and depth maps, and computes the coordinate transforms required for projection and rendering.\n\nThe module is split across two files:\n\n- **`scene/cameras.py`** — Core camera data structures (`Camera`, `MiniCam`)\n- **`utils/camera_utils.py`** — Factory functions and serialization helpers\n\n## Architecture\n\n```mermaid\ngraph TD\n    CI[cam_infos] --> CLFC[cameraList_from_camInfos]\n    CLFC --> LC[loadCam]\n    LC --> CAM[Camera]\n    LC --> IMG[Image.open + cv2.imread]\n    CAM --> W2V[getWorld2View2]\n    CAM --> PROJ[getProjectionMatrix]\n    CAM --> PIL[PILtoTorch]\n    CAM2JSON[camera_to_JSON] --> CAM\n    CAM2JSON --> F2F[fov2focal]\n```\n\n## Core Classes\n\n### `Camera` (`scene/cameras.py`)\n\nAn `nn.Module` that encapsulates a single training or test viewpoint with its full image, optional depth, and all derived geometric transforms.\n\n**Constructor signature:**\n\n```python\nCamera(resolution, colmap_id, R, T, FoVx, FoVy, depth_params, image, invdepthmap,\n       image_name, uid, trans=[0,0,0], scale=1.0, data_device=\"cuda\",\n       train_test_exp=False, is_test_dataset=False, is_test_view=False)\n```\n\n**Key parameters:**\n\n| Parameter | Type | Description |\n|---|---|---|\n| `resolution` | `(int, int)` | Target `(width, height)` after resizing |\n| `R` | `np.ndarray` | 3×3 world-to-camera rotation (COLMAP convention) |\n| `T` | `np.ndarray` | 3×1 world-to-camera translation |\n| `FoVx` / `FoVy` | `float` | Horizontal and vertical field of view in radians |\n| `depth_params` | `dict` or `None` | Contains `scale`, `offset`, `med_scale` for depth normalization |\n| `image` | `PIL.Image` | Input RGB(A) image |\n| `invdepthmap` | `np.ndarray` or `None` | Inverse depth map (disparity) |\n| `trans` | `np.ndarray` | Additional translation offset applied to the camera pose |\n| `scale` | `float` | Uniform scale factor applied to the camera pose |\n| `train_test_exp` | `bool` | Enables exposure-comparison masking (half-image masking) |\n\n**Derived attributes (computed at construction):**\n\n| Attribute | Shape | Description |\n|---|---|---|\n| `original_image` | `(3, H, W)` | Resized, clamped [0,1] RGB tensor on `data_device` |\n| `alpha_mask` | `(1, H, W)` | Alpha channel or all-ones fallback |\n| `invdepthmap` | `(1, H, W)` | Scaled/offset inverse depth on `data_device`, or `None` |\n| `depth_mask` | `(1, H, W)` | Binary reliability mask for depth supervision |\n| `depth_reliable` | `bool` | Whether this camera's depth is trustworthy |\n| `world_view_transform` | `(4, 4)` | World-to-view matrix (transposed, on CUDA) |\n| `projection_matrix` | `(4, 4)` | Perspective projection matrix (transposed, on CUDA) |\n| `full_proj_transform` | `(4, 4)` | `world_view_transform @ projection_matrix` (on CUDA) |\n| `camera_center` | `(3,)` | Camera position in world space, extracted from inverse W2V |\n\n#### Image processing pipeline\n\n1. The PIL image is converted via `PILtoTorch(image, resolution)` → `(C, H, W)` tensor.\n2. Channels 0–2 become `original_image` (clamped to [0, 1]).\n3. Channel 3 (if present) becomes `alpha_mask`; otherwise a ones mask is synthesized.\n4. If `train_test_exp` is enabled and this is a test view, half the alpha mask is zeroed to support exposure evaluation — left half for `is_test_dataset`, right half otherwise.\n\n#### Depth processing pipeline\n\n1. The raw inverse depth map is resized to `resolution` via `cv2.resize`.\n2. Negative values are clamped to 0.\n3. If `depth_params` is provided, the scale is checked against `med_scale`: if `scale < 0.2 * med_scale` or `scale > 5 * med_scale`, the depth is marked unreliable and `depth_mask` is zeroed.\n4. If `scale > 0`, the map is affine-transformed: `invdepthmap = invdepthmap * scale + offset`.\n5. The result is squeezed to 2D, then unsqueezed to `(1, H, W)` and moved to `data_device`.\n\n#### Transform conventions\n\nAll 4×4 matrices are stored **transposed** (column-major) to match CUDA/gsplat expectations. The `full_proj_transform` is computed as a batched matrix multiply of the (transposed) world-view and projection matrices. The `camera_center` is extracted from the last row, first three columns of the *inverse* of the (transposed) world-view transform.\n\n---\n\n### `MiniCam` (`scene/cameras.py`)\n\nA lightweight, non-`nn.Module` camera representation that carries only geometric data — no images or depth. Used during the CUDA rasterization pass where only projection parameters are needed.\n\n**Constructor signature:**\n\n```python\nMiniCam(width, height, fovy, fovx, znear, zfar, world_view_transform, full_proj_transform)\n```\n\nAll transform arguments are expected to already be in the transposed convention. `camera_center` is derived identically to `Camera`: `view_inv[3][:3]`.\n\n## Factory Functions (`utils/camera_utils.py`)\n\n### `loadCam`\n\n```python\nloadCam(args, id, cam_info, resolution_scale, is_nerf_synthetic, is_test_dataset) -> Camera\n```\n\nConstructs a `Camera` from a `cam_info` dataclass and CLI arguments. Responsibilities:\n\n1. **Image loading** — Opens `cam_info.image_path` as a PIL Image.\n2. **Depth loading** — If `cam_info.depth_path` is non-empty, reads the 16-bit inverse depth map. For NeRF synthetic datasets the values are divided by 512; otherwise by 2¹⁶.\n3. **Resolution computation** — Determined by `args.resolution` and `resolution_scale`:\n   - **Integer mode** (`1`, `2`, `4`, `8`): `resolution = (orig_w / (resolution_scale × args.resolution), orig_h / ...)`\n   - **Auto mode** (`-1`): If width > 1600px, a global downscale factor is applied with a one-time warning. Otherwise no downscale.\n   - **Float mode**: `global_down = orig_w / args.resolution`, then `scale = global_down × resolution_scale`.\n4. **Camera construction** — Passes all parameters through to the `Camera` constructor.\n\n### `cameraList_from_camInfos`\n\n```python\ncameraList_from_camInfos(cam_infos, resolution_scale, args, is_nerf_synthetic, is_test_dataset) -> list[Camera]\n```\n\nIterates over `cam_infos` and calls `loadCam` for each, returning a list of `Camera` objects indexed by enumeration order.\n\n### `camera_to_JSON`\n\n```python\ncamera_to_JSON(id, camera: Camera) -> dict\n```\n\nSerializes a `Camera` into a JSON-compatible dictionary containing:\n\n| Key | Source |\n|---|---|\n| `id` | Passed-in `id` |\n| `img_name` | `camera.image_name` |\n| `width` / `height` | `camera.width` / `camera.height` |\n| `position` | Camera-to-world translation from `R⁻¹` and `T` |\n| `rotation` | Camera-to-world rotation (3×3 list-of-lists) |\n| `fy` / `fx` | Computed via `fov2focal(FoVy, height)` / `fov2focal(FoVx, width)` |\n\nNote: this function reconstructs the camera-to-world transform independently from `R` and `T` rather than using `camera_center` or `world_view_transform`, so it can serve as a cross-check.\n\n## Integration Points\n\nThe Camera System is consumed by:\n\n- **`scene/__init__.py`** — Calls `cameraList_from_camInfos` during scene construction and `camera_to_JSON` for export.\n- **CUDA rasterizer** — Receives `MiniCam` instances (or `Camera` attributes) for frustum culling and projection during forward rendering.\n- **Loss computation** — Reads `Camera.original_image`, `alpha_mask`, `invdepthmap`, and `depth_mask` for RGB, mask, and depth supervision losses.\n\n## Common Patterns\n\n**Adding a new camera attribute:** Add the parameter to `Camera.__init__`, store it, and update `loadCam` to pass it from `cam_info` or `args`.\n\n**Custom depth normalization:** Modify the depth processing block in `Camera.__init__` or adjust the `depth_params` dict before it reaches the constructor.\n\n**Changing resolution strategy:** Edit the branching logic in `loadCam`. The integer-mode path is used for explicit downscaling; the auto-mode path guards against excessively large inputs.","colmap-i-o":"# COLMAP I/O\n\n# COLMAP I/O Module\n\n## Overview\n\nThis module provides Python readers and writers for COLMAP's reconstruction file formats — both human-readable text (`.txt`) and compact binary (`.bin`). It is split across two files that serve different roles in the codebase:\n\n| File | Role |\n|---|---|\n| `scene/colmap_loader.py` | Read-only loader optimised for the scene-initialisation pipeline. Returns simplified data structures (e.g. flat NumPy arrays for 3D points). |\n| `utils/read_write_model.py` | Full-featured read/write utility (derived from COLMAP's official scripts). Returns rich namedtuples with complete track information. Supports round-trip serialisation. |\n\nBoth files are self-contained and share no imports with each other; they duplicate the core data structures and low-level helpers intentionally so each can be used independently.\n\n## Architecture\n\n```mermaid\ngraph TD\n    subgraph \"scene/colmap_loader.py\"\n        rit[\"read_intrinsics_text\"]\n        rib[\"read_intrinsics_binary\"]\n        ret[\"read_extrinsics_text\"]\n        reb[\"read_extrinsics_binary\"]\n        rpt[\"read_points3D_text\"]\n        rpb[\"read_points3D_binary\"]\n        rcba[\"read_colmap_bin_array\"]\n    end\n\n    subgraph \"utils/read_write_model.py\"\n        rct2[\"read_cameras_text\"]\n        rcb2[\"read_cameras_binary\"]\n        rit2[\"read_images_text\"]\n        rib2[\"read_images_binary\"]\n        rpt2[\"read_points3D_text\"]\n        rpb2[\"read_points3D_binary\"]\n        wct[\"write_cameras_text\"]\n        wcb[\"write_cameras_binary\"]\n        wit[\"write_images_text\"]\n        wib[\"write_images_binary\"]\n        wpt[\"write_points3D_text\"]\n        wpb[\"write_points3D_binary\"]\n        rm[\"read_model\"]\n        wm[\"write_model\"]\n    end\n\n    DSI[\"readColmapSceneInfo<br/>(scene/dataset_readers.py)\"]\n    DSI --> rit & rib & ret & reb & rpt & rpb & rcba\n\n    rm --> rct2 & rcb2 & rit2 & rib2 & rpt2 & rpb2\n    wm --> wct & wcb & wit & wib & wpt & wpb\n```\n\n`scene/colmap_loader.py` is the entry point used at runtime by the Gaussian Splatting scene loader. `utils/read_write_model.py` is a general-purpose utility for offline model inspection, conversion, and round-tripping.\n\n## Data Structures\n\nAll primary entities are represented as `namedtuple` instances (identical definitions in both files):\n\n### `CameraModel(model_id, model_name, num_params)`\n\nMetadata for a supported camera model. Used to resolve binary camera entries where only `model_id` is stored.\n\n### `Camera(id, model, width, height, params)`\n\n| Field | Type | Description |\n|---|---|---|\n| `id` | `int` | Unique camera identifier |\n| `model` | `str` | Model name, e.g. `\"PINHOLE\"`, `\"OPENCV\"` |\n| `width` | `int` | Image width in pixels |\n| `height` | `int` | Image height in pixels |\n| `params` | `np.ndarray` | Intrinsic parameters (length depends on model) |\n\n### `Image(id, qvec, tvec, camera_id, name, xys, point3D_ids)`\n\n| Field | Type | Description |\n|---|---|---|\n| `id` | `int` | Unique image identifier |\n| `qvec` | `np.ndarray` (shape 4) | Quaternion `(w, x, y, z)` for camera orientation |\n| `tvec` | `np.ndarray` (shape 3) | Translation vector for camera position |\n| `camera_id` | `int` | References a `Camera.id` |\n| `name` | `str` | Image filename |\n| `xys` | `np.ndarray` (shape N×2) | 2D keypoint pixel coordinates |\n| `point3D_ids` | `np.ndarray` (shape N) | Associated 3D point IDs (`-1` if unobserved`)` |\n\nThe `Image` class (extending `BaseImage`) adds a convenience method:\n\n```python\nimg = Image(...)\nR = img.qvec2rotmat()   # returns 3×3 rotation matrix from qvec\n```\n\n### `Point3D(id, xyz, rgb, error, image_ids, point2D_idxs)`\n\n| Field | Type | Description |\n|---|---|---|\n| `id` | `int` | Unique 3D point identifier |\n| `xyz` | `np.ndarray` (shape 3) | 3D position |\n| `rgb` | `np.ndarray` (shape 3) | Colour as uint8 |\n| `error` | `float` | Reprojection error |\n| `image_ids` | `np.ndarray` | IDs of images observing this point (the \"track\") |\n| `point2D_idxs` | `np.ndarray` | Corresponding 2D keypoint indices in each image |\n\n> **Important difference:** `scene/colmap_loader.py`'s `read_points3D_text` and `read_points3D_binary` return `(xyzs, rgbs, errors)` as flat NumPy arrays — they discard point IDs and track data. `utils/read_write_model.py`'s equivalents return a `dict[int, Point3D]` with full track information, enabling round-trip writes.\n\n## Camera Models\n\nThe `CAMERA_MODELS` set and the lookup dictionaries `CAMERA_MODEL_IDS` / `CAMERA_MODEL_NAMES` map between numeric IDs and model metadata:\n\n| ID | Name | Params |\n|---|---|---|\n| 0 | `SIMPLE_PINHOLE` | 3 (`f, cx, cy`) |\n| 1 | `PINHOLE` | 4 (`fx, fy, cx, cy`) |\n| 2 | `SIMPLE_RADIAL` | 4 |\n| 3 | `RADIAL` | 5 |\n| 4 | `OPENCV` | 8 |\n| 5 | `OPENCV_FISHEYE` | 8 |\n| 6 | `FULL_OPENCV` | 12 |\n| 7 | `FOV` | 5 |\n| 8 | `SIMPLE_RADIAL_FISHEYE` | 4 |\n| 9 | `RADIAL_FISHEYE` | 5 |\n| 10 | `THIN_PRISM_FISHEYE` | 12 |\n\n**Note:** `scene/colmap_loader.py`'s `read_intrinsics_text` asserts that the camera model is `\"PINHOLE\"`. The rest of the Gaussian Splatting pipeline assumes this model. `utils/read_write_model.py` supports all models without restriction.\n\n## Rotation Conversions\n\nTwo standalone functions convert between quaternion and rotation-matrix representations:\n\n### `qvec2rotmat(qvec) → np.ndarray (3×3)`\n\nConverts a quaternion `(w, x, y, z)` to a 3×3 rotation matrix. Uses the standard formula for unit quaternions.\n\n### `rotmat2qvec(R) → np.ndarray (shape 4)`\n\nConverts a 3×3 rotation matrix back to a quaternion `(w, x, y, z)`. Uses Shepperd's method via the symmetric matrix `K` and eigendecomposition, ensuring numerical stability. The scalar part `w` is forced non-negative for canonical form.\n\nBoth functions are defined identically in each file.\n\n## Low-Level Binary Helpers\n\n### `read_next_bytes(fid, num_bytes, format_char_sequence, endian_character=\"<\")`\n\nReads `num_bytes` from the open file handle `fid`, unpacks using `struct.unpack` with the given format string and little-endian byte order. Returns a tuple of unpacked values.\n\n### `write_next_bytes(fid, data, format_char_sequence, endian_character=\"<\")` *(utils only)*\n\nPacks `data` (scalar or list/tuple) using `struct.pack` and writes to `fid`. This is the inverse of `read_next_bytes` and only exists in `utils/read_write_model.py`.\n\n## Reading Functions\n\n### `scene/colmap_loader.py` — Read API\n\nThese functions are called by `readColmapSceneInfo` in `scene/dataset_readers.py`.\n\n| Function | Input | Returns |\n|---|---|---|\n| `read_intrinsics_text(path)` | `cameras.txt` | `dict[int, Camera]` (PINHOLE only) |\n| `read_intrinsics_binary(path)` | `cameras.bin` | `dict[int, Camera]` |\n| `read_extrinsics_text(path)` | `images.txt` | `dict[int, Image]` |\n| `read_extrinsics_binary(path)` | `images.bin` | `dict[int, Image]` |\n| `read_points3D_text(path)` | `points3D.txt` | `(xyzs, rgbs, errors)` — arrays of shape `(N,3)`, `(N,3)`, `(N,1)` |\n| `read_points3D_binary(path)` | `points3D.bin` | `(xyzs, rgbs, errors)` — arrays of shape `(N,3)`, `(N,3)`, `(N,1)` |\n| `read_colmap_bin_array(path)` | Dense binary file (depth/normal maps) | `np.ndarray` |\n\nThe points3D readers perform a two-pass read for text (first pass counts lines, second pass fills arrays) and a single-pass read for binary. Both discard track data (`image_ids`, `point2D_idxs`) and point IDs.\n\n`read_colmap_bin_array` reads COLMAP's dense binary format (used for depth and normal maps). The header contains `width&height&channels` as text, followed by `float32` data in Fortran (column-major) order. The function transposes to row-major and squeezes singleton dimensions.\n\n### `utils/read_write_model.py` — Read API\n\n| Function | Input | Returns |\n|---|---|---|\n| `read_cameras_text(path)` | `cameras.txt` | `dict[int, Camera]` |\n| `read_cameras_binary(path)` | `cameras.bin` | `dict[int, Camera]` |\n| `read_images_text(path)` | `images.txt` | `dict[int, Image]` |\n| `read_images_binary(path)` | `images.bin` | `dict[int, Image]` |\n| `read_points3D_text(path)` | `points3D.txt` | `dict[int, Point3D]` |\n| `read_points3D_binary(path)` | `points3D.bin` | `dict[int, Point3D]` |\n\nAll return fully-populated namedtuples with track data preserved.\n\n## Writing Functions *(utils only)*\n\n`scene/colmap_loader.py` has no write capability. All write functions live in `utils/read_write_model.py`:\n\n| Function | Writes |\n|---|---|\n| `write_cameras_text(cameras, path)` | `cameras.txt` with header comment |\n| `write_cameras_binary(cameras, path)` | `cameras.bin` |\n| `write_images_text(images, path)` | `images.txt` (two lines per image) |\n| `write_images_binary(images, path)` | `images.bin` |\n| `write_points3D_text(points3D, path)` | `points3D.txt` with header comment |\n| `write_points3D_binary(points3D, path)` | `points3D.bin` |\n\nText writers include COLMAP-compatible header comments with counts and statistics. Binary writers use `write_next_bytes` with the same format sequences the readers expect, ensuring round-trip fidelity.\n\n## Convenience API *(utils only)*\n\n### `read_model(path, ext=\"\") → (cameras, images, points3D)`\n\nReads a complete COLMAP reconstruction from a directory. If `ext` is empty, auto-detects the format by checking for `cameras.bin`/`cameras.txt` (and the other two companion files). Returns three dictionaries.\n\n### `write_model(cameras, images, points3D, path, ext=\".bin\") → (cameras, images, points3D)`\n\nWrites a complete reconstruction to a directory. Default format is binary.\n\n### `detect_model_format(path, ext) → bool`\n\nChecks whether all three expected files (`cameras` + `ext`, `images` + `ext`, `points3D` + `ext`) exist in the given directory. Used internally by `read_model`.\n\n## Binary Format Details\n\nFor developers modifying or extending the binary readers/writers, the COLMAP binary layout is:\n\n**cameras.bin:** `Q` (num_cameras), then per camera: `iiQQ` (id, model_id, width, height) + `d×num_params` (params).\n\n**images.bin:** `Q` (num_images), then per image: `idddddddi` (id, qw, qx, qy, qz, tx, ty, tz, camera_id) + null-terminated UTF-8 name string + `Q` (num_points2D) + `ddq×num_points2D` (x, y, point3D_id per keypoint).\n\n**points3D.bin:** `Q` (num_points), then per point: `QdddBBBd` (id, x, y, z, r, g, b, error) + `Q` (track_length) + `ii×track_length` (image_id, point2D_idx per track element).\n\nAll multi-byte values are little-endian (`\"<\"`).\n\n## Integration with the Codebase\n\nThe primary integration point is `readColmapSceneInfo` in `scene/dataset_readers.py`, which:\n\n1. Calls `read_intrinsics_text` or `read_intrinsics_binary` to load camera intrinsics.\n2. Calls `read_extrinsics_text` or `read_extrinsics_binary` to load per-image extrinsics.\n3. Calls `read_points3D_text` or `read_points3D_binary` to load the sparse point cloud (used for initialisation / point sampling).\n4. Calls `qvec2rotmat` to convert each image's quaternion to a rotation matrix for downstream camera-to-world transforms.\n5. Optionally calls `read_colmap_bin_array` for depth priors.\n\n`utils/read_write_model.py` is not imported by the runtime pipeline. It serves as a standalone utility for format conversion, model inspection, and debugging.","configuration-parameters":"# Configuration & Parameters\n\n# Configuration & Parameters\n\n## Overview\n\nThe `arguments` module provides a structured, declarative system for defining, parsing, and extracting configuration parameters for 3D Gaussian Splatting training and rendering. It wraps Python's `argparse` with a class-based convention where instance attributes on a `ParamGroup` subclass are automatically promoted to CLI arguments, and parsed values can be extracted back into typed, namespaced objects.\n\n## Architecture\n\n```mermaid\nclassDiagram\n    class ParamGroup {\n        +__init__(parser, name, fill_none)\n        +extract(args) GroupParams\n    }\n    class GroupParams {\n        <<data container>>\n    }\n    class ModelParams {\n        +sh_degree\n        +_source_path\n        +_model_path\n        +_images\n        +_resolution\n        +_white_background\n        +extract(args) GroupParams\n    }\n    class PipelineParams {\n        +convert_SHs_python\n        +compute_cov3D_python\n        +debug\n        +antialiasing\n    }\n    class OptimizationParams {\n        +iterations\n        +position_lr_init\n        +densification_interval\n        +lambda_dssim\n        ...\n    }\n    ParamGroup <|-- ModelParams\n    ParamGroup <|-- PipelineParams\n    ParamGroup <|-- OptimizationParams\n    ParamGroup --> GroupParams : creates via extract()\n```\n\n## Core Classes\n\n### `GroupParams`\n\nA bare container class with no predefined attributes. Instances are populated dynamically by `ParamGroup.extract()` and serve as lightweight, attribute-accessible namespaces for a specific parameter group.\n\n### `ParamGroup`\n\nThe base class that bridges instance attribute declarations and `argparse` argument registration.\n\n**Shorthand convention:** Any instance attribute whose name starts with an underscore (`_`) is registered with both a long form (`--name`) and a single-letter shorthand (`-n`, using the first character of the name after stripping the underscore). The underscore is stripped from the final argument name.\n\n| Attribute Declaration | CLI Flag | Shorthand |\n|---|---|---|\n| `self.sh_degree = 3` | `--sh_degree` | — |\n| `self._source_path = \"\"` | `--source_path` | `-s` |\n| `self._white_background = False` | `--white_background` | `-w` |\n\n**Boolean handling:** `bool` attributes are registered with `action=\"store_true\"` rather than accepting a value. The default is the attribute's initial value. This means `--white_background` enables it; omitting the flag leaves it at its default.\n\n#### `__init__(self, parser, name, fill_none=False)`\n\nIterates over `vars(self)`, registers each attribute as an argument in a new argument group named `name`. When `fill_none=True`, all defaults are set to `None` instead of the attribute values — used by `ModelParams` with its sentinel pattern to create a parser that doesn't inject defaults.\n\n#### `extract(self, args) → GroupParams`\n\nGiven a parsed `Namespace` (the full result of `parser.parse_args()`), pulls out only the keys that belong to this group (matching either the plain name or the underscore-prefixed declaration name) and returns them in a `GroupParams` instance.\n\n## Parameter Groups\n\n### `ModelParams` — Loading Parameters\n\nControls dataset and model I/O configuration.\n\n| Attribute | Default | Shorthand | Description |\n|---|---|---|---|\n| `sh_degree` | `3` | — | Maximum spherical harmonics degree |\n| `source_path` | `\"\"` | `-s` | Path to the source dataset |\n| `model_path` | `\"\"` | `-m` | Path to the trained model directory |\n| `images` | `\"images\"` | `-i` | Subdirectory name for input images |\n| `depths` | `\"\"` | `-d` | Subdirectory name for depth maps (empty = unused) |\n| `resolution` | `-1` | `-r` | Input resolution (`-1` = native) |\n| `white_background` | `False` | `-w` | Composite on white instead of black |\n| `train_test_exp` | `False` | — | Enable separate exposure compensation for train/test |\n| `data_device` | `\"cuda\"` | — | Device for data loading (`cuda` or `cpu`) |\n| `eval` | `False` | — | Enable evaluation split during training |\n\n**Sentinel pattern:** `ModelParams.__init__` accepts a `sentinel` flag. When `sentinel=False` (the default for normal use), `fill_none` is passed through to `ParamGroup.__init__`, causing all defaults to be `None`. This is used by `get_combined_args` to avoid the parser injecting defaults that would override saved config values.\n\n**Path resolution:** `ModelParams.extract()` overrides the base method to resolve `source_path` to an absolute path via `os.path.abspath()`.\n\n### `PipelineParams` — Pipeline Parameters\n\nControls which computation paths are active during rendering.\n\n| Attribute | Default | Description |\n|---|---|---|\n| `convert_SHs_python` | `False` | Use Python-based SH conversion instead of CUDA |\n| `compute_cov3D_python` | `False` | Use Python-based 3D covariance computation instead of CUDA |\n| `debug` | `False` | Enable pipeline debug mode |\n| `antialiasing` | `False` | Enable anti-aliasing during rasterization |\n\n### `OptimizationParams` — Optimization Parameters\n\nControls all training hyperparameters, learning rate schedules, and densification behavior.\n\n**Learning rates:**\n\n| Attribute | Default | Description |\n|---|---|---|\n| `position_lr_init` | `0.00016` | Initial Gaussian position learning rate |\n| `position_lr_final` | `0.0000016` | Final position learning rate (after delay + max steps) |\n| `position_lr_delay_mult` | `0.01` | Multiplier applied during the delay warmup phase |\n| `position_lr_max_steps` | `30_000` | Step count over which position LR decays |\n| `feature_lr` | `0.0025` | SH color features learning rate |\n| `opacity_lr` | `0.025` | Opacity learning rate |\n| `scaling_lr` | `0.005` | Scaling learning rate |\n| `rotation_lr` | `0.001` | Rotation learning rate |\n| `exposure_lr_init` | `0.01` | Initial exposure compensation learning rate |\n| `exposure_lr_final` | `0.001` | Final exposure compensation learning rate |\n| `exposure_lr_delay_steps` | `0` | Steps before exposure LR begins decaying |\n| `exposure_lr_delay_mult` | `0.0` | Exposure LR delay multiplier |\n\n**Densification:**\n\n| Attribute | Default | Description |\n|---|---|---|\n| `densify_from_iter` | `500` | First iteration to trigger densification |\n| `densify_until_iter` | `15_000` | Last iteration to trigger densification |\n| `densification_interval` | `100` | Iterations between densification passes |\n| `densify_grad_threshold` | `0.0002` | Position gradient norm threshold for splitting/cloning |\n| `opacity_reset_interval` | `3_000` | Iterations between opacity resets |\n| `percent_dense` | `0.01` | Fraction of scene extent defining \"overly dense\" Gaussians |\n\n**Loss and training:**\n\n| Attribute | Default | Description |\n|---|---|---|\n| `iterations` | `30_000` | Total training iterations |\n| `lambda_dssim` | `0.2` | Weight for D-SSIM loss term (`1 - lambda_dssim` for L1) |\n| `depth_l1_weight_init` | `1.0` | Initial weight for depth L1 loss |\n| `depth_l1_weight_final` | `0.01` | Final weight for depth L1 loss |\n| `random_background` | `False` | Randomize background color each iteration |\n| `optimizer_type` | `\"default\"` | Optimizer selection (`\"default\"` or `\"sparse_adam\"`) |\n\n## Argument Merging\n\n### `get_combined_args(parser) → Namespace`\n\nResumes training or applies overrides by merging two sources of configuration:\n\n1. **Saved config file** — `<model_path>/cfg_args` containing a `Namespace()` string written during the initial training run.\n2. **Command-line arguments** — current `sys.argv` overrides.\n\n```python\n# Typical usage at training resume:\nparser = ArgumentParser()\nmodel_params = ModelParams(parser, sentinel=True)  # sentinel=True → fill_none=True → no defaults injected\npipeline_params = PipelineParams(parser)\noptim_params = OptimizationParams(parser)\nargs = get_combined_args(parser)\n```\n\n**Merge rule:** Values from the config file form the base. Any command-line value that is not `None` overwrites the config value. This means CLI flags only override when explicitly provided; omitted flags fall back to the saved configuration.\n\n**Warning:** The function uses `eval()` to parse the config file contents. The file is expected to contain a valid Python `Namespace(...)` expression. This is safe when the config file is self-generated, but do not manually edit it with untrusted input.\n\n## Usage Patterns\n\n### Registering and parsing arguments\n\n```python\nfrom argparse import ArgumentParser\nfrom arguments import ModelParams, PipelineParams, OptimizationParams\n\nparser = ArgumentParser(description=\"Training script\")\nmodel_params = ModelParams(parser)\npipeline_params = PipelineParams(parser)\noptim_params = OptimizationParams(parser)\n\nargs = parser.parse_args()\n```\n\n### Extracting typed parameter groups\n\nAfter parsing, extract each group into its own namespace:\n\n```python\nmodel = model_params.extract(args)    # GroupParams with source_path, sh_degree, etc.\npipeline = pipeline_params.extract(args)\noptim = optim_params.extract(args)\n\nprint(model.source_path)   # absolute path\nprint(optim.iterations)     # 30000\n```\n\n### Extending with a new parameter group\n\nSubclass `ParamGroup`, declare attributes as instance variables, and call `super().__init__()`:\n\n```python\nclass MyCustomParams(ParamGroup):\n    def __init__(self, parser):\n        self.custom_flag = False        # --custom_flag, store_true\n        self._batch_size = 32           # --batch_size -b, int, default 32\n        self.learning_rate = 0.001      # --learning_rate, float, default 0.001\n        super().__init__(parser, \"Custom Parameters\")\n```\n\nFollow the underscore-prefix convention for any parameter that benefits from a short flag. Boolean attributes are automatically registered as `store_true` actions.","conversion":"# Conversion\n\n# Conversion Module\n\n## Overview\n\n`convert.py` is a standalone preprocessing script that transforms a directory of raw input images into a COLMAP-compatible dataset structure suitable for 3D Gaussian Splatting training. It wraps the full COLMAP Structure-from-Motion pipeline — feature extraction, matching, bundle adjustment, and image undistortion — and optionally generates multi-resolution image pyramids using ImageMagick.\n\nThe script is based on the shell converter provided in the MipNeRF 360 repository and is intended to be invoked directly from the command line before training.\n\n## Pipeline\n\n```mermaid\nflowchart TD\n    A[Raw Input Images] --> B{skip_matching?}\n    B -- No --> C[Feature Extraction]\n    C --> D[Feature Matching]\n    D --> E[Bundle Adjustment / Mapper]\n    B -- Yes --> F[Image Undistortion]\n    E --> F\n    F --> G[Reorganize Sparse Reconstruction]\n    G --> H{resize?}\n    H -- Yes --> I[Generate 50% / 25% / 12.5% Pyramids]\n    H -- No --> J[Done]\n    I --> J\n```\n\n## Command-Line Arguments\n\n| Argument | Short | Type | Default | Description |\n|---|---|---|---|---|\n| `--source_path` | `-s` | `str` | *required* | Root directory containing an `input/` subfolder with raw images |\n| `--no_gpu` | — | flag | `False` | Disable GPU acceleration for COLMAP's SIFT extraction and matching |\n| `--skip_matching` | — | flag | `False` | Skip feature extraction, matching, and mapping; go directly to undistortion (use when a COLMAP reconstruction already exists) |\n| `--camera` | — | `str` | `OPENCV` | COLMAP camera model type (e.g., `SIMPLE_PINHOLE`, `PINHOLE`, `OPENCV`) |\n| `--colmap_executable` | — | `str` | `\"\"` | Path to the COLMAP binary. Defaults to `colmap` on `$PATH` |\n| `--resize` | — | flag | `False` | Generate downsampled image pyramids at ½, ¼, and ⅛ resolution |\n| `--magick_executable` | — | `str` | `\"\"` | Path to the ImageMagick binary. Defaults to `magick` on `$PATH` |\n\n## Expected Input Layout\n\n```\n<source_path>/\n└── input/\n    ├── image_001.jpg\n    ├── image_002.jpg\n    └── ...\n```\n\nThe `input/` directory must contain the raw photographs. All other directories are created by the script.\n\n## Output Structure\n\nAfter a full run (with `--resize`), the directory tree becomes:\n\n```\n<source_path>/\n├── input/                  # Original images (unchanged)\n├── distorted/\n│   ├── database.db         # COLMAP feature/matching database\n│   └── sparse/\n│       └── 0/              # Initial sparse reconstruction (before undistortion)\n├── sparse/\n│   └── 0/                  # Final sparse reconstruction (cameras, points, images bin files)\n├── images/                 # Undistorted images (full resolution)\n├── images_2/               # 50% resolution\n├── images_4/               # 25% resolution\n└── images_8/               # 12.5% resolution\n```\n\n## Pipeline Stages\n\n### 1. Feature Extraction\n\nInvokes `colmap feature_extractor` on the images in `input/`. Key parameters:\n\n- `ImageReader.single_camera` is set to `1`, meaning all images share a single intrinsic model. Change `--camera` if your dataset requires per-image intrinsics or a different distortion model.\n- `SiftExtraction.use_gpu` is controlled by `--no_gpu`.\n\nOutput: feature descriptors written to `distorted/database.db`.\n\n### 2. Feature Matching\n\nInvokes `colmap exhaustive_matcher` against the same database. Uses exhaustive matching (every image pair), which is appropriate for small-to-medium datasets. For very large datasets (hundreds of images), consider running COLMAP's sequential or spatial matcher manually instead.\n\nOutput: matches written to `distorted/database.db`.\n\n### 3. Bundle Adjustment (Mapper)\n\nInvokes `colmap mapper` to run incremental SfM, producing a sparse point cloud and camera poses. The global bundle adjustment tolerance is tightened to `0.000001` (from COLMAP's default), which speeds up convergence.\n\nOutput: sparse reconstruction in `distorted/sparse/0/`.\n\n### 4. Image Undistortion\n\nInvokes `colmap image_undistorter` to warp images into ideal pinhole intrinsics using the reconstruction from stage 3. This step always runs, even with `--skip_matching`.\n\nOutput: undistorted images in `images/`, and a clean sparse reconstruction in `sparse/`.\n\n### 5. Sparse File Reorganization\n\nCOLMAP's `image_undistorter` writes the sparse reconstruction files directly into `sparse/` (not inside a `0/` subdirectory). The script moves them into `sparse/0/` to match the directory layout expected by the Gaussian Splatting training code.\n\n### 6. Multi-Resolution Image Pyramids\n\nWhen `--resize` is set, the script creates three downsampled copies of every image in `images/`:\n\n| Directory | Scale | Use Case |\n|---|---|---|\n| `images_2` | 50% | Coarse training / preview |\n| `images_4` | 25% | Coarse training |\n| `images_8` | 12.5% | Coarse training |\n\nResizing is performed with `magick mogrify -resize`. Each image is first copied with `shutil.copy2` (preserving metadata), then resized in-place.\n\n## Skipping Existing Reconstructions\n\nIf you already have a COLMAP reconstruction (e.g., from a prior run or manual processing), use `--skip_matching` to jump directly to the undistortion step. In this case, the script expects the reconstruction to exist at `<source_path>/distorted/sparse/0/`.\n\n## Error Handling\n\nEvery COLMAP and ImageMagick invocation checks the process exit code. On failure, the script logs an error via `logging.error` and terminates immediately with the failing exit code. There is no partial recovery — fix the issue and re-run.\n\n## Dependencies\n\n- **COLMAP** — required for all SfM and undistortion steps. Must be on `$PATH` or specified via `--colmap_executable`.\n- **ImageMagick** — required only when `--resize` is used. Must be on `$PATH` or specified via `--magick_executable`.\n\n## Usage Examples\n\n**Full pipeline with GPU:**\n```bash\npython convert.py -s /data/my_scene\n```\n\n**Full pipeline, force CPU for SIFT:**\n```bash\npython convert.py -s /data/my_scene --no_gpu\n```\n\n**Skip SfM, only undistort + resize:**\n```bash\npython convert.py -s /data/my_scene --skip_matching --resize\n```\n\n**Custom COLMAP binary and OPENCV camera model:**\n```bash\npython convert.py -s /data/my_scene --colmap_executable /usr/local/bin/colmap --camera OPENCV\n```\n\n## Limitations\n\n- The script uses `exhaustive_matcher`, which has quadratic cost in the number of images. For datasets with more than ~200 images, consider running COLMAP manually with a sequential or vocabulary-tree matcher.\n- `ImageReader.single_camera` is hardcoded to `1`. If your dataset uses multiple cameras with different intrinsics, you will need to modify the script or run COLMAP manually.\n- The script provides no resumability — if it fails mid-way, you must re-run from the beginning or manually clean up partial outputs.\n- Image resizing uses percentage-based scaling, so the absolute pixel dimensions depend on the input image size. There is no option to resize to a target pixel count.","evaluation-metrics":"# Evaluation & Metrics\n\n# Evaluation & Metrics\n\n## Overview\n\nThis module provides image-quality evaluation for rendered scenes by computing three standard metrics—**PSNR**, **SSIM**, and **LPIPS**—against ground-truth images. It ships as two entry points:\n\n- **`metrics.py`** — computes metrics on already-rendered output and writes JSON results.\n- **`full_eval.py`** — orchestrates the full benchmark pipeline (train → render → metrics) across standard datasets.\n\nBoth are designed to be run as standalone CLI scripts.\n\n---\n\n## Metrics Computed\n\n| Metric | Source | Range | Interpretation |\n|--------|--------|-------|----------------|\n| **PSNR** | `utils/image_utils.psnr` | 0–∞ dB | Higher is better. Peak signal-to-noise ratio derived from MSE. |\n| **SSIM** | `utils.loss_utils.ssim` | 0–1 | Higher is better. Structural similarity using a Gaussian-windowed comparison of luminance, contrast, and structure. |\n| **LPIPS** | `lpipsPyTorch.lpips` (VGG backbone) | 0–1 | Lower is better. Learned perceptual similarity via deep features. |\n\n### PSNR Implementation\n\nDefined in `utils/image_utils.py`:\n\n```python\ndef mse(img1, img2):\n    return (((img1 - img2)) ** 2).view(img1.shape[0], -1).mean(1, keepdim=True)\n\ndef psnr(img1, img2):\n    mse = (((img1 - img2)) ** 2).view(img1.shape[0], -1).mean(1, keepdim=True)\n    return 20 * torch.log10(1.0 / torch.sqrt(mse))\n```\n\nBoth functions expect batched tensors in `[B, C, H, W]` format with values in `[0, 1]`. The `1.0` constant assumes the images are normalized to that range (which they are—see `readImages` below).\n\n### SSIM Call Chain\n\n`evaluate` calls `ssim` from `utils.loss_utils`, which internally calls `_ssim` after creating a Gaussian window via `create_window` → `gaussian`. This is the same SSIM used during training (called from `training_report` in `train.py`), ensuring consistency between training-time monitoring and final evaluation.\n\n---\n\n## Expected Directory Layout\n\n`metrics.py` expects each model path to contain a `test/` directory with one subdirectory per method, each holding paired `renders/` and `gt/` folders with identically-named image files:\n\n```\n<model_path>/\n└── test/\n    └── <method_name>/\n        ├── renders/\n        │   ├── 0001.png\n        │   ├── 0002.png\n        │   └── ...\n        └── gt/\n            ├── 0001.png\n            ├── 0002.png\n            └── ...\n```\n\nThis structure is produced by `render.py` when run with the `--eval` flag.\n\n---\n\n## `metrics.py` — Core Evaluation\n\n### `readImages(renders_dir, gt_dir)`\n\nLoads all images from both directories, matching by filename.\n\n- Converts each image to a CUDA tensor via `tf.to_tensor` (PIL → `[0,1]` float tensor).\n- Strips the alpha channel, keeping only the first 3 channels (`[:, :3, :, :]`).\n- Returns three lists: `renders`, `gts`, `image_names`.\n\n**Important:** Filenames must match exactly between `renders/` and `gt/`. The function iterates over `os.listdir(renders_dir)` and opens the same filename from `gt_dir`.\n\n### `evaluate(model_paths)`\n\nMain evaluation loop. For each scene directory in `model_paths`:\n\n1. Iterates over every method subdirectory under `<scene>/test/`.\n2. Calls `readImages` to load rendered and ground-truth pairs.\n3. Computes SSIM, PSNR, and LPIPS per view (with a `tqdm` progress bar).\n4. Prints aggregate means to stdout.\n5. Writes two JSON files:\n\n| File | Content |\n|------|---------|\n| `<scene>/results.json` | Aggregate mean per metric, per method |\n| `<scene>/per_view.json` | Per-view metric values keyed by image name, per method |\n\nErrors for individual scenes are caught and reported without halting the full evaluation.\n\n### CLI Usage\n\n```bash\npython metrics.py -m <path1> <path2> ...\n```\n\nThe `-m` / `--model_paths` argument accepts one or more scene directories.\n\n---\n\n## `full_eval.py` — Full Benchmark Pipeline\n\nThis script automates the complete evaluation workflow across three standard benchmark datasets:\n\n| Dataset | Scenes | Image Resolution |\n|---------|--------|-----------------|\n| Mip-NeRF 360 (outdoor) | bicycle, flowers, garden, stump, treehill | `images_4` (1/4 res) |\n| Mip-NeRF 360 (indoor) | room, counter, kitchen, bonsai | `images_2` (1/2 res) |\n| Tanks and Temples | truck, train | full resolution |\n| Deep Blending | drjohnson, playroom | full resolution |\n\n### Execution Flow\n\n```mermaid\nflowchart TD\n    A[full_eval.py] --> B{skip_training?}\n    B -- No --> C[train.py for each scene]\n    C --> D[Record timing per dataset]\n    D --> E{skip_rendering?}\n    B -- Yes --> E\n    E -- No --> F[render.py at iter 7000 & 30000]\n    F --> G{skip_metrics?}\n    E -- Yes --> G\n    G -- No --> H[metrics.py on all scenes]\n    G -- Yes --> I[Done]\n    H --> I\n```\n\n### CLI Arguments\n\n| Flag | Description |\n|------|-------------|\n| `--skip_training` | Skip the training phase |\n| `--skip_rendering` | Skip the rendering phase |\n| `--skip_metrics` | Skip metric computation |\n| `--output_path` | Root output directory (default: `./eval`) |\n| `--use_depth` | Pass `-d depths2/` to training |\n| `--use_expcomp` | Enable exposure compensation training |\n| `--fast` | Use `sparse_adam` optimizer |\n| `--aa` | Enable antialiasing |\n| `-m360` | Path to Mip-NeRF 360 dataset root (required if training or rendering) |\n| `-tat` | Path to Tanks and Temples dataset root (required if training or rendering) |\n| `-db` | Path to Deep Blending dataset root (required if training or rendering) |\n\n### Training Phase\n\nEach scene is trained with `--disable_viewer --quiet --eval --test_iterations -1`. Optional flags (`--antialiasing`, `-d depths2/`, exposure compensation args, `--optimizer_type sparse_adam`) are appended based on the CLI flags. Indoor Mip-NeRF 360 scenes use `-i images_2`; outdoor use `-i images_4`.\n\nTraining time is recorded per dataset group and written to `<output_path>/timing.txt`.\n\n### Rendering Phase\n\nEach scene is rendered at both iteration 7000 and iteration 30000 using `render.py --skip_train --eval`. The `--use_expcomp` and `--aa` flags propagate to rendering where applicable.\n\n### Metrics Phase\n\nInvokes `metrics.py` with all scene output directories, computing the three metrics across every rendered method.\n\n---\n\n## Integration with the Codebase\n\nThe evaluation module sits at the end of the Gaussian Splatting pipeline:\n\n- **Training** (`train.py`) uses `ssim` and `psnr` from `utils/loss_utils` and `utils/image_utils` for on-the-fly reporting via `training_report`.\n- **Rendering** (`render.py`) with `--eval` produces the `test/<method>/{renders,gt}` directory structure that `metrics.py` consumes.\n- **Evaluation** (`metrics.py`) reuses the same `ssim` and `psnr` implementations, plus adds LPIPS for perceptual quality assessment.\n\nThis shared metric code ensures that numbers reported during training and final evaluation are directly comparable.\n\n---\n\n## Output Format\n\n### `results.json`\n\n```json\n{\n \"point_cloud_7000\": {\n  \"SSIM\": 0.9512,\n  \"PSNR\": 28.342,\n  \"LPIPS\": 0.087\n },\n \"point_cloud_30000\": {\n  \"SSIM\": 0.9734,\n  \"PSNR\": 31.105,\n  \"LPIPS\": 0.042\n }\n}\n```\n\n### `per_view.json`\n\n```json\n{\n \"point_cloud_7000\": {\n  \"SSIM\": {\"0001.png\": 0.96, \"0002.png\": 0.94},\n  \"PSNR\": {\"0001.png\": 29.1, \"0002.png\": 27.5},\n  \"LPIPS\": {\"0001.png\": 0.07, \"0002.png\": 0.10}\n }\n}\n```\n\n---\n\n## Notes\n\n- **GPU required.** `readImages` moves all tensors to CUDA (` .cuda()`). Running on CPU will fail.\n- **Alpha channel handling.** Only RGB channels are retained (`:3`). RGBA ground-truth images are safe to use.\n- **Error resilience.** `evaluate` wraps each scene in a try/except, so a single corrupt image or missing directory won't abort the entire batch.\n- **LPIPS backbone.** The VGG network (`net_type='vgg'`) is used for all LPIPS computations. The `lpipsPyTorch` package must be installed and will download pretrained weights on first use.","gaussian-model":"# Gaussian Model\n\n# GaussianModel\n\nThe central data structure for 3D Gaussian Splatting. `GaussianModel` stores, optimizes, and manages the full set of Gaussian parameters — positions, spherical harmonic coefficients, scaling, rotation, and opacity — along with the infrastructure for adaptive densification, per-image exposure compensation, and PLY serialization.\n\n## Architecture Overview\n\n```mermaid\ngraph TD\n    GM[GaussianModel] --> Params[Raw Parameters _xyz, _features_dc, _features_rest, _scaling, _rotation, _opacity]\n    GM --> Props[Activated Properties get_xyz, get_scaling, get_rotation, get_opacity, get_features, get_covariance]\n    GM --> Densify[Densification densify_and_clone, densify_and_split, densify_and_prune]\n    GM --> IO[Serialization save_ply, load_ply]\n    GM --> Optim[Optimizer Management replace_tensor_to_optimizer, _prune_optimizer, cat_tensors_to_optimizer]\n    Densify --> Optim\n    Densify --> Props\n    Props --> Params\n```\n\n## Parameter Storage & Activations\n\nAll optimizable parameters are stored in their **raw (pre-activation) form** as `nn.Parameter` instances, prefixed with an underscore. Properties apply the corresponding activation function on access:\n\n| Raw Parameter | Property | Activation | Inverse Activation |\n|---|---|---|---|\n| `_xyz` | `get_xyz` | None (identity) | — |\n| `_scaling` | `get_scaling` | `torch.exp` | `torch.log` |\n| `_rotation` | `get_rotation` | `F.normalize` (quaternion) | — |\n| `_opacity` | `get_opacity` | `torch.sigmoid` | `inverse_sigmoid` |\n| `_features_dc` | `get_features_dc` | None | — |\n| `_features_rest` | `get_features_rest` | None | — |\n\nThe **covariance** is computed on-the-fly via `get_covariance(scaling_modifier)`, which calls `build_covariance_from_scaling_rotation` to construct the symmetric covariance matrix from the activated scaling and raw rotation, using `build_scaling_rotation` and `strip_symmetric`.\n\nSpherical harmonic features are split into two groups:\n- **`_features_dc`**: The DC (0th-order) SH coefficient — shape `(N, 1, 3)`.\n- **`_features_rest`**: Higher-order SH coefficients — shape `(N, (max_sh_degree+1)² - 1, 3)`.\n\n`get_features` concatenates both along dim=1, yielding shape `(N, (max_sh_degree+1)², 3)`.\n\n## Initialization\n\n### `create_from_pcd(pcd, cam_infos, spatial_lr_scale)`\n\nInitializes all Gaussian parameters from a `BasicPointCloud`:\n\n1. **Positions** — taken directly from `pcd.points`.\n2. **Colors** — converted from RGB to SH DC coefficients via `RGB2SH`. Higher-order SH coefficients are zeroed.\n3. **Scaling** — computed from KNN distances: `distCUDA2` finds the squared distance to the nearest neighbor for each point, then `log(sqrt(dist2))` is replicated across all 3 axes. This gives each Gaussian an initial size proportional to local point density.\n4. **Rotation** — initialized to identity quaternion `(1, 0, 0, 0)`.\n5. **Opacity** — initialized to `inverse_sigmoid(0.1)`, i.e., a raw value that maps through sigmoid to 0.1.\n6. **Exposure** — per-camera 3×4 affine correction matrices, initialized to identity. A mapping from `image_name` to index is built from `cam_infos`.\n\n### `load_ply(path, use_train_test_exp)`\n\nRestores all parameters from a PLY file. Parses vertex attributes by naming convention (`f_dc_*`, `f_rest_*`, `scale_*`, `rot_*`, `opacity`). Sets `active_sh_degree = max_sh_degree`. Optionally loads pretrained exposure parameters from a sibling `exposure.json` file.\n\n## Training Setup & Learning Rate Scheduling\n\n### `training_setup(training_args)`\n\nConfigures the optimizer with six parameter groups, each with its own learning rate:\n\n| Group Name | Parameter | Learning Rate |\n|---|---|---|\n| `xyz` | `_xyz` | `position_lr_init × spatial_lr_scale` |\n| `f_dc` | `_features_dc` | `feature_lr` |\n| `f_rest` | `_features_rest` | `feature_lr / 20.0` |\n| `opacity` | `_opacity` | `opacity_lr` |\n| `scaling` | `_scaling` | `scaling_lr` |\n| `rotation` | `_rotation` | `rotation_lr` |\n\nTwo optimizer types are supported:\n- **`\"default\"`** — standard `torch.optim.Adam` (eps=1e-15).\n- **`\"sparse_adam\"`** — `SparseGaussianAdam` from the diff-gaussian-rasterization package, falling back to Adam if unavailable.\n\nA separate `exposure_optimizer` (Adam) manages `_exposure` parameters.\n\nPosition and exposure learning rates follow exponential decay schedules built by `get_expon_lr_func`, stored in `xyz_scheduler_args` and `exposure_scheduler_args`.\n\n### `update_learning_rate(iteration)`\n\nCalled each training step. Updates the `xyz` param group's learning rate via `xyz_scheduler_args`. If no pretrained exposures are loaded, also updates the exposure learning rate. Returns the new xyz learning rate.\n\n### `oneupSHdegree()`\n\nIncrements `active_sh_degree` by 1 (up to `max_sh_degree`). Called periodically during training to progressively enable higher-order SH coefficients.\n\n## Densification\n\nDensification is the core adaptive mechanism that grows and prunes the Gaussian set during training. It operates on view-space positional gradient statistics accumulated via `add_densification_stats`.\n\n### `add_densification_stats(viewspace_point_tensor, update_filter)`\n\nAccumulates the L2 norm of view-space gradients into `xyz_gradient_accum` and increments `denom` for points visible in the current frame (indicated by `update_filter`). These running averages drive densification decisions.\n\n### `densify_and_prune(max_grad, min_opacity, extent, max_screen_size, radii)`\n\nThe main entry point called from the training loop. Orchestrates the full densification cycle:\n\n1. Computes average gradients: `xyz_gradient_accum / denom` (NaN-safe).\n2. **Clones** small Gaussians with high gradients via `densify_and_clone`.\n3. **Splits** large Gaussians with high gradients via `densify_and_split`.\n4. **Prunes** Gaussians that are too transparent (`opacity < min_opacity`), too large in screen space (`max_radii2D > max_screen_size`), or too large in world space (`max scaling > 0.1 × extent`).\n\n### `densify_and_clone(grads, grad_threshold, scene_extent)`\n\nDuplicates Gaussians whose gradient norm exceeds `grad_threshold` **and** whose maximum scale is at most `percent_dense × scene_extent`. Cloned points inherit all properties of the source. This handles under-reconstruction in regions where Gaussians are small enough.\n\n### `densify_and_split(grads, grad_threshold, scene_extent, N=2)`\n\nReplaces large Gaussians (gradient above threshold **and** max scale > `percent_dense × scene_extent`) with `N` smaller ones:\n\n1. Samples `N` offset positions from a Gaussian distribution scaled by the current scaling and rotated by the current rotation.\n2. New scaling = `current_scaling / (0.8 × N)` (slightly smaller to maintain coverage).\n3. New rotation and SH features are copied from the parent.\n4. The original parent point is pruned after the children are added.\n\n### `prune_points(mask)`\n\nRemoves all points where `mask` is `True`. Delegates to `_prune_optimizer` to correctly slice optimizer state (exp_avg, exp_avg_sq) along with the parameters. Also prunes `xyz_gradient_accum`, `denom`, `max_radii2D`, and `tmp_radii`.\n\n### `reset_opacity()`\n\nClamps all opacities to at most 0.01 (after sigmoid), then converts back to raw values. Used periodically during training to force the model to rely on geometry rather than opacity for rendering. Implemented via `replace_tensor_to_optimizer`.\n\n## Optimizer State Management\n\nDensification operations must keep optimizer momentum buffers (Adam's `exp_avg` and `exp_avg_sq`) consistent with the changing parameter tensors. Three internal methods handle this:\n\n- **`_prune_optimizer(mask)`** — Slices optimizer state and parameters using a boolean mask. Points where `mask` is `True` are **kept**.\n- **`cat_tensors_to_optimizer(tensors_dict)`** — Appends new parameter rows and zero-initialized momentum buffers to existing optimizer state.\n- **`replace_tensor_to_optimizer(tensor, name)`** — Replaces a parameter entirely (e.g., during `reset_opacity`), resetting its momentum buffers to zero.\n\nAll three return a dict mapping group names to the new `nn.Parameter` objects, which are then assigned back to the model's raw parameter attributes.\n\n## Serialization\n\n### `save_ply(path)`\n\nWrites all Gaussian parameters to a PLY file. Attributes are named following the convention used by `construct_list_of_attributes`: `x/y/z`, `nx/ny/nz` (zeros), `f_dc_0..2`, `f_rest_0..M`, `opacity`, `scale_0..2`, `rot_0..3`. The directory is created via `mkdir_p` if it doesn't exist.\n\n### `load_ply(path, use_train_test_exp)`\n\nReads a PLY file and reconstructs all parameters. SH features are parsed by naming convention and reshaped to `(N, 3, SH_coeffs)`. When `use_train_test_exp` is `True`, attempts to load pretrained exposure matrices from `exposure.json` two directories up from the PLY file.\n\n## State Capture & Restoration\n\n### `capture()`\n\nReturns a tuple of all model state needed to resume training: active SH degree, all raw parameters, `max_radii2D`, gradient accumulators, `denom`, optimizer state dict, and `spatial_lr_scale`.\n\n### `restore(model_args, training_args)`\n\nReconstructs the model from a `capture()` tuple. Calls `training_setup` to reinitialize the optimizer, then reloads the saved optimizer state dict and gradient accumulators.\n\n## Exposure Compensation\n\nThe model maintains per-camera 3×4 affine exposure correction matrices (`_exposure`), optimized separately from the main Gaussians.\n\n- **`get_exposure`** — Returns the full `_exposure` parameter tensor.\n- **`get_exposure_from_name(image_name)`** — Looks up the exposure for a specific image. If `pretrained_exposures` is set (loaded from `exposure.json`), returns the fixed pretrained value; otherwise returns the learnable parameter at the mapped index.\n\nThe exposure optimizer and scheduler are managed independently in `training_setup` and `update_learning_rate`.\n\n## Integration with the Codebase\n\n| Caller | Method Called | Purpose |\n|---|---|---|\n| `Scene.__init__` | `create_from_pcd` / `load_ply` | Initialize or restore the Gaussian set |\n| `Scene.save` | `save_ply`, `get_exposure_from_name` | Persist model to disk |\n| `train.py` training loop | `training_setup`, `update_learning_rate`, `oneupSHdegree`, `densify_and_prune`, `reset_opacity`, `add_densification_stats`, `capture`, `restore` | Full training lifecycle |\n| `GaussianRenderer.render` | `get_covariance`, `get_exposure_from_name` | Access activated parameters for rasterization |","general-utilities":"# General Utilities\n\n# General Utilities\n\nThis module provides foundational utilities for the 3D Gaussian Splatting pipeline, spanning mathematical helpers for covariance/rotation computation, learning rate scheduling, image conversion, filesystem operations, and depth map scaling. It is organized across three files:\n\n| File | Domain |\n|---|---|\n| `utils/general_utils.py` | Math, learning rate, image I/O, reproducibility |\n| `utils/system_utils.py` | Filesystem and checkpoint iteration helpers |\n| `utils/make_depth_scale.py` | Standalone depth scale/offset computation script |\n\n---\n\n## Covariance and Rotation Pipeline\n\nThe most critical functions in this module form a pipeline that constructs and compresses 3D covariance matrices for Gaussian primitives. This is the core geometric computation underpinning how each Gaussian's shape is represented.\n\n```mermaid\nflowchart LR\n    S[\"Scaling vector s\"] --> BSR[\"build_scaling_rotation\"]\n    R[\"Quaternion r\"] --> BSR\n    BSR --> BR[\"build_rotation\"]\n    BR --> M[\"M = R · diag(s)\"]\n    M --> SS[\"strip_symmetric\"]\n    SS --> SL[\"strip_lowerdiag\"]\n    SL --> V[\"6-element vector\"]\n```\n\n### `build_rotation(r)`\n\nConverts a batch of quaternions to 3×3 rotation matrices using the standard quaternion-to-rotation formula.\n\n**Parameters:**\n- `r` — Tensor of shape `(N, 4)` in **(w, x, y, z)** order (scalar-first convention).\n\n**Returns:** Tensor of shape `(N, 3, 3)` with rotation matrices on CUDA.\n\n**Details:** Quaternions are normalized before conversion. The implementation follows the standard formula:\n\n```\nR = [1-2(y²+z²)   2(xy-wz)   2(xz+wy)]\n    [2(xy+wz)   1-2(x²+z²)   2(yz-wx)]\n    [2(xz-wy)     2(yz+wx)   1-2(x²+y²)]\n```\n\n**Called by:** `build_scaling_rotation`, and directly by `densify_and_split` in `GaussianModel` when splitting Gaussians (new Gaussians inherit the parent's rotation but need it as a matrix for covariance recomputation).\n\n### `build_scaling_rotation(s, r)`\n\nConstructs the combined scaling-rotation matrix **M = R · diag(s)** for each Gaussian in the batch.\n\n**Parameters:**\n- `s` — Tensor of shape `(N, 3)`, per-axis scaling factors.\n- `r` — Tensor of shape `(N, 4)`, quaternions in (w, x, y, z) order.\n\n**Returns:** Tensor of shape `(N, 3, 3)` on CUDA. Each matrix is the product of the rotation matrix and the diagonal scaling matrix.\n\n**Called by:** `build_covariance_from_scaling_rotation` in `GaussianModel`, which then computes the full covariance as **Σ = M · Mᵀ**.\n\n### `strip_lowerdiag(L)` / `strip_symmetric(sym)`\n\nExtracts the 6 unique elements from a batch of symmetric 3×3 matrices by taking the lower triangle.\n\n**Parameters:**\n- `L` / `sym` — Tensor of shape `(N, 3, 3)`, symmetric matrices.\n\n**Returns:** Tensor of shape `(N, 6)` with elements in order: `[L₀₀, L₀₁, L₀₂, L₁₁, L₁₂, L₂₂]`.\n\n`strip_symmetric` is a thin wrapper that delegates to `strip_lowerdiag`. The distinction exists because for symmetric matrices the lower and upper triangles are identical, but the naming clarifies intent at call sites.\n\n**Called by:** `build_covariance_from_scaling_rotation` in `GaussianModel`, after computing **Σ = M · Mᵀ** (which is symmetric by construction), to obtain the compact 6-element representation stored per Gaussian.\n\n---\n\n## Learning Rate Scheduling\n\n### `get_expon_lr_func(lr_init, lr_final, lr_delay_steps=0, lr_delay_mult=1.0, max_steps=1000000)`\n\nReturns a closure that computes a log-linearly interpolated (exponentially decaying) learning rate for a given step, with an optional warmup delay.\n\n**Parameters:**\n- `lr_init` — Initial learning rate at step 0.\n- `lr_final` — Final learning rate at step `max_steps`.\n- `lr_delay_steps` — Number of warmup steps. If > 0, the rate is scaled down at the start and eased back to normal.\n- `lr_delay_mult` — Multiplier applied at step 0 during warmup. The effective initial rate becomes `lr_init * lr_delay_mult`.\n- `max_steps` — Total optimization steps.\n\n**Returns:** A callable `helper(step) -> float`.\n\n**Behavior:**\n\n1. If `step < 0` or both `lr_init` and `lr_final` are 0, returns `0.0` (parameter is disabled).\n2. **Warmup phase** (when `lr_delay_steps > 0` and `step < lr_delay_steps`): A smooth scaling factor is applied using a half-cosine ramp: `delay_rate = lr_delay_mult + (1 - lr_delay_mult) * sin(π/2 · step/lr_delay_steps)`. This starts at `lr_delay_mult` and reaches 1.0 at `step = lr_delay_steps`.\n3. **Exponential decay**: The base rate is `exp(log(lr_init) · (1-t) + log(lr_final) · t)` where `t = clip(step / max_steps, 0, 1)`. This is equivalent to log-linear interpolation between `lr_init` and `lr_final`.\n4. The final rate is `delay_rate * log_lerp`.\n\n**Called by:** `training_setup` in `GaussianModel` (for setting up parameter group schedulers) and `training` in `train.py` (for the main training loop scheduler).\n\n---\n\n## Image Conversion\n\n### `PILtoTorch(pil_image, resolution)`\n\nConverts a PIL image to a PyTorch tensor in CHW format with values in [0, 1].\n\n**Parameters:**\n- `pil_image` — A PIL Image object.\n- `resolution` — Target resolution as a `(width, height)` tuple (passed to PIL's `resize`).\n\n**Returns:** Float tensor in `(C, H, W)` layout. Grayscale images get an explicit channel dimension (`1, H, W`).\n\n**Called by:** `Camera.__init__` when loading ground-truth images for training.\n\n### `inverse_sigmoid(x)`\n\nComputes the logit function: `log(x / (1 - x))`. This is the mathematical inverse of the sigmoid activation, used to convert probabilities back to logit-space parameters.\n\n---\n\n## Reproducibility and Logging\n\n### `safe_state(silent)`\n\nInitializes a deterministic random state and optionally silences stdout.\n\n**Parameters:**\n- `silent` — If `True`, suppresses all stdout output. If `False`, each line is timestamped with `[dd/mm HH:MM:SS]`.\n\n**Side effects:**\n- Seeds `random`, `numpy`, and `torch` (CPU) with seed `0`.\n- Sets the CUDA device to `cuda:0`.\n- Replaces `sys.stdout` with a custom wrapper that either suppresses or timestamps output.\n\n**Note:** This does **not** set `torch.cuda.manual_seed`, so GPU-side RNG is not fully deterministic from this function alone.\n\n---\n\n## Filesystem Utilities (`system_utils.py`)\n\n### `mkdir_p(folder_path)`\n\nCreates a directory and all parent directories, equivalent to `mkdir -p`. Silently ignores `EEXIST` errors when the directory already exists; re-raises all other errors.\n\n**Called by:** `save_ply` in `GaussianModel` when writing output point clouds.\n\n### `searchForMaxIteration(folder)`\n\nScans a folder for checkpoint iteration files and returns the highest iteration number. Expects filenames to follow the pattern `*_N` where `N` is the iteration count (extracted by splitting on `_` and taking the last element as an integer).\n\n**Called by:** `Scene.__init__` to find the latest checkpoint when loading a trained model.\n\n---\n\n## Depth Scale Computation (`make_depth_scale.py`)\n\nA standalone script that computes per-image scale and offset parameters to align monocular depth predictions with COLMAP's sparse reconstruction. This is used as a preprocessing step when incorporating monocular depth priors.\n\n### `get_scales(key, cameras, images, points3d_ordered, args)`\n\nComputes the scale and offset for a single image by comparing COLMAP-projected inverse depths against a monocular inverse depth map.\n\n**Algorithm:**\n\n1. Projects 3D points into the camera frame using the image's extrinsics (`qvec`, `tvec`).\n2. Computes inverse COLMAP depth (`1 / z`) at each observed 2D keypoint.\n3. Reads the corresponding monocular inverse depth map from disk and resamples it at the keypoint locations using `cv2.remap`.\n4. Computes a robust alignment using **median and mean absolute deviation**:\n   - `scale = MAD_colmap / MAD_mono`\n   - `offset = median_colmap - median_mono × scale`\n5. Returns `None` if fewer than 10 valid correspondences exist or if the COLMAP depth range is degenerate.\n\n**Returns:** `{\"image_name\": str, \"scale\": float, \"offset\": float}` or `None`.\n\n### Main script flow\n\n1. Reads the COLMAP sparse model from `<base_dir>/sparse/0/`.\n2. Builds an ordered array of 3D point coordinates indexed by point ID.\n3. Parallelizes `get_scales` across all images using `joblib.Parallel` (threading backend).\n4. Writes the resulting `{image_name: {scale, offset}}` mapping to `<base_dir>/sparse/0/depth_params.json`.\n\n**Usage:**\n```\npython make_depth_scale.py --base_dir <path> --depths_dir <path> --model_type bin\n```\n\n**Known issue:** The function body references `images_metas` (the parameter name in `main`) instead of the formal parameter `images`, causing a `NameError` at runtime. This is a bug in the source — the reference on the `pts_idx` line should use `images` rather than `images_metas`.\n\n---\n\n## Integration Map\n\nThe following summarizes how the rest of the codebase depends on this module:\n\n| Caller | Callee | Purpose |\n|---|---|---|\n| `GaussianModel.build_covariance_from_scaling_rotation` | `build_scaling_rotation` → `build_rotation` | Construct per-Gaussian covariance matrices |\n| `GaussianModel.build_covariance_from_scaling_rotation` | `strip_symmetric` → `strip_lowerdiag` | Compress symmetric covariance to 6-element form |\n| `GaussianModel.densify_and_split` | `build_rotation` | Reconstruct rotation matrix when splitting Gaussians |\n| `GaussianModel.training_setup` | `get_expon_lr_func` | Create LR schedulers for each parameter group |\n| `train.py` training loop | `get_expon_lr_func` | Create the main position LR scheduler |\n| `Camera.__init__` | `PILtoTorch` | Load GT images as tensors |\n| `GaussianModel.save_ply` | `mkdir_p` | Ensure output directory exists |\n| `Scene.__init__` | `searchForMaxIteration` | Find latest checkpoint to resume from |","graphics-math-utilities":"# Graphics & Math Utilities\n\n# Graphics & Math Utilities\n\nThis module provides the foundational geometric, projection, and spherical harmonics computations used across the 3D Gaussian Splatting pipeline. It is split into two files:\n\n- **`utils/graphics_utils.py`** — Camera coordinate transforms, perspective projection, and FOV/focal conversions\n- **`utils/sh_utils.py`** — Spherical harmonics (SH) basis evaluation and color-space conversion\n\nBoth files are stateless: every function is pure and operates on NumPy arrays or PyTorch tensors passed as arguments.\n\n## Module Architecture\n\n```mermaid\ngraph TD\n    subgraph \"scene/dataset_readers.py\"\n        A[readCamerasFromTransforms]\n        B[readColmapCameras]\n        C[readNerfSyntheticInfo]\n        D[getNerfppNorm]\n    end\n    subgraph \"scene/cameras.py\"\n        E[Camera.__init__]\n    end\n    subgraph \"scene/gaussian_model.py\"\n        F[create_from_pcd]\n    end\n    subgraph \"gaussian_renderer\"\n        G[render]\n    end\n    subgraph \"utils/graphics_utils.py\"\n        H[getWorld2View2]\n        I[getProjectionMatrix]\n        J[focal2fov]\n        K[fov2focal]\n    end\n    subgraph \"utils/sh_utils.py\"\n        L[eval_sh]\n        M[RGB2SH]\n        N[SH2RGB]\n    end\n    A --> J\n    A --> K\n    A --> H\n    B --> J\n    C --> N\n    D --> H\n    E --> I\n    E --> H\n    F --> M\n    G --> L\n```\n\n---\n\n## `utils/graphics_utils.py`\n\n### `BasicPointCloud`\n\nA `NamedTuple` representing a 3D point cloud with per-point attributes:\n\n| Field | Type | Description |\n|-------|------|-------------|\n| `points` | `np.array` | `(N, 3)` vertex positions |\n| `colors` | `np.array` | `(N, 3)` RGB colors |\n| `normals` | `np.array` | `(N, 3)` surface normals |\n\nUsed as the interchange format when initializing a Gaussian model from an input point cloud (e.g., from SfM or COLMAP).\n\n---\n\n### `geom_transform_points(points, transf_matrix)`\n\nApplies a 4×4 homogeneous transformation to a set of 3D points.\n\n**Parameters:**\n- `points` — `torch.Tensor` of shape `(P, 3)`\n- `transf_matrix` — `torch.Tensor` of shape `(4, 4)`\n\n**Returns:** `torch.Tensor` of shape `(P, 3)` — the transformed points.\n\n**How it works:**\n1. Appends a column of ones to create homogeneous coordinates `(P, 4)`.\n2. Right-multiplies by the (broadcast) transformation matrix.\n3. Performs perspective division by the `w` component, with a small epsilon (`1e-7`) added to the denominator to avoid division by zero.\n\nThis handles both affine and projective transforms correctly. The `squeeze(dim=0)` on the output removes the batch dimension introduced by `unsqueeze(0)` on the matrix.\n\n---\n\n### `getWorld2View(R, t)`\n\nBuilds a 4×4 world-to-camera (view) matrix from a rotation and translation.\n\n**Parameters:**\n- `R` — `np.array` of shape `(3, 3)`, the camera orientation (world→camera rotation)\n- `t` — `np.array` of shape `(3,)`, the camera translation in camera space\n\n**Returns:** `np.float32` array of shape `(4, 4)`\n\nThe matrix is constructed as:\n\n```\n| R^T | t |\n| 0 0 0| 1 |\n```\n\nNote that `R` is transposed before insertion, which means the input `R` is expected to be the **camera-to-world** rotation (the convention used by many dataset formats), and the transpose converts it to world-to-camera.\n\n---\n\n### `getWorld2View2(R, t, translate, scale)`\n\nExtended version of `getWorld2View` that re-centers and optionally rescales the scene around the camera.\n\n**Parameters:**\n- `R` — `np.array(3, 3)`, camera-to-world rotation\n- `t` — `np.array(3,)`, camera translation\n- `translate` — `np.array(3,)`, offset added to the camera center (default `[0, 0, 0]`)\n- `scale` — `float`, multiplicative scale applied to the camera center (default `1.0`)\n\n**Returns:** `np.float32` array of shape `(4, 4)`\n\n**How it works:**\n1. Builds the standard world-to-view matrix `Rt`.\n2. Inverts it to get the camera-to-world matrix `C2W`.\n3. Extracts the camera center `C2W[:3, 3]`, applies `(center + translate) * scale`.\n4. Writes the transformed center back and inverts again to produce the final world-to-view matrix.\n\nThis is the primary function used during scene loading. The `translate` and `scale` parameters allow normalizing the scene so all cameras are centered and at a consistent scale — critical for stable optimization. Called from both `Camera.__init__` and `getNerfppNorm`.\n\n---\n\n### `getProjectionMatrix(znear, zfar, fovX, fovY)`\n\nConstructs a symmetric perspective projection matrix for a Vulkan-style clip space (depth range `[0, 1]`).\n\n**Parameters:**\n- `znear` — `float`, distance to the near plane\n- `zfar` — `float`, distance to the far plane\n- `fovX` — `float`, full horizontal field of view in radians\n- `fovY` — `float`, full vertical field of view in radians\n\n**Returns:** `torch.Tensor` of shape `(4, 4)`\n\nThe matrix follows the standard symmetric frustum form:\n\n```\n| 2n/(r-l)    0       (r+l)/(r-l)       0       |\n|    0     2n/(t-b)   (t+b)/(t-b)       0       |\n|    0        0        f/(f-n)     -fn/(f-n) |\n|    0        0           1             0       |\n```\n\nWhere `n = znear`, `f = zfar`, and `t, b, r, l` are derived from the FOV angles. Because the frustum is symmetric, `r = -l` and `t = -b`, which zeros out the off-center terms `(r+l)/(r-l)` and `(t+b)/(t-b)` — though they are computed and stored for generality.\n\nThe `z_sign = 1.0` hardcodes a forward-looking depth convention. Row 3 (`P[3, 2] = z_sign`) maps the view-space z into the w clip component, enabling perspective division.\n\n---\n\n### `fov2focal(fov, pixels)`\n\nConverts a field of view angle to a focal length in pixel units.\n\n```python\nfocal = pixels / (2 * tan(fov / 2))\n```\n\n**Parameters:**\n- `fov` — `float`, full field of view in radians\n- `pixels` — `float`, image dimension (width or height) in pixels\n\n**Returns:** `float` — focal length in pixels\n\nUsed when parsing NeRF Synthetic datasets where only FOV is provided but the renderer needs focal length.\n\n---\n\n### `focal2fov(focal, pixels)`\n\nInverse of `fov2focal`. Converts a focal length in pixels to a field of view in radians.\n\n```python\nfov = 2 * atan(pixels / (2 * focal))\n```\n\nUsed when parsing COLMAP datasets where focal length is known but the camera model requires FOV.\n\n---\n\n## `utils/sh_utils.py`\n\n### Spherical Harmonics Constants\n\nThe module pre-computes the normalization constants for real spherical harmonics up to degree 4:\n\n| Constant | Degree | Values | Count |\n|----------|--------|--------|-------|\n| `C0` | 0 | `0.28209...` | 1 |\n| `C1` | 1 | `0.48860...` | 1 (shared for all 3 bands) |\n| `C2` | 2 | 5 coefficients | 5 |\n| `C3` | 3 | 7 coefficients | 7 |\n| `C4` | 4 | 9 coefficients | 9 |\n\nTotal SH coefficients through degree `d`: `(d + 1)²`. Degree 4 requires 25 coefficients per color channel.\n\n---\n\n### `eval_sh(deg, sh, dirs)`\n\nEvaluates spherical harmonics at given unit directions using hardcoded polynomial expressions.\n\n**Parameters:**\n- `deg` — `int`, maximum SH degree to evaluate (0–4)\n- `sh` — tensor of shape `(..., C, (deg+1)²)`, SH coefficients. `C` is the number of color channels (typically 3).\n- `dirs` — tensor of shape `(..., 3)`, unit direction vectors\n\n**Returns:** tensor of shape `(..., C)` — evaluated color values\n\n**How it works:**\n\nThe function incrementally accumulates contributions from each degree level. Each level multiplies the corresponding SH basis function (expressed as a polynomial in `x, y, z` components of the direction) by its coefficient from `sh`:\n\n- **Degree 0:** Constant term `C0 * sh[..., 0]` — this is the diffuse/ambient color.\n- **Degree 1:** Linear terms in `x, y, z` — captures first-order directional shading.\n- **Degree 2:** Quadratic terms (`xx, yy, zz, xy, yz, xz`) — captures anisotropic effects.\n- **Degree 3:** Cubic terms — higher-frequency directional detail.\n- **Degree 4:** Quartic terms — finest angular detail.\n\nThe assertion `sh.shape[-1] >= (deg + 1)²` ensures enough coefficients are provided for the requested degree. Extra coefficients beyond `(deg+1)²` are ignored.\n\n**Usage context:** Called from `gaussian_renderer/render()` during every forward pass to compute view-dependent color for each Gaussian. This is the most performance-critical SH function in the codebase.\n\n---\n\n### `RGB2SH(rgb)`\n\nConverts an RGB color value to its 0th-order SH coefficient.\n\n```python\nsh = (rgb - 0.5) / C0\n```\n\n**Parameters:**\n- `rgb` — tensor or array of RGB values in `[0, 1]`\n\n**Returns:** SH coefficient such that `SH2RGB(result) ≈ rgb`\n\nThe `0.5` offset centers the color range around zero before scaling by `1/C0`, which maps the DC SH basis to the expected RGB range. Called from `create_from_pcd` when initializing Gaussian color attributes from an input point cloud's RGB values.\n\n---\n\n### `SH2RGB(sh)`\n\nInverse of `RGB2SH`. Converts a 0th-order SH coefficient back to RGB.\n\n```python\nrgb = sh * C0 + 0.5\n```\n\nCalled from `readNerfSyntheticInfo` when converting stored SH coefficients back to RGB for visualization or validation.\n\n---\n\n## Integration Points\n\n| Consumer | Function Called | Purpose |\n|----------|----------------|---------|\n| `scene/gaussian_model.py` → `create_from_pcd` | `RGB2SH` | Initialize 0th-order SH from point cloud RGB |\n| `scene/dataset_readers.py` → `readCamerasFromTransforms` | `focal2fov`, `fov2focal`, `getWorld2View2` | Parse camera intrinsics/extrinsics from NeRF Synthetic JSON |\n| `scene/dataset_readers.py` → `readColmapCameras` | `focal2fov` | Convert COLMAP focal length to FOV |\n| `scene/dataset_readers.py` → `readNerfSyntheticInfo` | `SH2RGB` | Convert SH DC term to RGB for processing |\n| `scene/dataset_readers.py` → `getNerfppNorm` | `getWorld2View2` | Compute scene normalization bounds |\n| `scene/cameras.py` → `Camera.__init__` | `getWorld2View2`, `getProjectionMatrix` | Build camera view and projection matrices |\n| `gaussian_renderer/__init__.py` → `render` | `eval_sh` | Compute view-dependent color per Gaussian during rendering |\n| `utils/camera_utils.py` → `camera_to_JSON` | `fov2focal` | Serialize camera parameters |\n\n## Design Notes\n\n**Why hardcoded SH polynomials?** The `eval_sh` function avoids any loop or dynamic dispatch by explicitly writing out each basis polynomial. This eliminates branching and enables efficient vectorized execution on GPU tensors, which matters because `eval_sh` runs on every forward pass for every Gaussian.\n\n**Why two `getWorld2View` variants?** `getWorld2View` is the minimal version for cases where no scene normalization is needed. `getWorld2View2` adds the centering/scaling transform used during dataset loading to place the scene at the origin and normalize its scale — a prerequisite for stable training convergence.\n\n**Epsilon in `geom_transform_points`:** The `1e-7` added to the denominator before perspective division prevents NaN when the homogeneous `w` component is zero (degenerate projection). This is a safety measure rather than a mathematically meaningful correction.","loss-functions":"# Loss Functions\n\n# Loss Functions (`utils/loss_utils.py`)\n\nImage similarity and reconstruction loss functions used during training and evaluation of 3D Gaussian Splatting models. The module provides L1/L2 pixel-level losses, a pure-PyTorch SSIM implementation, and a CUDA-fused SSIM variant for accelerated computation.\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[l1_loss / l2_loss] --> B[\"Pixel-wise comparison\"]\n    C[ssim] --> D[create_window]\n    D --> E[gaussian]\n    C --> F[_ssim]\n    F --> G[\"Conv2d-based SSIM map\"]\n    H[fast_ssim] --> I[FusedSSIMMap.apply]\n    I --> J[\"CUDA fusedssim kernel\"]\n```\n\n## Constants\n\n| Constant | Value | Purpose |\n|----------|-------|---------|\n| `C1` | `(0.01)²` | Stabilization constant for luminance comparison in SSIM |\n| `C2` | `(0.03)²` | Stabilization constant for contrast/comparison in SSIM |\n\nThese follow the standard SSIM formulation from Wang et al. (2004), where `0.01` and `0.03` are the default `k1`/`k2` multipliers against the dynamic range.\n\n## Pixel-Level Losses\n\n### `l1_loss(network_output, gt)`\n\nMean absolute error between prediction and ground truth. Returns a scalar.\n\n```python\nloss = l1_loss(rendered_img, gt_img)\n```\n\n### `l2_loss(network_output, gt)`\n\nMean squared error between prediction and ground truth. Returns a scalar.\n\n```python\nloss = l2_loss(rendered_img, gt_img)\n```\n\nBoth functions accept tensors of any shape — they operate element-wise and reduce via `.mean()`.\n\n## SSIM (Structural Similarity Index Measure)\n\nThe module provides two SSIM implementations: a flexible pure-PyTorch version and a faster CUDA-fused version.\n\n### Pure PyTorch: `ssim(img1, img2, window_size=11, size_average=True)`\n\nComputes SSIM using depthwise 2D convolutions with a Gaussian weighting window.\n\n**Parameters:**\n- `img1`, `img2` — Image tensors of shape `(C, H, W)` or `(N, C, H, W)`. Must share the same device and dtype.\n- `window_size` — Side length of the square Gaussian kernel. Default `11`.\n- `size_average` — If `True`, returns a single scalar (mean over all spatial locations and channels). If `False`, returns per-image means (useful for batched inputs).\n\n**Returns:** A scalar (or per-image tensor) in the range `[-1, 1]`, where 1 indicates identical images.\n\n**How it works:**\n\n1. `create_window(window_size, channel)` builds a 2D Gaussian kernel:\n   - `gaussian(window_size, sigma)` generates a 1D Gaussian with `sigma=1.5`.\n   - The 1D vector is outer-producted with itself to form a 2D kernel, then expanded across all channels for depthwise convolution.\n\n2. `_ssim(img1, img2, window, window_size, channel, size_average)` computes the SSIM map:\n   - Local means (`mu1`, `mu2`) via depthwise `F.conv2d` with the Gaussian window.\n   - Local variances (`sigma1_sq`, `sigma2_sq`) and covariance (`sigma12`) computed as `E[X²] - (E[X])²`.\n   - The SSIM map is: `((2·mu1·mu2 + C1)(2·sigma12 + C2)) / ((mu1² + mu2² + C1)(sigma1² + sigma2² + C2))`\n\n### CUDA-Fused: `fast_ssim(img1, img2)`\n\nA performance-optimized SSIM that delegates both forward and backward passes to custom CUDA kernels.\n\n```python\nloss = fast_ssim(rendered_img, gt_img)\n```\n\n**How it works:**\n\n`FusedSSIMMap` is a `torch.autograd.Function` subclass that:\n- **Forward:** Calls `fusedssim(C1, C2, img1, img2)` from the `diff_gaussian_rasterization._C` extension, returning a per-pixel SSIM map.\n- **Backward:** Calls `fusedssim_backward(C1, C2, img1, img2, opt_grad)` to compute gradients with respect to `img1` only (gradients for `C1`, `C2`, and `img2` are `None`).\n\n`fast_ssim` wraps this by applying `FusedSSIMMap` and averaging the resulting map.\n\n> **Note:** The fused CUDA extension is optional. If `diff_gaussian_rasterization._C` is not available
