var PAGES = {"arxiv-integration":"# ArXiv Integration\n\n# ArXiv Integration\n\nFetches paper metadata from arXiv and appends it as a formatted entry to a curated YAML file. Designed to maintain a hand-curated paper list (e.g., an Awesome-style repository) where new arXiv papers need to be added without breaking existing formatting.\n\n## Architecture\n\n```mermaid\nflowchart LR\n    A[URL or arXiv ID] --> B[extract_arxiv_id]\n    B --> C[get_paper]\n    C --> D[Dict entry]\n    D --> E[append_to_yaml]\n    E --> F[format_yaml_entry]\n    F --> G[clean_and_quote]\n    F --> H[format_optional_field]\n```\n\nThe pipeline is linear: a URL or raw ID goes in, gets normalized, the arXiv API is queried, a dictionary is built, and that dictionary is formatted and appended to the YAML file. `format_yaml_entry` delegates the tricky quoting work to `clean_and_quote` and `format_optional_field`.\n\n## Class: `ArxivIntegration`\n\n### `__init__(self)`\n\nCreates an `arxiv.Client` instance used for all API requests. No configuration is required; the client uses the default arxiv API endpoint.\n\n### `extract_arxiv_id(self, url_or_id: str) -> str`\n\nNormalizes user input into a bare arXiv identifier. Accepts:\n\n- Full URLs: `https://arxiv.org/abs/2401.12345`, `https://arxiv.org/pdf/2401.12345v2.pdf`\n- Bare IDs: `2401.12345`, `2401.12345v2`\n- Partial URLs without scheme: `arxiv.org/abs/2401.12345`\n\nThe method strips `.pdf` suffixes, extracts the last path segment from `/abs/` or `/pdf/` paths, and validates the result against the pattern `\\d{4}\\.\\d{4,5}(?:v\\d+)?`. Raises `ValueError` if the ID doesn't match.\n\n### `get_paper(self, url_or_id: str) -> Optional[Dict[str, Any]]`\n\nFetches a paper from arXiv and returns a dictionary ready for YAML serialization. Returns `None` if the paper is not found or an error occurs.\n\n**ID generation.** The `id` field is constructed as `{last_name}{year}{first_title_word}` — for example, a 2024 paper by Jane Smith titled \"Novel Gaussian Splatting...\" produces `smith2024novel`. This convention matches the naming scheme used in the target YAML file.\n\n**Returned fields:**\n\n| Field | Source | Notes |\n|---|---|---|\n| `id` | Derived | `{author_lastname}{year}{first_title_word}` |\n| `title` | arXiv API | Raw title string |\n| `authors` | arXiv API | Comma-separated names |\n| `year` | arXiv API | Publication year as string |\n| `abstract` | arXiv API | Full abstract text |\n| `project_page` | — | Always `None` (set manually later) |\n| `paper` | Derived | `https://arxiv.org/pdf/{arxiv_id}.pdf` |\n| `code` | — | Always `None` (set manually later) |\n| `video` | — | Always `None` (set manually later) |\n| `tags` | Derived | `[\"Year {year}\"]` |\n| `thumbnail` | Derived | `assets/thumbnails/{paper_id}.jpg` |\n\nFields left as `None` (`project_page`, `code`, `video`) are placeholders the curator fills in after the initial fetch.\n\n### `append_to_yaml(self, entry: Dict[str, Any], filename: str = \"awesome_3dgs_papers.yaml\") -> bool`\n\nAppends a formatted entry to the YAML file. Returns `True` on success, `False` on failure or duplicate.\n\n**Duplicate detection.** Before writing, the entire file is loaded with `yaml.safe_load` and scanned for an existing entry with the same `id`. If found, the write is skipped and `False` is returned.\n\n**Formatting.** The entry is serialized by `format_yaml_entry` rather than `yaml.dump`, preserving the hand-tuned indentation and quoting style that the file relies on. A trailing newline is ensured before appending so entries don't run together.\n\n### `format_yaml_entry(entry: Dict[str, Any]) -> str` *(static)*\n\nProduces a single YAML list item as a multi-line string. Key behaviors:\n\n- **Title quoting** is handled by `clean_and_quote`, which adds single quotes if the title contains YAML-special characters (`:`, `[`, `]`, `{`, `}`, `,`, newlines).\n- **Abstract wrapping** uses a fold-like block scalar indicator (`>`) with lines broken at ~80 characters for readability.\n- **Optional fields** (`project_page`, `code`, `video`) go through `format_optional_field`, which renders `None` as the bare string `null`.\n- **Tags** are sorted alphabetically before output.\n\n## Module-level Functions\n\n### `clean_and_quote(text: str) -> str`\n\nReturns the text as-is if it contains no YAML-special characters. Otherwise wraps it in single quotes. Returns `'null'` for empty input.\n\n### `format_optional_field(value) -> str`\n\nReturns `'null'` for falsy values, otherwise returns the value unchanged. Used for fields that may or may not have a URL.\n\n## Typical Usage\n\n```python\nfrom src.arxiv_integration import ArxivIntegration\n\nintegration = ArxivIntegration()\n\n# Fetch and add a paper\nentry = integration.get_paper(\"https://arxiv.org/abs/2401.12345\")\nif entry:\n    success = integration.append_to_yaml(entry, \"papers.yaml\")\n    if success:\n        print(f\"Added {entry['id']}\")\n    else:\n        print(\"Paper already exists or write failed\")\n```\n\nAfter running this, manually edit the YAML file to fill in `project_page`, `code`, and `video` links, and place a thumbnail image at the path specified in the `thumbnail` field.","editor-application":"# Editor Application\n\n# Editor Application\n\nA PyQt6 desktop application for browsing, editing, and managing entries in the Awesome 3D Gaussian Splatting Papers YAML database. The editor provides a form-based interface with auto-save, tag management, arXiv integration, and thumbnail generation.\n\n## Architecture Overview\n\n```mermaid\ngraph TD\n    E[editor.py] --> M[main]\n    M --> YE[YAMLEditor]\n    YE --> YU[YAMLUpdater]\n    YE --> AD[ArxivAddDialog]\n    AD --> AI[ArxivIntegration]\n    AD --> TG[ThumbnailGenerator]\n    YE --> TB[TagButton]\n    YE --> UW[URLWidget]\n    AD --> YAML[awesome_3dgs_papers.yaml]\n    YE --> YAML\n    TG --> THUMBS[assets/thumbnails/]\n```\n\n## Entry Point\n\n**`editor.py`** — Minimal launcher that calls `main()` from `src.yaml_editor`. This is the script to run the application:\n\n```bash\npython editor.py\n```\n\n`main()` creates the `QApplication`, instantiates `YAMLEditor`, and starts the Qt event loop.\n\n---\n\n## YAMLEditor (`src/yaml_editor.py`)\n\nThe central `QMainWindow` subclass. Manages the full lifecycle: loading YAML data, rendering the current entry, handling edits, and persisting changes.\n\n### Initialization Flow\n\n1. Creates a `YAMLUpdater` instance (from `src.fix_date`) for date processing\n2. Initializes state: `fields`, `url_widgets`, `tag_buttons` dictionaries; `original_entry_state`; `search_results` list\n3. Defines the 55 available tags (from \"2DGS\" through \"World Generation\")\n4. Calls `load_yaml()` to read and sort the data file\n5. Calls `setup_ui()` to build the interface\n6. Calls `show_current_entry()` to display the first entry\n\n### Data Loading and Sorting\n\n**`load_yaml()`** reads `awesome_3dgs_papers.yaml` from the working directory. The file must contain a YAML list of paper dictionaries. Entries are sorted descending by `safe_sort_key()`, which produces a tuple of:\n\n| Priority | Field | Default if missing |\n|----------|-------|--------------------|\n| 1 | `publication_date` | `'9999'` |\n| 2 | `date_source` priority (`arxiv`=0, `estimated`=1, `unknown`=2) | 2 |\n| 3 | First author's last name (lowercase) | `'z'` |\n| 4 | `title` (lowercase) | `'z'` |\n\nThis ensures newest papers appear first, with ties broken by author then title.\n\n### UI Layout\n\nThe window is divided into three horizontal regions:\n\n**Navigation bar (top)**\n- Previous / Next buttons\n- Delete Entry button (red-styled)\n- Add from arXiv button\n- Go-to-page input (1-based index, press Enter to jump)\n- Entry counter label (`Entry N of M`)\n- Search input (matches title, authors, or tags; Enter cycles through results)\n\n**Form panel (left, scrollable)**\n- Basic text fields: `id`, `title`, `authors`, `year`, `publication_date` (read-only)\n- URL fields using `URLWidget`: `project_page`, `paper`, `code`, `video` — each with an \"Open\" button that launches the system browser\n- Abstract: multi-line `QTextEdit`\n- Current Tags: `QListWidget` showing the entry's active tags\n\n**Tag grid (right)**\n- 4-column `QGridLayout` of `TagButton` toggleable pills\n- Clicking a tag calls `update_tags()` → `auto_save()`\n\n### Auto-Save System\n\nEvery edit to a text field, URL field, or tag triggers `auto_save()`. The method:\n\n1. Reads all widget values into the current `self.data[self.current_index]` entry\n2. If `publication_date` is missing, calls `self.yaml_updater.process_paper(entry)` to populate it\n3. Re-sorts the entire dataset using `self.yaml_updater.safe_sort_key`\n4. Locates the current entry by `id` after re-sorting and updates `self.current_index`\n5. Writes the full dataset to `awesome_3dgs_papers.yaml` with `yaml.dump(sort_keys=False, allow_unicode=True)`\n6. Updates `original_entry_state` and the entry counter\n7. Shows a status bar indicator: \"✓ Changes saved\" (green) or \"⚠ Save failed\" (red), cleared after 1.5 seconds\n\nBecause sorting happens on every save, the entry's position may shift. The method tracks the entry by its `id` field to maintain the correct `current_index`.\n\n### Automatic Tag Inference\n\n`update_automatic_tags()` is called whenever a URL field changes. It enforces three tag rules:\n\n| URL field populated | Tag auto-applied |\n|---------------------|-----------------|\n| `project_page` | `Project` |\n| `code` | `Code` |\n| `video` | `Video` |\n\nIf the URL is non-empty, the tag is added; if empty, the tag is removed. These tags cannot be manually removed while their corresponding URL is present.\n\n### Navigation\n\n| Method | Behavior |\n|--------|----------|\n| `prev_entry()` | Decrements `current_index`, clears search, shows entry |\n| `next_entry()` | Increments `current_index`, clears search, shows entry |\n| `go_to_page()` | Parses 1-based page number from input, jumps to that index |\n| `search_entry()` | Searches all entries for a case-insensitive substring match in `title`, `authors`, or `tags`. If the current entry is already a result, advances to the next result (wrapping). Status bar shows result position. |\n\n### Entry Display\n\n`show_current_entry()` populates all widgets from `self.data[self.current_index]`. It uses `blockSignals(True)` on every widget before setting values to prevent `auto_save()` from firing during population. After setting values, it calls `blockSignals(False)` to re-enable auto-save.\n\n`get_entry_state()` captures a snapshot of the current entry's field values and tags — used by `auto_save()` to track dirty state.\n\n### Deleting Entries\n\n`delete_current_entry()` prompts for confirmation, then:\n\n1. Deletes the thumbnail file at `assets/thumbnails/{id}.jpg` if it exists\n2. Removes the entry from `self.data`\n3. Writes the updated list to YAML\n4. Adjusts `current_index` if it now exceeds the list length\n5. Closes the window if no entries remain\n\n### Adding Papers from arXiv\n\n`show_arxiv_dialog()` opens an `ArxivAddDialog`. After the dialog is accepted:\n\n1. Re-reads the YAML file to get the newly appended entry\n2. Calls `self.yaml_updater.process_paper()` to populate date fields\n3. Re-sorts and saves the data\n4. Reloads via `load_yaml()`\n5. Locates the new entry by `id` and navigates to it\n\n### Refresh\n\n`refresh_ui()` reloads the YAML file, attempts to preserve the current position by matching the entry's `id`, and re-displays. Used after external modifications to the data file.\n\n---\n\n## ArxivAddDialog (`src/components/dialogs.py`)\n\nA `QDialog` for adding papers by arXiv URL or ID.\n\n### Workflow\n\n1. User enters an arXiv URL (e.g., `https://arxiv.org/abs/2412.21206`) or bare ID (`2412.21206`)\n2. Clicking \"Add Paper\" calls `add_paper()`, which:\n   - Disables the button and shows status\n   - Calls `self.arxiv.get_paper(url_or_id)` to fetch metadata via `ArxivIntegration`\n   - Shows a confirmation dialog with the paper title\n   - On confirmation, calls `self.arxiv.append_to_yaml(entry)` to add to the YAML file\n   - Calls `generate_thumbnail(entry)` to create a preview image\n3. On success, calls `self.accept()` (dialog result = 1), which signals the parent `YAMLEditor` to reload\n\n### Thumbnail Generation\n\n`generate_thumbnail()` downloads the PDF from the entry's `paper` URL and calls `ThumbnailGenerator.create_thumbnail()`. The status label updates during the process. Failure to generate a thumbnail is non-fatal — the paper is still added with a warning.\n\n---\n\n## ThumbnailGenerator (`src/components/thumbnail.py`)\n\nConverts the first page of a PDF to a JPEG thumbnail.\n\n| Property | Value |\n|----------|-------|\n| Output directory | `assets/thumbnails/` |\n| Dimensions | 360 × 300 px |\n| Format | JPEG, quality 85, optimized |\n| Naming | `{paper_id}.jpg` |\n\n### Methods\n\n- **`download_pdf(url)`** — Fetches PDF bytes with a browser-like `User-Agent` header. Raises on HTTP errors; 30-second timeout.\n- **`create_thumbnail(pdf_content, paper_id)`** — Uses `pdf2image.convert_from_bytes` to render page 1, composites it onto a white background centered within the target dimensions, and saves. Returns `True` on success.\n\nDependencies: `pdf2image` (requires `poppler` installed on the system), `Pillow`, `requests`.\n\n---\n\n## Custom Widgets (`src/components/widgets.py`)\n\n### TagButton\n\nA `QPushButton` subclass with `checkable` behavior. Styled as a rounded pill — white with a border when unchecked, blue with white text when checked. Used in the tag grid to toggle paper categories.\n\n### URLWidget\n\nA composite widget containing a `QLabel`, `QLineEdit` (for the URL), and a `QPushButton` (\"Open\"). The label has a fixed 100px minimum width. The open button's `clicked` signal is connected externally by `YAMLEditor` to `open_url()`, which calls `webbrowser.open()`.\n\n---\n\n## External Dependencies\n\n| Module | Purpose |\n|--------|---------|\n| `src.fix_date.YAMLUpdater` | Date extraction and `safe_sort_key` for consistent sorting |\n| `src.arxiv_integration.ArxivIntegration` | Fetches paper metadata from arXiv API and appends to YAML |\n| `arxiv` (pip) | arXiv API client used by `ArxivAddDialog` |\n| `pdf2image` + `poppler` | PDF-to-image conversion for thumbnails |\n| `Pillow` | Image compositing for thumbnails |\n| `requests` | HTTP downloads |\n| `PyQt6` | GUI framework |\n\n## Data File Contract\n\nThe editor reads and writes `awesome_3dgs_papers.yaml` in the current working directory. The file must be a YAML list of dictionaries. Each entry is expected to have these fields (though the editor handles missing ones gracefully):\n\n```\nid, title, authors, year, publication_date, date_source,\nproject_page, paper, code, video, abstract, tags\n```\n\nThe `tags` field is a list of strings drawn from the 55 predefined tag names. The `publication_date` field is read-only in the editor and is populated by `YAMLUpdater.process_paper()`.","other":"# Other\n\n# Awesome 3D Gaussian Splatting — Web Frontend\n\n## Overview\n\nThis module is the client-side web application that powers the [Awesome 3DGS paper database](https://mrnerf.github.io/awesome-3D-gaussian-splatting/). It renders a searchable, filterable, and shareable catalog of 3D Gaussian Splatting research papers. The page is server-rendered from templates with placeholder substitution (`${paper_cards}`, `${year_options}`, etc.), then enriched on the client with interactive filtering, multi-select, and deep-linking via URL parameters.\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[state.js] --> B[filters.js]\n    A --> C[selection.js]\n    A --> D[sharing.js]\n    E[main.js] --> A\n    E --> B\n    E --> C\n    E --> D\n    E --> F[navigation.js]\n    E --> G[utils.js]\n    B --> G\n    C --> B\n    C --> G\n    D --> B\n    D --> C\n    F --> B\n    F --> G\n```\n\nAll JavaScript modules share a global `state` object and communicate through direct function calls. There is no event bus or pub/sub layer — modules call each other explicitly.\n\n## Application State\n\n**File:** `src/static/js/state.js`\n\nThe single source of truth for the UI. Exposed as a global `const state`:\n\n| Property | Type | Purpose |\n|---|---|---|\n| `selectedPapers` | `Set<string>` | IDs of papers currently selected in selection mode |\n| `isSelectionMode` | `boolean` | Whether selection mode is active (checkboxes visible, preview bar shown) |\n| `includeTags` | `Set<string>` | Tags that must be present on a paper for it to appear |\n| `excludeTags` | `Set<string>` | Tags that must *not* be present on a paper for it to appear |\n| `onlyShowSelected` | `boolean` | When true, only selected papers are visible regardless of other filters |\n\n## Initialization Flow\n\n**File:** `src/static/js/main.js`\n\n`DOMContentLoaded` bootstraps the application:\n\n1. Caches DOM references (`paperCards`, `searchInput`, `yearFilter`, `tagFilters`) on `window`.\n2. Creates a `LazyLoad` instance for thumbnail images with fallback support.\n3. Calls `initializeFilters()` to wire search, year, and tag click handlers.\n4. Attaches click handlers to `.paper-card` elements for selection-mode toggling.\n5. Calls `applyURLParams()` to restore any persisted filter/selection state from the URL.\n6. Runs `filterPapers()` and `updatePaperNumbers()` for the initial render.\n7. Exposes key functions on `window` for inline `onclick` handlers in the HTML template.\n\n## Filtering\n\n**File:** `src/static/js/filters.js`\n\n### `filterPapers()`\n\nThe central visibility function. It iterates every `.paper-row` element and toggles the `visible` class based on the current state:\n\n- **Selection-only mode** (`state.onlyShowSelected`): Only rows whose `data-id` is in `state.selectedPapers` are shown; all other filters are bypassed.\n- **Normal mode**: A paper is visible only when *all* of the following match:\n  - **Search** — `data-title` or `data-authors` contains the search term (case-insensitive).\n  - **Year** — `data-year` equals the selected year, or year filter is `\"all\"`.\n  - **Include tags** — Every tag in `state.includeTags` appears in the paper's `data-tags` JSON array (or the set is empty).\n  - **Exclude tags** — No tag in `state.excludeTags` appears in the paper's `data-tags` array (or the set is empty).\n\nAfter toggling visibility, it calls `updatePaperNumbers()` to renumber visible cards and `updateURL()` to persist the filter state.\n\n### `initializeFilters()`\n\nBinds event listeners:\n\n- **Tag filters**: Three-state click cycle — neutral → `include` (blue) → `exclude` (red) → neutral. Each transition updates `state.includeTags` / `state.excludeTags` and calls `filterPapers()`.\n- **Search input**: Debounced (150 ms) call to `filterPapers()`.\n- **Year dropdown**: `change` event calls `filterPapers()` directly.\n\n### `clearSearch()`\n\nResets the search input and re-runs `filterPapers()`.\n\n## Selection Mode\n\n**File:** `src/static/js/selection.js`\n\nSelection mode lets users pick specific papers and share a URL that pre-selects them.\n\n### Entering / Exiting\n\n`toggleSelectionMode()` toggles `state.isSelectionMode` and the `selection-mode` class on `<body>`. The CSS class reveals checkboxes on each card and the sticky selection preview bar. Exiting also resets `onlyShowSelected` if it was active.\n\n### Selecting Papers\n\n`togglePaperSelection(paperId, checkbox)` is called when a checkbox changes or a card is clicked in selection mode:\n\n- **Checked**: Adds `paperId` to `state.selectedPapers`, adds the `selected` class to the card, and appends a preview item (title + authors) to `#selectionPreview`.\n- **Unchecked**: Delegates to `removeFromSelection()`.\n\n`handleCheckboxClick(ev, paperId, checkbox)` is the inline handler that stops event propagation and calls `togglePaperSelection`.\n\n### Removing Papers\n\n`removeFromSelection(paperId)` unchecks the checkbox, deletes from `state.selectedPapers`, removes the `selected` class, removes the preview item, and if `onlyShowSelected` is active, re-runs `filterPapers()`.\n\n### Show Selected Only\n\n`toggleSelectedOnly()` flips `state.onlyShowSelected`, updates the button label, sets/clears the `show_selected` URL parameter, and calls `filterPapers()`.\n\n### Clearing\n\n`clearSelection()` empties `state.selectedPapers`, unchecks all checkboxes, removes `selected` classes, clears the preview bar, resets `onlyShowSelected`, strips `selected` and `show_selected` from the URL, and re-filters.\n\n### Navigation\n\n`scrollToPaper(paperId)` scrolls the target `.paper-row` into view and briefly highlights it with a light-blue background flash (1.5 s).\n\n## Sharing & URL Persistence\n\n**File:** `src/static/js/sharing.js`\n\n### `showShareModal()` / `hideShareModal()`\n\nOpens a modal containing a URL that encodes the current selection and `show_selected` flag. The URL is built from `window.location.href` with `selected` and `show_selected` query parameters.\n\n### `copyShareLink()`\n\nWrites the share URL to the clipboard with a brief \"Copied!\" confirmation on the button.\n\n### `applyURLParams()`\n\nCalled during initialization to restore state from the URL:\n\n1. Reads `selected` → enters selection mode and checks each listed paper.\n2. Reads `show_selected` → activates show-selected-only mode.\n3. Reads `search` → populates the search input.\n4. Reads `year` → sets the year dropdown.\n5. Reads `include` / `exclude` → populates `state.includeTags` / `state.excludeTags` and applies the corresponding CSS classes to tag buttons.\n6. Calls `filterPapers()` to apply everything.\n\n### `copyBitcoinAddress()`\n\nCopies the donation Bitcoin address to the clipboard with a brief confirmation.\n\n## Navigation & Filter Status\n\n**File:** `src/static/js/navigation.js`\n\n### Scroll Controls\n\n- `scrollToTop()` / `scrollToBottom()` — smooth scroll to page boundaries.\n- `updateScrollProgress()` — updates the percentage indicator in the floating nav.\n\n### Filter Status Bar\n\n`updateFilterStatus()` populates the sticky \"Active Filters\" bar:\n\n- Updates visible/total paper counts.\n- Creates removable filter tags for active search, year, and tag filters using `createFilterTag(type, title, info)`.\n- Each tag's remove button clears the corresponding filter and re-runs `filterPapers()`.\n\n`clearAllFilters()` resets search input, year dropdown, and all tag filter states, then calls `filterPapers()` and `updateFilterStatus()`.\n\nOn `DOMContentLoaded`, the module wraps the existing `filterPapers` so that every call also triggers `updateFilterStatus()`.\n\n## Utilities\n\n**File:** `src/static/js/utils.js`\n\n### `debounce(fn, delay)`\n\nStandard debounce. Used for the search input to avoid filtering on every keystroke.\n\n### `updateURL()`\n\nSerializes the current filter and selection state into URL search parameters (`search`, `year`, `include`, `exclude`, `selected`, `show_selected`) and calls `history.replaceState`. This enables bookmarkable and shareable filter states without page reloads.\n\n### `updatePaperNumbers()`\n\nRe-numbers visible `.paper-row` elements sequentially, updating the `.paper-number` badge on each card.\n\n## CSS Structure\n\n| File | Scope |\n|---|---|\n| `src/static/css/base.css` | Root variables, layout, donation box, search/filter controls, floating nav, filter status bar, print styles |\n| `src/static/css/components.css` | Paper cards, selection mode UI, selection preview bar, share modal, control buttons |\n| `src/static/css/responsive.css` | Breakpoint overrides for 1024 px, 768 px, and 480 px |\n\nKey CSS conventions:\n\n- **CSS custom properties** in `:root` (`--primary-color`, `--hover-color`, `--border-color`, etc.) for theming.\n- **`selection-mode` class on `<body>`** gates visibility of checkboxes and the preview bar.\n- **`paper-row.visible`** controls whether a card is displayed; cards are hidden by default (`display: none`) and shown via the `visible` class.\n- **`paper-card.selected`** adds a blue border and shadow to indicate selection.\n- **Dark mode** is handled via `@media (prefers-color-scheme: dark)` for floating nav elements only.\n\n## HTML Templates\n\n### `src/templates/index.html`\n\nThe main page template. Server-side rendering replaces these placeholders before serving:\n\n| Placeholder | Content |\n|---|---|\n| `${styles}` | Concatenated CSS from the three stylesheets |\n| `${scripts}` | Concatenated JavaScript from all JS modules |\n| `${year_options}` | `<option>` elements for each publication year |\n| `${tag_filters}` | `<button class=\"tag-filter\">` elements for each tag |\n| `${paper_cards}` | Rendered paper card HTML |\n\n### `src/templates/paper_card.html`\n\nTemplate for a single paper. Substitution variables:\n\n| Variable | Source |\n|---|---|\n| `$id` | Unique paper identifier |\n| `$title`, `$authors`, `$year` | Paper metadata |\n| `$tags_json` | JSON-escaped tag array for `data-tags` |\n| `$tags_html` | Rendered tag badges |\n| `$thumbnail` | Thumbnail image URL (lazy-loaded) |\n| `$fallback_url` | Fallback image if thumbnail fails |\n| `$links_html` | Paper/ArXiv/project page links |\n\nEach card stores its metadata in `data-*` attributes on the `.paper-row` wrapper, which the JavaScript reads during filtering.\n\n## Data Flow Summary\n\n1. **Page load** → server renders HTML with paper data embedded in `data-*` attributes.\n2. **`main.js` init** → caches DOM, wires events, restores URL state, runs initial filter.\n3. **User interaction** (search, tag click, year change) → updates `state` → `filterPapers()` → toggles `.visible` classes → `updatePaperNumbers()` + `updateURL()`.\n4. **Selection mode** → checkbox/card click → `togglePaperSelection()` → updates `state.selectedPapers` + preview bar → `updateSelectionCount()` + `updateURL()`.\n5. **Share** → `showShareModal()` → builds URL from current state → user copies link.\n6. **Deep link** → `applyURLParams()` on load → restores all state from URL → `filterPapers()`.","overview":"# awesome-3D-gaussian-splatting — Wiki\n\n# Awesome 3D Gaussian Splatting\n\nWelcome! This repository is a curated, searchable catalog of research papers and resources focused on **3D Gaussian Splatting (3DGS)** and related technologies. It powers the live paper database at [mrnerf.github.io/awesome-3D-gaussian-splatting](https://mrnerf.github.io/awesome-3D-gaussian-splatting/) and provides tooling to keep that database accurate, enriched, and easy to manage.\n\n## What This Project Does\n\nAt its core, the project maintains a hand-curated YAML file (`awesome_3dgs_papers.yaml`) that serves as the single source of truth for paper metadata. Around that YAML file, several systems work together:\n\n- **Ingestion** — Pull new papers from arXiv and append them to the YAML database without breaking existing formatting.\n- **Enrichment & Validation** — Backfill missing publication dates, validate tags and URLs, and enforce data integrity on every pull request.\n- **Editing** — A desktop GUI for browsing, editing, tagging, and adding papers.\n- **Publishing** — Generate a self-contained static HTML page from the YAML data, complete with filtering, search, and deep-linking.\n\n## Architecture\n\n```mermaid\ngraph LR\n    ARX[arXiv API] --> AI[ArXiv Integration]\n    AI --> YAML[YAML Database]\n    EDIT[Editor Application] --> YAML\n    YAML --> YDP[YAML Data Processing]\n    YDP --> YAML\n    YAML --> SG[Site Generation]\n    PDM[Paper Data Model] -.-> SG\n    PDM -.-> YDP\n    SG --> HTML[Static HTML Page]\n    HTML --> WF[Web Frontend]\n```\n\nThe **YAML Database** is the central artifact. Everything either writes to it or reads from it. The [Paper Data Model](paper-data-model.md) sits one step removed — it defines the validated `Paper` dataclass that [Site Generation](site-generation.md) and [YAML Data Processing](yaml-data-processing.md) use to enforce structure at the boundary between raw YAML and the rest of the codebase.\n\n## Key End-to-End Flows\n\n### Adding a New Paper from arXiv\n\nA contributor supplies an arXiv URL or ID. The [ArXiv Integration](arxiv-integration.md) module extracts the ID, fetches metadata from the arXiv API, formats it as a YAML entry, and appends it to the database. The pipeline is linear: URL → extract ID → fetch metadata → format → append.\n\n### Validating a Pull Request\n\nWhen a PR changes the YAML file, [YAML Data Processing](yaml-data-processing.md) runs its validation pipeline — checking tags against an allow-list and verifying that URLs are live. This keeps the database clean without requiring manual review of every field.\n\n### Publishing the Site\n\n[Site Generation](site-generation.md) reads the YAML file, converts each entry into a validated `Paper` object via the [Paper Data Model](paper-data-model.md), generates HTML fragments for filter controls and paper cards, inlines all CSS and JS, and writes a single self-contained HTML file. The [Web Frontend](web-frontend.md) then handles client-side interactivity — filtering by tag/year, multi-select, URL-based deep-linking, and paper count updates.\n\n### Editing Papers via the Desktop App\n\nThe [Editor Application](editor-application.md) is a PyQt6 desktop tool that loads the YAML database into a form-based interface. It supports auto-save, tag management, thumbnail generation, and one-click arXiv imports through the same [ArXiv Integration](arxiv-integration.md) backend.\n\n## Getting Started\n\n1. **Clone the repository** and install Python dependencies as listed in the project's requirements.\n2. **Browse or edit the database** — open `awesome_3dgs_papers.yaml` directly, or launch the [Editor Application](editor-application.md) for a GUI workflow.\n3. **Add a paper** — use the ArXiv integration script or the editor's built-in arXiv dialog to fetch and append entries.\n4. **Generate the site** — run the [Site Generation](site-generation.md) CLI to produce the static HTML.\n5. **Validate before committing** — run the YAML validation pipeline to catch tag or URL issues before opening a PR.\n\nFor contribution guidelines, see `CONTRIBUTING.md` in the repository root.","paper-data-model":"# Paper Data Model\n\n# Paper Data Model\n\n## Overview\n\nThe `paper_schema` module defines the canonical data structure for research papers across the application. It provides a validated, typed `Paper` dataclass along with serialization methods that enforce data integrity at the boundary between raw input (dictionaries) and the rest of the codebase.\n\n## The `Paper` Dataclass\n\n`Paper` is a `@dataclass` with five required fields and eight optional fields. The split is intentional: required fields represent the minimum viable paper record, while optional fields capture enrichment data that may not be available at ingestion time.\n\n### Required Fields\n\n| Field | Type | Description |\n|-------|------|-------------|\n| `id` | `str` | Unique identifier for the paper |\n| `title` | `str` | Paper title |\n| `authors` | `str` | Author names (stored as a single string, not a list) |\n| `year` | `int` | Publication year |\n| `tags` | `List[str]` | Category or topic tags |\n\n### Optional Fields\n\n| Field | Type | Default | Description |\n|-------|------|---------|-------------|\n| `publication_date` | `Optional[str]` | `None` | Full publication date (e.g., \"2024-03-15\") |\n| `date_source` | `Optional[str]` | `None` | Origin of the publication date metadata |\n| `thumbnail` | `Optional[str]` | `None` | URL to a preview/thumbnail image |\n| `abstract` | `Optional[str]` | `None` | Paper abstract text |\n| `project_page` | `Optional[str]` | `None` | URL to the project's website |\n| `paper` | `Optional[str]` | `None` | URL to the paper PDF or publisher page |\n| `code` | `Optional[str]` | `None` | URL to the source code repository |\n| `video` | `Optional[str]` | `None` | URL to a video presentation or demo |\n\n## Construction and Validation\n\n### `Paper.from_dict(data: dict) -> Paper`\n\nThe primary entry point for creating `Paper` instances. It performs three layers of validation before construction:\n\n1. **Required field check** — Raises `ValueError` if any of `id`, `title`, `authors`, `year`, or `tags` is missing from the input dictionary.\n\n2. **Year normalization and range check** — Accepts `int`, `float`, or `str` types for `year`:\n   - `str`: strips non-digit characters, then converts to `int` (e.g., `\"2024\"` or `\"published: 2024\"` → `2024`)\n   - `float`: truncates to `int` (e.g., `2024.0` → `2024`)\n   - `int`: used directly\n   - Any other type raises `ValueError`\n   \n   After conversion, the year must fall within `[1900, current_year + 1]`. The upper bound accommodates preprints dated ahead of the current calendar year.\n\n3. **Tags type check** — Ensures `tags` is a `list`. Does not validate individual tag contents.\n\nAfter validation, all values are coerced to their target types via `str()`, `int()`, or `list()` constructors. Missing optional fields default to empty strings internally.\n\n```python\n# Minimal valid input\npaper = Paper.from_dict({\n    'id': 'paper-001',\n    'title': 'Attention Is All You Need',\n    'authors': 'Vaswani et al.',\n    'year': 2017,\n    'tags': ['transformers', 'nlp']\n})\n\n# Year as string with noise characters\npaper = Paper.from_dict({\n    'id': 'paper-002',\n    'title': 'Another Paper',\n    'authors': 'Smith',\n    'year': 'published: 2023',\n    'tags': ['cv']\n})\n# paper.year == 2023\n```\n\n### `Paper.to_dict() -> dict`\n\nSerializes a `Paper` instance back to a dictionary. Optional fields that are empty strings are converted to `None` in the output, providing a clean representation where absent data is explicitly `None` rather than `\"\"`.\n\n```python\npaper.to_dict()\n# {\n#   'id': 'paper-001',\n#   'title': 'Attention Is All You Need',\n#   'authors': 'Vaswani et al.',\n#   'year': 2017,\n#   'tags': ['transformers', 'nlp'],\n#   'publication_date': None,\n#   'date_source': None,\n#   'thumbnail': None,\n#   'abstract': None,\n#   'project_page': None,\n#   'paper': None,\n#   'code': None,\n#   'video': None\n# }\n```\n\n## Integration Point\n\nThe module is consumed by `generate_paper_cards` in `src/helper.py`, which calls `Paper.from_dict` to transform raw paper data into validated `Paper` objects before rendering. This makes `from_dict` the de facto ingestion boundary for paper data flowing into the application.\n\n```mermaid\nflowchart LR\n    A[Raw paper dict] -->|from_dict| B[Paper instance]\n    B -->|to_dict| C[Serialized dict]\n    D[generate_paper_cards<br/>src/helper.py] -->|calls| B\n```\n\n## Design Notes\n\n- **`authors` is a `str`, not a `List[str]`** — Author data arrives in varied formats (comma-separated, \"et al.\", etc.). The model stores it as-is rather than imposing a parsing structure that may not fit all sources.\n\n- **Empty string vs. `None` asymmetry** — Internally, `from_dict` stores missing optional fields as `\"\"` for simpler default handling. The `to_dict` method normalizes these back to `None` for external consumers. Code working with `Paper` attributes directly should account for both `None` and `\"\"` as \"absent\" values.\n\n- **No tag content validation** — `from_dict` only checks that `tags` is a list. It does not validate that individual tags are strings or non-empty. Downstream code should not assume well-formed tag entries.\n\n- **Year string parsing is permissive** — The digit-stripping approach (`''.join(filter(str.isdigit, year_value))`) means strings like `\"CVPR 2024\"` resolve to `2024`, but also that `\"2024a\"` or `\"12024\"` would produce `2024` and `12024` respectively. The range check catches the latter; the former is a known edge case.","site-generation":"# Site Generation\n\n# Site Generation Module\n\n## Overview\n\nThis module generates a static HTML page from a YAML data source containing paper entries. It reads raw paper data, validates and converts it to domain objects, produces HTML fragments for filters and paper cards, inlines all CSS and JavaScript assets, and writes a single self-contained HTML file as output.\n\n## Architecture\n\n```mermaid\ngraph TD\n    CLI[\"main() — CLI entry point\"]\n    GH[\"generate_html() — orchestration\"]\n    RF[\"read_files() — CSS/JS inlining\"]\n    GYO[\"generate_year_options()\"]\n    GTF[\"generate_tag_filters()\"]\n    GPC[\"generate_paper_cards()\"]\n    TE[\"TemplateEngine.render()\"]\n    WO[\"write_output()\"]\n    PCG[\"PaperCardGenerator\"]\n    FD[\"Paper.from_dict()\"]\n\n    CLI --> GH\n    GH --> RF\n    GH --> GYO\n    GH --> GTF\n    GH --> GPC\n    GH --> TE\n    GH --> WO\n    GPC --> FD\n    GPC --> PCG\n```\n\n## Generation Pipeline\n\nThe full pipeline runs in this order:\n\n1. **CLI invocation** — `main()` in `generate.py` receives `<input_yaml>` and `<output_html>` paths.\n2. **YAML loading** — The input file is parsed with `yaml.safe_load`, producing a list of dictionaries.\n3. **Asset inlining** — `read_files()` reads all CSS and JS files from `static/` and returns their contents as strings.\n4. **HTML fragment generation** — Three helper functions produce HTML snippets:\n   - `generate_year_options()` — `<option>` elements for the year dropdown filter.\n   - `generate_tag_filters()` — `<div>` elements for the tag filter panel.\n   - `generate_paper_cards()` — The complete set of paper card HTML (see [Paper Card Generation](#paper-card-generation)).\n5. **Template rendering** — `TemplateEngine.render()` substitutes all context variables into `templates/index.html`.\n6. **Output** — `write_output()` writes the final HTML string to disk.\n\n## Key Components\n\n### `generate.py` — Entry Point and Orchestrator\n\nThe CLI entry point. `main()` validates arguments (exactly two: input YAML path and output HTML path), loads the YAML data, and delegates to `generate_html()`.\n\n`generate_html(entries, output_file)` is the core orchestration function. It:\n\n- Resolves the base directory relative to the module's own location (`Path(__file__).parent`), making paths work regardless of working directory.\n- Reads three CSS files and seven JS files (listed below) via `read_files()`.\n- Builds a context dictionary and passes it to `TemplateEngine.render()`.\n- Writes the result via `write_output()`.\n\n**Inlined assets:**\n\n| Type | Files |\n|------|-------|\n| CSS | `static/css/base.css`, `static/css/components.css`, `static/css/responsive.css` |\n| JS | `static/js/state.js`, `static/js/utils.js`, `static/js/filters.js`, `static/js/selection.js`, `static/js/sharing.js`, `static/js/navigation.js`, `static/js/main.js` |\n\n### `helper.py` — HTML Fragment Generators\n\nThree functions that produce HTML fragments injected into the page template. All accept the raw list of entry dictionaries (not `Paper` objects).\n\n**`generate_year_options(entries)`** — Extracts unique year values, sorts them descending, and produces `<option value=\"{y}\">{y}<\/option>` elements.\n\n**`generate_tag_filters(entries)`** — Collects all unique tags across entries, filters out any tag starting with `\"Year \"` (these are internal categorization tags not shown to users), sorts alphabetically, and produces `<div class=\"tag-filter\" data-tag=\"{t}\">{t}<\/div>` elements.\n\n**`generate_paper_cards(entries)`** — The most complex fragment generator. It:\n1. Converts each dictionary entry to a `Paper` object via `Paper.from_dict()`, skipping invalid entries with a warning printed to stdout.\n2. Sorts papers (see [Sorting Logic](#sorting-logic)).\n3. Delegates to `PaperCardGenerator.generate_cards()` for HTML output.\n\n**`format_publication_date(date_str, date_source)`** — Formats an ISO date string as `\"%B %d, %Y\"` (e.g., \"March 15, 2024\"). Appends ` (est.)` when `date_source == 'estimated'`. Returns the raw string on parse failure. This function is available but not called within the current generation pipeline.\n\n### `paper_generator.py` — `PaperCardGenerator`\n\nGenerates individual paper card HTML using the `templates/paper_card.html` template.\n\n**Initialization:**\n\n```python\ncard_generator = PaperCardGenerator(Path(__file__).parent / 'templates')\n```\n\nA module-level instance is created in `helper.py` and reused across calls.\n\n**`generate_card(paper)`** — Renders a single card. The template context includes:\n\n| Context Key | Source |\n|-------------|--------|\n| `id` | `paper.id` |\n| `title` | `paper.title` |\n| `authors` | `paper.authors` |\n| `year` | `paper.year` |\n| `tags_json` | `json.dumps(paper.tags)` — serialized for client-side JS consumption |\n| `thumbnail` | `paper.thumbnail` or fallback `assets/thumbnails/{paper.id}.jpg` |\n| `fallback_url` | Always `\"None\"` (string) |\n| `tags_html` | Output of `_generate_tags()` |\n| `links_html` | Output of `_generate_links()` |\n| `abstract_html` | `paper.abstract` or empty string |\n\n**`_generate_links(paper)`** — Produces link HTML in a fixed order:\n\n1. **Paper** link (📄) — from `paper.paper`\n2. **Project** link (🌐) — from `paper.project_page`\n3. **Code** link (💻) — from `paper.code`\n4. **Video** link (🎥) — from `paper.video`\n5. **Abstract toggle** (📖) — a `<button>` and hidden `<div>` if `paper.abstract` exists\n\nAny URL that is missing or has the string value `\"None\"` (case-insensitive) is omitted entirely. The abstract toggle is always last when present.\n\n**`_generate_tags(paper)`** — Produces `<span class=\"paper-tag\">` elements. Tags starting with `\"Year \"` are excluded (consistent with `generate_tag_filters`).\n\n**`_generate_link(url, icon, text, emoji)`** — Low-level helper that produces an `<a>` tag with `target=\"_blank\"` and `rel=\"noopener\"`. Returns an empty string if the URL is falsy or equals `\"None\"` (case-insensitive).\n\n### `template_engine.py` — `TemplateEngine`\n\nA thin wrapper around Python's `string.Template`. Initialized with a template file path, which is read at construction time. The `render(context)` method calls `template.substitute(context)`, performing `$variable` substitution.\n\nBecause `string.Template.substitute` is used (not `safe_substitute`), any missing key in the context will raise a `KeyError`. All expected variables must be present.\n\n### `utils.py` — File I/O Utilities\n\n**`read_files(base_dir, file_paths)`** — Reads a list of relative file paths under `base_dir` and returns their contents as a list of strings. Used to inline CSS and JS assets.\n\n**`write_output(output_file, content)`** — Writes a string to the specified output file with UTF-8 encoding.\n\n## Sorting Logic\n\nPapers are sorted in both `helper.generate_paper_cards()` and `PaperCardGenerator.generate_cards()` using the same three-level key (descending/reverse order):\n\n1. **Publication date** — `paper.publication_date or '9999'`. Papers without a date sort to the end.\n2. **First author's last name** — Extracted as `paper.authors.split(',')[0].strip().split()[-1].lower()`.\n3. **Title** — `paper.title.lower()` for alphabetical tiebreaking.\n\nBecause `reverse=True` is applied, newer papers appear first, and within the same date, authors are sorted Z→A, titles Z→A.\n\n## CLI Usage\n\n```bash\npython generate.py <input_yaml> <output_html>\n```\n\n- `<input_yaml>` — Path to a YAML file containing a list of paper entry dictionaries.\n- `<output_html>` — Path where the generated HTML file will be written.\n\nOn success, prints `Successfully generated <output_html>` and exits with code 0. On invalid arguments or any exception during generation, prints an error message and exits with code 1.\n\n## Data Flow and Validation\n\nRaw YAML entries (dictionaries) flow through two paths:\n\n- **Filter fragments** (`generate_year_options`, `generate_tag_filters`) consume raw dictionaries directly, using `.get(\"year\")` and `entry[\"tags\"]`.\n- **Paper cards** (`generate_paper_cards`) validates each entry through `Paper.from_dict()`. Invalid entries are skipped with a warning that includes the entry's `id` and `title`. This means the card output may contain fewer papers than the YAML input if validation fails.\n\n## Template Requirements\n\nThe `templates/index.html` template must define the following `$variables`:\n\n| Variable | Content |\n|----------|---------|\n| `$styles` | Concatenated CSS from all three stylesheet files |\n| `$scripts` | Concatenated JS from all seven script files |\n| `$year_options` | HTML `<option>` elements for year filter |\n| `$tag_filters` | HTML `<div>` elements for tag filter panel |\n| `$paper_cards` | Full HTML for all paper cards |\n\nThe `templates/paper_card.html` template must define the variables listed in the `PaperCardGenerator` context table above.","yaml-data-processing":"# YAML Data Processing\n\n# YAML Data Processing Module\n\n## Overview\n\nThis module manages the integrity and enrichment of a curated YAML database of 3D Gaussian Splatting papers (`awesome_3dgs_papers.yaml`). It provides two independent pipelines:\n\n- **Date enrichment** (`fix_date.py`) — backfills missing `publication_date` fields by querying the arXiv API or estimating from paper metadata, then re-sorts the entire dataset.\n- **Entry validation** (`validate_yaml.py`) — runs as a CI check on pull requests, validating tags and liveness of URLs for changed entries only.\n\nBoth scripts operate on the same YAML schema where each entry is a dictionary with keys like `id`, `title`, `authors`, `paper`, `tags`, `publication_date`, `date_source`, `project_page`, `code`, and `video`.\n\n## Architecture\n\n```mermaid\nflowchart LR\n    subgraph fix_date.py\n        A[update_yaml_with_dates] --> B[process_paper]\n        B --> C[extract_arxiv_id]\n        B --> D[get_fallback_date]\n        D --> E[extract_year_from_id]\n        B -->|arXiv API| F[(arxiv.Client)]\n    end\n\n    subgraph validate_yaml.py\n        G[main] --> H[get_changed_entries]\n        G --> I[validate_entries]\n        I --> J[validate_url]\n        H -->|GitHub API| K[(PyGithub)]\n        J -->|HTTP| L[(Remote URLs)]\n    end\n\n    M[(awesome_3dgs_papers.yaml)] --> A\n    M --> H\n    A --> M\n```\n\n---\n\n## `fix_date.py` — Publication Date Enrichment\n\n### `YAMLUpdater`\n\nThe central class that orchestrates date resolution and file I/O.\n\n#### Constructor\n\n```python\nYAMLUpdater()\n```\n\nInitializes an `arxiv.Client` instance and an empty `failed_papers` list to track entries that could not be resolved.\n\n#### Date Resolution Pipeline\n\n`process_paper(entry)` applies a two-tier strategy for each entry that lacks a `publication_date` key:\n\n1. **arXiv lookup** — `extract_arxiv_id(url)` parses the paper URL for an arXiv identifier (pattern `\\d{4}\\.\\d{4,5}(?:v\\d+)?`). If found, the arXiv API is queried and `entry['publication_date']` is set to the paper's `published` timestamp in ISO format. `date_source` is set to `'arxiv'`.\n\n2. **Fallback estimation** — `get_fallback_date(entry)` attempts to derive a year from:\n   - The `id` field via `extract_year_from_id` (regex `20\\d{2}`)\n   - The `year` field (cast to `int`)\n   \n   If a year is found, `publication_date` is set to `YYYY-07-01T00:00:00` (mid-year approximation) and `date_source` is set to `'estimated'`.\n\nIf neither source yields a date, the paper ID and reason are appended to `self.failed_papers`.\n\n#### Sorting\n\n`safe_sort_key(x)` produces a tuple for deterministic sorting:\n\n```\n(publication_date, source_priority, last_name, title)\n```\n\n- `source_priority` ranks `'arxiv'` (0) above `'estimated'` (1) above `'unknown'` (2), so verified dates sort before estimated ones when dates are equal.\n- `last_name` is extracted from the first comma-separated author.\n- All string components are lowercased; missing values default to `'z'` or `'9999'` to push incomplete entries to the end.\n\n#### `update_yaml_with_dates(filename)`\n\nMain entry point. Execution flow:\n\n1. Loads the YAML file via `yaml.safe_load`.\n2. Filters entries missing `publication_date`.\n3. Dispatches `process_paper` across a `ThreadPoolExecutor(max_workers=5)`.\n4. Sorts the full dataset newest-first (`reverse=True`).\n5. Writes back with `yaml.dump(sort_keys=False, allow_unicode=True)`.\n6. Prints a summary of arXiv-sourced, estimated, and failed updates.\n\n**Usage:**\n\n```bash\npython src/fix_date.py\n```\n\nThis runs `YAMLUpdater().update_yaml_with_dates()` against the default file `awesome_3dgs_papers.yaml`.\n\n### Rate Limiting Consideration\n\nThe arXiv API has rate limits. With `max_workers=5`, the script can hit these quickly on large datasets. If you encounter `HTTP 429` errors, reduce `max_workers` or add a `time.sleep()` call inside `process_paper` before the API query.\n\n---\n\n## `validate_yaml.py` — PR Entry Validation\n\nDesigned to run as a GitHub Actions check. It validates only entries that were added or modified in the current pull request, keeping CI fast and reviews focused.\n\n### HTTP Session Configuration\n\nA module-level `requests.Session` is configured with:\n\n- **Retry policy** — 3 total retries, exponential backoff (factor 1), retrying on status codes `408`, `429`, `500`, `502`, `503`, `504`.\n- **User-Agent header** — set to avoid blocks from academic sites.\n\n### `validate_url(url, required=False)`\n\nChecks URL reachability with a two-step strategy:\n\n1. **HEAD request** — lightweight check for a valid response (status in `{200, 301, 302, 303, 307, 308}`).\n2. **GET fallback** — if HEAD returns `405`, `400`, or `403`, a streaming GET is attempted and immediately closed.\n\nReturns `None` on success, or an error string on failure (timeout, network error, bad status). The `required` flag controls whether a missing/empty URL is treated as an error.\n\n### `get_changed_entries()`\n\nCompares the current YAML against the PR base branch:\n\n1. Reads `GITHUB_TOKEN`, `REPO`, and `PR_NUMBER` from environment variables.\n2. Fetches the base version of the YAML from the repo at `pr.base.sha`.\n3. Indexes base entries by `id`.\n4. Returns entries that are new (`id` not in base) or modified (dict inequality).\n\nIf the file doesn't exist on the base branch, all entries are treated as new.\n\n### `validate_entries(entries)`\n\nPerforms two categories of checks per entry:\n\n**Tag validation:**\n- At least one non-`Year ` tag must be present.\n- Every tag must either start with `\"Year \"` or appear in the `allowed_tags` list (a module-level constant of ~60 curated categories like `\"2DGS\"`, `\"SLAM\"`, `\"Meshing\"`, etc.).\n\n**URL validation:**\n- `paper` — required. Must be reachable.\n- `project_page`, `code`, `video` — optional, but if present must be reachable.\n- A 1-second delay is inserted between URL checks to avoid rate-limiting.\n\nReturns a list of error strings. An empty list means all entries passed.\n\n### `main()`\n\nOrchestrates the CI flow:\n\n1. Calls `get_changed_entries()`.\n2. If no changes, exits `0`.\n3. Calls `validate_entries()`.\n4. On errors, prints each one and exits `1`.\n5. On success, prints confirmation and exits `0`.\n\n**Required environment variables:**\n\n| Variable | Purpose |\n|---|---|\n| `GITHUB_TOKEN` | Authenticate with the GitHub API |\n| `REPO` | Full repository name (e.g., `owner/repo`) |\n| `PR_NUMBER` | Pull request number to diff against |\n\n**Usage:**\n\n```bash\nexport GITHUB_TOKEN=ghp_...\nexport REPO=owner/awesome-3dgs\nexport PR_NUMBER=42\npython src/validate_yaml.py\n```\n\n---\n\n## YAML Entry Schema\n\nBoth scripts expect entries conforming to this structure:\n\n| Field | Type | Required | Notes |\n|---|---|---|---|\n| `id` | `str` | Yes | Unique identifier, often `author2024keyword` format |\n| `title` | `str` | Yes | Paper title |\n| `authors` | `str` | Yes | Comma-separated author names |\n| `paper` | `str` (URL) | Yes | Link to paper (arXiv or other) |\n| `tags` | `list[str]` | Yes | Must use values from `allowed_tags` or `\"Year YYYY\"` |\n| `publication_date` | `str` (ISO 8601) | No | Added by `fix_date.py` if missing |\n| `date_source` | `str` | No | `'arxiv'` or `'estimated'`; set by `fix_date.py` |\n| `project_page` | `str` (URL) | No | Validated if present |\n| `code` | `str` (URL) | No | Validated if present |\n| `video` | `str` (URL) | No | Validated if present |\n| `year` | `int` or `str` | No | Used as fallback by `get_fallback_date` |\n\n---\n\n## Dependencies\n\n| Package | Used In | Purpose |\n|---|---|---|\n| `arxiv` | `fix_date.py` | Query arXiv metadata API |\n| `yaml` (PyYAML) | Both | Parse and serialize YAML |\n| `requests` | `validate_yaml.py` | HTTP URL liveness checks |\n| `urllib3` | `validate_yaml.py` | Retry configuration for requests |\n| `github` (PyGithub) | `validate_yaml.py` | Fetch base branch content from GitHub |\n| `concurrent.futures` | `fix_date.py` | Parallel arXiv lookups |\n\n---\n\n## Common Workflows\n\n### Adding a new paper to the YAML\n\n1. Add the entry with `id`, `title`, `authors`, `paper`, and `tags`. Omit `publication_date`.\n2. Run `fix_date.py` to backfill the date and re-sort.\n3. Commit the updated YAML. The PR validation will check your new entry's tags and URLs.\n\n### Fixing a validation failure\n\n- **Invalid tags** — replace with values from `allowed_tags` or use a `\"Year YYYY\"` tag.\n- **URL returns 4xx/5xx** — verify the URL is correct and the site is up. Some academic sites block automated HEAD requests; the GET fallback handles most of these.\n- **URL timed out** — may be transient; re-run the check. If persistent, the URL may be behind a restrictive firewall or geo-block."};

(function() {

  document.addEventListener('DOMContentLoaded', function() {
    mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose' });
    renderMeta();
    renderNav();
    document.getElementById('menu-toggle').addEventListener('click', function() {
      document.getElementById('sidebar').classList.toggle('open');
    });
    if (location.hash && location.hash.length > 1) {
      activePage = decodeURIComponent(location.hash.slice(1));
    }
    navigateTo(activePage);
  });

  function renderMeta() {
    if (!META) return;
    var el = document.getElementById('meta-info');
    var parts = [];
    if (META.generatedAt) {
      parts.push(new Date(META.generatedAt).toLocaleDateString());
    }
    if (META.model) parts.push(META.model);
    if (META.fromCommit) parts.push(META.fromCommit.slice(0, 8));
    el.textContent = parts.join(' \u00b7 ');
  }

  function renderNav() {
    var container = document.getElementById('nav-tree');
    var html = '<div class="nav-section">';
    html += '<a class="nav-item overview" data-page="overview" href="#overview">Overview</a>';
    html += '</div>';
    if (TREE.length > 0) {
      html += '<div class="nav-group-label">Modules</div>';
      html += buildNavTree(TREE);
    }
    container.innerHTML = html;
    container.addEventListener('click', function(e) {
      var target = e.target;
      while (target && !target.dataset.page) { target = target.parentElement; }
      if (target && target.dataset.page) {
        e.preventDefault();
        navigateTo(target.dataset.page);
      }
    });
  }

  function buildNavTree(nodes) {
    var html = '';
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      html += '<div class="nav-section">';
      html += '<a class="nav-item" data-page="' + escH(node.slug) + '" href="#' + encodeURIComponent(node.slug) + '">' + escH(node.name) + '</a>';
      if (node.children && node.children.length > 0) {
        html += '<div class="nav-children">' + buildNavTree(node.children) + '</div>';
      }
      html += '</div>';
    }
    return html;
  }

  function escH(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function navigateTo(page) {
    activePage = page;
    location.hash = encodeURIComponent(page);

    var items = document.querySelectorAll('.nav-item');
    for (var i = 0; i < items.length; i++) {
      if (items[i].dataset.page === page) {
        items[i].classList.add('active');
      } else {
        items[i].classList.remove('active');
      }
    }

    var contentEl = document.getElementById('content');
    var md = PAGES[page];

    if (!md) {
      contentEl.innerHTML = '<div class="empty-state"><h2>Page not found</h2><p>' + escH(page) + '.md does not exist.</p></div>';
      return;
    }

    contentEl.innerHTML = marked.parse(md);

    // Rewrite .md links to hash navigation
    var links = contentEl.querySelectorAll('a[href]');
    for (var i = 0; i < links.length; i++) {
      var href = links[i].getAttribute('href');
      if (href && href.endsWith('.md') && href.indexOf('://') === -1) {
        var slug = href.replace(/\.md$/, '');
        links[i].setAttribute('href', '#' + encodeURIComponent(slug));
        (function(s) {
          links[i].addEventListener('click', function(e) {
            e.preventDefault();
            navigateTo(s);
          });
        })(slug);
      }
    }

    // Convert mermaid code blocks into mermaid divs
    var mermaidBlocks = contentEl.querySelectorAll('pre code.language-mermaid');
    for (var i = 0; i < mermaidBlocks.length; i++) {
      var pre = mermaidBlocks[i].parentElement;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = mermaidBlocks[i].textContent;
      pre.parentNode.replaceChild(div, pre);
    }
    try { mermaid.run({ querySelector: '.mermaid' }); } catch(e) {}

    window.scrollTo(0, 0);
    document.getElementById('sidebar').classList.remove('open');
  }
