tly over multiple steps.\n\n## Execution Flow\n\n```mermaid\nflowchart TD\n    A[gpt2_build_from_checkpoint] --> B[Load debug state file]\n    B --> C{Step 0..9}\n    C --> D[gpt2_forward]\n    D --> E[gpt2_zero_grad]\n    E --> F[gpt2_backward]\n    F --> G{Step 0?}\n    G -- Yes --> H[Compare logits, loss, all 16 gradients]\n    G -- No --> I[Skip detailed check]\n    H --> J[gpt2_update - Adam]\n    I --> J\n    J --> K[Compare loss vs expected_losses]\n    K --> C\n    C -- Done --> L[Print overall okay]\n```\n\n## Relationship to the Codebase\n\nThis file is compiled by defining `TESTING` before including `train_gpt2.c`:\n\n```c\n#define TESTING\n#include \"train_gpt2.c\"\n```\n\nThis gives the test direct access to all internal structures (`GPT2`, `ParameterTensors`, `model.acts.logits`, `model.grads`, etc.) without needing a separate header. The `TESTING` macro may also alter behavior in `train_gpt2.c` (e.g., disabling random dropout for deterministic outputs).\n\nThe test depends on two external artifacts that must be produced before running:\n\n| File | Generated by | Purpose |\n|------|-------------|---------|\n| `gpt2_124M.bin` | `train_gpt2.py` | Model weights checkpoint |\n| `gpt2_124M_debug_state.bin` | `train_gpt2.py` | Reference inputs, logits, loss, gradients |\n\n## Running the Test\n\n```bash\n# First, generate the reference files\npython train_gpt2.py\n\n# Then compile and run the test\ngcc -O2 -o test_gpt2 test_gpt2.c -lm\n./test_gpt2\n```\n\nExpected output ends with:\n\n```\noverall okay: 1\n```\n\nIf any check fails, the output identifies which tensor or step failed and the maximum difference observed, allowing targeted debugging.\n\n## Known Design Considerations\n\n- **No explicit exit code:** The process always returns 0 regardless of `allok`. For CI integration, pipe stdout and check for `overall okay: 1`.\n- **Logits comparison uses `1e-2` tolerance** while `check_tensor` uses `2e-2`. The stricter tolerance for logits reflects their role as the primary forward-pass output.\n- **Padding handling:** The logits comparison correctly accounts for `Vp` (padded vocab size) vs `V` (actual vocab size) in index arithmetic, ensuring padding elements are not compared.\n- **Early exit on logits mismatch:** If any logit element exceeds tolerance, both loops break immediately (`bt = B*T`), preventing flood of mismatch output.","gpt-2-training-test-gpt2-cu":"# GPT-2 Training — test_gpt2.cu\n\n# GPT-2 Training — test_gpt2.cu\n\n## Purpose\n\n`test_gpt2.cu` is the correctness and determinism validation suite for the GPT-2 training implementation. It compiles the full training codebase (via `#define TESTING` followed by `#include \"train_gpt2.cu\"`) and layers verification checks on top of it. The test answers two questions:\n\n1. **Numerical correctness** — Do the CUDA forward pass, backward pass, and optimizer produce results that match a PyTorch reference within acceptable tolerances?\n2. **Determinism** — Does saving and restoring a checkpoint reproduce identical training behavior?\n\nA passing test returns `EXIT_SUCCESS` (0); any failure returns `EXIT_FAILURE` (1).\n\n## Test Flow Overview\n\n```mermaid\nflowchart TD\n    A[Load model checkpoint] --> B[Load reference state from Python]\n    B --> C[Target-free forward pass]\n    C --> D[Compare logits vs reference]\n    D --> E[10 training iterations]\n    E --> F{Step 0?}\n    F -->|Yes| G[Compare all parameter gradients vs reference]\n    F -->|No| H[Continue training]\n    G --> H\n    H --> I[Compare losses vs PyTorch expected losses]\n    I --> J[Determinism test: save checkpoint + state]\n    J --> K[Reload and replay 10 steps]\n    K --> L[Verify token-by-token and loss-by-loss match]\n    L --> M[Report overall pass/fail]\n```\n\n## Key Components\n\n### `check_tensor`\n\n```c\nint check_tensor(float *a, float *b, int n, const char* label, float threshold=1e-0)\n```\n\nCompares a calculated tensor `a` against a reference tensor `b`, element by element. Rather than using a flat threshold, it applies a **relative threshold** that accounts for BF16 quantization noise:\n\n```\nt_eff = threshold + |b[i]| * epsilon    (epsilon = 0.079, the BF16 machine epsilon)\n```\n\nThis means larger reference values are allowed proportionally larger absolute differences, which is the expected behavior under reduced-precision arithmetic.\n\n**Outputs:**\n- Prints the first 10 element comparisons with OK/NOT OK status\n- Prints a summary with max absolute difference, max relative error, and how close the worst element came to the threshold (as a percentage)\n- Returns `1` if all elements pass, `0` otherwise\n\n### `FloatParameterTensors`\n\nA CPU-side, float32 mirror of the GPU's parameter tensor struct. Contains the same 16 pointer fields (`wte`, `wpe`, `ln1w`, `ln1b`, `qkvw`, `qkvb`, `attprojw`, `attprojb`, `ln2w`, `ln2b`, `fcw`, `fcb`, `fcprojw`, `fcprojb`, `lnfw`, `lnfb`) but typed as `float*` instead of `floatX*`. Used to hold reference gradients read from the Python-generated state file.\n\nA `static_assert` verifies that the struct size matches `NUM_PARAMETER_TENSORS * sizeof(void*)`, ensuring the layout stays in sync with the training code.\n\n### `float_cpu_malloc_and_point_parameters`\n\n```c\nfloat* float_cpu_malloc_and_point_parameters(FloatParameterTensors* params, size_t* param_sizes)\n```\n\nAllocates a single contiguous block of CPU memory for all float32 reference parameters and distributes pointers into the `FloatParameterTensors` struct. This mirrors the GPU-side `malloc_and_point_parameters` but uses `malloc` instead of `cudaMalloc` and stores `float` instead of `floatX`.\n\n## Test Phases in Detail\n\n### Phase 1: Setup and Reference Data Loading\n\nThe test loads two files:\n\n| File | Contents |\n|------|----------|\n| `gpt2_124M.bin` (or `gpt2_124M_bf16.bin`) | Model weights checkpoint |\n| `gpt2_124M_debug_state.bin` | Reference inputs, targets, logits, loss, and parameter gradients from PyTorch |\n\nThe debug state file has a magic number `20240327` and version `2`. It contains:\n- Header (256 ints): magic, version, batch size `B`, sequence length `T`\n- Input token IDs: `B * T` ints\n- Target token IDs: `B * T` ints\n- Expected logits: `B * T * V` floats (unpadded vocab dimension)\n- Expected loss: 1 float\n- Expected parameter gradients: `num_parameters` floats\n\n### Phase 2: Logit Verification (Target-Free Forward Pass)\n\nA forward pass is run **without targets** (the `y` pointer is not passed to `gpt2_forward` in this call — the model computes logits but not the cross-entropy loss). The output logits are copied to CPU, cast from `floatX` to `float`, and compared element-by-element against the PyTorch reference.\n\n**Tolerance thresholds** depend on precision mode:\n\n| Mode | Logit threshold | Loss threshold |\n|------|-----------------|----------------|\n| FP32 | `1e-3` | `1e-5` |\n| BF16 / FP16 | `25.0` | `0.05` |\n\nThe padded vocab columns (`V` through `Vp`) are excluded from comparison. On mismatch, the first failing index is printed and the check aborts early.\n\n### Phase 3: Gradient Verification (Step 0 of Training Loop)\n\nDuring the first training step, after `gpt2_backward_and_reduce`, all parameter gradients are copied from GPU to CPU, converted from `floatX` to `float` if needed, and compared against the PyTorch reference gradients using `check_tensor`.\n\nEach parameter tensor has its own tolerance, reflecting the varying sensitivity of different parts of the model to reduced-precision arithmetic:\n\n| Parameter | Threshold | Parameter | Threshold |\n|-----------|-----------|-----------|-----------|\n| `wte` | 5e-1 | `attprojw` | 2e-2 |\n| `wpe` | 4e-3 | `attprojb` | 3e-2 |\n| `ln1w` | 1e-1 | `ln2w` | 5e-2 |\n| `ln1b` | 4e-2 | `ln2b` | 3e-2 |\n| `qkvw` | 5e-2 | `fcw` | 3e-2 |\n| `qkvb` | 3.5e-2 | `fcb` | 3e-2 |\n| `fcprojw` | 2e-2 | `lnfw` | 1e-1 |\n| `fcprojb` | 1e-2 | `lnfb` | 2e-2 |\n\nIn FP32 mode, all thresholds are tightened to `1e-6`.\n\n**Important caveat** (from the source comments): Stochastic rounding introduces non-deterministic noise, and different GPUs may use different matrix multiplication algorithms. If a threshold is tripped after a code change, it may be acceptable after manual review — tolerances can be relaxed slightly.\n\n### Phase 4: Loss Trajectory Verification\n\nAfter 10 training steps with AdamW (lr=1e-4, β1=0.9, β2=0.95, eps=1e-8), the per-step losses are compared against these PyTorch reference values:\n\n```\nStep  1: 5.270009    Step  6: 1.653923\nStep  2: 4.060681    Step  7: 1.168050\nStep  3: 3.320085    Step  8: 0.736873\nStep  4: 2.717550    Step  9: 0.401021\nStep  5: 2.181066    Step 10: 0.187493\n```\n\nLosses are rounded to 6 decimal places before comparison (matching PyTorch's print formatting). The comparison uses the same `loss_diff_threshold` as Phase 2.\n\nGradient norm scaling is applied during the update: if the gradient norm exceeds 1.0, gradients are scaled down by `1/grad_norm`.\n\n### Phase 5: Determinism Verification\n\nThis phase verifies that the training pipeline is fully reproducible after a checkpoint save/restore cycle:\n\n1. Save model checkpoint to `test_gpt2cu_model.ckpt` via `gpt2_write_to_checkpoint`\n2. Save training state (step counter, model state, dataloader state) to `test_gpt2cu_state.ckpt` via `save_state`\n3. Run 10 steps on the validation dataset (`tiny_shakespeare_val.bin`), recording per-step loss and the first input token\n4. Free the model, rebuild from the checkpoint, restore the dataloader state\n5. Replay the same 10 steps and verify **exact** match on both the first input token and the loss value at every step\n\nAny mismatch is reported as nondeterminism and causes test failure. Intermediate checkpoint files are deleted at the end.\n\n## Command-Line Flags\n\nThe test accepts optional flags to control model behavior during the run:\n\n| Flag | Field | Description |\n|------|-------|-------------|\n| `-w <0\\|1>` | `model.use_master_weights` | Enable master weights (FP32 copy) for mixed-precision training |\n| `-r <0\\|1>` | `model.recompute` | Enable gradient checkpointing / activation recomputation |\n| `-ge <0\\|1>` | `model.gelu_fusion` | Enable fused GELU kernel |\n\nFlags are parsed in pairs (`argv[i]` is the flag, `argv[i+1]` is the value).\n\n## Relationship to the Codebase\n\n`test_gpt2.cu` is not a unit test in the traditional sense — it is a **full integration test** that exercises the entire training pipeline:\n\n- `gpt2_init_common` / `gpt2_build_from_checkpoint` — model construction\n- `gpt2_allocate_state` — activation/gradient memory allocation\n- `gpt2_forward` — forward pass\n- `gpt2_backward_and_reduce` — backward pass with gradient reduction\n- `gpt2_calculate_grad_norm` — gradient norm for scaling\n- `gpt2_update` — AdamW optimizer step\n- `gpt2_write_to_checkpoint` / `gpt2_build_from_checkpoint` — checkpoint I/O\n- `save_state` / `load_state` — full training state persistence\n- `DataLoader` — batch iteration and state management\n- `common_start` / `common_free` — multi-GPU initialization and teardown\n\nThe `#define TESTING` macro is set before including `train_gpt2.cu`, which may alter compilation behavior in the training code (e.g., disabling certain side effects or enabling test-specific code paths).\n\n## Prerequisites\n\nBefore running the test, the following files must exist in the working directory:\n\n- `gpt2_124M.bin` (FP32) or `gpt2_124M_bf16.bin` (BF16) — model weights\n- `gpt2_124M_debug_state.bin` — reference data generated by `python train_gpt2.py`\n- `dev/data/tinyshakespeare/tiny_shakespeare_val.bin` — validation data for the determinism test\n\nIf the state file has an incorrect magic number or version, the test prints a hint to re-run the Python training script.","gpt-2-training-test-gpt2-fp32-cu":"# GPT-2 Training — test_gpt2_fp32.cu\n\n# GPT-2 FP32 Correctness Test (`test_gpt2_fp32.cu`)\n\n## Purpose\n\nThis module is a **reference correctness test** that validates the CUDA GPT-2 implementation against PyTorch-generated ground truth. It verifies that the forward pass, backward pass, and optimizer update produce numerically equivalent results to a known-good Python implementation, using a tolerance of **1e-2**.\n\nThe test is not a unit test framework — it is a standalone executable that loads pre-computed reference data, runs the CUDA model, compares outputs, and reports pass/fail.\n\n## How It Works\n\nThe test includes the entire training implementation by `#define TESTING` before including `train_gpt2_fp32.cu`. This gives it access to all model construction, forward/backward, and optimizer functions while preventing the training binary's own `main()` from conflicting.\n\n```mermaid\nflowchart TD\n    A[Load checkpoint: gpt2_124M.bin] --> B[Load reference state: gpt2_124M_debug_state.bin]\n    B --> C[Forward pass without targets → validate logits]\n    C --> D[10-step training loop]\n    D --> E{Step 0?}\n    E -->|Yes| F[Validate loss + all gradients]\n    E -->|No| G[Continue training]\n    F --> G\n    G --> H[AdamW update]\n    H --> I{All 10 steps done?}\n    I -->|No| D\n    I -->|Yes| J[Compare 10-step loss trajectory]\n    J --> K[Report overall pass/fail]\n```\n\n## Required Input Files\n\n| File | Contents | Generated By |\n|------|----------|-------------|\n| `gpt2_124M.bin` | Model weights and config (vocab size, layers, channels, etc.) | `train_gpt2.py` export |\n| `gpt2_124M_debug_state.bin` | Reference inputs, expected logits, expected loss, expected gradients | `train_gpt2.py` with debug export |\n\nThe debug state file has a 256-int header:\n- `state_header[0]` — magic number `20240327`\n- `state_header[1]` — version number (must be `2`; re-run `train_gpt2.py` if mismatch)\n- `state_header[2]` — batch size `B`\n- `state_header[3]` — sequence length `T`\n\nFollowing the header, the file contains (in order):\n1. `x` — input token IDs (`B * T` ints)\n2. `y` — target token IDs (`B * T` ints)\n3. Expected logits (`B * T * V` floats, where `V` is the unpadded vocab size)\n4. Expected loss (1 float)\n5. Expected gradients for all parameters (`model.num_parameters` floats)\n\n## Key Design Decisions\n\n### TF32 Disabled\n\nTF32 is **explicitly forced off** regardless of GPU capability:\n\n```c\nenable_tf32 = 0; // NOTE: disable TF32 for testing!!!\n```\n\nThis ensures the CUDA implementation runs in strict FP32 mode, matching the PyTorch reference which also uses standard FP32. Without this, Ampere+ GPUs would use TF32 tensor cores, introducing small numerical differences that could cause false test failures.\n\n### Padded Vocab Handling\n\nThe model uses a padded vocab size `Vp` (aligned for performance), but PyTorch reference logits use the actual vocab size `V`. The logit comparison accounts for this by indexing the CUDA output with `bt * Vp + v` while indexing the reference with `bt * V + v`:\n\n```c\nfloat diff = fabsf(expected_logits[bt*V + v] - logits_cpu[i]); // i = bt * Vp + v\n```\n\nOnly the first `V` columns are compared; padded columns are skipped.\n\n### Bulk Gradient Comparison\n\nAt step 0, all parameter gradients are compared in a single bulk operation rather than per-parameter:\n\n```c\ncudaMemcpy(calculated_grads_memory, model.grads_memory,\n           model.num_parameters * sizeof(float), cudaMemcpyDeviceToHost);\ncheck_tensor(calculated_grads_memory, expected_grads_memory,\n             model.num_parameters, \"grads\");\n```\n\nThe per-parameter `cudaMemcpy` + `check_tensor` calls are preserved as commented-out code for debugging specific gradient mismatches.\n\n## Test Validation Points\n\n### 1. Logit Correctness (Forward Pass)\n\nA target-free forward pass (`y = NULL`) is run first. The output logits are copied to CPU and compared element-wise against the PyTorch reference. A single mismatch above 1e-2 triggers failure and breaks out of the comparison loop early.\n\n### 2. Loss Correctness (Step 0)\n\nAfter the first forward pass **with targets**, `model.mean_loss` is compared against the reference loss value.\n\n### 3. Gradient Correctness (Step 0)\n\nAfter the first backward pass, all parameter gradients are transferred to host and compared against the PyTorch-computed gradients using `check_tensor`.\n\n### 4. Training Trajectory (Steps 0–9)\n\nTen full training iterations are executed with AdamW (lr=1e-4, β1=0.9, β2=0.999, eps=1e-8, weight_decay=0.01). The loss at each step is compared against hardcoded expected values:\n\n```\nStep 0:  5.2700    Step 5:  1.8490\nStep 1:  4.0597    Step 6:  1.3947\nStep 2:  3.3751    Step 7:  0.9991\nStep 3:  2.8008    Step 8:  0.6241\nStep 4:  2.3154    Step 9:  0.3765\n```\n\nThis validates that the optimizer update is numerically correct — a wrong gradient or update rule would cause the loss trajectory to diverge.\n\n## Helper: `check_tensor`\n\n```c\nint check_tensor(float *a, float *b, int n, const char* label);\n```\n\nCompares two float arrays element-wise with a tolerance of **1e-2**. Prints the first 5 elements (OK/NOT OK with values), then reports `TENSOR OK` or `TENSOR NOT OK`. Returns 1 if all elements match, 0 otherwise.\n\n## Overall Result\n\nThe variable `allok` accumulates results from all three validation points (logits, loss at step 0, 10-step loss trajectory). The final line prints:\n\n```\noverall okay: 1    # all checks passed\noverall okay: 0    # one or more checks failed\n```\n\nNote: gradient correctness at step 0 is printed by `check_tensor` but does **not** feed into `allok` — it is informational only. The 10-step loss trajectory serves as the indirect gradient validation.\n\n## Relationship to `train_gpt2_fp32.cu`\n\nThis test is a consumer of the training module, not a peer. It accesses:\n\n- **Types**: `GPT2`, `ParameterTensors`\n- **Functions**: `gpt2_build_from_checkpoint`, `gpt2_forward`, `gpt2_zero_grad`, `gpt2_backward`, `gpt2_update`, `gpt2_free`, `malloc_and_point_parameters`\n- **Macros**: `cudaCheck`, `cublasCheck`, `freadCheck`, `fopenCheck`, `fcloseCheck`, `mallocCheck`\n- **Globals**: `cublas_handle`, `cublas_compute_type`\n\nThe `#define TESTING` guard in `train_gpt2_fp32.cu` prevents its `main()` from being compiled, allowing this test to provide its own entry point.","gpt-2-training-train-gpt2-c":"# GPT-2 Training — train_gpt2.c\n\n# GPT-2 Training — `train_gpt2.c`\n\nA clean, minimal, CPU-based reference implementation of GPT-2 training. All transformer layer operations are written as explicit forward/backward C functions with no framework dependencies. OpenMP pragmas provide low-cost parallelism where it matters most (matmul, attention). This file is the algorithmic baseline; optimized variants will derive from it.\n\n## Architecture Overview\n\n```mermaid\ngraph TD\n    A[encoder_forward] --> B[layernorm_forward]\n    B --> C[matmul_forward]\n    C --> D[attention_forward]\n    D --> E[matmul_forward]\n    E --> F[residual_forward]\n    F --> G[layernorm_forward]\n    G --> H[matmul_forward]\n    H --> I[gelu_forward]\n    I --> J[matmul_forward]\n    J --> K[residual_forward]\n    K --> L[layernorm_forward]\n    L --> M[matmul_forward]\n    M --> N[softmax_forward]\n    N --> O[crossentropy_forward]\n    subgraph \"Transformer Block ×L\"\n        B; C; D; E; F; G; H; I; J; K\n    end\n```\n\nThe forward pass flows top-to-bottom; the backward pass (`gpt2_backward`) reverses this exactly, calling each layer's `_backward` counterpart in reverse order.\n\n## Dimension Conventions\n\nThroughout the code, these symbols are used consistently:\n\n| Symbol | Meaning | Typical GPT-2 124M value |\n|--------|---------|--------------------------|\n| `B` | Batch size | 4 |\n| `T` | Sequence length | 64 (max 1024) |\n| `C` | Channels (hidden dim) | 768 |\n| `V` | Vocab size | 50257 |\n| `Vp` | Padded vocab size (for alignment) | 50304 |\n| `L` | Number of transformer layers | 12 |\n| `NH` | Number of attention heads | 12 |\n| `hs` | Head size (`C / NH`) | 64 |\n\nAll tensors are stored in row-major order. Multi-dimensional indexing follows the pattern `base + dim0 * stride0 + dim1 * stride1 + ...`.\n\n## Layer Operations\n\nEach layer operation is a standalone function pair (`*_forward` / `*_backward`) with no shared state. Gradients are accumulated (+=) into caller-provided buffers, matching the standard autograd convention.\n\n### `encoder_forward` / `encoder_backward`\n\nToken + positional embedding lookup. Adds `wte[token_id]` and `wpe[position]` elementwise.\n\n- **Forward**: `out[b,t,i] = wte[inp[b,t], i] + wpe[t, i]`\n- **Backward**: Accumulates `dout` into `dwte` (indexed by token id) and `dwpe` (indexed by position). Multiple occurrences of the same token in the batch will accumulate gradients.\n\n### `layernorm_forward` / `layernorm_backward`\n\nLayer normalization with learnable scale (`weight`) and shift (`bias`). Caches `mean` and `rstd` (reciprocal standard deviation) per `(b,t)` position for the backward pass.\n\n- **Forward**: Normalizes the C-dimensional vector at each `(b,t)`, then applies `out = norm * weight + bias`. Uses `eps = 1e-5f` for numerical stability.\n- **Backward**: Computes gradients for `dinp`, `dweight`, `dbias` using the standard three-term decomposition (direct gradient, mean correction, variance correction).\n\n### `matmul_forward` / `matmul_backward`\n\nGeneral matrix multiplication: `out[B,T,OC] = inp[B,T,C] @ weight[OC,C] + bias[OC]`. This is the most time-critical operation.\n\n**Forward optimization**: The non-naive `matmul_forward` collapses the `B` and `T` loops into a single strided loop and tiles it with `LOOP_UNROLL = 8`. This keeps 8 output values in registers while iterating over the shared weight row, enabling FMA generation by the compiler. Falls back to `matmul_forward_naive` when `B*T` is not divisible by 8.\n\n**Backward strategy**: Split into two separate parallel regions for better parallelization:\n1. `dinp` computation — parallelized over `(B, T)` with `collapse(2)`\n2. `dweight`/`dbias` computation — parallelized over output channels `OC`\n\n### `attention_forward` / `attention_backward`\n\nMulti-head causal self-attention. The only operation that mixes information across time.\n\n- **Input layout**: `inp` is `(B, T, 3C)` — Q, K, V concatenated along the channel dimension. For head `h`, Q starts at offset `h*hs`, K at `h*hs + C`, V at `h*hs + 2*C`.\n- **Causal mask**: Positions `t2 > t` are explicitly zeroed in the attention matrix (for debuggability), and the forward loops only iterate `t2 <= t`.\n- **Numerical stability**: Max-val subtraction before `expf` in softmax.\n- **Scaling**: Dot products are scaled by `1/sqrt(hs)`.\n\n**Backward** reverses the four forward passes in order: value accumulation → softmax → Q·K matmul. The softmax backward uses the identity `∂L/∂pre_ij = Σ_k att_kj * (δ_jk - att_ik) * datt_kj` without needing the pre-attention values.\n\n### `gelu_forward` / `gelu_backward`\n\nApproximate GELU activation: `0.5 * x * (1 + tanh(sqrt(2/π) * (x + 0.044715 * x³)))`.\n\n**Important**: `gelu_backward` is compiled with `#pragma float_control(precise, on)` and `__attribute__((optimize(\"no-finite-math-only\")))` on GCC. This is necessary because `-Ofast` enables finite-math-only assumptions that break the `tanhf`/`coshf` computations in the GELU derivative (see issue #168).\n\n### `residual_forward` / `residual_backward`\n\nElementwise addition of two streams. Backward copies `dout` into both `dinp1` and `dinp2` (accumulated).\n\n### `softmax_forward` / `crossentropy_forward` / `crossentropy_softmax_backward`\n\n- `softmax_forward`: Computes softmax over the vocab dimension with max-val subtraction. Only processes the first `V` elements; padded positions are explicitly zeroed.\n- `crossentropy_forward`: `-log(probs[target])` per position.\n- `crossentropy_softmax_backward`: Fused backward through both softmax and cross-entropy. The combined gradient simplifies to `dlogits[i] = (probs[i] - indicator[i==target]) * dloss`, which is more numerically stable than separate backward passes.\n\n## Model Structure\n\n### `GPT2Config`\n\nHolds the immutable hyperparameters read from the checkpoint header:\n\n```c\ntypedef struct {\n    int max_seq_len;        // e.g. 1024\n    int vocab_size;         // e.g. 50257\n    int padded_vocab_size;  // e.g. 50304 (aligned for efficiency)\n    int num_layers;         // e.g. 12\n    int num_heads;          // e.g. 12\n    int channels;           // e.g. 768\n} GPT2Config;\n```\n\n### `ParameterTensors`\n\n16 weight tensors stored as a struct of pointers into a single contiguous allocation:\n\n| Field | Shape | Description |\n|-------|-------|-------------|\n| `wte` | `(Vp, C)` | Token embeddings |\n| `wpe` | `(maxT, C)` | Positional embeddings |\n| `ln1w`, `ln1b` | `(L, C)` | Pre-attention layer norm |\n| `qkvw`, `qkvb` | `(L, 3C, C)` / `(L, 3C)` | QKV projection |\n| `attprojw`, `attprojb` | `(L, C, C)` / `(L, C)` | Attention output projection |\n| `ln2w`, `ln2b` | `(L, C)` | Pre-MLP layer norm |\n| `fcw`, `fcb` | `(L, 4C, C)` / `(L, 4C)` | MLP up-projection |\n| `fcprojw`, `fcprojb` | `(L, C, 4C)` / `(L, C)` | MLP down-projection |\n| `lnfw`, `lnfb` | `(C)` | Final layer norm |\n\nLayer-specific weights are accessed by offsetting the base pointer: `params.ln1w + l * C`.\n\n### `ActivationTensors`\n\n23 activation buffers, also pointing into a single contiguous allocation. Per-layer activations are indexed by layer offset (e.g., `acts.ln1 + l * B * T * C`). The `preatt` and `att` tensors at `(L, B, NH, T, T)` dominate memory usage for long sequences.\n\n### `GPT2`\n\nThe top-level struct tying everything together:\n\n```c\ntypedef struct {\n    GPT2Config config;\n    ParameterTensors params;       // model weights\n    size_t param_sizes[16];\n    float* params_memory;          // contiguous backing allocation\n    size_t num_parameters;\n    ParameterTensors grads;        // weight gradients\n    float* grads_memory;\n    float* m_memory, *v_memory;    // AdamW first/second moment estimates\n    ActivationTensors acts;        // forward-pass activations\n    size_t act_sizes[23];\n    float* acts_memory;\n    size_t num_activations;\n    ActivationTensors grads_acts;  // activation gradients\n    float* grads_acts_memory;\n    int batch_size, seq_len;       // current B, T (fixed after first forward)\n    int* inputs, *targets;         // cached input/target token ids\n    float mean_loss;               // -1.0f if no loss computed\n} GPT2;\n```\n\n## Model Lifecycle\n\n### Initialization\n\n```c\nGPT2 model;\ngpt2_build_from_checkpoint(&model, \"gpt2_124M.bin\");\n```\n\nReads the binary checkpoint file (magic `20240326`, version `3`), populates `GPT2Config` from the 7-element header, allocates parameter memory via `malloc_and_point_parameters`, and reads all weights. Activation and gradient memory is **not** allocated yet — it's done lazily on the first forward/backward call.\n\n### Forward Pass\n\n```c\ngpt2_forward(&model, inputs, targets, B, T);\n```\n\n1. Validates all token IDs are in `[0, V)`.\n2. Lazily allocates activation memory on first call. Subsequent calls require the same `B` and `T`.\n3. Caches `inputs` and `targets` (needed by `encoder_backward` and `crossentropy_softmax_backward`).\n4. Executes the full forward pass through all `L` transformer blocks.\n5. If `targets != NULL`, computes cross-entropy loss and sets `model.mean_loss`. Otherwise sets `mean_loss = -1.0f`.\n\nThe logits layer reuses `wte` as the output projection (weight tying): `matmul_forward(acts.logits, acts.lnf, params.wte, NULL, B, T, C, Vp)`.\n\n### Backward Pass\n\n```c\ngpt2_zero_grad(&model);\ngpt2_backward(&model);\n```\n\n1. Requires `mean_loss != -1.0f` (i.e., forward was called with targets).\n2. Lazily allocates gradient memory on first call, then zeros it.\n3. Seeds the backward chain with `dloss = 1/(B*T)` at every position (mean loss gradient).\n4. Fuses softmax + cross-entropy backward via `crossentropy_softmax_backward`.\n5. Propagates gradients in reverse through the final layer norm, then each transformer block from `l = L-1` down to `0`, and finally the encoder.\n\n**Gradient accumulation pattern**: All backward functions use `+=` to accumulate into gradient buffers. This means `gpt2_zero_grad` must be called before each backward pass to avoid stale gradients.\n\n### Parameter Update\n\n```c\ngpt2_update(&model, lr, beta1, beta2, eps, weight_decay, step);\n```\n\nImplements AdamW with decoupled weight decay. The `step` parameter (`t`) is 1-indexed for bias correction. Weight decay is applied as `lr * weight_decay * param` (added to the Adam step, not to the gradient).\n\n### Cleanup\n\n```c\ngpt2_free(&model);\n```\n\nFrees all contiguous memory blocks (`params_memory`, `grads_memory`, `m_memory`, `v_memory`, `acts_memory`, `grads_acts_memory`) plus the cached `inputs` and `targets` arrays. All pointer fields in `ParameterTensors` and `ActivationTensors` become dangling — do not access them after free.\n\n## Checkpoint File Format\n\nThe binary checkpoint has this layout:\n\n| Offset | Size | Content |\n|--------|------|---------|\n| 0 | 256 × `int` | Header: `[magic, version, maxT, V, L, NH, C, Vp, ...]` |\n| 1024 | `num_parameters` × `float` | All model weights, in `ParameterTensors` field order |\n\nMagic number: `20240326`. Version: `3`. If you get a version mismatch, re-run the Python export script (`train_gpt2.py`).\n\n## Training Loop\n\nThe `main()` function demonstrates the complete training workflow:\n\n1. **Model loading**: `gpt2_build_from_checkpoint` from `gpt2_124M.bin`\n2. **Data loading**: Prefers TinyShakespeare if available, falls back to TinyStories. Uses `DataLoader` from `llmc/dataloader.h` with `B=4, T=64`.\n3. **Validation**: Every 10 steps, runs 5 batches through the val loader (forward only) and reports mean loss.\n4. **Generation**: Every 20 steps, does autoregressive sampling for 64 tokens starting from the EOT token. Uses `sample_mult` for categorical sampling from the probability distribution. Note: generation re-runs the full forward pass for each token — this is intentionally simple, not optimized.\n5. **Training step**: `dataloader_next_batch` → `gpt2_forward` → `gpt2_zero_grad` → `gpt2_backward` → `gpt2_update` with `lr=1e-4, beta1=0.9, beta2=0.999, eps=1e-8, weight_decay=0.0`.\n\n## Utilities\n\n### Random Number Generation\n\n- `random_u32`: xorshift* PRNG — fast, no external dependency.\n- `random_f32`: Returns a float in `[0, 1)` by taking the upper 24 bits of `random_u32`.\n- `sample_mult`: Categorical sampling from a probability vector using a coin flip.\n\n### Memory Helpers\n\n- `fill_in_parameter_sizes` / `fill_in_activation_sizes`: Populate size arrays from config.\n- `malloc_and_point_parameters` / `malloc_and_point_activations`: Single `malloc` + pointer arithmetic to set up the struct-of-pointers layout. Returns the base pointer for later `free`.\n\n## External Dependencies\n\n| Header | Functions Used |\n|--------|---------------|\n| `llmc/utils.h` | `fopenCheck`, `freadCheck`, `fcloseCheck`, `fseekCheck`, `mallocCheck` |\n| `llmc/tokenizer.h` | `tokenizer_init`, `tokenizer_decode`, `tokenizer_free`, `safe_printf` |\n| `llmc/dataloader.h` | `dataloader_init`, `dataloader_reset`, `dataloader_next_batch`, `dataloader_free` |\n\nCompile with `-DOMP` and link `-fopenmp` to enable OpenMP parallelization. Without it, the `#ifdef OMP` guard disables `omp.h` and all pragmas degrade to serial execution.\n\n## Testing\n\nWhen the macro `TESTING` is defined, the `main()` function is excluded, allowing `test_gpt2.c` to link against the layer functions and model API directly. All public functions (`gpt2_build_from_checkpoint`, `gpt2_forward`, `gpt2_backward`, `gpt2_update`, `gpt2_zero_grad`, `gpt2_free`, and all individual layer forward/backward functions) are accessible for unit testing.","gpt-2-training-train-gpt2-cu":"# GPT-2 Training — train_gpt2.cu\n\n# GPT-2 Training — `train_gpt2.cu`\n\n## Overview\n\nThis module implements the full training loop for GPT-2 and GPT-3 family transformer models, written in CUDA for maximum GPU performance. It covers model construction, forward/backward passes, AdamW optimization, checkpointing, multi-GPU training (ZeRO-1), validation, inference sampling, and HellaSwag evaluation.\n\nThe design philosophy is **single-allocation, pointer-arithmetic memory layout**: all parameter tensors and all activation tensors are each allocated as one contiguous `cudaMalloc` block, with individual tensor pointers set to offsets within that block. This minimizes allocation overhead and enables efficient device-to-disk I/O.\n\n---\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[main training loop] --> B[gpt2_forward]\n    A --> C[gpt2_backward_and_reduce]\n    A --> D[gpt2_update AdamW]\n    B --> E[encoder_forward]\n    B --> F[layernorm_forward]\n    B --> G[matmul_forward_cublaslt]\n    B --> H[attention_forward / attention_forward_cudnn]\n    B --> I[fused_residual_forward5]\n    C --> J[fused_classifier]\n    C --> K[matmul_backward]\n    C --> L[layernorm_backward]\n    C --> M[attention_backward / attention_backward_cudnn]\n    C --> N[encoder_backward]\n    D --> O[adamw_update]\n    A --> P[gpt2_validate]\n    A --> Q[write_checkpoint / load_state]\n```\n\n---\n\n## Key Data Structures\n\n### `GPT2Config`\n\nHolds the immutable model hyperparameters:\n\n| Field | Description | Example (GPT-2 124M) |\n|---|---|---|\n| `max_seq_len` | Maximum context length | 1024 |\n| `vocab_size` | Actual vocabulary size | 50257 |\n| `padded_vocab_size` | Padded to multiple of 128 for kernel efficiency | 50304 |\n| `num_layers` | Transformer block count (L) | 12 |\n| `num_heads` | Attention head count (NH) | 12 |\n| `channels` | Hidden dimension (C) | 768 |\n\n### `ParameterTensors`\n\nContains 16 individual `floatX*` pointers into a single contiguous GPU allocation. The tensors, in memory order:\n\n| Index | Name | Shape | Notes |\n|---|---|---|---|\n| 0 | `wte` | (Vp, C) | Token embeddings (weight-tied with classifier) |\n| 1 | `wpe` | (maxT, C) | Position embeddings |\n| 2 | `ln1w` | (L, C) | LayerNorm 1 weights |\n| 3 | `ln1b` | (L, C) | LayerNorm 1 biases |\n| 4 | `qkvw` | (L, 3C, C) | QKV projection weights |\n| 5 | `qkvb` | (L, 3C) | QKV projection biases |\n| 6 | `attprojw` | (L, C, C) | Attention output projection weights |\n| 7 | `attprojb` | (L, C) | Attention output projection biases |\n| 8 | `ln2w` | (L, C) | LayerNorm 2 weights |\n| 9 | `ln2b` | (L, C) | LayerNorm 2 biases |\n| 10 | `fcw` | (L, 4C, C) | MLP up-projection weights |\n| 11 | `fcb` | (L, 4C) | MLP up-projection biases |\n| 12 | `fcprojw` | (L, C, 4C) | MLP down-projection weights |\n| 13 | `fcprojb` | (L, C) | MLP down-projection biases |\n| 14 | `lnfw` | (C) | Final LayerNorm weight |\n| 15 | `lnfb` | (C) | Final LayerNorm bias |\n\n### `ActivationTensors`\n\nContains 21 tensors for the forward/backward pass. Sizes depend on batch size B, sequence length T, and the `recompute` setting. Key tensors:\n\n| Name | Shape | Notes |\n|---|---|---|\n| `encoded` | (B, T, C) | Output of token+position embedding |\n| `ln1` | (L, B, T, C) | LayerNorm 1 output (NULL if recompute ≥ 2) |\n| `ln1_mean`, `ln1_rstd` | (L, B, T) | LayerNorm 1 statistics |\n| `atty` | (L, B, T, C) | Attention output values |\n| `att` | (L, B, NH, T, T) or (L, B, NH, T) | Attention weights (smaller with cuDNN) |\n| `residual2` | (L, B, T, C) | Residual after attention + LN2 |\n| `ln2` | (L, B, T, C) | LayerNorm 2 output (NULL if recompute ≥ 2) |\n| `fch` | (L, B, T, 4C) | Pre-GELU MLP activations |\n| `fch_gelu` | (L, B, T, 4C) or (B, T, 4C) | Post-GELU (shared buffer if recompute ≥ 1) |\n| `residual3` | (L, B, T, C) | Residual after MLP |\n| `lnf` | (B, T, C) | Final LayerNorm output |\n| `output` | (B, T, max(3C, NH·T, Vp)) | Multi-purpose scratch: logits / QKV scratch / grad buffer |\n| `scratch_bt4c`, `scratch_btc` | (B, T, 4C) / (B, T, C) | Backward pass scratch buffers |\n\n### `GPT2`\n\nThe top-level struct that owns all state:\n\n- `config` — Model hyperparameters\n- `params` / `grads` — `ParameterTensors` pointing into contiguous GPU memory\n- `acts` — `ActivationTensors` pointing into contiguous GPU memory\n- `m_memory`, `v_memory` — AdamW first/second moment estimates (always FP32)\n- `master_weights` — Optional FP32 master copy of parameters (for mixed-precision training)\n- `inputs`, `targets` — Current batch data on GPU\n- `mean_loss` — Loss after the most recent backward pass\n- `rng_state` — RNG state for stochastic rounding\n- `recompute` — Activation recomputation level (0/1/2)\n- `gelu_fusion` — cuBLASLt GELU fusion level (0/1/2)\n\n---\n\n## Model Construction\n\n### From a checkpoint file: `gpt2_build_from_checkpoint`\n\nReads a 256-int header (magic `20240326`, version 3=FP32 or 5=BF16, then config fields), allocates parameter memory, and loads weights from disk to GPU via `file_to_device`.\n\n### From a descriptor string: `gpt_build_from_descriptor`\n\nSupports three formats:\n\n| Format | Example | Meaning |\n|---|---|---|\n| `dX` (legacy) | `d12` | GPT-2 with X layers |\n| `gpt2:dX` | `gpt2:d48` | GPT-2 with X layers |\n| `gpt3:cX` | `gpt3:c768` | GPT-3 with X channels |\n\nGPT-2 models are keyed by layer depth; GPT-3 models by channel count. Both use `vocab_size=50257` and `padded_vocab_size=50304`. Weights are initialized on CPU following the GPT-2 scheme: weights ~N(0, 0.02), biases = 0, residual projections scaled by `0.02/√(2L)`.\n\n---\n\n## Forward Pass: `gpt2_forward`\n\nExecutes the full transformer forward pass, producing logits in `acts.output`.\n\n**Per-layer operations:**\n\n1. **QKV projection**: `matmul_forward_cublaslt` on `ln1` output → `qkvr` (or scratch buffer)\n2. **Attention**: `attention_forward` (custom CUDA) or `attention_forward_cudnn` → `atty`\n3. **Output projection**: `matmul_forward_cublaslt` on `atty` → scratch\n4. **Residual + LN2 fusion**: `fused_residual_forward5` combines residual add + LayerNorm 2 → `residual2`, `ln2`\n5. **MLP up + GELU**: `matmul_forward_cublaslt` with optional GELU fusion → `fch_gelu`\n6. **MLP down**: `matmul_forward_cublaslt` → scratch\n7. **Residual + next LN1/final LN fusion**: `fused_residual_forward5` → `residual3`, next `ln1` or `lnf`\n\nAfter all layers: final classifier matmul `lnf × wte^T` → logits in `acts.output`.\n\n**Key design choices:**\n- The first LayerNorm is computed outside the loop (not fused with a residual).\n- `acts.output` serves as a scratch buffer during the layer loop (for QKV, attention projection, MLP projection) and only holds the final logits at the end.\n- When `T < model->seq_len`, the attention buffer must be zeroed because the custom attention kernel assumes zero-initialized memory for unused positions.\n\n---\n\n## Backward Pass: `gpt2_backward_and_reduce`\n\nCalled once per micro-step within the gradient accumulation loop. Supports `grad_accum_steps` micro-batches before the optimizer step.\n\n**Gradient accumulation flow:**\n\n1. On `micro_step == 0`: zero `grads_memory` and `acts.losses`\n2. `fused_classifier` computes cross-entropy loss and the initial gradient of logits (scaled by `1/(B·T·grad_accum_steps)`)\n3. Classifier matmul backward → `dlogits` in `scratch_bt4c`, `grads.wte` accumulated\n4. Final LayerNorm backward → `dresidual` in `scratch_btc`\n5. **Per layer (L-1 → 0):**\n   - If `recompute ≥ 1`: recompute GELU from `fch`\n   - MLP down-projection backward → `grads.fcprojw`, `grads.fcprojb`, `dl_bt4c`\n   - If `recompute ≥ 2`: recompute `ln2` from `residual2`\n   - MLP up-projection backward → `grads.fcw`, `grads.fcb`\n   - LN2 backward (accumulates into `dresidual`)\n   - Attention projection backward → `grads.attprojw`, `grads.attprojb`\n   - Attention backward → `dl_bt4c`\n   - If `recompute ≥ 2`: recompute `ln1` from residual\n   - QKV projection backward → `grads.qkvw`, `grads.qkvb`\n   - LN1 backward (accumulates into `dresidual`)\n   - On `last_step`: async multi-GPU gradient reduce for this layer's parameters\n6. `encoder_backward` → `grads.wte`, `grads.wpe`\n7. On `last_step`: reduce loss across GPUs, reduce non-layer gradients (`wte`, `wpe`, `lnfw`, `lnfb`)\n\n**Scratch buffer reuse:** After the final LayerNorm backward, the last `residual3` buffer is no longer needed and is reused as `dl_btc` — a generic scratch for intermediate gradients within each layer's backward pass.\n\n---\n\n## Optimizer Update: `gpt2_update`\n\nImplements AdamW with optional FP32 master weights and stochastic rounding.\n\n**Weight decay policy:** Only 2D weight tensors are decayed (indices 0, 1, 4, 6, 10, 12). All biases and LayerNorm parameters are excluded.\n\n**ZeRO-1 integration:** Each GPU owns a shard of the optimizer states (`m_memory`, `v_memory`, `master_weights`). After updating its local shard, an `ncclAllGather` distributes the updated parameter shards to all ranks.\n\n**Master weights:** When enabled, the optimizer updates FP32 master weights and stochastically rounds back to `floatX`. The RNG state is saved before each update (`rng_state_last_update`) so that weights can be identically re-rounded when resuming from a checkpoint.\n\n---\n\n## Activation Recomputation\n\nControlled by the `recompute` flag, trading memory for compute:\n\n| Value | Strategy | Memory savings |\n|---|---|---|\n| 0 | Store all activations | None |\n| 1 | Recompute GELU during backward; share `fch_gelu` buffer across layers | ~L × B × T × 4C elements |\n| 2 | Additionally recompute both LayerNorms during backward; share `lnf` buffer for all LN outputs | ~2L × B × T × C elements more |\n\nAt `recompute ≥ 2`, `acts.ln1` and `acts.ln2` are allocated as NULL, and `acts.lnf` is used as a single buffer that each LayerNorm forward recomputes into on demand during the backward pass.\n\n---\n\n## Checkpointing and Resume\n\n### Checkpoint format\n\nA checkpoint consists of three files per step:\n\n1. **`model_XXXXX.bin`** (rank 0 only) — Model weights via `gpt2_write_to_checkpoint`\n   - 256-int header: magic `20240326`, version, config fields\n   - Raw parameter bytes (device → disk via `device_to_file`)\n\n2. **`state_XXXXX_YYYYY.bin`** (per rank) — Optimizer + dataloader state via `save_state`\n   - 256-int header: magic `20240527`, version, rank info, step, RNG states, dataloader position\n   - AdamW `m_memory`, `v_memory` (FP32)\n   - Optional `master_weights` (FP32)\n   - Dataloader shuffle state (shard indices, intra-shard indices, RNG)\n\n3. **`DONE_XXXXX`** (rank 0 only) — Empty sentinel file signaling the checkpoint is complete\n\n### Resume logic\n\nWhen `-y 1` is set, `find_max_step` scans the output directory for the highest step with a `DONE_*` file. The model weights are loaded, then `load_state` restores optimizer states. If master weights are present, `gpt2_update` is called with `init_from_master_only=true` to re-round the FP32 masters into the model's `floatX` parameters using the saved RNG state, ensuring bit-exact resumption.\n\n### Checkpoint retention\n\n`-nk N` keeps at most N recent checkpoints on disk. `-nm M` marks every M-th step as a \"major\" checkpoint that is never deleted.\n\n---\n\n## Multi-GPU Training\n\n### Configuration\n\nSet via CLI flags `-pn`, `-pr`, `-pg` and initialized with `multi_gpu_config_init`. Supports NCCL initialization methods: `mpi`, `tcp`, `fs`.\n\n### ZeRO Stage 1\n\nWhen `-z 1` is enabled:\n- Optimizer states (`m`, `v`, `master_weights`) are sharded across ranks\n- Gradients are reduced via `ncclReduceScatter` during backward (each rank only keeps its shard)\n- After `gpt2_update`, updated parameter shards are gathered via `ncclAllGather`\n- `gpt2_calculate_grad_norm` only sums squared norms over local shards, then reduces across GPUs\n\n### Gradient reduction\n\nDuring `gpt2_backward_and_reduce`, per-layer gradient reductions are launched asynchronously on the last micro-step. Non-layer parameters (`wte`, `wpe`, `lnfw`, `lnfb`) are reduced after the loop. This overlaps communication with computation where possible.\n\n---\n\n## Validation and Evaluation\n\n### `gpt2_validate`\n\nRuns a forward pass then computes per-token cross-entropy losses via `fused_classifier` (with `dloss = 1/(B·T)`). Returns the mean loss and populates `model->cpu_losses` with per-token losses for downstream evals (e.g., HellaSwag).\n\n### HellaSwag\n\nWhen `-h 1` is set and the HellaSwag data file exists, `evalloader_next_batch` provides context+completion pairs. Per-token losses from `gpt2_validate` are compared via `evalloader_stat_losses` to determine if the correct completion has the lowest normalized loss.\n\n---\n\n## Inference Sampling\n\nEvery `sample_every` steps, rank 0 generates text autoregressively:\n\n1. Initialize `gen_tokens` with the EOT token\n2. For each position `t = 1..genT-1`:\n   - Call `gpt2_forward` with `B=1` and a T rounded up to a multiple of 256 (for cuDNN algorithm stability)\n   - Copy logits at position `t-1` to CPU\n   - Sample via `sample_softmax` with a random coin\n   - Decode and print the token\n\n**Note:** There is no KV cache, so each generation step recomputes the full sequence. This is intentionally simple — generation is only for qualitative monitoring, not production inference.\n\n---\n\n## Training Loop Flow\n\n```\nfor step = 0..train_num_batches:\n    ├── Validation loss (every val_loss_every steps)\n    ├── HellaSwag eval (every val_loss_every steps, if enabled)\n    ├── Text generation (every sample_every steps, rank 0 only)\n    ├── Checkpoint write (every checkpoint_every steps)\n    ├── TRAINING STEP:\n    │   ├── for micro_step = 0..grad_accum_steps-1:\n    │   │   ├── dataloader_next_batch\n    │   │   ├── gpt2_forward\n    │   │   └── gpt2_backward_and_reduce\n    │   ├── Outlier detection (loss z-score, grad norm z-score)\n    │   ├── Learning rate from scheduler\n    │   ├── Gradient norm calculation + clipping (max norm = 1.0)\n    │   └── gpt2_update (AdamW)\n    └── Timing, MFU estimation, logging\n```\n\n### Gradient accumulation\n\n`total_batch_size` determines how many tokens constitute one optimizer step. The number of micro-steps is:\n\n```\ngrad_accum_steps = total_batch_size / (B × T × num_processes)\n```\n\nGradients and losses accumulate with `+=` across micro-steps, then are averaged by the `1/grad_accum_steps` scaling inside `fused_classifier`.\n\n### Outlier detection\n\n`-sl Z` and `-sg Z` flags enable z-score-based skipping of optimizer updates when the loss or gradient norm is statistically anomalous. The `OutlierDetector` maintains a running mean/variance and computes z-scores online.\n\n### MFU estimation\n\n`gpt2_estimate_mfu` computes Model FLOPs Utilization as:\n\n```\nflops_per_token = 6N + 6·L·C·T\nflops_achieved  = flops_per_token × num_tokens / dt\nmfu             = flops_achieved / peak_flops\n```\n\nWhere `N` is the total parameter count and peak FLOPs are looked up from `get_flops_promised` based on the GPU model and precision mode.\n\n---\n\n## CLI Reference\n\n| Flag | Default | Description |\n|---|---|---|\n| `-i` | `tiny_shakespeare_train.bin` | Training data pattern |\n| `-j` | `tiny_shakespeare_val.bin` | Validation data pattern |\n| `-e` | `gpt2_124M_bf16.bin` | Model file or descriptor |\n| `-o` | NULL | Output log directory |\n| `-b` | 4 | Micro batch size (per GPU) |\n| `-t` | 1024 | Sequence length |\n| `-d` | B×T×num_processes | Total batch size |\n| `-l` | 3e-4 | Learning rate |\n| `-u` | 0 | Warmup iterations |\n| `-q` | 1.0 | Final LR fraction |\n| `-c` | 0.0 | Weight decay |\n| `-k` | cosine | LR scheduler type |\n| `-x` | -1 | Max steps (-1 = 1 epoch) |\n| `-v` | 20 | Val loss evaluation frequency |\n| `-m` | 20 | Max val batches |\n| `-s` | 20 | Sample generation frequency |\n| `-g` | 64 | Generation length |\n| `-r` | 1 | Recompute level (0/1/2) |\n| `-w` | 1 | Keep FP32 master weights |\n| `-z` | 0 | ZeRO stage (0/1) |\n| `-n` | 0 | Checkpoint frequency |\n| `-nk` | 0 | Max checkpoints to keep |\n| `-nm` | 0 | Major checkpoint interval |\n| `-y` | 0 | Resume from checkpoint |\n| `-a` | 0 | Overfit single batch |\n| `-h` | 0 | Run HellaSwag eval |\n| `-f` | 1 | Enable TF32 override |\n| `-ge` | 0 | GELU fusion level |\n| `-sl` | 0.0 | Skip-update loss z-score threshold |\n| `-sg` | 0.0 | Skip-update grad norm z-score threshold |\n| `-pn` | 1 | Number of processes |\n| `-pr` | 0 | Process rank |\n| `-pg` | 8 | GPUs per node |\n\n---\n\n## Memory Layout and Allocation\n\nAll GPU memory is allocated in a few large contiguous blocks:\n\n1. **Parameters** — `malloc_and_point_parameters` allocates one block and sets 16 pointers at offsets\n2. **Gradients** — Same layout as parameters, allocated lazily in `gpt2_allocate_state`\n3. **Activations** — `malloc_and_point_activations` allocates one block (zeroed via `cudaMemset`), sets 21 pointers; sizes depend on `recompute` level\n4. **Optimizer state** — `m_memory`, `v_memory`, `master_weights` allocated via `cudaMallocConditionallyManaged` (falls back to managed memory on OOM)\n\n`gpt2_allocate_state` is called once with the first (B, T) and prints memory diagnostics including estimated maximum batch size.\n\n---\n\n## Precision Modes\n\nControlled at compile time via `PRECISION_MODE`:\n\n| Mode | `floatX` | Checkpoint version | Notes |\n|---|---|---|---|\n| `PRECISION_FP32` | `float` | 3 | TF32 enabled by default on SM80+ |\n| `PRECISION_BF16` | `__nv_bfloat16` | 5 | Master weights in FP32 recommended |\n| `PRECISION_FP16` | `half` | Not supported | Cannot load from checkpoint |\n\nWhen using BF16 with master weights (`-w 1`), the optimizer updates FP32 copies and stochastically rounds back to BF16, matching the approach used in production training of large models.","gpt-2-training-train-gpt2-fp32-cu":"# GPT-2 Training — train_gpt2_fp32.cu\n\n# GPT-2 Training — `train_gpt2_fp32.cu`\n\nA self-contained GPT-2 (124M parameter) trainer written in raw CUDA with custom kernels for every operation. No deep learning framework is used — the forward pass, backward pass, optimizer, and loss computation are all implemented from scratch using CUDA kernels and cuBLAS.\n\n## Architecture Overview\n\n```mermaid\ngraph TD\n    subgraph \"Training Loop\"\n        DL[DataLoader] --> FWD[gpt2_forward]\n        FWD --> ZG[gpt2_zero_grad]\n        ZG --> BWD[gpt2_backward]\n        BWD --> UPD[gpt2_update / AdamW]\n    end\n\n    subgraph \"Forward Pass (per layer)\"\n        ENC[encoder_forward] --> LN1[layernorm_forward]\n        LN1 --> MM1[matmul_forward QKV]\n        MM1 --> ATT[attention_forward]\n        ATT --> MM2[matmul_forward attproj]\n        MM2 --> RES1[residual_forward]\n        RES1 --> LN2[layernorm_forward]\n        LN2 --> MM3[matmul_forward fc]\n        MM3 --> GELU[gelu_forward]\n        GELU --> MM4[matmul_forward fcproj]\n        MM4 --> RES2[residual_forward]\n    end\n\n    subgraph \"Backward Pass (per layer, reverse)\"\n        B_MM4[matmul_backward fcproj] --> B_GELU[gelu_backward]\n        B_GELU --> B_MM3[matmul_backward fc]\n        B_MM3 --> B_LN2[layernorm_backward +=]\n        B_LN2 --> B_MM2[matmul_backward attproj]\n        B_MM2 --> B_ATT[attention_backward]\n        B_ATT --> B_MM1[matmul_backward QKV]\n        B_MM1 --> B_LN1[layernorm_backward +=]\n    end\n\n    FWD --> FC[fused_classifier3]\n    FC --> BWD\n```\n\n## Model Definition\n\n### `GPT2Config`\n\nHolds the hyperparameters read from the checkpoint file header:\n\n| Field | Description | GPT-2 124M Value |\n|---|---|---|\n| `max_seq_len` | Maximum sequence length | 1024 |\n| `vocab_size` | Vocabulary size | 50257 |\n| `padded_vocab_size` | Vocab padded to multiple of 128 | 50304 |\n| `num_layers` | Transformer block count | 12 |\n| `num_heads` | Attention heads per block | 12 |\n| `channels` | Hidden dimension | 768 |\n\n### `GPT2` struct\n\nThe top-level model container. Owns all GPU memory and tracks training state:\n\n- **`params` / `params_memory`** — Model weights as a single contiguous GPU allocation, with `ParameterTensors` pointing into it.\n- **`grads` / `grads_memory`** — Weight gradients, same layout. Allocated lazily on first backward.\n- **`m_memory` / `v_memory`** — AdamW first/second moment buffers. Allocated lazily on first update.\n- **`acts` / `acts_memory`** — Forward-pass activations. Allocated lazily on first forward with the given `(B, T)`.\n- **`grads_acts` / `grads_acts_memory`** — Backward-pass activation gradients. Only 3 tensors (see [Memory Strategy](#memory-strategy)).\n- **`inputs` / `targets`** — GPU-side copies of the current batch's token IDs.\n- **`cpu_losses`** — Pinned host memory for reading per-position losses back to CPU.\n- **`mean_loss`** — Set to `-1.0f` when no loss has been computed; otherwise the mean cross-entropy over `(B, T)`.\n\n### Parameter Layout (`ParameterTensors`)\n\nAll 16 parameter tensors are packed into one allocation. Per-layer weights are indexed by offsetting with `l * <stride>`:\n\n| Index | Tensor | Shape | Per-layer stride |\n|---|---|---|---|\n| 0 | `wte` | `(Vp, C)` | — |\n| 1 | `wpe` | `(maxT, C)` | — |\n| 2 | `ln1w` | `(L, C)` | `C` |\n| 3 | `ln1b` | `(L, C)` | `C` |\n| 4 | `qkvw` | `(L, 3C, C)` | `3*C*C` |\n| 5 | `qkvb` | `(L, 3C)` | `3*C` |\n| 6 | `attprojw` | `(L, C, C)` | `C*C` |\n| 7 | `attprojb` | `(L, C)` | `C` |\n| 8 | `ln2w` | `(L, C)` | `C` |\n| 9 | `ln2b` | `(L, C)` | `C` |\n| 10 | `fcw` | `(L, 4C, C)` | `4*C*C` |\n| 11 | `fcb` | `(L, 4C)` | `4*C` |\n| 12 | `fcprojw` | `(L, C, 4C)` | `C*4*C` |\n| 13 | `fcprojb` | `(L, C)` | `C` |\n| 14 | `lnfw` | `(C,)` | — |\n| 15 | `lnfb` | `(C,)` | — |\n\n### Activation Layout (`ActivationTensors`)\n\n21 tensors stored for the forward pass. Layer-indexed activations use `l * B*T*C` (or similar) offsets. The `output` tensor serves triple duty:\n\n1. **During transformer blocks** — scratch buffer for QKV input `(B, T, 3C)`, pre-attention scores `(B, NH, T, T)`, and attention×value output `(B, NH, T, HS)`.\n2. **After final layernorm** — logits `(B, T, Vp)`.\n3. **After `fused_classifier3`** — logit *gradients* (overwritten in-place).\n\nIts allocation size is `B * T * max(3C, NH*T, Vp)` to accommodate all three uses.\n\n## Memory Strategy\n\nThe backward pass is designed to minimize GPU memory:\n\n- **Forward activations** are stored per-layer (e.g., `ln1` has `L * B * T * C` entries).\n- **Backward activation gradients** reuse a single set of 3 buffers across all layers:\n\n| Buffer | Shape | Purpose |\n|---|---|---|\n| `bt4c` | `(B, T, 4C)` | Gradient workspace for 4C-wide tensors (fch, QKV) |\n| `preatt` | `(B, NH, T, T)` | Pre-softmax attention gradients |\n| `residual3` | `(B, T, C)` | Residual stream gradient (carried across layers) |\n\nAdditionally, the backward pass reuses forward activation memory that is no longer needed:\n- `acts.lnf` is reused as a `B×T×C` gradient buffer (`dl_btc`).\n- `l_atty` and `l_fch` are reused as scratch buffers inside the attention backward.\n\n## Gradient Accumulation Semantics\n\nA critical design choice noted in the source:\n\n- **Parameter gradients** use `+=` (accumulate), enabling gradient accumulation across multiple micro-batches before an optimizer step.\n- **Activation gradients** use `=` (overwrite), which is faster because it avoids a read-before-write.\n- **Exception**: The residual stream gradient must accumulate contributions from both the attention and MLP sub-blocks. This is handled by `layernorm_backward`, which does `+=` into `dresidual`, correctly merging the two gradient paths.\n\n## Lifecycle\n\n### `gpt2_build_from_checkpoint`\n\nReads a binary checkpoint file (magic `20240326`, version `3`). The header contains 5 ints of config, followed by `num_parameters` floats of weights. Allocates GPU memory for parameters only; all other buffers are allocated lazily.\n\n### `gpt2_forward`\n\n```\ngpt2_forward(model, inputs, targets, B, T)\n```\n\nRuns the full forward pass. On first call, allocates activation memory for the given `(B, T)` and pins that shape — subsequent calls must use the same dimensions.\n\n**Forward pass per layer:**\n1. `layernorm_forward` — LayerNorm on residual stream\n2. `matmul_forward` — Project to Q, K, V (output channels = 3C)\n3. `attention_forward` — Multi-head self-attention (permute → batched GEMM → softmax → batched GEMM → unpermute)\n4. `matmul_forward` — Attention output projection\n5. `residual_forward` — Add attention output to residual\n6. `layernorm_forward` — Second LayerNorm\n7. `matmul_forward` — FC up-projection (C → 4C)\n8. `gelu_forward` — GELU activation\n9. `matmul_forward` — FC down-projection (4C → C)\n10. `residual_forward` — Add MLP output to residual\n\nAfter all layers: final LayerNorm → logits matmul → `fused_classifier3` (if targets provided).\n\n### `gpt2_backward`\n\nMust be called after a forward pass with targets (enforced by `mean_loss != -1.0f`). On first call, allocates gradient and AdamW buffers.\n\n**Backward pass per layer (reverse order):**\n1. `matmul_backward` — fcproj\n2. `gelu_backward`\n3. `matmul_backward` — fc\n4. `layernorm_backward` — **`+=` into `dresidual`** (merges MLP gradient)\n5. `matmul_backward` — attproj\n6. `attention_backward` — unpermute_backward → batched GEMMs → softmax_backward → batched GEMMs → permute_backward\n7. `matmul_backward` — QKV\n8. `layernorm_backward` — **`+=` into `dresidual`** (merges attention gradient)\n\nAfter all layers: `matmul_backward` for final logits → `layernorm_backward` for final LN → `encoder_backward` for embedding gradients.\n\n### `gpt2_update`\n\nRuns the AdamW optimizer via a single kernel (`adamw_kernel2`). Uses an optimized `lerp` for the momentum and RMSprop updates:\n\n```\nm = lerp(grad, m, beta1)     // equivalent to m = beta1 * m + (1 - beta1) * grad\nv = lerp(grad*grad, v, beta2) // equivalent to v = beta2 * v + (1 - beta2) * grad^2\nparam -= lr * (m_hat / (sqrt(v_hat) + eps) + weight_decay * param)\n```\n\n### `gpt2_zero_grad`\n\nMemsets both `grads_memory` and `grads_acts_memory` to zero. Must be called before `gpt2_backward` to avoid accumulating stale gradients.\n\n### `gpt2_free`\n\nReleases all GPU allocations and pinned host memory.\n\n## CUDA Kernels\n\n### Encoder\n\n| Kernel | Direction | Notes |\n|---|---|---|\n| `encoder_forward_kernel3` | Forward | Uses `float4` vectorized loads for 128-bit LDG/STG. Adds token + position embeddings. |\n| `encoder_backward_kernel` | Backward | Uses `atomicAdd` into `dwte` and `dwpe` because multiple token positions map to the same embedding row. |\n\n### LayerNorm\n\n| Kernel | Direction | Notes |\n|---|---|---|\n| `layernorm_forward_kernel3` | Forward | One warp per row. Uses `cg::reduce` for sum/variance. Streaming cache hints (`__ldcs`/`__stcs`) for input/output; weight/bias stay in cache. |\n| `layernorm_backward_kernel2` | Backward | Shared memory for per-row `dbias`/`dweight` partial sums, then `atomicAdd` to global. Does `+=` into `dinp` for residual accumulation. |\n\n### Attention\n\n| Kernel | Direction | Notes |\n|---|---|---|\n| `permute_kernel` | Forward | Rearranges `(B, N, 3, NH, d)` → three `(B, NH, N, d)` tensors. |\n| `unpermute_kernel` | Forward | Rearranges `(B, NH, N, d)` → `(B, N, NH, d)`. |\n| `softmax_forward_kernel5` | Forward | Online softmax over the lower-triangular (autoregressive) mask. Fuses `1/√d` scaling. Iterates blocks in reverse order to keep upper-left cache lines warm for the subsequent matmul. |\n| `permute_kernel_backward` | Backward | Inverse of `permute_kernel`. |\n| `unpermute_kernel_backward` | Backward | Inverse of `unpermute_kernel`. |\n| `softmax_autoregressive_backward_kernel` | Backward | Computes `dpreatt = scale * att * (datt - sum(att * datt))`. Processes 4 time steps per block for cache reuse. |\n\nThe batched matrix multiplications (`QK^T`, `att·V`, and their backward counterparts) use `cublasSgemmStridedBatched`.\n\n### Matmul\n\n| Kernel | Direction | Notes |\n|---|---|---|\n| `matmul_forward_kernel4` | Forward | Tiled shared-memory kernel: 128×128 blocks, 8×8 per thread. Uses `float4` for bias broadcast and result stores. `__launch_bounds__(256, 2)` ensures 2 blocks per SM. |\n| `matmul_backward_bias_kernel4` | Backward | Column-parallel reduction for `dbias = dout.sum(dim=(0,1))`. One block per 32 columns; shared memory for cross-warp reduction. |\n\nWeight/input backward matmuls use `cublasSgemm`.\n\n### GELU\n\n| Kernel | Direction | Notes |\n|---|---|---|\n| `gelu_forward_kernel` | Forward | `0.5 * x * (1 + tanh(√(2/π) * (x + 0.044715 * x³)))` |\n| `gelu_backward_kernel` | Backward | Analytical derivative of the GELU approximation. |\n\n### Residual\n\n| Kernel | Direction | Notes |\n|---|---|---|\n| `residual_forward_kernel` | Forward | Elementwise `out = inp1 + inp2` with streaming loads. |\n\n### Fused Classifier\n\n| Kernel | Direction | Notes |\n|---|---|---|\n| `fused_classifier_kernel3` | Forward + partial backward | Computes softmax, cross-entropy loss, and logit gradients in one kernel. Replaces logits in-place with `(prob - indicator) * dloss`. Uses block-wide online softmax via `prepare_softmax_blockwide_nofloat4`. |\n\n### AdamW\n\n| Kernel | Notes |\n|---|---|\n| `adamw_kernel2` | Single-pass per-parameter update. Uses `lerp(a, b, t) = fma(t, b, fma(-t, a, a))` for 2-op linear interpolation instead of the naive 3-op form. |\n\n## cuBLAS Configuration\n\n- On Ampere+ GPUs (compute capability ≥ 8.0), TF32 tensor operations are enabled for matmuls (`CUBLAS_TF32_TENSOR_OP_MATH`), equivalent to PyTorch's `torch.set_float32_matmul_precision('high')`.\n- On older GPUs, standard FP32 compute is used.\n\n## Training Loop\n\nThe `main` function implements a single-epoch training loop:\n\n1. **Validation** — Every `val_loss_every` steps, run forward passes on the validation set and report mean loss.\n2. **Sampling** — Every `sample_every` steps, autoregressively generate `genT` tokens. Note: inference is naive (full `(B, T)` forward per token, only position `t-1` is used).\n3. **Training step** — `dataloader_next_batch` → `gpt2_forward` → `gpt2_zero_grad` → `gpt2_backward` → `gpt2_update`. Reports per-step loss, wall-clock time, and tokens/second.\n\n### CLI Arguments\n\n| Flag | Default | Description |\n|---|---|---|\n| `-i` | `dev/data/tinyshakespeare/tiny_shakespeare_train.bin` | Training data pattern |\n| `-j` | `dev/data/tinyshakespeare/tiny_shakespeare_val.bin` | Validation data pattern |\n| `-o` | `NULL` | Output log file path |\n| `-b` | `4` | Batch size |\n| `-t` | `1024` | Sequence length |\n| `-l` | `3e-4` | Learning rate |\n| `-v` | `20` | Validate every N steps |\n| `-m` | `20` | Max validation batches |\n| `-s` | `20` | Sample every N steps |\n| `-g` | `64` | Number of generation steps |\n\n## Dependencies\n\n| Header | Provides |\n|---|---|\n| `llmc/utils.h` | `fopenCheck`, `freadCheck`, `fcloseCheck`, `fseekCheck`, `mallocCheck` |\n| `llmc/tokenizer.h` | `tokenizer_init`, `tokenizer_decode`, `tokenizer_free` |\n| `llmc/dataloader.h` | `DataLoader` init/reset/next_batch/free |\n\n## Checkpoint File Format\n\nBinary file with a 256-int header:\n- `[0]` = magic number `20240326`\n- `[1]` = version `3` (includes padded vocab size)\n- `[2]` = `max_seq_len`\n- `[3]` = `vocab_size`\n- `[4]` = `num_layers`\n- `[5]` = `num_heads`\n- `[6]` = `channels`\n- `[7]` = `padded_vocab_size`\n\nFollowed by `num_parameters` float32 values in the order defined by `fill_in_parameter_sizes`.\n\n## Testing\n\nWhen compiled with `TESTING` defined, the `main` function is excluded so that test files (e.g., `test_gpt2.cu`) can link against the kernels and model functions directly.","gpt-2-training-train-gpt2-py":"# GPT-2 Training — train_gpt2.py\n\n# GPT-2 Training — train_gpt2.py\n\n## Purpose\n\nThis module implements a from-scratch GPT-2 training and inference pipeline in PyTorch. It serves two roles:\n\n1. **Train or fine-tune GPT-2 models** with support for single-GPU and multi-GPU distributed training, mixed precision, flash attention, `torch.compile`, and ZeRO optimization.\n2. **Export model weights, gradients, and debug state to binary files** that can be loaded by a companion C inference engine for cross-language verification.\n\nThe implementation follows the original OpenAI GPT-2 architecture and weight layout, with weight-loading compatibility against HuggingFace `transformers` checkpoints.\n\n---\n\n## Model Architecture\n\n```mermaid\ngraph TD\n    GPT --> wte[\"wte<br/>nn.Embedding (V×C)\"]\n    GPT --> wpe[\"wpe<br/>nn.Embedding (T×C)\"]\n    GPT --> h[\"h<br/>nn.ModuleList of Block\"]\n    GPT --> ln_f[\"ln_f<br/>nn.LayerNorm (C)\"]\n    GPT --> lm_head[\"lm_head<br/>nn.Linear (C→V)<br/>weight-tied with wte\"]\n    Block --> ln_1[\"ln_1<br/>LayerNorm\"]\n    Block --> attn[\"attn<br/>CausalSelfAttention\"]\n    Block --> ln_2[\"ln_2<br/>LayerNorm\"]\n    Block --> mlp[\"mlp<br/>MLP\"]\n    CausalSelfAttention --> c_attn[\"c_attn<br/>Linear (C→3C)\"]\n    CausalSelfAttention --> c_proj[\"c_proj<br/>Linear (C→C)\"]\n    MLP --> c_fc[\"c_fc<br/>Linear (C→4C)\"]\n    MLP --> gelu[\"gelu<br/>NewGELU\"]\n    MLP --> c_proj_mlp[\"c_proj<br/>Linear (4C→C)\"]\n```\n\n### GPTConfig\n\n```python\n@dataclass\nclass GPTConfig:\n    block_size: int = 1024    # maximum sequence length\n    vocab_size: int = 50257   # GPT-2 BPE vocabulary size\n    n_layer: int = 12         # number of transformer blocks\n    n_head: int = 12          # number of attention heads\n    n_embd: int = 768         # embedding / hidden dimension\n```\n\nThe defaults match the 124M-parameter `gpt2` variant. Four size presets are available:\n\n| Preset | `n_layer` | `n_head` | `n_embd` | ~Params |\n|--------|-----------|----------|----------|---------|\n| `gpt2` / `d12` | 12 | 12 | 768 | 124M |\n| `gpt2-medium` / `d24` | 24 | 16 | 1024 | 350M |\n| `gpt2-large` / `d36` | 36 | 20 | 1280 | 774M |\n| `gpt2-xl` / `d48` | 48 | 25 | 1600 | 1558M |\n\nThe `d*` variants initialize from scratch with random weights; the `gpt2*` variants load pretrained weights from HuggingFace via `GPT.from_pretrained()`.\n\n### GPT\n\nThe top-level `nn.Module` that assembles the full model:\n\n- **Token + position embeddings** are summed: `tok_emb + pos_emb`.\n- **Transformer blocks** are applied sequentially via `nn.ModuleList`.\n- **Final LayerNorm** (`ln_f`) is applied after all blocks.\n- **Weight tying**: `lm_head.weight` is the same tensor as `transformer.wte.weight`, following the GPT-2 paper.\n- **Initialization**: Uses a deterministic `torch.Generator` (seed 42). Residual projections (`c_proj` in both attention and MLP) receive scaled initialization with `std = 0.02 / sqrt(2 * n_layer)`, per the GPT-2 paper. The tied `lm_head` is skipped during init (marked with `LLMC_SKIP_INIT`).\n\n**Forward signature:**\n\n```python\ndef forward(self, idx, targets=None, return_logits=True) -> (logits, loss)\n```\n\n- When `targets` is provided, cross-entropy loss is computed over the full sequence and all logits are returned.\n- When `targets` is `None` (inference mode), only the last-position logits are computed as an optimization: `self.lm_head(x[:, [-1], :])`.\n- Set `return_logits=False` to skip returning logits (saves memory when only the loss is needed).\n\n### CausalSelfAttention\n\n- Single fused `c_attn` linear projects to Q, K, V in one batch (`3 * n_embd` output), then splits.\n- Heads are reshaped to `(B, n_head, T, head_dim)` for parallel computation.\n- **Flash attention** (`F.scaled_dot_product_attention` with `is_causal=True`) is toggled by the global `FLASH` flag (set from `--flash` CLI arg).\n- **Manual attention** materializes the full `(T, T)` attention matrix, applies the causal mask from the registered `bias` buffer, then softmax and multiply by V.\n- Output projection `c_proj` is marked with `LLMC_RESIDUAL_SCALE_FLAG` for scaled init.\n\n### MLP\n\nStandard GPT-2 MLP: `c_fc` (4× expansion) → `NewGELU` → `c_proj` (back to `n_embd`). The `c_proj` layer uses scaled initialization.\n\n### NewGELU\n\nThe exact GELU approximation used by OpenAI:\n\n```\n0.5 * x * (1 + tanh(sqrt(2/π) * (x + 0.044715 * x³)))\n```\n\nThis differs from `torch.nn.GELU` (which uses the exact erf-based formula or the `tanh` approximation with different coefficients).\n\n### Block\n\nPre-norm transformer block:\n\n```python\nx = x + self.attn(self.ln_1(x))\nx = x + self.mlp(self.ln_2(x))\n```\n\n---\n\n## Data Loading\n\n### Binary Data Format\n\nTraining data is stored in `.bin` files with a custom format:\n\n| Offset | Size | Content |\n|--------|------|---------|\n| 0 | 256 × int32 | Header (1024 bytes) |\n| 0 | int32 | Magic number: `20240520` |\n| 4 | int32 | Version: `1` |\n| 8 | int32 | Number of tokens (`ntok`) |\n| 12–1023 | — | Unused padding |\n| 1024 | ntok × uint16 | Token IDs |\n\nEach shard must contain at least `num_processes * B * T + 1` tokens to guarantee every rank gets a full batch.\n\n### DistributedDataLoader\n\nA lightweight data loader that partitions shards across ranks without overlap:\n\n- **Construction**: `DistributedDataLoader(filename_pattern, B, T, process_rank, num_processes)` — globs all matching `.bin` files and validates each shard header.\n- **`next_batch()`**: Returns `(x, y)` where `x` is tokens `[0..T-1]` and `y` is tokens `[1..T]` for next-token prediction. Each rank reads from its own offset (`process_rank * B * T`) and strides by `num_processes * B * T` between batches.\n- **`advance()`**: Moves to the next shard (wraps around cyclically).\n- **`reset()`**: Returns to shard 0, position `process_rank * B * T`. Skips re-loading shard 0 if already in memory.\n\n---\n\n## Training Loop\n\n### Gradient Accumulation\n\nThe effective batch size is controlled by `--total_batch_size` (in tokens). The number of micro-steps is computed as:\n\n```\ngrad_accum_steps = total_batch_size // (B * T * ddp_world_size)\n```\n\nLoss is divided by `grad_accum_steps` so that the accumulated gradient corresponds to a mean rather than a sum.\n\n### DDP Gradient Synchronization\n\nWhen running under DDP, gradient synchronization across ranks is deferred to the last micro-step only:\n\n```python\nmodel.require_backward_grad_sync = (micro_step == grad_accum_steps - 1)\n```\n\nThis avoids redundant all-reduce operations during accumulation.\n\n### Learning Rate Schedule\n\nCosine decay with linear warmup, implemented in `get_lr(it)`:\n\n1. **Warmup** (`it < warmup_iters`): linear ramp from 0 to `learning_rate`.\n2. **Cosine decay** (`warmup_iters ≤ it ≤ num_iterations`): decays from `learning_rate` down to `min_lr = learning_rate * learning_rate_decay_frac`.\n3. **Post-training** (`it > num_iterations`): clamps to `min_lr`.\n\n### Optimizer Configuration\n\n`GPT.configure_optimizers()` creates an AdamW optimizer with two parameter groups:\n\n| Group | Parameters | Weight Decay |\n|-------|-----------|--------------|\n| Decay | All 2D tensors (weight matrices, embeddings) | `weight_decay` |\n| No decay | All <2D tensors (biases, LayerNorm params) | 0.0 |\n\nWhen `zero_stage == 1`, the optimizer wraps into `ZeroRedundancyOptimizer` to shard optimizer state across ranks. Fused AdamW is used automatically when available on CUDA.\n\n### Mixed Precision\n\nAn `torch.amp.autocast` context manager wraps the forward pass when `--dtype` is `float16` or `bfloat16` and the device is CUDA. The `--tensorcores` flag enables TF32 matmul precision via `torch.set_float32_matmul_precision('high')`.\n\n---\n\n## Python → C Bridge\n\nThe module exports three types of binary files for consumption by a C inference/testing engine.\n\n### Model Checkpoint: `write_model()`\n\nWrites a standalone binary containing the full model configuration and parameters.\n\n**Header** (256 int32s, 1024 bytes):\n\n| Index | Value |\n|-------|-------|\n| 0 | Magic: `20240326` |\n| 1 | Version: `3` (fp32) or `5` (bf16) |\n| 2 | `block_size` |\n| 3 | `vocab_size` (50257) |\n| 4 | `n_layer` |\n| 5 | `n_head` |\n| 6 | `n_embd` |\n| 7 | Padded vocab size (e.g., 50304) |\n\n**Vocab padding**: The raw vocab size of 50257 is padded up to the nearest multiple of 128 (default 50304) via `pad_vocab()`. This is a no-op algorithmically — the extra rows are zero-filled — but enables efficient GPU matrix operations in the C engine. Both `wte.weight` and its gradient are padded consistently.\n\n**Parameter layout** (written sequentially after header):\n\n```\nwte.weight (Vp, C)\nwpe.weight (T, C)\nfor i in range(L):\n    h{i}.ln_1.weight (C)\nfor i in range(L):\n    h{i}.ln_1.bias (C)\nfor i in range(L):\n    h{i}.attn.c_attn.weight (3C, C)\nfor i in range(L):\n    h{i}.attn.c_attn.bias (3C)\nfor i in range(L):\n    h{i}.attn.c_proj.weight (C, C)\nfor i in range(L):\n    h{i}.attn.c_proj.bias (C)\nfor i in range(L):\n    h{i}.ln_2.weight (C)\nfor i in range(L):\n    h{i}.ln_2.bias (C)\nfor i in range(L):\n    h{i}.mlp.c_fc.weight (4C, C)\nfor i in range(L):\n    h{i}.mlp.c_fc.bias (4C)\nfor i in range(L):\n    h{i}.mlp.c_proj.weight (C, 4C)\nfor i in range(L):\n    h{i}.mlp.c_proj.bias (C)\nln_f.weight (C)\nln_f.bias (C)\n```\n\nNote: `lm_head.weight` is **not** written separately because it is weight-tied with `wte.weight`.\n\n### Debug State: `write_state()`\n\nWrites input, targets, logits, loss, and all parameter gradients for numerical verification against the C implementation. Always stored in float32 for maximum precision. The header uses magic `20240327` and version `2`. Gradients are vocab-padded identically to the model checkpoint.\n\n### Tokenizer: `write_tokenizer()`\n\nWrites the GPT-2 BPE tokenizer to binary. Each token is stored as a 1-byte length prefix followed by the raw UTF-8 bytes. Header uses magic `20240328`, version `2` (includes EOT token ID in `header[3]`).\n\n---\n\n## Pretrained Weight Loading\n\n`GPT.from_pretrained(model_type)` loads weights from HuggingFace's `GPT2LMHeadModel`. Key details:\n\n- HuggingFace uses `Conv1D` layers (transposed weight layout) for attention and MLP projections. The four transposed weight keys are: `attn.c_attn.weight`, `attn.c_proj.weight`, `mlp.c_fc.weight`, `mlp.c_proj.weight`. These are transposed (`.t()`) during copy.\n- The causal attention mask buffer (`.attn.bias` / `.attn.masked_bias`) is excluded from the copy — it's re-created by the `CausalSelfAttention` constructor.\n- An assertion verifies that the key counts match between the two state dicts.\n\n---\n\n## Text Generation\n\n`GPT.generate()` performs autoregressive sampling:\n\n```python\nmodel.eval()\noutput = model.generate(idx, max_new_tokens, temperature=1.0, top_k=None)\n```\n\n- Sequences longer than `block_size` are truncated from the left.\n- Temperature scales logits before softmax.\n- Top-k filtering zeros out logits below the k-th highest value.\n- Sampling uses `torch.multinomial` on the resulting probability distribution.\n\n---\n\n## CLI Reference\n\n| Argument | Default | Description |\n|----------|---------|-------------|\n| `--input_bin` | `dev/data/tinyshakespeare/tiny_shakespeare_val.bin` | Training data `.bin` file pattern |\n| `--input_val_bin` | `\"\"` | Validation data `.bin` file pattern |\n| `--output_dir` | `\"\"` | Directory for logs and checkpoints |\n| `--model` | `gpt2` | Model variant: `gpt2`, `gpt2-medium`, `gpt2-large`, `gpt2-xl`, `d12`, `d24`, `d36`, `d48` |\n| `--batch_size` | `4` | Micro-batch size (B) |\n| `--sequence_length` | `64` | Sequence length (T) |\n| `--total_batch_size` | `256` | Desired total batch size in tokens |\n| `--num_iterations` | `10` | Number of training iterations |\n| `--inference_only` | `0` | Skip backward pass and optimizer step |\n| `--learning_rate` | `1e-4` | Peak learning rate |\n| `--warmup_iters` | `0` | Linear warmup iterations |\n| `--learning_rate_decay_frac` | `1.0` | Fraction of LR at end of decay (1.0 = no decay) |\n| `--weight_decay` | `0.0` | AdamW weight decay |\n| `--grad_clip` | `1.0` | Gradient norm clipping threshold |\n| `--val_loss_every` | `0` | Evaluate val loss every N steps (0 = disabled) |\n| `--val_max_steps` | `20` | Number of val batches to average |\n| `--sample_every` | `0` | Generate text every N steps (0 = disabled) |\n| `--overfit_single_batch` | `1` | Reset data loader each step to overfit one batch |\n| `--tensorcores` | `0` | Enable TF32 matmul precision on CUDA |\n| `--device` | `\"\"` | Override auto-detected device |\n| `--compile` | `0` | Apply `torch.compile` to the model |\n| `--flash` | `0` | Use flash attention (`F.scaled_dot_product_attention`) |\n| `--dtype` | `float32` | Precision: `float32`, `float16`, `bfloat16` |\n| `--zero_stage` | `0` | ZeRO optimizer stage (0 or 1) |\n| `--write_tensors` | `1` | Write model weights and debug state to disk |\n\n---\n\n## Example Launches\n\n**Single-GPU benchmark (bf16, compiled, flash attention):**\n\n```bash\npython train_gpt2.py --write_tensors=0 --num_iterations=50 \\\n    --sequence_length=1024 --compile=1 --tensorcores=1 --dtype=bfloat16 --flash=1\n```\n\n**4-GPU distributed benchmark:**\n\n```bash\ntorchrun --standalone --nproc_per_node=4 train_gpt2.py \\\n    --write_tensors=0 --num_iterations=50 --sequence_length=1024 \\\n    --compile=1 --tensorcores=1 --dtype=bfloat16\n```\n\n**Overfit a single batch (default behavior):**\n\n```bash\npython train_gpt2.py --model=gpt2 --batch_size=4 --sequence_length=64 \\\n    --num_iterations=10\n```\n\nThis writes `gpt2_124M.bin`, `gpt2_124M_bf16.bin`, `gpt2_124M_debug_state.bin`, and `gpt2_tokenizer.bin` to the working directory on the first iteration.\n\n---\n\n## Key Design Decisions\n\n- **Weight tying** between `wte` and `lm_head` is enforced at construction time by assigning the same `nn.Parameter` object. The `LLMC_SKIP_INIT` flag prevents double-initialization.\n- **Residual scaling**: Projections at the end of each residual path (`c_proj` in attention and MLP) use `std = 0.02 / sqrt(2 * n_layer)` to counteract variance growth with depth, as specified in the GPT-2 paper.\n- **Inference optimization**: When `targets` is `None`, only the last token position is passed through `lm_head`, avoiding unnecessary computation for all other positions.\n- **DDP gradient sync control**: `model.require_backward_grad_sync` is toggled per micro-step rather than using `model.no_sync()` as a context manager, keeping the accumulation loop cleaner.\n- **Vocab padding** is applied only at export time (in `write_model` / `write_state`), not during training, so the model itself always uses the true vocab size of 50257.","gpt-2-training":"# GPT-2 Training\n\n# GPT-2 Training\n\nA from-scratch GPT-2 (124M–1558M) training implementation in C, CUDA, and PyTorch — with no framework dependencies in the C/CUDA paths. The project reproduces GPT-2 and GPT-3 family pretraining, and the mainline CUDA implementation currently outperforms PyTorch Nightly by ~7%.\n\n## Architecture\n\nThe module is organized as a layered system: a PyTorch reference generates ground-truth artifacts, C and CUDA implementations provide the production training path, and test harnesses validate numerical equivalence across all layers.\n\n```mermaid\ngraph LR\n    subgraph \"Reference & Artifacts\"\n        PY[train_gpt2.py<br/>PyTorch Reference] -->|generates .bin| BIN[Checkpoint &<br/>Debug State Files]\n    end\n\n    subgraph \"Training Implementations\"\n        C[train_gpt2.c<br/>CPU Reference]\n        CU[train_gpt2.cu<br/>CUDA Mainline]\n        FP32[train_gpt2_fp32.cu<br/>CUDA FP32]\n    end\n\n    subgraph \"Correctness Validation\"\n        TC[test_gpt2.c]\n        TCU[test_gpt2.cu]\n        TFP32[test_gpt2_fp32.cu]\n    end\n\n    BIN --> TC & TCU & TFP32\n    C & CU & FP32 --> TC & TCU & TFP32\n```\n\n## Sub-Modules\n\n### Training Implementations\n\n| Module | Role |\n|--------|------|\n| [train_gpt2.py](train_gpt2.py.md) | PyTorch reference. Trains/fine-tunes GPT-2 with distributed training, mixed precision, flash attention, and ZeRO. **Exports `.bin` checkpoint and debug-state files** that the C/CUDA test harnesses load for cross-language verification. |\n| [train_gpt2.c](train_gpt2.c.md) | Clean CPU-o
