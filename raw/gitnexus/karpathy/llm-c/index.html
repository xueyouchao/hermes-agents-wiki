var PAGES = {"core-utilities":"# Core Utilities\n\n# Core Utilities\n\nThe `llmc/` directory contains the shared utility layer for the training framework. These headers are self-contained (header-only C) and provide everything from safe I/O wrappers to a PyTorch-compatible RNG, data loading, learning rate scheduling, and GPU monitoring. Every other module in the codebase — the model, the training loop, the checkpoint system — depends on these headers.\n\n## Architecture\n\n```mermaid\ngraph TD\n    utils[\"utils.h<br/>I/O & alloc checks\"]\n    rand[\"rand.h<br/>Mersenne Twister\"]\n    logger[\"logger.h<br/>Training logger\"]\n    mfu[\"mfu.h<br/>GPU perf & NVML\"]\n    outlier[\"outlier_detector.h<br/>Z-score detector\"]\n    sampler[\"sampler.h<br/>Inference sampler\"]\n    sched[\"schedulers.h<br/>LR schedules\"]\n    tok[\"tokenizer.h<br/>GPT-2 decode\"]\n    dl[\"dataloader.h<br/>Train & eval loaders\"]\n\n    dl --> utils\n    dl --> rand\n    logger --> utils\n    tok --> utils\n    mfu --> utils\n\n    rand --> randint32\n    randint32 --> next_state\n    randint32 --> manual_seed\n```\n\nThe dependency graph is intentionally flat: most headers depend only on `utils.h` for checked I/O, and `dataloader.h` additionally depends on `rand.h` for shuffling. No circular dependencies exist.\n\n---\n\n## Error-Checked I/O and Allocation (`utils.h`)\n\n### Design Pattern\n\nEvery risky C standard library call is wrapped by an `extern inline` function that validates the return value and a macro that injects `__FILE__` and `__LINE__`. On failure, the wrapper prints structured diagnostics to stderr and calls `exit(EXIT_FAILURE)`. This eliminates silent failures and makes bugs trivially locatable.\n\n**Always use the macro form** — it captures the call site automatically:\n\n| Macro | Wraps | Failure mode detected |\n|---|---|---|\n| `fopenCheck(path, mode)` | `fopen` | Returns `NULL` |\n| `freadCheck(ptr, size, nmemb, stream)` | `fread` | Short read (EOF, error, or partial) |\n| `fwriteCheck(ptr, size, nmemb, stream)` | `fwrite` | Short write |\n| `fcloseCheck(fp)` | `fclose` | Returns non-zero |\n| `fseekCheck(fp, off, whence)` | `fseek` | Returns non-zero |\n| `mallocCheck(size)` | `malloc` | Returns `NULL` |\n| `scloseCheck(sockfd)` | `close` | Returns non-zero |\n| `closesocketCheck(sockfd)` | `closesocket` (Windows only) | Returns non-zero |\n| `tokenCheck(tokens, count, vocab)` | Manual loop | Token outside `[0, vocab_size)` |\n\n`fopenCheck` includes two hints in its error output: one about the dataset directory migration (May 2024), and another suggesting to re-run the Python training script. These are the most common failure points for new users.\n\n### Token Validation\n\n`tokenCheck` iterates over an array of token IDs and verifies each falls within `[0, vocab_size)`. This is called during data loading to catch corrupted or mismatched token files early.\n\n### Filesystem Helpers\n\n- **`create_dir_if_not_exists(dir)`** — Calls `stat()` then `mkdir()` with mode `0700` if the directory doesn't exist. No-op if `dir` is `NULL`.\n- **`find_max_step(output_log_dir)`** — Scans a directory for files matching the pattern `DONE_*`, parses the step number from each filename, and returns the maximum. Returns `-1` if the directory is `NULL` or can't be opened. Used for checkpoint resume logic.\n- **`ends_with_bin(str)`** — Returns non-zero if `str` ends with `.bin`. Used for filtering shard files.\n\n---\n\n## Random Number Generation (`rand.h`)\n\nA Mersenne Twister MT19937 implementation that is **numerically identical to PyTorch** (`torch.manual_seed` / `torch.randint` / `tensor.normal_()`). This is critical: it allows the C training loop to reproduce the exact same weight initializations and data shuffles as the Python reference, enabling bit-exact verification.\n\n### State and Seeding\n\n```c\nmt19937_state state;\nmanual_seed(&state, 137);\n```\n\n`mt19937_state` holds the 624-element state array, a left counter, a next index, and the twist matrix constants. `manual_seed` initializes the state from a 32-bit seed using the standard MT19937 initialization recurrence.\n\nIf `randint32` is called on an uninitialized state (detected by checking the `MATRIX_A` constants), it auto-seeds with the MT19937 default seed `5489`.\n\n### Integer Generation\n\n- **`randint32(state)`** — Returns a uniformly distributed `unsigned int` in `[0, 2^32)`. Calls `next_state` to regenerate the state array when exhausted, then applies the standard MT tempering transforms.\n- **`randint64(state)`** — Concatenates two `randint32` calls into a 64-bit value.\n\n### Float Generation\n\n- **`randfloat32(state)`** — Returns a `float` in `[0, 1)` by taking the upper 24 bits of `randint32` and dividing by `2^24`. This matches PyTorch's precision.\n- **`randfloat64(state)`** — Returns a `double` in `[0, 1)` by taking the upper 53 bits of `randint64` and dividing by `2^53`.\n\n### Distributions\n\n- **`uniform_(data, numel, from, to, state)`** — Fills `data` with `numel` uniform samples in `[from, to)`.\n- **`normal_(data, numel, mean, std, state)`** — Fills `data` with Gaussian samples. Uses two codepaths:\n  - **`numel >= 16`**: Delegates to `normal_fill`, which generates uniform samples in batches of 16 and applies the Box-Muller transform via `normal_fill_16`. The last partial block of 16 is recomputed to maintain PyTorch numerical identity.\n  - **`numel < 16`**: Uses a scalar Box-Muller with `randfloat64` for higher precision, caching the second sample for the next call.\n\n### Permutations\n\n- **`init_identity_permutation(data, numel)`** — Fills `data[i] = i`.\n- **`random_permutation(data, numel, state)`** — Fisher-Yates shuffle using `randint32` for index selection.\n\n---\n\n## Training Logger (`logger.h`)\n\nA minimal append-only logger that writes to `<log_dir>/main.log`. Only rank 0 in distributed training writes logs (`logger->active` is set to 0 for all other ranks).\n\n### API\n\n```c\nLogger logger;\nlogger_init(&logger, log_dir, process_rank, resume);\n```\n\n- If `resume == 0`, the log file is wiped clean on init. If `resume == 1`, new entries are appended.\n- `log_dir` must be shorter than 500 characters (asserted internally).\n\n| Function | Log format |\n|---|---|\n| `logger_log_train(logger, step, train_loss, lr, grad_norm)` | `s:<step> trl:<loss> lr:<lr> norm:<norm>` |\n| `logger_log_val(logger, step, val_loss)` | `s:<step> tel:<loss>` |\n| `logger_log_eval(logger, step, val)` | `s:<step> eval:<val>` |\n\nEach call opens the file in append mode, writes one line, and closes it. This is intentionally stateless — no file handle is held open between calls, ensuring crash safety.\n\n---\n\n## Model Flops Utilization (`mfu.h`)\n\nComputes the theoretical peak FLOP/s for a given GPU and precision mode, and (when NVML is available) queries live GPU telemetry.\n\n### Peak FLOP/s Lookup\n\n```c\nfloat flops = get_flops_promised(\"NVIDIA A100-SXM4-80GB\", MFUH_PRECISION_BF16);\n// Returns value in units of 1e12 (TFLOP/s)\n```\n\nThe function searches a built-in `gpu_db[]` table of ~40 GPU models. Each entry maps to an architecture family (`VOLTA`, `AMPERE_DATACENTER`, `AMPERE_CONSUMER`, `HOPPER`, `ADA`) with reference peak FLOP/s, core count, and clock speed. For non-flagship GPUs, the peak is linearly scaled:\n\n```\nadjusted = reference_flops × (actual_cores / reference_cores) × (actual_mhz / reference_mhz)\n```\n\nPrecision modes (`MFUH_PRECISION_FP32`, `MFUH_PRECISION_FP16`, `MFUH_PRECISION_BF16`) select the appropriate column from the `PerfData` struct. Returns `-1.0f` if the GPU is unknown or the precision mode is unsupported on that architecture (e.g., BF16 on Volta).\n\n### GPU Telemetry (NVML)\n\nWhen compiled with NVML (`#if __has_include(<nvml.h>)`), the header provides:\n\n- **`nvml_get_device()`** — Lazily initializes NVML and returns a handle to GPU 0.\n- **`get_gpu_utilization_info()`** — Returns a `GPUUtilInfo` struct with clock speeds, power usage/limit, temperature, fan speed, throttle reason, and averaged GPU/memory utilization from the driver's sample buffers (up to 128 samples).\n- **`get_throttle_reason(bits)`** — Converts the NVML throttle bitfield into a human-readable string: `\"power cap\"`, `\"thermal cap\"`, `\"other cap\"`, or `\"no cap\"`.\n\nWithout NVML, `get_gpu_utilization_info()` prints an error and exits.\n\n---\n\n## Outlier Detector (`outlier_detector.h`)\n\nA sliding-window z-score detector for monitoring training loss and gradient norms. Uses `double` arithmetic internally to avoid drift in the running sum/sum-of-squares.\n\n### Usage\n\n```c\nOutlierDetector detector;\ninit_detector(&detector);\n\ndouble z = update_detector(&detector, loss_value);\nif (isnan(z)) {\n    // Still filling the window, no z-score available yet\n} else if (fabs(z) > threshold) {\n    // Outlier detected\n}\n```\n\nThe window size is a compile-time constant (`OUTLIER_DETECTOR_WINDOW_SIZE = 128`), avoiding dynamic allocation. During the first 128 calls, `update_detector` returns `nan(\"\")` while building up the window. After that, it maintains a circular buffer: the oldest value is subtracted from the running sums, the new value is added, and the z-score `(new_value - mean) / std_dev` is returned. If `std_dev == 0`, returns `0.0`.\n\n---\n\n## Inference Sampler (`sampler.h`)\n\nLightweight token sampling for generation. Uses a xorshift64* RNG (distinct from the MT19937 used in training) and softmax-based categorical sampling.\n\n- **`random_u32(state)`** — xorshift64* returning the upper 32 bits.\n- **`random_f32(state)`** — Returns a `float` in `[0, 1)` by taking the upper 24 bits of `random_u32`.\n- **`sample_softmax(logits, n, coin)`** — Given raw logits and a random `coin` in `[0, 1)`, computes the softmax CDF and returns the sampled index. Avoids a full normalization pass by scaling `coin` by the sum of exponentials instead.\n\n---\n\n## Learning Rate Schedulers (`schedulers.h`)\n\nFour schedule types, all sharing the same `LearningRateScheduler` config struct:\n\n```c\nLearningRateScheduler sched;\nlr_scheduler_init(&sched, \"cosine\", 3e-4, 250, 10000, 0.1);\nfloat lr = get_learning_rate(&sched, step);\n```\n\n| Field | Meaning |\n|---|---|\n| `learning_rate` | Peak learning rate |\n| `warmup_iterations` | Steps for linear warmup |\n| `train_num_batches` | Total training steps |\n| `final_learning_rate_frac` | Final LR as fraction of peak (e.g., `0.1` means decay to 10% of peak) |\n\n### Schedule Types\n\n**Cosine** (`\"cosine\"`) — Linear warmup from 0 to `learning_rate`, then cosine decay to `learning_rate × final_learning_rate_frac`. The standard schedule for GPT-2/GPT-3 training.\n\n**Linear** (`\"linear\"`) — Linear warmup, then linear decay to `learning_rate × final_learning_rate_frac`.\n\n**Constant** (`\"constant\"`) — Returns `learning_rate` regardless of step. Warmup and decay are ignored.\n\n**WSD** (`\"wsd\"`) — Warmup-Stable-Decay from [arXiv:2405.18392](https://arxiv.org/abs/2405.18392). Linear warmup, constant plateau until 80% of total steps, then `1 - sqrt(decay_ratio)` decay to `learning_rate × final_learning_rate_frac`. Set `final_learning_rate_frac` to `0.0` for full decay.\n\nAll schedules use `step + 1` during warmup (so step 0 gives a non-zero LR) and include assertions that decay ratios stay in `[0, 1]`.\n\n---\n\n## Tokenizer (`tokenizer.h`)\n\nGPT-2 **decode-only** tokenizer. Encodes token IDs → strings. Encoding (string → tokens) is not supported because it requires regex, which is non-trivial in C.\n\n### File Format\n\nThe tokenizer binary file has a 256-`uint32_t` header:\n- `header[0]` = magic number `20240328`\n- `header[1]` = version (1 or 2)\n- `header[2]` = vocab size\n- `header[3]` = EOT token ID (version 2 only; version 1 assumes 50256)\n\nFollowing the header, each token is stored as: one `unsigned char` length byte, then `length` bytes of token content.\n\n### API\n\n```c\nTokenizer tokenizer;\ntokenizer_init(&tokenizer, \"gpt2_tokenizer.bin\");\n\nconst char *text = tokenizer_decode(&tokenizer, token_id);\nsafe_printf(text);\n\ntokenizer_free(&tokenizer);\n```\n\n- **`tokenizer_init`** — Reads the binary file, allocates the token table. Sets `init_ok = 0` if the file can't be opened (non-fatal; decode calls become no-ops).\n- **`tokenizer_decode`** — Returns the string for a given token ID, or `NULL` if out of range or uninitialized.\n- **`safe_printf`** — Prints a token string, filtering out non-printable, non-whitespace control characters. Handles single-byte tokens specially.\n- **`tokenizer_free`** — Frees the token table and all allocated token strings.\n\n---\n\n## Data Loaders (`dataloader.h`)\n\n### Training DataLoader\n\nServes sharded training data for distributed training. Each shard is a binary file with a 256-`int32` header (magic `20240520`, version `1`, token count) followed by `uint16_t` token IDs.\n\n```c\nDataLoader loader;\ndataloader_init(&loader, \"data/*.bin\", B, T, rank, num_procs, 1);\ndataloader_next_batch(&loader);\n// loader.inputs and loader.targets are now populated\ndataloader_free(&loader);\n```\n\n**Distributed partitioning**: The global batch is `num_processes × B × T` tokens. Each process reads its own slice (`local_batch_offset_bytes = rank × B × T × sizeof(uint16_t)`) from the current position in the shard file.\n\n**Shuffling**: When `should_shuffle = 1`, both inter-shard and intra-shard shuffling are applied using the MT19937 RNG seeded with `42 + process_rank`. Shard order is permuted on each epoch reset; sample order within a shard is permuted when the shard is loaded.\n\n**Epoch handling**: When all samples in a shard are exhausted, `dataloader_advance_` loads the next shard. When the last shard is exhausted, `dataloader_reset` starts a new epoch.\n\n**Resume**: `dataloader_resume(loader, shard_idx, sample_idx)` restores position for checkpoint resumption.\n\n#### Data Flow\n\n```mermaid\ngraph LR\n    A[dataloader_next_batch] --> B{sample_idx >= shard_num_samples?}\n    B -->|yes| C[dataloader_advance_]\n    C --> D{last shard?}\n    D -->|yes| E[dataloader_reset]\n    D -->|no| F[load next shard]\n    E --> F\n    B -->|no| G[dataloader_load_batch]\n    F --> G\n    G --> H[fseek + fread into buffer]\n    H --> I[decode uint16 to inputs/targets]\n```\n\n### EvalLoader\n\nLoads multiple-choice evaluation datasets (e.g., HellaSwag, MMLU). Each example has a shared context and 4 completions; the correct one is identified by a label.\n\n```c\nEvalLoader loader;\nevalloader_init(&loader, \"hellaswag.bin\", B, T, rank, num_procs);\nevalloader_next_batch(&loader);\n// Run forward pass to get losses[B*T]\nint correct = evalloader_stat_losses(&loader, losses);\nevalloader_free(&loader);\n```\n\n**Batch packing**: Each example occupies 4 rows in the batch (one per completion). `can_fit_examples = B / 4` examples are packed per batch. The context tokens are replicated across all 4 rows; completion tokens follow the context. The `mask` array marks which positions belong to completions (where loss should be averaged).\n\n**Scoring**: `evalloader_stat_losses` averages the loss over masked positions for each completion, then checks whether the completion with the lowest average loss matches the label. Returns the count of correct examples.\n\n**Distributed work**: Examples are divided evenly across processes. Each process seeks to its assigned start position using the `<EXAMPLE_BYTES>` field for efficient skipping.\n\n---\n\n## Cross-Module Integration\n\nThe training loop (`train_gpt2.c`) ties these utilities together:\n\n1. **Startup**: `dataloader_init` loads and validates all shards, `tokenizer_init` loads the vocab, `logger_init` prepares the log file.\n2. **Each step**: `dataloader_next_batch` feeds `inputs`/`targets` to the model. `get_learning_rate` computes the current LR. `logger_log_train` records metrics. `update_detector` monitors for loss spikes.\n3. **Checkpointing**: `find_max_step` determines the latest checkpoint. `dataloader_resume` restores data position.\n4. **Evaluation**: `evalloader_next_batch` constructs multiple-choice batches. `evalloader_stat_losses` scores them.\n5. **Generation**: `sample_softmax` and `random_f32` drive autoregressive token sampling. `tokenizer_decode` + `safe_printf` render output.\n6. **MFU reporting**: `get_flops_promised` provides the denominator for MFU calculation. `get_gpu_utilization_info` adds hardware telemetry.","cpu-reference-kernels":"# CPU Reference Kernels\n\n# CPU Reference Kernels — Matrix Multiplication Forward Pass\n\n## Overview\n\nThis module provides CPU-side reference implementations for the matrix multiplication forward pass, the dominant operation in transformer inference and training. It serves two purposes:\n\n1. **Correctness baseline** — the naive `matmul_forward_cpu` kernel is the ground truth against which GPU or optimized CPU kernels are validated.\n2. **Optimization testbed** — an optimized tiled kernel (`matmul_forward_ngc92`) demonstrates a CPU-side performance technique and is benchmarked against the baseline in the built-in test harness.\n\n## Tensor Layouts and Semantics\n\nAll kernels implement the same operation:\n\n```\nout[b][t][o] = bias[o] + sum_i( inp[b][t][i] * weight[o][i] )\n```\n\n| Tensor | Shape | Stride convention | Notes |\n|--------|-------|-------------------|-------|\n| `inp` | (B, T, C) | Row-major | Input activations |\n| `weight` | (OC, C) | Row-major | Weight matrix |\n| `bias` | (OC) | — | May be `NULL`; omitted from accumulation when absent |\n| `out` | (B, T, OC) | Row-major | Output activations |\n\n`OC` denotes \"output channels.\" A typical use is the MLP expansion layer where `OC = 4 * C`.\n\n## Kernel Implementations\n\n### Kernel 0 — `matmul_forward_cpu`\n\nThe straightforward triple-nested-loop implementation:\n\n```\nfor each (b, t):\n    for each output channel o:\n        val = bias[o]   (or 0.0f if bias is NULL)\n        for each input channel i:\n            val += inp[b,t,i] * weight[o,i]\n        out[b,t,o] = val\n```\n\nNo tiling, no vectorization hints. Serves as the readability reference and correctness oracle.\n\n### Kernel 1 — `matmul_forward_ngc92`\n\nAn optimized variant that collapses the `B` and `T` dimensions into a single strided loop and tiles it with a factor of `LOOP_UNROLL = 8`. The key insight: each weight element `weight[o*C + i]` is loaded once and reused across 8 consecutive batch-time steps, keeping 8 partial sums in registers so the compiler can emit fused multiply-add (FMA) instructions.\n\n**Restriction:** `B * T` must be a multiple of 8. The function prints an error and returns early if this invariant is violated.\n\nStructure of the tiled loop:\n\n```\nfor obt in [0, B*T, step=8]:        // collapsed batch-time, tiled by 8\n    for o in [0, OC):\n        result[0..7] = bias[o]       // 8 accumulators in registers\n        for i in [0, C):\n            w = weight[o*C + i]      // load weight once\n            for ibt in [0..7]:\n                result[ibt] += inp[(obt+ibt)*C + i] * w\n        out[(obt+ibt)*OC + o] = result[ibt]  // write back\n```\n\nCompile with `-Ofast` (or MSVC `/O2 /fp:fast`) to ensure the inner loop is auto-vectorized into FMAs.\n\n## Dispatch — `matmul_forward`\n\n```c\nvoid matmul_forward(int kernel_num, float* out,\n    const float* inp, const float* weight, const float* bias,\n    int B, int T, int C, int OC);\n```\n\nSelects the implementation at runtime via `kernel_num`:\n\n| `kernel_num` | Function called |\n|--------------|-----------------|\n| 0 | `matmul_forward_cpu` |\n| 1 | `matmul_forward_ngc92` |\n| other | prints error, calls `exit(1)` |\n\n## Validation Utility — `validate_results_cpu`\n\n```c\nvoid validate_results_cpu(const float* kernel_result, const float* cpu_reference,\n    const char* name, int num_elements, float tolerance);\n```\n\nCompares two buffers element-wise using a **relative tolerance** check:\n\n```\n|cpu_reference[i] - kernel_result[i]| <= tolerance + |cpu_reference[i]|\n```\n\nThis accounts for floating-point drift proportional to the magnitude of the reference value. On mismatch, up to 10 discrepancies are printed before the process exits with failure. The first 5 element pairs are always printed for quick inspection.\n\n## Test Harness — `main`\n\nThe built-in `main` function runs a full validate-then-benchmark workflow:\n\n```mermaid\nflowchart TD\n    A[Allocate random tensors] --> B[Compute reference with matmul_forward_cpu]\n    B --> C{For each kernel 0..1}\n    C --> D[Allocate fresh random tensors with same seed]\n    D --> E[Run kernel via matmul_forward]\n    E --> F[validate_results_cpu against reference]\n    F --> C\n    C -->|all pass| G{For each kernel 0..1}\n    G --> H[Time RUNS=4 invocations with clock_gettime]\n    H --> G\n    G -->|done| I[Free memory, exit]\n```\n\n**Default problem size:** `B=8, T=1024, C=768, OC=3072` — representative of a GPT-2-small MLP layer.\n\n**Random data generation:** `make_random_float` fills arrays with values in `[-1, 1)` using `rand()` seeded with `srand(137)`. The same seed is used for both reference and kernel allocations to ensure bit-identical inputs during validation.\n\n**Timing:** Uses `clock_gettime(CLOCK_MONOTONIC)` across `RUNS=4` iterations, reported in milliseconds.\n\n## Build Notes\n\nMSVC examples from the source header:\n\n```bash\n# Default (host ISA)\ncl.exe /O2 /fp:fast /Qvec-report:2 /I. /I ..\\..\\dev matmul_forward.c\n\n# Force AVX\ncl.exe /O2 /fp:fast /Qvec-report:2 /arch:AVX /I. /I ..\\..\\dev matmul_forward.c\n\n# Force AVX2\ncl.exe /O2 /fp:fast /Qvec-report:2 /arch:AVX2 /I. /I ..\\..\\dev matmul_forward.c\n```\n\n`/Qvec-report:2` causes the compiler to report which loops were auto-vectorized — useful for confirming that the inner accumulation loop in `matmul_forward_ngc92` is vectorized.\n\nFor GCC/Clang:\n\n```bash\ngcc -O3 -ffast-math -march=native -o matmul_forward matmul_forward.c\n```\n\n## Adding a New Kernel\n\n1. Implement a function with the same signature as `matmul_forward_cpu`.\n2. Increment `NUM_KERNELS`.\n3. Add a `case` to the `switch` in `matmul_forward`.\n4. The test harness will automatically validate and benchmark the new kernel — no changes to `main` required.","cuda-backward-kernels":"# CUDA Backward Kernels\n\n# CUDA Backward Kernels\n\nGPU implementations of the backward pass kernels for a GPT-2 transformer training loop. Each operation is provided as a set of progressively optimized CUDA kernels, with a CPU reference for correctness validation and a version dispatch mechanism for benchmarking.\n\n## Backward Pass Data Flow\n\nThe backward pass reverses through the transformer block in this order:\n\n```mermaid\ngraph LR\n    CE[\"CrossEntropy<br>+ Softmax<br>Backward\"] --> Res[\"Residual<br>Backward\"]\n    Res --> LN2[\"LayerNorm<br>Backward #2\"]\n    LN2 --> MLP[\"MLP Backward<br>(GELU + Linear)\"]\n    MLP --> Res2[\"Residual<br>Backward\"]\n    Res2 --> LN1[\"LayerNorm<br>Backward #1\"]\n    LN1 --> Att[\"Attention<br>Backward\"]\n    Att --> Enc[\"Encoder<br>Backward\"]\n```\n\nEach node in this diagram corresponds to one of the kernel files in this module.\n\n## Common Patterns\n\n### Version Dispatch\n\nEvery kernel module exposes a top-level dispatch function (e.g. `attention_backward`, `layernorm_backward`) that takes a `kernel_num` integer argument and routes to the appropriate implementation. This allows A/B testing and benchmarking of different optimization strategies from a single codebase.\n\n### CPU Reference\n\nEach file contains a `_cpu` suffix function implementing the same math on the CPU. These serve as ground truth for correctness checks and as readable documentation of the algorithm.\n\n### Launcher Functions\n\nIntermediate `launch_softmax_N` / `layernorm_backwardN` functions set up grid dimensions and call the CUDA kernel. Template-based kernels (those parameterized on `BlockSize`) use a `dispatch_launch` helper that maps runtime block sizes to compile-time constants via `std::integral_constant`.\n\n### Testing Harness\n\nEach file's `main()` function:\n1. Runs the CPU reference to produce expected outputs\n2. Runs the GPU kernel and validates against CPU with a tolerance\n3. Benchmarks across multiple `block_size` values (32–1024)\n\n---\n\n## Attention Backward\n\n**File:** `attention_backward.cu`\n\nThe most complex backward kernel. Implements the full backward pass through multi-head causal self-attention.\n\n### Mathematical Decomposition\n\nThe forward pass is the sequence: **permute → QKᵀ matmul → softmax → AV matmul → unpermute**. The backward reverses each step:\n\n| Step | Forward | Backward | Implementation |\n|------|---------|----------|----------------|\n| 5 | unpermute: `(B,NH,T,HS) → (B,T,C)` | `unpermute_kernel_backward` | elementwise index remapping |\n| 4 | `vaccum = att @ V` | `datt = Vᵀ @ dvaccum`, `dV = attᵀ @ dvaccum` | cuBLAS `SgemmStridedBatched` |\n| 3 | softmax over rows of `preatt` | `dpreatt` from `datt` and `att` | custom CUDA kernels (8 versions) |\n| 2 | `preatt = Q @ Kᵀ` | `dQ = K @ dpreattᵀ`, `dK = Q @ dpreatt` | cuBLAS `SgemmStridedBatched` |\n| 1 | permute: `(B,T,3C) → 3×(B,NH,T,HS)` | `permute_kernel_backward` | elementwise index remapping |\n\n### Softmax Backward Kernel Evolution\n\nThe softmax backward is the computational bottleneck. The derivative of the autoregressive softmax for row `t` is:\n\n```\ndpreatt[t3] = scale * Σ_{t2≤t} att[t2] * (𝟙{t2==t3} - att[t3]) * datt[t2]\n```\n\nThis requires an O(T²) reduction per (b, h) pair. The eight kernel versions optimize this differently:\n\n| Version | Strategy | Key Idea |\n|---------|----------|----------|\n| `kernel1` | Naive | Single thread per `t3`, loops over all `b,h,t` — severe load imbalance |\n| `kernel2` | Parallelize over `t3,b,h` | Uses 2D grid `(T, B*NH)` — better balance |\n| `kernel3` | Warp-level parallelism | One warp per `t3`, warp-reduce over `t2` loop — coalesced access |\n| `kernel4` | Register reuse (UNROLL=8) | Each warp handles 8 consecutive `t3` values, reusing loaded `att[t2]` and `datt[t2]` across all 8 |\n| `kernel5` | Branch elimination | Splits the `t2` loop into three regions: before/after the diagonal indicator, avoiding per-element `if` — significant perf gain |\n| `kernel6` | Shared memory tiling | Block-level cooperation: loads `att[t2]*datt[t2]` into shared memory, all threads read — becomes compute-bound |\n| `kernel7` | Mathematical simplification | Derives closed-form: `dpreatt[t3] = scale * att[t3] * (datt[t3] - Σ att[t2]*datt[t2])` — single reduction per row, then elementwise |\n| `kernel8` | Production tuning | Adds streaming loads (`__ldcs`/`__stcs`), reversed block order (longest rows start first), `T_per_block=4` for data reuse |\n\n**Kernel 7's simplification** is the key insight. Expanding the sum:\n\n```\nΣ_{t2} att[t2] * (𝟙{t2==t3} - att[t3]) * datt[t2]\n= att[t3] * datt[t3] - att[t3] * Σ_{t2} att[t2] * datt[t2]\n= att[t3] * (datt[t3] - local_sum)\n```\n\nThis reduces the problem from O(T²) per output element to O(T) for the reduction plus O(1) per element.\n\n### Entry Point\n\n```c\nvoid attention_backward(int kernel_num,\n    float* dinp, float* dqkvr, float* dpreatt, float* datt, float* dvaccum,\n    const float* dout,\n    const float* inp, const float* qkvr, const float* preatt,\n    const float* att, const float* vaccum,\n    int B, int T, int C, int NH, int block_size);\n```\n\nAll gradient buffers (`dinp`, `dqkvr`, `dpreatt`, `datt`, `dvaccum`) must be zeroed before calling. The cuBLAS operations use `beta=1.0f` to accumulate.\n\n### Memory Layouts\n\n| Buffer | Shape | Notes |\n|--------|-------|-------|\n| `inp` / `dinp` | `(B, T, 3C)` | Interleaved QKV |\n| `qkvr` / `dqkvr` | `(3, B, NH, T, HS)` | Permuted: Q, K, V contiguous |\n| `preatt` / `dpreatt` | `(B, NH, T, T)` | Full dense matrix (upper triangle unused) |\n| `att` / `datt` | `(B, NH, T, T)` | Causal: upper triangle is zero |\n| `vaccum` / `dvaccum` | `(B, NH, T, HS)` | Before unpermute |\n| `out` / `dout` | `(B, T, C)` | Final output |\n\n---\n\n## Cross-Entropy + Softmax Backward\n\n**File:** `crossentropy_softmax_backward.cu`\n\nFuses the backward pass through both cross-entropy loss and softmax into a single kernel. The combined gradient is:\n\n```\ndlogits[v] = (probs[v] - 𝟙{v==target}) * dloss\n```\n\nThis is the standard softmax-cross-entropy fused derivative, avoiding the need to materialize an intermediate Jacobian.\n\n### Kernel Versions\n\n| Version | Strategy |\n|---------|----------|\n| `kernel1` | Parallelize over `(B, T, V)` — one thread per logit. Each thread reads `dlosses[b,t]` and `targets[b,t]` once, computes `(p - indicator) * dloss`, and accumulates into `dlogits`. |\n\nOnly one version exists because the kernel is already memory-bandwidth-bound: each element requires one read from `probs` and one read-modify-write to `dlogits`, with negligible compute.\n\n### Entry Point\n\n```c\nvoid crossentropy_softmax_backward(int kernel_num,\n    float* dlogits,\n    const float* dlosses, const float* probs, const int* targets,\n    int B, int T, int V, int block_size);\n```\n\n`dlogits` is accumulated into (not overwritten), matching the pattern where residual connections add their gradients later.\n\n---\n\n## Encoder Backward\n\n**File:** `encoder_backward.cu`\n\nBackward through the GPT-2 positional encoder, which sums token embeddings and position embeddings:\n\n```\nout[b,t,c] = wte[inp[b,t], c] + wpe[t, c]\n```\n\nThe gradients are scatter-adds: each `dout[b,t,c]` contributes to both `dwte[inp[b,t], c]` and `dwpe[t, c]`.\n\n### Kernel Versions\n\n| Version | Strategy | Trade-off |\n|---------|----------|-----------|\n| `kernel1` | Parallelize over `(B,T,C)`, use `atomicAdd` for `dwte` and `dwpe` | High parallelism, but atomics on `dwte` are contended (many tokens map to same vocabulary entry) |\n| `kernel2` | Parallelize over `C` only, loop over `B*T` | No atomics needed, but poor GPU utilization (only `C` threads) and serial loop |\n\nKernel 1 is faster in practice because the atomic contention on `dwte` is mitigated by the random distribution of token IDs across a large vocabulary.\n\n### Entry Point\n\n```c\nvoid encoder_backward(int kernel_num,\n    float* dwte, float* dwpe,\n    const float* dout, const int* inp,\n    int B, int T, int C, int block_size);\n```\n\n---\n\n## GELU Backward\n\n**File:** `gelu_backward.cu`\n\nBackward through the Gaussian Error Linear Unit activation used in GPT-2's MLP:\n\n```\nGELU(x) = 0.5 * x * (1 + tanh(√(2/π) * (x + 0.044715 * x³)))\n```\n\nThe local gradient is:\n\n```\ndGELU/dx = 0.5*(1 + tanh_out) + x * 0.5 * sech²(tanh_arg) * √(2/π) * (1 + 3*0.044715*x²)\n```\n\n### Kernel Versions\n\n| Version | Strategy |\n|---------|----------|\n| `kernel1` | Scalar: one element per thread |\n| `kernel2` | Vectorized: uses `Packed128` (`x128`) to process 4 elements per thread (FP32) or 8 (BF16), with `load128cs`/`store128` for coalesced 128-bit memory access |\n\nKernel 2 achieves near-peak memory bandwidth by reducing the total number of memory transactions.\n\n### Entry Point\n\n```c\nvoid gelu_backward(int kernel_num,\n    floatX* dinp, const floatX* inp, const floatX* dout,\n    int B, int T, int C, int block_size);\n```\n\nSupports `floatX` which resolves to `float`, `__half`, or `__nv_bfloat16` depending on compile-time defines (`ENABLE_BF16`, `ENABLE_FP16`).\n\n---\n\n## LayerNorm Backward\n\n**File:** `layernorm_backward.cu`\n\nBackward through layer normalization. This is the second most complex kernel after attention.\n\n### Mathematical Formulation\n\nGiven forward: `out = rstd * (inp - mean) * weight + bias`, the backward computes three gradients:\n\n**Input gradient** (per element):\n```\ndinp[i] = rstd * (weight[i]*dout[i] - dnorm_mean - norm[i]*dnorm_norm_mean)\n```\nwhere `norm[i] = (inp[i] - mean) * rstd`, `dnorm_mean = Σ weight[i]*dout[i] / C`, and `dnorm_norm_mean = Σ weight[i]*dout[i]*norm[i] / C`.\n\n**Weight and bias gradients** (reduced across all B*T positions):\n```\ndweight[i] = Σ_{b,t} norm[b,t,i] * dout[b,t,i]\ndbias[i]   = Σ_{b,t} dout[b,t,i]\n```\n\nThe challenge is that `dweight` and `dbias` require a reduction across the entire batch, while `dinp` is per-position.\n\n### Kernel Evolution\n\n| Version | Strategy | Key Details |\n|---------|----------|-------------|\n| `kernel1` | Naive | One thread per `(b,t)`, loops over `C`. Uses `atomicAdd` for `dweight`/`dbias` — heavy contention |\n| `kernel2` | Shared memory partial sums | Warps accumulate `dweight`/`dbias` into shared memory, then one atomic per C-element per block. Uses `floatX` template params for mixed precision |\n| `kernel3` | Grid-stride loops | Each block processes multiple `(b,t)` positions via grid-stride. Shared memory for partial `dweight`/`dbias`. Final write uses `atomicAddX` (handles BF16/FP16 atomics) |\n| `kernel4` | atomicCAS for BF16 | Replaces BF16 `atomicAdd` with 32-bit `atomicCAS` loop on `__nv_bfloat162` pairs — avoids non-native atomic instructions |\n| `kernel5` | FP32 scratchpad per block | Each block writes partial sums to a per-block FP32 scratch region. Last block to finish (via `atomicAdd` on a flag) reduces all partial sums and writes final `dweight`/`dbias` |\n| `kernel6` | Single shared FP32 scratchpad | All blocks atomically add into one shared FP32 scratch. Last block converts FP32→floatX and writes. Simpler than kernel 5 but more atomic contention |\n| `kernel7` | No cooperative groups | Same as kernel 6 but uses manual `warpReduceSum` instead of `cg::reduce` — wider compiler compatibility |\n| `kernel8` | Vectorized loads + shared memory reindexing | Uses `x128` loads. Reorders shared memory indices to avoid 8-way bank conflicts (atomics are 32-bit, but `x128` packs 4 values). `store128cg` for L2-cached `dinp` writes |\n| `kernel9` | Inter-warp reduction in shared memory | Non-zero warps write partial sums to `dbias_tmp_shared`/`dweight_tmp_shared`; warp 0 reads and accumulates — eliminates atomics within a block. Cache-line-aligned scratch. Final reduction uses `f128` vectors |\n| `kernel10` | Vectorized shared memory access | Uses `f128` (4×float) for shared memory reads/writes, avoiding bank conflicts without index reordering. Extremely register-heavy — uses `__launch_bounds__(512, 2)` to limit register pressure. Careful pointer arithmetic to avoid register spills |\n\n### Shared Memory Bank Conflict Strategy (Kernels 8–10)\n\nThe core tension: `x128` loads group 4 consecutive `floatX` values, but shared memory atomics operate on individual 32-bit floats. Naively mapping `x128` index `k` to shared memory index `k` causes an 8-way bank conflict (4 values × 2 banks apart).\n\n- **Kernel 8/9**: Reorder the shared memory index so that `x128` element `x` maps to `shared_index + x * WARP_SIZE`, spreading accesses across different banks.\n- **Kernel 10**: Use `f128` (128-bit float vector) for shared memory access, which naturally avoids bank conflicts at the cost of higher shared memory consumption.\n\n### Entry Point\n\n```c\nvoid layernorm_backward(int kernel_num,\n    floatX* dinp, floatX* dweight, floatX* dbias, float* scratch,\n    const floatX* dout, const floatX* inp, const floatX* weight,\n    const floatX* mean, const floatX* rstd,\n    int B, int T, int C, int block_size);\n```\n\nThe `scratch` buffer is required for kernels 5–10. Its size depends on the kernel version and grid dimensions. For kernel 9, it must hold at least `2*C*gridDim.x + 128` floats (partial sums + cache-line-aligned flag).\n\n---\n\n## Build Instructions\n\nEach file can be compiled standalone for testing:\n\n```bash\n# Attention backward (requires cuBLAS)\nnvcc -O3 --use_fast_math -lcublas -lcublasLt attention_backward.cu -o attention_backward\n\n# Cross-entropy + softmax backward\nnvcc -O3 --use_fast_math crossentropy_softmax_backward.cu -o crossentropy_softmax_backward\n\n# Encoder backward\nnvcc -O3 --use_fast_math encoder_backward.cu -o encoder_backward\n\n# GELU backward (BF16 enabled by default)\nnvcc -O3 --use_fast_math gelu_backward.cu -o gelu_backward\n\n# LayerNorm backward (BF16 enabled by default)\nnvcc -O3 --use_fast_math layernorm_backward.cu -o layernorm_backward\n```\n\nRun with a kernel version number as the first argument:\n\n```bash\n./attention_backward 8    # Use kernel version 8\n./layernorm_backward 10   # Use kernel version 10\n```\n\nIf no argument is given, version 1 is used by default.\n\n### Common Header Dependency\n\nAll files include `common.h`, which provides:\n- `cublasCheck`, `cudaCheck` — error-checking macros\n- `make_random_float`, `make_zeros_float` — host memory helpers\n- `validate_result` — CPU↔GPU comparison with tolerance\n- `benchmark_kernel` — timing wrapper with warmup\n- `ceil_div` — integer ceiling division\n- `floatX`, `x128`, `f128`, `load128`/`store128` — mixed-precision types and vectorized memory ops (when `ENABLE_BF16` or `ENABLE_FP16` is defined)\n- `cublas_handle` — global cuBLAS handle\n- `warpReduceSum` — manual warp-level reduction (used by kernels that avoid cooperative groups)","cuda-forward-kernels":"# CUDA Forward Kernels\n\n# CUDA Forward Kernels\n\nGPU kernel implementations for the forward pass of a GPT-2 transformer. Each operation is provided in multiple versions that progressively increase in optimization, from naive CPU ports to fused, vectorized, low-precision kernels.\n\n## Architecture\n\nAll kernel files share a common structure and set of conventions:\n\n```\n┌─────────────────────────────────────────┐\n│  CPU reference implementation           │  correctness baseline\n├─────────────────────────────────────────┤\n│  GPU kernel versions (1..N)            │  increasing optimization\n├─────────────────────────────────────────┤\n│  Kernel launcher functions             │  grid/block dimension setup\n├─────────────────────────────────────────┤\n│  Dispatch function                     │  selects version at runtime\n├─────────────────────────────────────────┤\n│  main()                                │  standalone test + benchmark\n└─────────────────────────────────────────┘\n```\n\n```mermaid\ngraph TD\n    A[attention_forward] --> A1[v1: naive 3-kernel]\n    A --> A3[v3: cuBLAS + softmax]\n    A --> A4[v4: fused scale + online softmax]\n    A --> A5[v5: FP16/BF16 of v4]\n    A --> A10[v10: cuDNN flash attention]\n\n    B[crossentropy_forward] --> B1[v1: parallel B,T]\n\n    C[encoder_forward] --> C1[v1: parallel B,T loop C]\n    C --> C2[v2: parallel B,T,C]\n    C --> C3[v3: float4 vectorized]\n\n    D[fused_residual_forward] --> D1[v1: separate residual + layernorm]\n    D --> D3[v3: warp-per-token]\n    D --> D4[v4: x128 + single-pass variance]\n    D --> D5[v5: shared memory weights]\n    D --> D6[v6: multi-warp persistent threads]\n\n    E[gelu_forward] --> E1[v1: scalar elementwise]\n    E --> E2[v2: x128 packed elementwise]\n\n    F[layernorm_forward] --> F1[v1: one-thread-per-row]\n    F --> F3[v3: warp cooperative groups]\n    F --> F4[v4: single-pass variance]\n    F --> F5[v5: block-per-row]\n    F --> F6[v6: shared memory + x128]\n```\n\n## Common Infrastructure\n\n### Data Types\n\n- **`floatX`** — Conditional typedef: `__half` when `ENABLE_FP16` is defined, `__nv_bfloat16` when `ENABLE_BF16` is defined, otherwise `float`. All low-precision kernels use this alias.\n- **`x128` / `Packed128<floatX>`** — 128-bit packed type holding `128 / sizeof(floatX)` elements. Used for vectorized loads/stores via `load128()`, `load128cs()`, `store128()`, `store128cs()`. The `cs` suffix is a cache-streaming hint for data that won't be reused soon.\n\n### Reduction Primitives\n\n- **`warpReduceSum()`** / **`warpReduceMax()`** — Warp-level reductions using `__shfl_down_sync`.\n- **`cg::reduce(warp, val, op)`** — Cooperative groups variant used in attention kernels for cleaner warp reductions.\n- **Shared memory reductions** — Block-level reductions when multiple warps cooperate (see layernorm kernel 5, fused residual kernel 6).\n\n### Conventions\n\n- **`block_size`** parameter — Every launcher accepts a thread-block size for tuning. Typical values tested: 32, 64, 128, 256, 512, 1024.\n- **`ceil_div(a, b)`** — Integer ceiling division for grid size calculation.\n- **`cudaCheck()`** / **`cublasCheck()`** — Error-checking macros that assert on CUDA/cuBLAS errors.\n- **`first_run_validation`** — Global bool that forces FP32↔low-precision conversions on the first call so correctness can be validated against CPU results. Set to `false` after validation for performance runs.\n\n---\n\n## Attention Forward (`attention_forward.cu`)\n\nCausal multi-head self-attention. The most complex module with the widest version spread.\n\n### Tensor Layouts\n\n| Tensor | Shape | Notes |\n|--------|-------|-------|\n| `inp` | (B, T, 3C) | Interleaved QKV: Q at offset 0, K at C, V at 2C per token |\n| `preatt` | (B, NH, T, T) | Pre-softmax attention scores |\n| `att` | (B, NH, T, T) | Post-softmax attention weights |\n| `out` | (B, T, C) | Output, heads concatenated |\n\nThe interleaved QKV layout means Q, K, V for head `h` at position `t` are at offsets `h*hs`, `h*hs + C`, `h*hs + 2*C` within the token's 3C-wide slice.\n\n### Version Progression\n\n**Version 1** — Three separate kernels launched sequentially:\n1. `attention_query_key_kernel1` — One thread per (b, h, t, t2) cell. Computes Q·K dot product with serial reduction over head dimension. Sets future positions to `-INFINITY` for causal masking.\n2. `attention_softmax_kernel1` — One thread per (b, h, t) row. Serial max-finding, exp, and normalization.\n3. `attention_value_kernel1` — One thread per (b, h, t). Serial accumulation of weighted values.\n\n**Version 2** — Flash attention (tiled SRAM). Adapted from [flash-attention-minimal](https://github.com/tspeterkim/flash-attention-minimal). Uses online softmax with running `m` (max) and `l` (sum) per row. Tiles Q, K, V into SRAM blocks of size `Bc × d` / `Br × d`. Requires `permute_kernel` to rearrange from interleaved QKV to separate (B, NH, T, HS) tensors, and `unpermute_kernel` to convert back. **~3× slower than v1** due to SRAM tiling overhead at these sizes.\n\n**Version 3** — cuBLAS-based, ~20× faster than v1:\n1. `permute_kernel` — Rearranges QKV to (B, NH, T, HS) layout.\n2. `cublasSgemmStridedBatched` — Batched GEMM for QK^T.\n3. `scale_kernel` — Elementwise scale by `1/√(hs)` and causal masking (sets future to `-INFINITY`).\n4. `softmax_forward_kernel4` — Block-parallel softmax with warp reductions and shared memory for inter-warp reduction.\n5. `cublasSgemmStridedBatched` — Batched GEMM for att×V.\n6. `unpermute_kernel` — Convert output back to (B, T, C).\n\n**Version 4** — Fused optimizations over v3:\n- Replaces `scale_kernel` + `softmax_forward_kernel4` with `softmax_forward_kernel5`, which fuses the scale multiplication, uses online softmax algorithm, and is directly autoregressive (only computes the lower triangular part). Uses `float4` vectorized reads and cooperative groups warp reductions.\n\n**Version 5** — FP16/BF16 version of v4:\n- `permute_kernel_lowp` — Converts FP32 input to `floatX` during permute.\n- `cublasGemmStridedBatchedEx` — Low-precision batched GEMM with `CUBLAS_LOWP` data type and `CUBLAS_LOWP_COMPUTE` compute type.\n- `softmax_forward_kernel5_lowp` — Same algorithm as kernel5 but operates on `floatX` with explicit casts for arithmetic.\n- `unpermute_kernel_lowp` — Converts `floatX` back to FP32 output.\n\n**Version 6** — Same as v5 but with `skip_permute=true`, skipping the permute/unpermute steps. Unrealistic but useful for measuring the overhead of FP32↔FP16 conversions.\n\n**Version 10** (requires `ENABLE_CUDNN`) — cuDNN Flash Attention via the `cudnn_frontend` graph API:\n- Builds an SDPA (Scaled Dot Product Attention) graph with causal masking.\n- Q, K, V strides are set to match the interleaved QKV layout directly, eliminating the need for an external permute.\n- Graphs are cached in `user_maintained_cache_fwd` keyed by `graph->key()` to avoid the slow `build_operation_graph()` on subsequent calls.\n- Workspace is dynamically allocated up to the required size (capped implicitly by cuDNN at ~256 MiB).\n- On first run, `fp32_to_lowp_kernel` converts input and `lowp_to_fp32_kernel` converts output for validation.\n\n**Version 11** — Same as v10 but skips FP16↔FP32 conversions (full low-precision pipeline).\n\n### Key Softmax Kernels\n\n`softmax_forward_kernel4` — General-purpose block-parallel softmax for (N, C) tensors. Uses thread coarsening, warp-level `warpReduceMax`/`warpReduceSum`, shared memory for inter-warp reduction. Requires `2 * warpsPerBlock * sizeof(float)` shared memory.\n\n`softmax_forward_kernel5` — Attention-specific autoregressive softmax. Fuses `inv_temperature` (scale), only processes the causal lower triangle. Uses online softmax: maintains running `maxval` and `sumval` while iterating in groups of 4 via `float4` reads. Warp-cooperative groups for final reduction. Recomputes exp values during the write phase rather than storing and reloading.\n\n### Permute/Unpermute\n\nThe interleaved QKV layout `(B, T, 3, NH, HS)` must be rearranged to `(B, NH, T, HS)` for cuBLAS. `permute_kernel` maps index `(b, nh, n, d)` → input offset with stride `3*NH*HS` between Q/K/V. `unpermute_kernel` reverses this for the output.\n\n---\n\n## Cross-Entropy Forward (`crossentropy_forward.cu`)\n\nComputes per-token cross-entropy loss from probabilities and target indices.\n\n### Version 1\n\n`crossentropy_forward_kernel1` — One thread per (b, t). Reads `probs[b, t, targets[b,t]]` and computes `-logf(...)`. Simple and memory-bound.\n\n---\n\n## Encoder Forward (`encoder_forward.cu`)\n\nGPT-2 positional encoder: token embedding lookup + positional embedding addition.\n\n### Tensor Layouts\n\n| Tensor | Shape |\n|--------|-------|\n| `inp` | (B, T) — integer token indices |\n| `wte` | (V, C) — token embedding table |\n| `wpe` | (T, C) — positional embedding table |\n| `out` | (B, T, C) — `wte[inp[b,t]] + wpe[t]` |\n\n### Version Progression\n\n**Version 1** — One thread per (b, t), serial loop over C. Each thread does two gather reads and C writes.\n\n**Version 2** — One thread per (b, t, c). Fully parallel. Single read from `wte[ix*C + c]` and `wpe[t*C + c]`, single write. Better memory coalescing since adjacent threads read adjacent channels.\n\n**Version 3** — `x128` vectorized version of v2. Each thread processes `x128::size` elements (4 for FP32, 8 for FP16/BF16). Uses `load128cs` for streaming reads and `store128` for output (non-streaming, to keep data in cache for downstream ops). Grid size divided by `x128::size`.\n\n---\n\n## Fused Residual + LayerNorm Forward (`fused_residual_forward.cu`)\n\nCombines the residual connection (`inp1 + inp2`) with subsequent layer normalization into a single pass, avoiding the write-back and re-read of the intermediate residual.\n\n### Version Progression\n\n**Version 1** — Unfused baseline. Launches `residual_forward_kernel1` (elementwise add) then `layernorm_forward_kernel1` (per-row layernorm) as separate kernels.\n\n**Version 2** — First fusion attempt. One thread per token (b, t). Serial loops over C for residual sum, variance, and normalization. **Uncoalesced access** — threads in a warp access non-contiguous memory, causing terrible performance.\n\n**Version 3** — One warp per token. `dim3(32, block_y)` block layout where `threadIdx.x` is the lane within the warp and `threadIdx.y` selects the token. Coalesced reads since lane `x` reads position `c = threadIdx.x` with stride 32. Uses `warpReduceSum` for mean and variance.\n\n**Version 4** — Adds `x128` vectorization and single-pass variance estimation. Uses the identity `var(x) = E[x²] - E[x]²` to compute mean and variance in one pass over the data. Uses a **zigzag loop**: forward iteration for the residual+stats pass, then backward iteration for the normalization pass. The backward iteration ensures that by the time the normalization pass reads `residual[c]`, the write from the forward pass has already been committed from the write-back stage. Uses `load128cs`/`store128cs` for streaming.\n\n**Version 5** — Loads weight and bias into **shared memory** before processing. Eliminates the zigzag loop because residual values are also cached in shared memory (`s_res`). Shared memory layout: `s_weight[C/x128]`, `s_bias[C/x128]`, `s_res[C/x128]` per `threadIdx.y`. Requires `(2 + block_y) * C * sizeof(floatX)` shared memory. Falls back to kernel 4 if `cudaFuncSetAttribute` for large shared memory fails.\n\n**Version 6** — **Multi-warp per token with persistent threads**. Uses `dim3(32, block_y, block_z)` where `block_z` sub-blocks each handle a different token. Multiple warps (`block_y`) cooperate on a single token for large C. Weights and biases loaded once into shared memory and reused across all tokens processed by the block. Each sub-block has its own `s_res` and reduction buffers (`s_mean`, `s_var`). Interleaved `s_mean`/`s_var` layout eliminates extra `__syncthreads` between loop iterations. Launches with occupancy-based grid size (`cuda_threads_per_SM * cuda_num_SMs / block_size`).\n\n### Shared Memory Layout (Kernel 6)\n\n```\nparams:\n  [0 .. C)                        → s_weight (x128 packed)\n  [C .. 2C)                       → s_bias (x128 packed)\n  [2C .. (2+blockDim.z)*C)        → s_res[threadIdx.z] (x128 packed, per sub-block)\n  [(2+blockDim.z)*C .. +32*blockDim.z) → s_mean[threadIdx.z] (float, per sub-block)\n  [+32*blockDim.z .. +64*blockDim.z)   → s_var[threadIdx.z] (float, per sub-block)\n```\n\n---\n\n## GELU Forward (`gelu_forward.cu`)\n\nGaussian Error Linear Unit activation used in GPT-2's MLP.\n\nFormula: `0.5 * x * (1 + tanh(√(2/π) * (x + 0.044715 * x³)))`\n\n### Version Progression\n\n**Version 1** — One thread per element. Scalar read, compute, write.\n\n**Version 2** — `x128` packed. Each thread processes `x128::size` elements. Loads with `load128cs` (streaming), stores with `store128` (non-streaming) to keep results in cache for the next layer.\n\n---\n\n## LayerNorm Forward (`layernorm_forward.cu`)\n\nStandard layer normalization: normalize, then scale by learned weight and bias.\n\n### Version Progression\n\n**Version 1** — One thread per (b, t). Serial loops for mean, variance, and output. Two-pass (mean then variance).\n\n**Version 2** — Three-kernel decomposition: `mean_kernel` (shared memory reduction), `rstd_kernel` (shared memory reduction), `normalization_kernel` (fully parallel over B×T×C). Each kernel is a separate launch.\n\n**Version 3** — One warp per row using cooperative groups. `cg::reduce` for warp-level sum. Two-pass (mean then variance). Uses `__ldcs`/`__stcs` streaming hints.\n\n**Version 4** — Same structure as v3 but uses **single-pass variance**: `var = mean(x²) - mean(x)²`. Accumulates `sum` and `sum2` simultaneously during the coarsening loop, then one `cg::reduce` call for each.\n\n**Version 5** — One **block** per row (not just one warp). Shared memory for inter-warp reduction of `shared_sum[warp_id]` and `shared_sum2[warp_id]`. Final reduction done by lane 0 of the first warp. Better for large C where one warp doesn't provide enough parallelism.\n\n**Version 6** — Inspired by `fused_residual_forward_kernel5`. Loads weight and bias into shared memory. Caches input in shared memory (`s_in`) to avoid re-reading from global memory during normalization. Uses `x128` vectorized loads. Block layout `dim3(WARP_SIZE, block_y)` with `threadIdx.y` selecting the row.\n\n---\n\n## Building and Running\n\nEach `.cu` file is self-contained and can be compiled standalone:\n\n```bash\n# Attention (without cuDNN)\nnvcc -O3 --use_fast_math -lcublas -lcublasLt attention_forward.cu -o attention_forward\n\n# Attention (with cuDNN)\nnvcc -I/PATH/TO/cudnn-frontend/include -DENABLE_CUDNN -O3 --use_fast_math \\\n     -lcublas -lcublasLt -lcudnn attention_forward.cu -o attention_forward\n\n# Other kernels\nnvcc -O3 --use_fast_math -lcublas -lcublasLt layernorm_forward.cu -o layernorm_forward\nnvcc -O3 --use_fast_math encoder_forward.cu -o encoder_forward\nnvcc -O3 --use_fast_math gelu_forward.cu -o gelu_forward\nnvcc -O3 --use_fast_math crossentropy_forward.cu -o crossentropy_forward\nnvcc -O3 --use_fast_math fused_residual_forward.cu -o fused_residual_forward\n```\n\nRun with kernel version as argument:\n\n```bash\n./attention_forward 4        # run kernel version 4\n./layernorm_forward 5        # run kernel version 5\n```\n\nEach binary validates against the CPU reference on the first run, then benchmarks across multiple block sizes.\n\n## Design Patterns and Optimization Strategies\n\n### Parallelism Granularity\n\n| Strategy | Used in | Tradeoff |\n|----------|---------|----------|\n| One thread per row | layernorm v1, fused_residual v2 | Simple, but serial inner loop |\n| One warp per row | layernorm v3/v4, fused_residual v3/v4, attention v1 fused | Good balance for moderate C |\n| One block per row | layernorm v5/v6, fused_residual v5/v6 | Better for large C, uses shared memory |\n| One thread per element | encoder v2, gelu v1 | Maximum parallelism, memory-bound |\n| Persistent threads | fused_residual v6 | Amortizes shared memory loads across tokens |\n\n### Memory Access Optimization\n\n1. **Coalesced access** — Adjacent threads read adjacent memory addresses. Warp-per-token layouts (threadIdx.x = lane) naturally achieve this.\n2. **Vectorized loads** — `x128`/`Packed128` packs 4 FP32 or 8 FP16/BF16 values into a single 128-bit transaction, reducing instruction count and improving bandwidth utilization.\n3. **Cache streaming** — `__ldcs`/`__stcs` and `load128cs`/`store128cs` hint that data won't be reused, freeing cache for weight/bias tensors that are shared across threads.\n4. **Shared memory** — Weight and bias cached in shared memory avoid redundant global reads when multiple warps process different tokens in the same block (fused_residual v5/v6, layernorm v6).\n\n### Numerical Considerations\n\n- **Online softmax** — Maintains running max and sum to avoid a separate pass. Used in attention v4/v5 and flash attention v2.\n- **Single-pass variance** — `var = E[x²] - E[x]²` avoids two passes over the data but is slightly less numerically stable than the two-pass formula. Used in layernorm v4+ and fused_residual v4+.\n- **Low precision** — FP16/BF16 kernels cast to `float` for arithmetic (accumulation, exp, sqrt) and store back as `floatX`. cuBLAS compute type is controlled by `CUBLAS_LOWP_COMPUTE` (typically `CUBLAS_COMPUTE_32F` for accuracy).\n- **Accuracy thresholds** — FP32 kernels validated at 1e-3, low-precision kernels at 1e-2 to account for reduced precision.","cuda-infrastructure":"# CUDA Infrastructure\n\n# CUDA Infrastructure\n\nThe CUDA infrastructure module provides the foundational layer for all GPU computation in the codebase. It spans three tiers: a **production library** under `llmc/` used by the training loop, a **development sandbox** under `dev/cuda/` for kernel prototyping and benchmarking, and **cross-platform shims** under `dev/` for Windows compatibility.\n\n## Architecture Overview\n\n```mermaid\ngraph TD\n    A[llmc/cuda_common.h] --> B[llmc/cuda_utils.cuh]\n    A --> C[llmc/cublas_common.h]\n    A --> D[llmc/cudnn_att.h]\n    D --> E[llmc/cudnn_att.cpp]\n    E --> C\n    F[dev/cuda/common.h] --> G[dev/cuda/Makefile]\n    H[dev/unistd.h] --> I[Windows Compatibility]\n    A --> J[NVTX Profiling]\n    A --> K[Device ↔ File I/O]\n    B --> L[Packed128 / Reductions]\n    C --> M[cuBLAS Handles & Workspace]\n    E --> N[cuDNN Graph Cache]\n```\n\n---\n\n## Precision Configuration\n\nThe entire codebase compiles in one of three precision modes, selected at compile time via defines:\n\n| Define        | `floatX` type     | cuBLAS low-precision flag | `PrecisionMode` enum |\n|---------------|-------------------|--------------------------|----------------------|\n| `ENABLE_FP32` | `float`           | `CUDA_R_32F`             | `PRECISION_FP32`     |\n| `ENABLE_FP16` | `half`            | `CUDA_R_16F`             | `PRECISION_FP16`     |\n| *(default)*   | `__nv_bfloat16`   | `CUDA_R_16BF`            | `PRECISION_BF16`     |\n\nIn the production Makefile (`dev/test/Makefile`), this is controlled by the `PRECISION` variable (defaults to `BF16`), which translates to the `-DENABLE_BF16` / `-DENABLE_FP16` / `-DENABLE_FP32` compiler flag.\n\nThe `floatX` typedef in `llmc/cuda_common.h` is the canonical type used throughout kernel code and tensor allocations. The `floatN` alias exists in `dev/cuda/common.h` as a secondary name (identical to `floatX`).\n\n### Cache-hint shims for bfloat16\n\nOlder nvcc (pre-12) does not provide `__ldcs` / `__stcs` intrinsics for `__nv_bfloat16`. Both `llmc/cuda_common.h` and `dev/cuda/common.h` conditionally define these overloads when:\n\n```c\ndefined(ENABLE_BF16) && (__CUDACC_VER_MAJOR__ < 12) && !((__CUDA_ARCH__ >= 800) || !defined(__CUDA_ARCH__))\n```\n\nThe implementations cast through `unsigned short` since bfloat16 has the same storage size.\n\n---\n\n## Error Checking\n\nAll CUDA runtime, cuBLAS, and cuDNN calls are wrapped with error-checking macros that print the file, line, and error string before calling `exit(EXIT_FAILURE)`.\n\n| Macro            | Header               | Checks type            |\n|------------------|----------------------|------------------------|\n| `cudaCheck`      | `llmc/cuda_common.h` | `cudaError_t`          |\n| `cudaFreeCheck`  | `llmc/cuda_common.h` | `cudaFree` + nulls ptr |\n| `cublasCheck`    | `llmc/cublas_common.h` | `cublasStatus_t`     |\n| `cuDNNCheck`     | `llmc/cudnn_att.cpp` | `cudnnStatus_t`        |\n| `checkCudnnFE`   | `llmc/cudnn_att.cpp` | `fe::error_object`     |\n\n`cudaFreeCheck` is a template function that frees device memory **and** resets the pointer to `nullptr`, preventing double-free bugs.\n\n---\n\n## Packed128 — Vectorized Memory Access\n\nDefined in both `llmc/cuda_utils.cuh` and `dev/cuda/common.h`, `Packed128<ElementType>` forces the compiler to emit 128-bit load/store instructions (`LDG.128` / `STS.128`).\n\n```c\ntemplate<class ElementType>\nstruct alignas(16) Packed128 {\n    static constexpr const int size = sizeof(int4) / sizeof(ElementType);\n    ElementType payload[size];\n    // ...\n};\n```\n\nFor `float`, `size` = 4; for `__nv_bfloat16`, `size` = 8. The convenience typedefs are:\n\n- `f128` → `Packed128<float>`\n- `x128` → `Packed128<floatX>`\n\n### Load/store helpers\n\n| Function      | Cache hint                          | Use case                              |\n|---------------|-------------------------------------|---------------------------------------|\n| `load128`     | Default (cache normally)            | Reused data                           |\n| `load128cs`   | Streaming (`__ldcs`)                | Read-once data                        |\n| `store128`    | Default                             | Normal writes                         |\n| `store128cs`  | Streaming (`__stcs`)               | Write-once, bypass L1/L2              |\n| `store128cg`  | Cache-global (`__stcg`)            | Bypass L1, cache in L2                |\n\nAll addresses **must** be 16-byte aligned. Misaligned addresses cause undefined behavior (typically misaligned read/write errors or silent data corruption).\n\n---\n\n## Warp and Block Reductions\n\n### `warpReduceSum` / `warpReduceMax`\n\nWarp-level reductions using `__shfl_xor_sync`. All 32 threads in the warp must be active:\n\n```c\n__device__ float warpReduceSum(float val);   // sum across warp\n__device__ float warpReduceMax(float val);   // max across warp\n```\n\n### `blockReduce`\n\nA two-stage reduction: warp shuffle → shared memory → warp shuffle. It is a template that takes a warp-level reduction function pointer:\n\n```c\nusing reduction_func_t = float (*) (float);\n\ntemplate<reduction_func_t warp_reduction>\n__device__ float blockReduce(float val, bool final_sync = false, float out_of_bounds = 0.0f);\n```\n\n**Key details:**\n\n- Uses `__shared__ float shared_val[WARP_SIZE]` (128 bytes of non-dynamic shared memory per call).\n- The unique shared memory per call site avoids an extra `__syncthreads()` at the end — **unless** called inside a loop, where the same shared memory is implicitly reused across iterations. Set `final_sync = true` in that case.\n- Supports up to 1024 threads per block (32 warps).\n- `out_of_bounds` is the value returned by lanes that don't participate in the second warp reduction (lanes ≥ `num_warps`).\n\n### `global_sum_deterministic`\n\nA deterministic sum reduction that enforces a single-block launch:\n\n```c\ntemplate<class Float>\nvoid global_sum_deterministic(float* result, const Float* values, int count, cudaStream_t stream);\n```\n\nLaunches `global_sum_single_block_kernel<<<1, 1024>>>` which uses grid-stride looping inside the single block, then `blockReduce<warpReduceSum>`.\n\n---\n\n## cuBLAS Setup\n\n`llmc/cublas_common.h` declares the global cuBLAS state:\n\n| Variable                  | Purpose                                              |\n|---------------------------|------------------------------------------------------|\n| `cublaslt_workspace_size` | 32 MiB (Hopper needs 32; older archs only need 4)    |\n| `cublaslt_workspace`      | Device pointer for cuBLASLt workspace                |\n| `cublas_compute`          | `CUBLAS_COMPUTE_32F` (or `CUBLAS_COMPUTE_32F_FAST_TF32` on Ampere+) |\n| `cublaslt_handle`         | cuBLASLt handle                                      |\n\nIn `dev/cuda/common.h`, `setup_main()` additionally creates a `cublas_handle` (legacy cuBLAS) and configures TF32 math mode when `cuda_arch_major >= 8`.\n\n---\n\n## cuDNN Attention\n\n`llmc/cudnn_att.cpp` / `llmc/cudnn_att.h` wrap cuDNN's fused scaled-dot-product-attention (SDPA) with a **graph cache** to amortize the expensive `build_operation_graph` call.\n\n### Graph caching\n\nForward and backward graphs are cached in `std::map` instances keyed by `(B, H, T, HS, is_inference)` and `(B, NH, T, HS)` respectively. On first use, the graph is built, validated, and execution plans are created. Subsequent calls with the same dimensions reuse the cached graph.\n\nWorkspace is dynamically grown: if a new graph requires more workspace than currently allocated, the old workspace is freed and a larger one is allocated (up to ~256 MiB).\n\n### Public API\n\n```c\nvoid create_cudnn();\nvoid destroy_cudnn();\n\nvoid attention_forward_cudnn(\n    floatX* out,    // (B, T, NH, HS)\n    float* stats,   // (B, NH, T) — pass nullptr for inference-only\n    floatX* inp,    // (B, T, 3, NH, HS) interleaved QKV\n    int B, int T, int NH, int C,\n    cudaStream_t stream\n);\n\nvoid attention_backward_cudnn(\n    floatX* dqkvr,  // output gradients, same layout as qkvr\n    floatX* dout, floatX* qkvr, floatX* o, float* stats,\n    int B, int T, int NH, int C,\n    cudaStream_t stream\n);\n```\n\nBoth functions push an NVTX range for profiling. The QKV input layout is `(B, T, 3, NH, HS)` with strides that cuDNN interprets to extract Q, K, V as separate tensors without an external permute.\n\ncuDNN is **not** supported in FP32 mode (static assert fires). It is disabled by default in the build; enable with `USE_CUDNN=1`.\n\n---\n\n## Device ↔ File I/O\n\n`llmc/cuda_common.h` provides double-buffered async transfer functions for checkpoint I/O:\n\n```c\nvoid device_to_file(FILE* dest, void* src, size_t num_bytes,\n                    size_t buffer_size, cudaStream_t stream);\n\nvoid file_to_device(void* dest, FILE* src, size_t num_bytes,\n                    size_t buffer_size, cudaStream_t stream);\n```\n\nBoth allocate **pinned host memory** (`cudaMallocHost`) split into two buffers. While one buffer is being transferred over PCIe, the other is being read from / written to disk. `file_to_device` additionally uses `cudaHostAllocWriteCombined` for the write-combined cache hint, optimizing for the CPU-write / device-read pattern.\n\nThe `buffer_size` parameter controls the double-buffer chunk size. It need not evenly divide `num_bytes`; the functions handle partial final chunks correctly.\n\nTest coverage is in `dev/test/device_file_io.cu`.\n\n---\n\n## NVTX Profiling\n\n`llmc/cuda_common.h` provides an RAII wrapper for NVIDIA Tools Extension ranges:\n\n```c\nclass NvtxRange {\npublic:\n    NvtxRange(const char* s);\n    NvtxRange(const std::string& base_str, int number);\n    ~NvtxRange();\n};\n\n#define NVTX_RANGE_FN() NvtxRange nvtx_range(__FUNCTION__)\n```\n\n`NVTX_RANGE_FN()` creates a range named after the enclosing function. The destructor calls `nvtxRangePop()`, ensuring the range is closed even on early returns. Used extensively in `cudnn_att.cpp`.\n\n---\n\n## Memory Management\n\n### `cudaMallocConditionallyManaged`\n\n```c\nint cudaMallocConditionallyManaged(void** out, size_t bytes);\n```\n\nTries `cudaMalloc` first. On `cudaErrorMemoryAllocation` (OOM), falls back to `cudaMallocManaged` with `cudaMemAdviseSetPreferredLocation` set to CPU. Returns `0` on success, `1` if it fell back to managed memory. This allows the training loop to continue on memory-constrained systems at reduced performance.\n\n---\n\n## Stochastic Rounding\n\n`llmc/cuda_utils.cuh` implements stochastic rounding for reduced-precision training using the SquirrelNoise5 hash function for per-thread random numbers:\n\n```c\n__device__ void stochastic_rounding(float in, __nv_bfloat16* out, unsigned int seed);\n__device__ void stochastic_rounding(float in, half* out, unsigned int random);  // TODO\n__device__ void stochastic_rounding(float in, float* out, unsigned int random); // identity\n```\n\nThe bfloat16 version compares the lower 16 bits of the float representation against a random threshold to decide whether to round up or down. The seed should be updated per training step (e.g., via xorshift) to produce different random numbers across steps.\n\n---\n\n## Copy and Cast\n\n`llmc/cuda_utils.cuh` provides a kernel for type conversion with stride support:\n\n```c\ntemplate<typename Td, typename Ts>\n__global__ void copy_and_cast_kernel(Td* dst, const Ts* src, size_t n,\n                                     ptrdiff_t stride_dst, ptrdiff_t stride_src);\n```\n\nThe `blockIdx.y` dimension indexes into strided batches. Device-side casting is handled by the `cast_value<Td, Ts>` specializations (float↔half↔bfloat16).\n\nThe `DType` enum (`FP32`, `FP16`, `BF16`) and `sizeof_dtype()` / `dtype_of()` helpers provide runtime type identification for tensor metadata.\n\n---\n\n## Build System\n\n### `dev/cuda/Makefile` — Kernel development\n\nCompiles individual `.cu` files into standalone test/benchmark binaries. Auto-detects GPU compute capability via `__nvcc_device_query`. Targets include all forward/backward kernels, the AdamW optimizer, and NCCL all-reduce.\n\nKey flags: `-O3 --use_fast_math -lcublas -lcublasLt -std=c++17`. The `matmul_forward` and `matmul_backward` targets additionally link `-fopenmp`. The `nccl_all_reduce` target links `-lmpi -lnccl`.\n\nRun `make all` to build everything, `make run_all` to build and execute, `make clean` to remove binaries. `make all_ptx` / `make all_sass` dump PTX/SASS via `cuobjdump`.\n\n### `dev/test/Makefile` — Production build\n\nMore sophisticated: auto-detects OpenMP, OpenMPI+NCCL, cuDNN frontend, and precision mode. The `PRECISION` variable (default `BF16`) controls the `-DENABLE_*` flag. cuDNN is off by default (`USE_CUDNN=1` to enable). Multi-GPU support requires OpenMPI+NCCL at standard system paths.\n\n---\n\n## Windows Compatibility\n\n`dev/unistd.h` provides POSIX shims for Windows builds:\n\n- `clock_gettime` → `timespec_get` with `TIME_UTC`\n- `mkdir` → `_mkdir`\n- `access` → `_access`\n- `glob` / `globfree` → Win32 `FindFirstFile` / `FindNextFile` implementation\n- `opendir` / `readdir` / `closedir` → Win32 equivalents\n- `TURN_OFF_FP_FAST` / `TURN_ON_FP_FAST` pragmas for controlling floating-point mode\n\nThe `glob` implementation converts forward slashes to backslashes and has a hard limit of 64,000 matched files.\n\n---\n\n## Development Workflow\n\nThe `dev/cuda/` directory is a scratch space for kernel development. Each `.cu` file contains multiple kernel versions (typically numbered 1, 2, 3...) in increasing optimization complexity. The standard workflow:\n\n1. Compile and run a specific kernel version: `./layernorm_forward 4`\n2. The binary runs a CPU reference, then the GPU kernel, validates correctness, and benchmarks various launch configurations\n3. Copy the fastest kernel into the production training code (`train_gpt2.cu`)\n\nFor developers without local GPU access, `dev/cuda/benchmark_on_modal.py` runs benchmarks on the Modal platform with configurable GPU type (`GPU_NAME`), memory (`GPU_MEM`), and count (`N_GPUS`). It also supports Nsight Systems profiling with report download via Modal volumes.\n\n---\n\n## Utility Functions (dev/cuda/common.h)\n\nThese are used only in the development/test context:\n\n- **`make_random_float_01`**, **`make_random_float`**, **`make_random_int`**, **`make_zeros_float`**, **`make_ones_float`** — host-side test data generation\n- **`memcpy_convert`** — host-to-device copy with type conversion (returns `cudaError_t` for deferred checking)\n- **`validate_result`** — compares device output against CPU reference with configurable tolerance, prints first 5 comparisons, exits on >10 mismatches\n- **`benchmark_kernel`** — times a kernel over multiple repeats, flushing L2 cache between runs via a `cudaMemset` of a buffer sized to `deviceProp.l2CacheSize`\n- **`setup_main`** — initializes CUDA device, cuBLAS handles, and TF32 math mode; seeds `srand(0)` for determinism\n\n### Hardware-aware constants\n\n`MAX_1024_THREADS_BLOCKS` is set to `2` on Ampere (`__CUDA_ARCH__ == 800`) and Hopper+ (`>= 900`) to ensure two thread blocks can reside on a single SM, maximizing latency tolerance. On older architectures it is `1`. This is used with `__launch_bounds__` in kernel definitions.","cuda-optimizer-communication":"# CUDA Optimizer & Communication\n\n# CUDA Optimizer & Communication Module\n\n## Overview\n\nThis module provides hand-optimized CUDA kernels for the core computational bottlenecks in transformer training: the AdamW weight update, fused classifier loss/gradient computation, global gradient norm calculation, multi-GPU communication, and tensor permutation. Each operation ships multiple kernel variants — from reference implementations to heavily optimized versions — allowing developers to trade off simplicity for performance and study the optimization techniques applied at each step.\n\nAll kernels follow a consistent pattern: a CPU reference implementation for correctness checking, a series of progressively optimized GPU kernels, a dispatch function that selects the kernel by number, and a `main()` function that validates correctness then benchmarks across block sizes.\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[Training Loop] --> B[AdamW Optimizer]\n    A --> C[Fused Classifier]\n    A --> D[Global Norm]\n    A --> E[NCCL All-Reduce]\n    A --> F[Permute]\n\n    B --> B1[kernel1: naive]\n    B --> B2[kernel2: lerp + registers]\n\n    C --> C1[kernel1: warp-per-row]\n    C --> C2[kernel2: block-per-row + float4]\n    C --> C3[kernel3: block-per-row scalar]\n    C --> C4[kernel4: x128 packed types]\n    C --> C5[kernel5: templates + streaming stores]\n\n    D --> D1[kernel1: block reduce + atomic]\n    D --> D2[kernel2: warp reduce + atomic]\n    D --> D3[kernel3: blockReduce + atomic]\n    D --> D4[kernel4: two-pass deterministic]\n\n    E --> E1[MPI + NCCL init]\n    E --> E2[ncclAllReduce]\n```\n\n---\n\n## AdamW Optimizer (`adamw.cu`)\n\nImplements the AdamW optimizer following [PyTorch's specification](https://pytorch.org/docs/stable/generated/torch.optim.AdamW.html) and [NVIDIA Apex](https://github.com/nvidia/apex/blob/master/csrc/multi_tensor_adam.cu). The kernel fuses the moment updates, bias correction, and weight decay into a single pass — no intermediate tensors are written to global memory.\n\n### Algorithm\n\nFor each parameter `i` at timestep `t`:\n\n```\nm[i] = β₁ · m[i] + (1 - β₁) · grad[i]\nv[i] = β₂ · v[i] + (1 - β₂) · grad[i]²\nm̂ = m[i] / (1 - β₁ᵗ)\nv̂ = v[i] / (1 - β₂ᵗ)\nparam[i] -= lr · (m̂ / (√v̂ + ε) + weight_decay · param[i])\n```\n\nThe bias correction terms `1 - β₁ᵗ` and `1 - β₂ᵗ` are computed once on the host and passed as `beta1_correction` / `beta2_correction` to avoid redundant `powf` calls per thread.\n\n### Kernel Variants\n\n| Kernel | Key Technique | Details |\n|--------|--------------|---------|\n| `adamw_kernel1` | Naive | Direct translation of the math. Each global-memory value is loaded/stored multiple times. |\n| `adamw_kernel2` | Register caching + `lerp` | Loads `grad`, `m`, `v` into registers once. Uses optimized linear interpolation for moment updates. |\n\nThe `lerp` device function computes `start + weight * (end - start)` using two FMA operations instead of three arithmetic ops:\n\n```cuda\n__device__ inline float lerp(float start, float end, float weight) {\n    return fma(weight, end, fma(-weight, start, start));\n}\n```\n\nThis is mathematically equivalent to `β * old + (1-β) * new` but maps to two hardware FMA instructions.\n\n### Dispatch\n\n`adamw()` computes the bias-correction scalars on the host, then dispatches to `adamw_dispatch1` or `adamw_dispatch2`. Both launch with a fixed block size of 512 threads and a grid sized via `ceil_div(num_parameters, 512)`.\n\n### Limitations\n\n- **amsgrad=True** is not yet supported.\n- Only FP32 is implemented (no FP16/BF16 support yet).\n- No thread coarsening or ILP (instruction-level parallelism) optimization.\n\n---\n\n## Fused Classifier (`classifier_fused.cu`)\n\nFuses softmax, cross-entropy loss, and logit gradient computation into one or two passes over the logits tensor. The key insight: the full `(B, T, V)` probability tensor never needs to be materialized in global memory. Probabilities are computed in registers and immediately consumed for loss and gradient calculation.\n\nThis is only possible when `dloss` is known in advance — which is almost always the case (constant `1/(B*T)` in pretraining, or a pre-determined mask in fine-tuning).\n\n### Data Layout\n\n- **logits**: shape `(B*T, P)` where `P` is the padded vocab size (`V` rounded up to a multiple of 64 for alignment)\n- **targets**: shape `(B*T,)` — integer indices into the vocab\n- **losses**: shape `(B*T,)` — scalar loss per position\n- **dlogits**: shape `(B*T, P)` — gradient of loss w.r.t. logits\n- **dlosses**: shape `(B*T,)` or `NULL` — upstream gradient; defaults to `1/(B*T)` when NULL\n\n### Online Softmax\n\nAll kernels use the online softmax algorithm (from [\"Online normalizer calculation for softmax\"](https://arxiv.org/abs/1805.02867)) to compute the max value and sum in a single pass:\n\n```cuda\nfloat old_maxval = maxval;\nmaxval = fmaxf(maxval, v);\nsumval *= expf(old_maxval - maxval);\nsumval += expf(v - maxval);\n```\n\nThis avoids a two-pass approach (one for max, one for sum) and is numerically stable.\n\n### Kernel Variants\n\n| Kernel | Threading Model | Softmax Prep | Load Width | Key Optimizations |\n|--------|----------------|--------------|------------|-------------------|\n| `fused_classifier_kernel1` | Warp-per-row | `prepare_softmax` (warp shuffle) | Scalar | Cooperative groups warp reduce |\n| `fused_classifier_kernel2` | Block-per-row | `prepare_softmax_blockwide` | `float4` (128-bit) | Shared memory cross-warp reduce, `__ldcs` for 2nd logits read |\n| `fused_classifier_kernel3` | Block-per-row | `prepare_softmax_blockwide_nofloat4` | Scalar | Same as kernel2 without float4 |\n| `fused_classifier_kernel4` | Block-per-row | `prepare_softmax_blockwide2` | `x128` packed | `load128cs` streaming loads, `floatX` type support |\n| `fused_classifier_kernel5` | Block-per-row | `prepare_softmax_blockwide3` | `x128` packed | `__launch_bounds__(1024)`, template flags for optional writes, split aligned/unaligned loops, `store128cs` streaming stores |\n\n**Kernel 1** assigns one warp per row. Multiple rows are processed per block (e.g., 4 warps in a 128-thread block handle 4 rows). The `prepare_softmax` function uses cooperative_groups `cg::reduce` for warp-level max and sum.\n\n**Kernels 2–5** assign one entire block per row, enabling up to 1024 threads to cooperatively process a single vocab row. This is critical for large vocabularies (V ≈ 50257) where a single warp cannot cover all elements efficiently.\n\n**Kernel 5** is the most optimized variant:\n- Template parameters `WriteLogits` and `WriteProbs` eliminate dead stores at compile time.\n- The main loop processes elements in multiples of `x128::size` (8 for FP32, 16 for FP16/BF16) without bounds checking. A separate tail loop handles the remaining unaligned elements.\n- `store128cs` uses cache-streaming stores to avoid polluting the L2 cache when writing dlogits (which will not be read again soon).\n- `__launch_bounds__(1024, MAX_1024_THREADS_BLOCKS)` gives the compiler register-allocation hints.\n\n### Reduction Strategy (Block-wide)\n\nFor kernels 2–5, the block-wide softmax reduction uses a three-phase approach:\n\n1. **Warp-level reduce** via `cg::reduce` or `warpReduceMax`/`warpReduceSum` (shuffle instructions)\n2. **Cross-warp reduce** via shared memory: thread 0 of each warp writes its result; all threads read and do a final warp reduce\n3. **Final warp reduce** on the shared-memory values\n\nThis produces cleaner PTX assembly than a single multi-warp `cg::reduce` call.\n\n### FP16/BF16 Support\n\nKernels 4 and 5 support `floatX` (configured at compile time via `ENABLE_BF16` or `ENABLE_FP16`). The softmax accumulation is always done in FP32 for numerical stability; only storage uses the reduced precision. Note: kernels 4/5 with FP16/BF16 are currently for performance testing only — format conversions are not fully implemented.\n\n---\n\n## Global Norm (`global_norm.cu`)\n\nComputes the squared L2 norm of an entire parameter buffer in a single cooperative operation across all SMs. This is used for gradient clipping in training.\n\n### CPU Reference\n\n`global_norm_cpu` accumulates in `double` precision to provide an accurate numerical baseline.\n\n### Grid Sizing Strategy\n\nAll launchers fill the GPU with exactly the number of blocks that can run concurrently:\n\n```cuda\nconst int grid_size = maxThreadsPerMultiProcessor * multiProcessorCount / block_size;\n```\n\nNo `DIV_CEIL` is used deliberately. Launching one block too many causes a second wave, which only starts after the first wave finishes — catastrophic for a reduction kernel where all blocks must contribute. Being one block short is a negligible performance loss.\n\n### Kernel Variants\n\n| Kernel | Reduction Level | Atomic Strategy | Determinism |\n|--------|----------------|-----------------|-------------|\n| `norm_kernel1` | Block (shared mem + warp) | 1 `atomicAdd` per block | No |\n| `norm_kernel2` | Warp only | 1 `atomicAdd` per warp | No |\n| `norm_kernel3` | Block via `blockReduce` | 1 `atomicAdd` per block | No |\n| `norm_kernel4` | Block via `blockReduce` | None (two-pass) | **Yes** |\n\n**Kernel 1** reduces within each block using shared memory and warp-level `cg::reduce`, then thread 0 of warp 0 performs a single `atomicAdd` per block.\n\n**Kernel 2** skips shared memory entirely — each warp does its own `atomicAdd`. This results in more atomics (one per warp instead of one per block) but avoids shared-memory synchronization overhead. On GPUs with many SMs, this can be ~6,900 atomic operations for a typical configuration.\n\n**Kernel 3** uses the `blockReduce` helper (defined in `common.h`) which combines warp shuffle reductions with shared memory, producing cleaner code.\n\n**Kernel 4** is the deterministic variant. Instead of `atomicAdd`, each block writes its partial sum to `out[blockIdx.x]`. A second kernel, `global_norm_aggregate_kerne
