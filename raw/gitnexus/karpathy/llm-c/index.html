nly reference (~1,000 lines). Explicit forward/backward C functions with OpenMP parallelism. The algorithmic baseline that all optimized variants derive from. |\n| [train_gpt2.cu](train_gpt2.cu.md) | Mainline CUDA implementation. Single-allocation pointer-arithmetic memory layout, custom kernels, cuBLAS, multi-GPU via ZeRO-1, checkpointing, and HellaSwag evaluation. The production training path. |\n| [train_gpt2_fp32.cu](train_gpt2_fp32.cu.md) | Self-contained CUDA FP32 trainer with custom kernels for every operation. No framework or cuDNN dependency — pure CUDA + cuBLAS. |\n\n### Correctness Testing\n\nEach test harness loads the same PyTorch-generated `.bin` reference data and compares forward pass, backward pass, and optimizer outputs against it:\n\n| Module | Validates |\n|--------|-----------|\n| [test_gpt2.c](test_gpt2.c.md) | `train_gpt2.c` — CPU forward/backward/update vs. PyTorch reference |\n| [test_gpt2.cu](test_gpt2.cu.md) | `train_gpt2.cu` — CUDA numerical correctness + checkpoint determinism |\n| [test_gpt2_fp32.cu](test_gpt2_fp32.cu.md) | `train_gpt2_fp32.cu` — FP32 CUDA vs. PyTorch (tolerance 1e-2) |\n\n### Profiling\n\n| Module | Role |\n|--------|------|\n| [profile_gpt2.cu](profile_gpt2.cu.md) | Minimal single-step CUDA harness designed as a clean target for NVIDIA Nsight Compute (`ncu`). |\n| [profile_gpt2cu.py](profile_gpt2cu.py.md) | Python wrapper that invokes `ncu` on the profiling binary, producing an `.ncu-rep` report and a console summary of per-kernel bandwidth and tensor core utilization. |\n\n### Infrastructure\n\n| Module | Role |\n|--------|------|\n| [Makefile](Makefile.md) | Build system. Compiles all CPU and GPU targets with auto-detection of OpenMP, cuDNN, NCCL, and MPI. Supports Linux, macOS, and Windows. |\n| [requirements.txt](requirements.txt.md) | Python dependencies for the PyTorch reference path. |\n| [scripts](scripts.md) | Shell scripts encoding exact hyperparameters and hardware estimates for training GPT-2 124M through GPT-3 1558M on FineWeb datasets. |\n| [multi_node](multi_node.md) | Multi-node distributed launch scripts (filesystem, MPI, and TCP process initialization backends). |\n| [dev](dev.md) | CI loss regression checker (`loss_checker_ci.py`) and training log visualization. Offline utilities, not part of the runtime. |\n\n## Key Cross-Module Workflows\n\n**Correctness validation pipeline.** [train_gpt2.py](train_gpt2.py.md) exports model weights and a debug-state snapshot (inputs, expected logits, expected gradients, expected updated weights) to `.bin` files. The test harnesses — [test_gpt2.c](test_gpt2.c.md), [test_gpt2.cu](test_gpt2.cu.md), and [test_gpt2_fp32.cu](test_gpt2_fp32.cu.md) — each load these artifacts, run their respective implementation's forward/backward/update, and compare within tolerance. A passing test confirms the entire training loop is numerically equivalent to PyTorch.\n\n**Profiling pipeline.** [profile_gpt2.cu](profile_gpt2.cu.md) compiles a single-step training harness. [profile_gpt2cu.py](profile_gpt2cu.py.md) wraps it with `ncu` to capture kernel-level metrics — memory throughput, occupancy, warp efficiency, and tensor core utilization — without the noise of multi-epoch iteration.\n\n**Multi-node training.** [multi_node](multi_node.md) scripts compile [train_gpt2.cu](train_gpt2.cu.md), distribute the binary to worker nodes, configure NCCL, and launch distributed training across three process-init backends (shared filesystem, MPI, TCP sockets).\n\n**CI regression detection.** After a training run, [dev/loss_checker_ci.py](dev.md) validates loss values against hardcoded references, catching numerical regressions from code changes.","layernorm-tutorial":"# LayerNorm Tutorial\n\n# LayerNorm Tutorial\n\n## Overview\n\nThis module provides a step-by-step walkthrough of Layer Normalization — one of the foundational layers in Transformer-based language models. It implements both the forward and backward passes from scratch in two forms: a PyTorch version for clarity and verification, and a pure C version that strips away the tensor abstraction to expose the raw memory layout and pointer arithmetic.\n\nThe tutorial serves as the template for how every layer in the training codebase is developed: derive the math, implement in PyTorch, verify against autograd, port to C, and validate against the PyTorch reference.\n\n## Workflow\n\n```mermaid\nflowchart LR\n    A[layernorm.py] -->|generates ln.bin| B[layernorm.c]\n    A -->|verifies against| C[PyTorch Autograd]\n    B -->|reads ln.bin| D[check_tensor]\n    D -->|validates| E[C forward/backward]\n```\n\nRunning `layernorm.py` produces two outputs: it prints gradient errors against PyTorch autograd, and it writes a binary file `ln.bin` containing all reference tensors. The C program reads `ln.bin`, recomputes everything independently, and compares element-by-element.\n\n## File Inventory\n\n| File | Language | Purpose |\n|------|----------|---------|\n| `layernorm.py` | Python | PyTorch reference implementation, autograd verification, binary data generation |\n| `layernorm.c` | C | Standalone forward/backward implementation, reads `ln.bin` for correctness checking |\n| `layernorm.md` | Markdown | Prose tutorial explaining the math, design decisions, and differences from inference |\n\n## Build and Run\n\n```bash\n# Step 1: generate reference data (requires PyTorch)\npython layernorm.py\n\n# Step 2: compile the C version\ngcc layernorm.c -o layernorm -lm\n\n# Step 3: run and verify\n./layernorm\n```\n\nThe Python script writes `ln.bin` to the current directory. The C program expects this file to exist and will exit with an error if it cannot open it.\n\n## Forward Pass\n\n### Mathematical Form\n\n$$\\text{LayerNorm}(x) = w \\odot \\frac{x - \\mu}{\\sqrt{\\sigma^2 + \\epsilon}} + b$$\n\nwhere $\\mu$ is the mean, $\\sigma^2$ is the variance (both computed over the channel dimension), $\\epsilon = 10^{-5}$ prevents division by zero, and $w$, $b$ are learnable parameters.\n\n### Algorithm\n\nFor each position `(b, t)` in the batch/time grid:\n\n1. **Mean**: $\\mu = \\frac{1}{C}\\sum_{i=0}^{C-1} x_i$\n2. **Variance**: $\\sigma^2 = \\frac{1}{C}\\sum_{i=0}^{C-1}(x_i - \\mu)^2$\n3. **Reciprocal std**: $s = (\\sigma^2 + \\epsilon)^{-1/2}$\n4. **Normalize, scale, shift**: $o_i = s \\cdot (x_i - \\mu) \\cdot w_i + b_i$\n\nThe mean and reciprocal standard deviation are cached for the backward pass.\n\n### PyTorch Implementation\n\n`LayerNorm.forward(x, w, b)` in `layernorm.py` implements the above using native PyTorch operations (`sum`, subtraction, exponentiation). It returns the output tensor and a `cache` tuple of `(x, w, mean, rstd)`.\n\n### C Implementation\n\n`layernorm_forward(out, mean, rstd, inp, weight, bias, B, T, C)` in `layernorm.c` implements the same algorithm with explicit loops and pointer arithmetic. The key detail is how 3D tensor indexing maps to the 1D storage:\n\n```\noffset for (b, t, c) = b * T * C + t * C + c\n```\n\nThe channel dimension `C` is the innermost (stride-1) dimension. A pointer to position `(b, t)` is computed as `inp + b * T * C + t * C`, and the next `C` elements are the channels at that position.\n\n## Backward Pass\n\n### Derivation\n\nThe backward pass receives `dout` (gradient of loss with respect to the output) and must compute gradients for the input (`dx`), weights (`dw`), and biases (`db`). Working through the chain rule and simplifying analytically yields three terms for the input gradient:\n\n$$dx_i = rstd \\cdot \\left( dnorm_i - \\frac{1}{C}\\sum_j dnorm_j - \\hat{x}_i \\cdot \\frac{1}{C}\\sum_j dnorm_j \\cdot \\hat{x}_j \\right)$$\n\nwhere $dnorm_i = w_i \\cdot dout_i$ and $\\hat{x}_i = (x_i - \\mu) \\cdot rstd$ is the normalized input.\n\n### PyTorch Implementation\n\n`LayerNorm.backward(dout, cache)` computes:\n\n- `db = dout.sum((0, 1))` — sum over batch and time\n- `dw = (dout * norm).sum((0, 1))` — sum of output gradient times normalized input\n- `dnorm = dout * w` — chain rule through the weight multiplication\n- `dx = rstd * (dnorm - dnorm.mean(-1, keepdim=True) - norm * (dnorm * norm).mean(-1, keepdim=True))`\n\n### C Implementation\n\n`layernorm_backward(dinp, dweight, dbias, dout, inp, weight, mean, rstd, B, T, C)` performs the same computation in two passes per `(b, t)` position:\n\n**First pass** — compute the two reduction terms:\n- `dnorm_mean = (1/C) * Σ(weight[i] * dout[i])`\n- `dnorm_norm_mean = (1/C) * Σ(weight[i] * dout[i] * norm[i])`\n\n**Second pass** — accumulate all three gradients:\n- `dbias[i] += dout[i]`\n- `dweight[i] += norm[i] * dout[i]`\n- `dinp[i] += rstd * (dnorm_i - dnorm_mean - norm[i] * dnorm_norm_mean)`\n\nAll gradient accumulations use `+=` rather than `=`. This is the correct convention for backward passes: if a variable is consumed multiple times in the forward graph, gradients from each use must sum. Even though this codebase doesn't have such branching, the `+=` pattern is maintained for correctness.\n\n## Checkpointing Tradeoff\n\nThe `cache` returned by the forward pass stores `(x, w, mean, rstd)` but **not** the normalized activations `norm`. The backward pass recomputes `norm = (x - mean) * rstd` from the cached values. This is a deliberate tradeoff:\n\n| Cached | Shape | Cost to recompute |\n|--------|-------|-------------------|\n| `mean`, `rstd` | `B × T` | Expensive (requires full reduction) |\n| `norm` | `B × T × C` | Cheap (elementwise from cached values) |\n\nSaving `norm` would avoid the recompute but consume `C` times more memory. This memory-vs-compute tradeoff appears throughout the codebase under the name \"checkpointing\" (unrelated to saving model weights to disk).\n\n## Verification\n\n### Python-side\n\n`layernorm.py` compares the manual backward pass against PyTorch autograd by constructing a fake loss `(out * dout).sum()` and calling `.backward()`. It prints the maximum absolute error for each gradient:\n\n```\ndx error: <tiny number>\ndw error: <tiny number>\ndb error: <tiny number>\n```\n\n### C-side\n\n`layernorm.c` reads all reference tensors from `ln.bin` (written by the Python script), recomputes forward and backward passes, and compares every element using `check_tensor(a, b, n, label)` with a tolerance of `1e-5`. Each element prints `OK` or `NOT OK` along with both values.\n\n## Comparison with RMSNorm (Inference)\n\nThis training implementation differs from the inference-only `rmsnorm` in [llama2.c](https://github.com/karpathy/llama2.c) in several ways:\n\n| Aspect | LayerNorm (training, this module) | RMSNorm (inference, llama2.c) |\n|--------|-----------------------------------|-------------------------------|\n| Mean subtraction | Yes | No — normalizes by RMS only |\n| Bias parameter | Yes | No |\n| Batch dimension | Loops over `B` | Assumed `B=1` |\n| Time dimension | Loops over `T` inside the layer | Handled by outer generation loop |\n| Backward pass | Required | Not needed |\n| Intermediate caching | Stores `mean`, `rstd` | Stores nothing |\n\nThe absence of mean subtraction and bias in RMSNorm simplifies the code significantly. The lack of batch and time loops in inference reflects the autoregressive generation pattern: tokens are produced one at a time, so each layer processes a single position per call.\n\n## Tensor Shapes\n\n| Tensor | Shape | Notes |\n|--------|-------|-------|\n| `inp` / `out` / `dout` / `dinp` | `B × T × C` | 3D activation tensors |\n| `weight` / `bias` / `dweight` / `dbias` | `C` | Shared across all positions |\n| `mean` / `rstd` | `B × T` | One scalar per (batch, time) position |\n\nThe toy example uses `B=2, T=3, C=4`. Real GPT-2 settings would be on the order of `B=8, T=1024, C=768`.","llama-training":"# LLaMA Training\n\n# LLaMA Training Module\n\n## Overview\n\nThis module implements LLaMA 3.1 training and inference in PyTorch, closely following Meta's reference implementation. It serves a dual purpose: training/fine-tuning LLaMA models and exporting model weights as binary files for initialization in a companion C implementation. The code is structured as a self-contained training script with distributed data parallel support, gradient accumulation, and validation/inference hooks.\n\nThree architectural differences distinguish this from a standard GPT-2 implementation:\n\n1. **RoPE** — Rotary Positional Encoding instead of absolute positional embeddings\n2. **GQA** — Grouped Query Attention, reducing the number of key/value heads\n3. **SwiGLU** — Swish-Gated Linear Unit activation in the MLP\n\n## Architecture\n\n```mermaid\ngraph TD\n    idx[Input Token IDs] --> wte[Token Embedding wte]\n    wte --> block0[Block 0]\n    block0 --> block1[Block 1]\n    block1 --> dots[...]\n    dots --> blockN[Block N-1]\n    blockN --> ln_f[RMSNorm ln_f]\n    ln_f --> lm_head[lm_head Linear]\n    lm_head --> logits[Logits]\n\n    subgraph \"Transformer Block\"\n        x_in[x] --> ln1[RMSNorm ln_1]\n        ln1 --> attn[CausalSelfAttention]\n        attn --> add1[+]\n        add1 --> ln2[RMSNorm ln_2]\n        ln2 --> mlp[MLP SwiGLU]\n        mlp --> add2[+]\n    end\n\n    subgraph \"CausalSelfAttention\"\n        qkv_in[x] --> c_attn[c_attn Q/K/V]\n        c_attn --> rope[Apply RoPE]\n        rope --> gqa[repeat_kv GQA]\n        gqa --> sdpa[Scaled Dot-Product Attn]\n        sdpa --> c_proj[c_proj]\n    end\n\n    subgraph \"MLP\"\n        mlp_in[x] --> c_fc[c_fc]\n        mlp_in --> c_fc2[c_fc2]\n        c_fc2 --> silu[silu]\n        silu --> mul[* gate]\n        c_fc --> mul\n        mul --> c_proj_mlp[c_proj]\n    end\n```\n\n## Configuration\n\n`LlamaConfig` is a dataclass with defaults matching the LLaMA 3.1 8B model:\n\n| Parameter | Default | Description |\n|---|---|---|\n| `block_size` | 8192 | Maximum sequence length |\n| `vocab_size` | 128256 | Vocabulary size |\n| `n_layer` | 32 | Number of transformer blocks |\n| `n_head` | 32 | Number of query attention heads |\n| `n_kv_head` | 8 | Number of key/value heads (GQA) |\n| `n_embd` | 4096 | Embedding dimension |\n| `ffn_dim_multiplier` | 1.3 | MLP hidden dimension multiplier |\n| `multiple_of` | 1024 | Round MLP hidden dim to multiple of this |\n| `norm_eps` | 1e-5 | RMSNorm epsilon |\n| `rope_theta` | 500000.0 | Base for RoPE frequency computation |\n| `use_scaled_rope` | True | Apply frequency scaling for extended context |\n| `max_gen_batch_size` | 4 | Max batch size during generation |\n| `use_kv` | True | Enable KV cache for inference |\n| `flash` | False | Use Flash Attention |\n\nThe constructor accepts `**kwargs` to override any field. It asserts that `n_kv_head <= n_head`, `n_head % n_kv_head == 0`, and `n_embd % n_head == 0`.\n\n## Model Components\n\n### RMSNorm\n\n`RMSNorm` replaces LayerNorm from GPT-2. It normalizes by the reciprocal square root of the mean of squared values, then scales by a learned weight:\n\n```python\n# _norm: x * rsqrt(mean(x^2) + eps)\n# forward: _norm(x.float()).type_as(x) * weight\n```\n\nThe computation is cast to float32 for numerical stability, then cast back to the input dtype. This matches Meta's reference implementation rather than `nn.RMSNorm` which has slightly different numeric properties.\n\n### CausalSelfAttention\n\nImplements Grouped Query Attention with RoPE and optional KV caching.\n\n**Projection:** `c_attn` projects input to `(n_head + 2 * n_kv_head) * head_dim` dimensions, then splits into Q, K, V. Q has shape `(B, T, n_head, head_dim)` while K and V have shape `(B, T, n_kv_head, head_dim)`.\n\n**RoPE:** Applied to Q and K via `apply_rotary_emb` before any attention computation.\n\n**KV Cache:** When `use_kv=True` and the model is in eval mode with `start_pos >= 0`, K and V are stored in pre-allocated static caches (`self.cache_k`, `self.cache_v`) of shape `(max_gen_batch_size, block_size, n_kv_head, head_dim)`. On subsequent forward passes, the cached values are concatenated with new K/V.\n\n**GQA:** `repeat_kv` broadcasts K and V from `n_kv_head` to `n_head` by expanding along the head dimension. The repeat factor is `n_rep = n_head // n_kv_head` (4 for the default 8B config).\n\n**Attention computation:** When `flash=True`, uses `F.scaled_dot_product_attention`. Otherwise falls back to a manual implementation that materializes the full `(T, T)` attention matrix. The causal mask is an upper-triangular boolean tensor; for Flash Attention the mask is inverted (True = attend), while the manual path uses `masked_fill_` with the original mask.\n\n### MLP with SwiGLU\n\nThe MLP hidden dimension is computed as:\n\n```\nhidden_dim = int(2 * (4 * n_embd) / 3)\nif ffn_dim_multiplier: hidden_dim = int(ffn_dim_multiplier * hidden_dim)\nhidden_dim = multiple_of * ceil(hidden_dim / multiple_of)\n```\n\nThe SwiGLU computation is:\n\n```\noutput = c_proj(silu(c_fc2(x)) * c_fc(x))\n```\n\n`c_fc2` produces the gate (passed through SiLU), `c_fc` produces the value, and their element-wise product is projected back by `c_proj`. All three linear layers are bias-free.\n\n### Block\n\nStandard pre-norm transformer block:\n\n```\nx = x + attn(ln_1(x), freqs_cis, start_pos, mask)\nx = x + mlp(ln_2(x))\n```\n\n### LLaMA (Top-Level Model)\n\nThe `LLaMA` module assembles:\n- `transformer.wte` — token embedding\n- `transformer.h` — list of `Block` modules\n- `transformer.ln_f` — final RMSNorm\n- `lm_head` — output projection (no bias)\n\nRoPE frequencies (`freqs_cis`) are precomputed at initialization for `block_size * 2` positions and sliced during forward passes to support KV-cached generation.\n\n**Forward pass** (`forward`):\n1. Embed tokens via `wte`\n2. Slice `freqs_cis` for positions `[start_pos : start_pos + t]`\n3. Create upper-triangular causal mask\n4. Pass through all blocks\n5. Apply final RMSNorm\n6. If `targets` provided: compute logits for all positions and cross-entropy loss (ignoring index -1). Otherwise: compute logits only for the last position (inference optimization).\n7. Return `(logits, loss)` — logits can be suppressed via `return_logits=False` for performance.\n\n## Rotary Positional Encoding (RoPE)\n\n### precompute_freqs_cis\n\n```python\nprecompute_freqs_cis(dim, end, theta=10000.0, use_scaled=False)\n```\n\nComputes complex exponentials `e^(i * t * freq)` for all positions up to `end` and all frequency bands. `dim` is the head dimension (`n_embd // n_head`). Returns a tensor of shape `(end, dim // 2)` in complex64.\n\nWhen `use_scaled=True`, `apply_scaling` adjusts frequencies for extended context lengths (8K → 64K scaling per LLaMA 3.1):\n\n- Frequencies with wavelength < `high_freq_wavelen` (2048) are kept unchanged\n- Frequencies with wavelength > `low_freq_wavelen` (8192) are divided by `scale_factor` (8)\n- Frequencies in between are smoothly interpolated\n\n### apply_rotary_emb\n\nApplies RoPE by treating Q and K as complex numbers and multiplying element-wise with the precomputed `freqs_cis`. The reshaping via `reshape_for_broadcast` ensures the frequency tensor broadcasts correctly across batch and head dimensions.\n\n### repeat_kv\n\nBroadcasts K/V tensors from `n_kv_heads` to `n_heads` for GQA. Uses expand+reshape instead of `torch.repeat_interleave` for the same effect. Returns early (no-op) when `n_rep == 1` (standard MHA).\n\n## Tokenizer\n\nThe `Tokenizer` class wraps tiktoken with LLaMA 3.1-specific configuration:\n\n- **Pattern:** Custom regex splitting contractions, Unicode letters, numbers, and special characters\n- **Special tokens:** 11 defined tokens (BOS, EOS, pad, step, header markers, EOM, EOT, python_tag) plus 245 reserved special tokens, totaling 256 special tokens\n- **Key token IDs:** `bos_id`, `eos_id`, `eot_id`, `eom_id`, `python_tag_id`, `pad_id` (128004)\n- **Stop tokens:** BOS and EOS for generation termination\n\n**Encoding** handles tiktoken's limits by splitting input into chunks of at most 400,000 characters, and further splitting runs of consecutive whitespace/non-whitespace exceeding 25,000 characters. BOS/EOS tokens are optionally prepended/appended.\n\n**Decoding** delegates directly to tiktoken's decode.\n\n## Data Loading\n\n### DistributedShardedDataLoader\n\nA minimal distributed data loader that reads binary shard files. Each shard has a 1024-byte header (256 int32 values) with magic number `20240801`, version `7`, and token count, followed by `uint32` token data.\n\n**Distributed behavior:** Each process reads the same shard but starts at offset `process_rank * B * T` and advances by `B * T * num_processes` per batch, ensuring no overlap.\n\n**Shard management:** When the current position would overflow the shard, `advance()` loads the next shard (cycling). `reset()` returns to shard 0 without reloading if already loaded.\n\n**Batch format:** Each batch returns `(x, y)` where `x` is tokens `[0:T]` and `y` is tokens `[1:T+1]` (next-token prediction), both shaped `(B, T)`.\n\n## Training\n\n### Distributed Setup\n\nUses PyTorch's `torchrun`-based DDP with NCCL backend. The script detects DDP via the `RANK` environment variable. Each process is assigned a CUDA device by `LOCAL_RANK`. The master process (rank 0) handles logging, checkpointing, and sampling.\n\n### Gradient Accumulation\n\nThe effective batch size is controlled by `--total_batch_size` (in tokens). The number of gradient accumulation steps is computed as:\n\n```\ngrad_accum_steps = total_batch_size / (B * T * ddp_world_size)\n```\n\nLoss is divided by `grad_accum_steps` so that accumulated gradients produce a mean rather than a sum. DDP gradient synchronization is disabled for all micro-steps except the last via `model.require_backward_grad_sync`.\n\n### Optimizer\n\n`configure_optimizers` creates AdamW with two parameter groups:\n- **Decay group:** All 2D+ tensors (weight matrices, embeddings) — receives `weight_decay`\n- **No-decay group:** All <2D tensors (RMSNorm weights) — zero weight decay\n\nSupports fused AdamW on CUDA and `ZeroRedundancyOptimizer` (ZeRO stage 1) for memory-efficient distributed training.\n\n### Learning Rate Schedule\n\nCosine decay with linear warmup:\n\n1. **Warmup** (`it < warmup_iters`): linear ramp from 0 to `learning_rate`\n2. **Decay** (`warmup_iters < it < num_iterations`): cosine decay from `learning_rate` to `min_lr = learning_rate * learning_rate_decay_frac`\n3. **Post-decay** (`it > num_iterations`): constant at `min_lr`\n\n### Training Loop\n\nEach iteration:\n1. Zero gradients\n2. Optionally reset loader (for `--overfit_single_batch`)\n3. Accumulate gradients over `grad_accum_steps` micro-batches\n4. All-reduce loss across DDP ranks\n5. Clip gradient norm to `--grad_clip`\n6. Set per-iteration learning rate\n7. Step optimizer\n8. Log timing and throughput (tokens/second)\n\nValidation loss is evaluated every `--val_loss_every` steps by averaging over `--val_max_steps` batches. Text sampling runs every `--sample_every` steps on the master process.\n\n## Inference / Generation\n\n`LLaMA.generate` performs autoregressive generation with KV caching:\n\n1. **Prefill:** Tokenize prompts and pad to uniform length. Run a full forward pass if the shortest prompt fills the entire context.\n2. **Decode loop:** For each position from `min_prompt_len` to `total_len`:\n   - Forward pass with `start_pos` for KV cache indexing\n   - Sample next token via top-p nucleus sampling (or argmax if temperature=0)\n   - Replace token only where the prompt hasn't already provided one (via `input_text_mask`)\n   - Track EOS reached per sequence\n   - Break early if all sequences have hit a stop token\n3. **Post-processing:** Trim output to `max_gen_len`, cut at stop tokens, optionally exclude the prompt (`echo=False`)\n\n`sample_top_p` sorts probabilities descending, computes cumulative sum, masks tokens where `cumsum - current > p`, renormalizes, and samples from the filtered distribution.\n\n## Weight Loading\n\n### from_pretrained_llama3_hf\n\nLoads the `meta-llama/Meta-Llama-3.1-8B` model from HuggingFace. Key adaptation via `adapt_llama_state_dict_keys_hf`:\n\n- Renames layer norm keys (`input_layernorm` → `ln_1`, `post_attention_layernorm` → `ln_2`)\n- Merges separate Q/K/V projections into a single `c_attn.weight` (concatenated along dim 0)\n- **Unpermutes** Q and K weights to undo HuggingFace's RoPE-related permutation (see HuggingFace's conversion script)\n- Maps FFN keys: `gate_proj` → `c_fc2`, `up_proj` → `c_fc`, `down_proj` → `c_proj`\n\n### from_pretrained_llama3_meta\n\nLoads from Meta's native checkpoint format. Key adaptation via `adapt_llama_state_dict_keys`:\n\n- Same norm renaming as HF\n- Merges Q/K/V into `c_attn.weight` (no unpermutation needed)\n- Maps FFN keys: `w1` → `c_fc2`, `w3` → `c_fc`, `w2` → `c_proj`\n\nBoth methods load weights in BFloat16 on CUDA for speed, then restore the default tensor type.\n\n## C Bridge (Weight Export)\n\nThe module exports model state as binary files for verification against a C implementation.\n\n### write_model\n\nWrites a standalone model checkpoint with a 1024-byte header (256 int32 values):\n\n| Header Index | Value |\n|---|---|\n| 0 | Magic: 20240803 |\n| 1 | Version: 3 (fp32) or 5 (bf16) |\n| 2–7 | block_size, vocab_size, n_layer, n_head, n_kv_head, n_embd |\n| 8–12 | ffn_dim_multiplier, multiple_of, norm_eps, rope_theta, use_scaled_rope |\n| 13 | max_gen_batch_size |\n| 14–15 | Major/minor version (3, 1) |\n\nParameters are written in a fixed order: `wte`, per-layer (`ln_1`, `c_attn`, `c_proj`, `ln_2`, `c_fc`, `c_fc2`, `c_proj`), `ln_f`, `lm_head`. BFloat16 tensors are reinterpreted as int16 for numpy serialization since numpy lacks a native bf16 dtype.\n\n### write_state\n\nWrites a debug state file containing input tokens, targets, logits, loss, and all parameter gradients (always in fp32). Used to verify numerical correctness of the C implementation against the PyTorch reference.\n\n## Command-Line Arguments\n\n| Argument | Default | Description |\n|---|---|---|\n| `--use_hf` | 1 | Load from HuggingFace (1) or Meta checkpoint (0) |\n| `--ckpt_dir` | None | Path to Meta checkpoint directory |\n| `--tokenizer_path` | None | Path to Meta tokenizer model file |\n| `--input_bin` | `tiny_shakespeare_val.bin` | Training data shard pattern |\n| `--input_val_bin` | \"\" | Validation data shard pattern |\n| `--output_dir` | \"\" | Directory for logs and checkpoints |\n| `--model` | `meta-llama/Meta-Llama-3.1-8B` | HuggingFace model identifier |\n| `--batch_size` | 4 | Micro-batch size |\n| `--sequence_length` | 64 | Sequence length per micro-batch |\n| `--total_batch_size` | 256 | Total batch size in tokens |\n| `--num_iterations` | 10 | Training iterations |\n| `--inference_only` | 0 | Skip training, only run inference |\n| `--learning_rate` | 1e-5 | Peak learning rate |\n| `--warmup_iters` | 0 | Linear warmup steps |\n| `--learning_rate_decay_frac` | 1.0 | Fraction of LR at end of decay |\n| `--weight_decay` | 0.0 | Weight decay for 2D+ parameters |\n| `--grad_clip` | 1.0 | Gradient norm clipping threshold |\n| `--val_loss_every` | 0 | Validation evaluation frequency |\n| `--val_max_steps` | 20 | Batches to average for validation |\n| `--sample_every` | 0 | Text generation frequency |\n| `--overfit_single_batch` | 1 | Reset loader each step (overfitting test) |\n| `--tensorcores` | 0 | Enable TF32 for matmuls |\n| `--device` | \"\" | Override device autodetection |\n| `--compile` | 0 | Apply `torch.compile` |\n| `--dtype` | bfloat16 | Floating point precision |\n| `--zero_stage` | 0 | ZeRO optimizer stage (0/1) |\n| `--write_tensors` | 0 | Export model weights and debug state |","model-evaluation-export":"# Model Evaluation & Export\n\n# Model Evaluation & Export\n\nThis module bridges llm.c-trained GPT-2 models and the HuggingFace ecosystem. It converts llm.c binary checkpoints into loadable HuggingFace models, then evaluates them against the same benchmark suite used by the Open LLM Leaderboard.\n\n## Pipeline Overview\n\n```mermaid\nflowchart LR\n    A[model.bin] -->|export_hf.py| B[HuggingFace Model Dir]\n    B -->|run_eval.sh| C[lm-evaluation-harness]\n    C --> D[results/ JSON files]\n    D -->|summarize_eval.py| E[Score Summary]\n    B -->|push_to_hub| F[HuggingFace Hub]\n```\n\nThe workflow is strictly sequential: export first, then evaluate, then summarize.\n\n---\n\n## Export: `export_hf.py`\n\nConverts a GPT-2 model from llm.c's binary format into a standard HuggingFace `GPT2LMHeadModel`, complete with tokenizer and safetensors weights.\n\n### Binary Format\n\nThe input `.bin` file starts with a 256-int32 header:\n\n| Offset | Field | Description |\n|--------|-------|-------------|\n| 0 | Magic number | Must be `20240326` |\n| 1 | Version | `3` = float32, `5` = bfloat16 (stored as int16) |\n| 2 | `maxT` | Maximum sequence length |\n| 3 | `V` | Vocab size (actual) |\n| 4 | `L` | Number of transformer layers |\n| 5 | `H` | Number of attention heads |\n| 6 | `C` | Hidden dimension (channels) |\n| 7 | `Vp` | Padded vocab size |\n\nAfter the header, all parameters are stored contiguously in a fixed order (see `shapes` dict in `convert()`). Version 3 files store float32 arrays; version 5 files store bfloat16 values packed as int16. The padded vocab rows (`Vp - V` extra rows) are stripped during loading to match GPT-2's actual vocabulary.\n\n### Weight Mapping\n\nThe llm.c parameter names map to HuggingFace state dict keys as follows:\n\n| llm.c key | HuggingFace key | Transpose |\n|-----------|----------------|-----------|\n| `wte` | `transformer.wte.weight` | No |\n| `wpe` | `transformer.wpe.weight` | No |\n| `ln1w[i]` | `transformer.h.{i}.ln_1.weight` | No |\n| `ln1b[i]` | `transformer.h.{i}.ln_1.bias` | No |\n| `qkvw[i]` | `transformer.h.{i}.attn.c_attn.weight` | **Yes** |\n| `qkvb[i]` | `transformer.h.{i}.attn.c_attn.bias` | No |\n| `attprojw[i]` | `transformer.h.{i}.attn.c_proj.weight` | **Yes** |\n| `attprojb[i]` | `transformer.h.{i}.attn.c_proj.bias` | No |\n| `ln2w[i]` | `transformer.h.{i}.ln_2.weight` | No |\n| `ln2b[i]` | `transformer.h.{i}.ln_2.bias` | No |\n| `fcw[i]` | `transformer.h.{i}.mlp.c_fc.weight` | **Yes** |\n| `fcb[i]` | `transformer.h.{i}.mlp.c_fc.bias` | No |\n| `fcprojw[i]` | `transformer.h.{i}.mlp.c_proj.weight` | **Yes** |\n| `fcprojb[i]` | `transformer.h.{i}.mlp.c_proj.bias` | No |\n| `lnfw` | `transformer.ln_f.weight` | No |\n| `lnfb` | `transformer.ln_f.bias` | No |\n\nThe four transposed weights (`qkvw`, `attprojw`, `fcw`, `fcprojw`) reflect a layout difference: llm.c stores them as `(out, in)` while HuggingFace expects `(in, out)` for `Conv1D` layers.\n\nWeight tying is enforced: `lm_head.weight` is set to the same tensor as `transformer.wte.weight`.\n\n### Tensor Decoding\n\nTwo helper functions handle the format-specific decoding, both returning float32 tensors:\n\n- **`tensor_bf16(data_int16, transpose=False)`** — Reinterprets int16 bytes as bfloat16, then converts to float32. Used for version 5 files.\n- **`tensor_fp32(data_float32, transpose=False)`** — Passes float32 data through directly. Used for version 3 files.\n\nBoth accept an optional `transpose` flag that swaps axes before conversion.\n\n### CLI Usage\n\n```bash\npython export_hf.py --input model.bin --output output_dir [--dtype bfloat16] [--push false] [--spin true]\n```\n\n| Argument | Default | Description |\n|----------|---------|-------------|\n| `--input` / `-i` | *required* | Path to llm.c `.bin` checkpoint |\n| `--output` / `-o` | *required* | Output directory for HuggingFace model files |\n| `--dtype` / `-d` | `bfloat16` | Output dtype: `bfloat16` or `float32` |\n| `--push` / `-p` | `False` | Push model and tokenizer to HuggingFace Hub |\n| `--spin` / `-s` | `True` | Run a quick generation test after export |\n\n### Quick Validation (`spin`)\n\nWhen `--spin` is enabled (the default), `spin()` loads the exported model with FlashAttention 2 on CUDA and generates 64 tokens from the prompt `\"During photosynthesis in green plants\"`. This provides a fast sanity check that the export succeeded and the model produces coherent text.\n\n### Hub Upload\n\nTo push to HuggingFace Hub, install the CLI and authenticate first:\n\n```bash\npip install -U \"huggingface_hub[cli]\"\nhuggingface-cli login\n```\n\nThen pass `--push true`. Both the model and the GPT-2 tokenizer will be uploaded.\n\n---\n\n## Evaluation: `run_eval.sh`\n\nRuns the six benchmark tasks used by the [Open LLM Leaderboard](https://huggingface.co/spaces/open-llm-leaderboard/open_llm_leaderboard) via the EleutherAI `lm-evaluation-harness`.\n\n### Prerequisites\n\nThe harness must be checked out at a pinned commit for reproducibility:\n\n```bash\ngit clone https://github.com/EleutherAI/lm-evaluation-harness/\ncd lm-evaluation-harness\ngit checkout b281b0921b636bc36ad05c0b0b0763bd6dd43463\npip install -e .\ncd ..\n```\n\n### Usage\n\nRun from the **root of the llm.c repo**:\n\n```bash\n./dev/eval/run_eval.sh <model_path_or_name> <result_name>\n```\n\n- `model_path_or_name` — Local directory (output of `export_hf.py`) or a HuggingFace repo ID (e.g., `openai-community/gpt2`)\n- `result_name` — Folder name under `lm-evaluation-harness/results/` where JSON results are written\n\nFor long-running evaluations, use `nohup` or a `screen` session:\n\n```bash\nnohup ./dev/eval/run_eval.sh ./my_model my_result > run.txt 2> err.txt &\n```\n\n### Benchmark Tasks\n\nThe script runs each task individually with its standard few-shot setting:\n\n| Task | Few-shot | Metric | Output file |\n|------|----------|--------|-------------|\n| TruthfulQA | 0 | `mc2` | `truthfulqa_0shot.json` |\n| Winogrande | 5 | `acc` | `winogrande_5shot.json` |\n| ARC-Challenge | 25 | `acc_norm` | `arc_challenge_25shot.json` |\n| HellaSwag | 10 | `acc_norm` | `hellaswag_10shot.json` |\n| GSM8k | 5 | `acc` | `gsm8k_5shot.json` |\n| MMLU | 5 | `acc` | `mmlu_5shot.json` |\n\nMMLU is evaluated across all 57 subtasks (listed explicitly in the script) with 5-shot prompting.\n\nAll tasks use `--model hf-causal-experimental`, batch size 1, no caching, and CUDA.\n\n### FlashAttention 2 Requirement\n\nWhen evaluating bfloat16 models, add the following to the exported model's `config.json`:\n\n```json\n\"_attn_implementation\": \"flash_attention_2\"\n```\n\nWithout FlashAttention 2, bfloat16 evaluation scores are significantly lower. This is a known issue and the config edit is the current workaround.\n\n---\n\n## Summarization: `summarize_eval.py`\n\nRe-prints evaluation scores from the JSON result files produced by `run_eval.sh`. Useful when the original console output is no longer available.\n\n### Usage\n\n```bash\npython dev/eval/summarize_eval.py <result_dir>\n```\n\nWhere `result_dir` is the path under `lm-evaluation-harness/results/` (e.g., `lm-evaluation-harness/results/result774M`).\n\n### Output\n\nReads each of the six expected JSON files, extracts the appropriate metric, and prints per-task percentages plus an average:\n\n```\n----------------------------------------\narc_challenge_25shot.json      : 30.4608\ngsm8k_5shot.json               : 0.1516\nhellaswag_10shot.json          : 57.8072\nmmlu_5shot.json                : 25.8682\ntruthfulqa_0shot.json          : 35.7830\nwinogrande_5shot.json          : 59.3528\n----------------------------------------\nAverage Score                  : 34.9039\n```\n\nThe metric key used for each task is hardcoded in the `key` dict and matches the Open LLM Leaderboard convention.\n\n---\n\n## Known Issues\n\n- **Slow evaluation**: The full benchmark suite takes 1–3 hours even for small models. This is unresolved and may be related to the `use_accelerate=True` flag or batch-size-1 inference.\n- **bfloat16 accuracy without FlashAttention 2**: Scores degrade noticeably. Always use FlashAttention 2 for bfloat16 evaluation by editing `config.json` as described above.\n- **`--push` argument type**: The `argparse` definition uses `type=bool`, which means any non-empty string (including `\"false\"`) evaluates to `True`. Pass `0` or omit the flag to keep it `False`.","neural-network-operations":"# Neural Network Operations\n\n# Neural Network Operations\n\nCUDA kernel implementations for the core operations in a GPT-2-style transformer training loop. Each sub-module is a self-contained `.cuh` header providing forward and backward kernel launchers for a specific layer or operation. All kernels target mixed-precision training with configurable `floatX` (BF16 by default, also supports FP16, FP32, FP8) and use stochastic rounding when writing back to low-precision parameter storage.\n\n## Architecture Overview\n\n```mermaid\ngraph TD\n    A[Encoder: token + position embeddings] --> B[LayerNorm + Residual]\n    B --> C[Matmul: QKV projection via cuBLASLt]\n    C --> D[Attention: permute, softmax, matmul, unpermute]\n    D --> E[LayerNorm + Residual fused]\n    E --> F[Matmul: MLP projections + GELU fusion]\n    F --> G[Fused Classifier: cross-entropy + logit grads]\n    G --> H[AdamW: parameter update with master weights]\n    I[Global Norm: gradient clipping] --> H\n    J[ZeRO: multi-GPU sharding] --> H\n```\n\n---\n\n## Sub-Modules\n\n### AdamW (`adamw.cuh`)\n\nImplements the AdamW optimizer as a single fused CUDA kernel. Each thread updates one parameter using the Adam algorithm with decoupled weight decay.\n\n**Key design decisions:**\n\n- **Linear interpolation (`lerp`)** — Uses the two-FMA formulation `fma(weight, end, fma(-weight, start, start))` instead of the naive three-op `start + weight * (end - start)`, following [NVIDIA's recommendation](https://developer.nvidia.com/blog/lerp-faster-cuda).\n- **Master weights** — When `master_params_memory` is non-null, the optimizer maintains an FP32 master copy of parameters. The update is computed in FP32 against the master copy, then stochastically rounded down to `floatX` for the next forward pass.\n- **Multi-slice support** — `adamw_kernel3` uses `blockIdx.y` to iterate over parameter slices (different layers), with separate strides (`w_stride`, `g_stride`, `s_stride`) for weights, gradients, and state. This enables a single kernel launch to update all layers.\n- **Bias correction** — Precomputes `beta1_correction = 1 - β₁ᵗ` and `beta2_correction = 1 - β₂ᵗ` on the host and passes them to the kernel.\n\n**API:**\n\n| Function | Description |\n|----------|-------------|\n| `adamw_update<Tp, Tg>(...)` | Host launcher. Computes bias corrections, launches `adamw_kernel3` with 512-thread blocks. |\n| `init_from_master<Tp>(...)` | Copies master FP32 params back to low-precision storage using stochastic rounding. Block size must match `adamw_update` (512) so RNG seeds align. |\n\n**Update formula per parameter:**\n\n```\nm = lerp(grad, m_old, β₁)\nv = lerp(grad², v_old, β₂)\nm̂ = m / (1 - β₁ᵗ)\nv̂ = v / (1 - β₂ᵗ)\nparam = old_param - lr * (m̂ / (√v̂ + ε) + λ · old_param)\n```\n\n---\n\n### Attention (`attention.cuh`)\n\nFallback multi-head self-attention when cuDNN Flash Attention is unavailable. Implements the full forward and backward pass using cuBLASLt batched matmuls and custom permute/softmax kernels.\n\n**Forward pass flow:**\n\n1. **Permute** — `permute_kernel` reshapes the fused QKV tensor from `(B, T, 3, NH, HS)` into three separate tensors `Q, K, V` of shape `(B, NH, T, HS)`.\n2. **QK matmul** — `matmul_cublaslt` computes `preatt = K^T @ Q` as a strided-batched GEMM over `B * NH` batches.\n3. **Causal softmax** — `softmax_forward_kernel5` applies online softmax row-by-row with autoregressive masking. Only the lower-triangular portion is computed. The scale `1/√HS` is fused into the softmax rather than applied separately.\n4. **Att-V matmul** — `matmul_cublaslt` computes `vaccum = V @ att^T`.\n5. **Unpermute** — `unpermute_kernel` reshapes from `(B, NH, T, HS)` back to `(B, T, C)`.\n\n**Backward pass flow:**\n\n1. Unpermute backward → `scratch`\n2. `datt = V @ scratch^T`, `dv = scratch @ att^T`\n3. Softmax backward in-place on `datt` (becomes `dpreatt`)\n4. `dq = K @ dpreatt^T`, `dk = Q^T @ dpreatt` (transposed GEMMs)\n5. Permute backward → `dinp`\n\n**Softmax implementation details:**\n\n- `softmax_forward_kernel5` uses the online softmax algorithm with warp-level reductions. It iterates backwards over rows to keep the upper-left cache lines warm for the subsequent matmul.\n- `softmax_autoregressive_backward_inplace_kernel` processes 4 timesteps per block in reverse order. It computes the local dot product `Σ att[t2] * datt[t2]` via block reduction, then writes `scale * att[t3] * (datt[t3] - local_sum)` in-place. Non-causal positions are explicitly zeroed.\n\n**Scratch buffer reuse:** The `inp` buffer (QKV) is not needed in the backward pass, so the forward pass reuses it as scratch for `preatt` and `vaccum`.\n\n---\n\n### Encoder (`encoder.cuh`)\n\nImplements the input embedding layer: `out = wte[token_id] + wpe[position]`.\n\n**Forward:** `encoder_forward_kernel3` vectorizes with `x128` loads. Each thread processes `x128::size` channels, loading the token embedding and position embedding and summing them.\n\n**Backward — deterministic gradient accumulation:**\n\nThe backward pass is fully deterministic (no `atomicAdd`), which is critical for reproducible training.\n\n- **`wpe_backward_kernel`** — Each `(t, c)` position is handled by exactly one thread, which sums gradients across the batch dimension in registers, then does a read-modify-write with stochastic rounding to `dwpe`.\n- **`wte_backward_kernel`** — More complex because multiple batch positions may reference the same vocabulary token. The CPU preprocesses inputs into **buckets**: each bucket groups all `(batch, time)` positions that share the same vocabulary index and channel group. Buckets are sorted by size (largest first) to maximize GPU occupancy. Within a bucket, warps accumulate partial sums in shared memory, then warp 0 performs the final reduction and stochastic-rounded write to `dwte`.\n\n**CPU-side bucket construction** (in `encoder_backward`):\n\n1. Build a hash map: key = `(c_group, vocab_index)`, value = list of `(bt, c_group)` pairs.\n2. Sort buckets by size descending.\n3. Pack bucket metadata into `int4` arrays and `workload_indices`, copy to device async.\n4. Launch `wpe_backward_kernel` first (it runs on GPU in parallel with the CPU bucket preprocessing).\n\n---\n\n### Fused Classifier (`fused_classifier.cuh`)\n\nFuses cross-entropy loss computation with the backward pass into a single kernel, avoiding materialization of the full softmax probability matrix.\n\n**Forward + backward in one kernel (`fused_classifier_kernel5`):**\n\n1. **Softmax** — `prepare_softmax_blockwide3` computes the row-wise max and sum using the online softmax algorithm with block-level reductions, returning `{Scale = 1/sum, Offset = max}`.\n2. **Loss** — Thread 0 computes `loss = -log(prob_target)` where `prob_target = exp(logit_target - Offset) * Scale`.\n3. **`__syncthreads()`** — Critical barrier. Without it, the logits read for the loss would race with the in-place overwrite by gradient values. Since gradients are in `[-1, 1]` and `Offset` can be `< -90`, reading a partially overwritten logit would compute `exp(90+)` → infinity.\n4. **Logit gradients** — Each element gets `dlogit = (prob - indicator) * dloss`, written in-place over the logits buffer. The `store128cs` (cache-streaming store) is used to reduce cache persistence on the overwritten data, maximizing the chance that the original logits remain in cache between the softmax read and the gradient write.\n\n**Template parameters:**\n\n- `WriteDLogits` — When true, overwrites logits with gradients (training mode). When false, logits are preserved (inference/debugging).\n- `WriteProbs` — When true, writes the full probability vector (for inference). Typically false during training to save bandwidth.\n\n**Unaligned tail handling:** The main loop processes elements in chunks of `x128::size`. A separate loop handles the remaining elements (e.g., last 3 elements when `V = 8003` and `x128::size = 8`).\n\n---\n\n### GELU (`gelu.cuh`)\n\nImplements the approximate GELU activation: `0.5 * x * (1 + tanh(√(2/π) * (x + 0.044715x³)))`.\n\n**Forward:** `gelu_forward_kernel2` — Vectorized with `x128` loads. Uses `load128cs` (streaming load, data not reused) and `store128` (non-streaming store, data may be reused by the next operation).\n\n**Backward:** `gelu_backward_inplace_kernel` — In-place operation on `d_in_out`. Computes the local gradient:\n\n```\nsech = 1 / cosh²(tanh_arg)\nlocal_grad = 0.5 * (1 + tanh_out) + 0.5 * x * sech * √(2/π) * (1 + 3 * 0.044715 * x²)\nd_in = local_grad * d_out\n```\n\nGELU can also be fused into cuBLASLt matmul epilogues (see Matmul section).\n\n---\n\n### Global Norm (`global_norm.cuh`)\n\nComputes the squared L2 norm across parameter slices, used for gradient clipping.\n\n**Two-phase reduction:**\n\n1. `global_norm_squared_kernel` — Each block computes a partial sum of squares for one slice (using `blockIdx.y` for slice indexing). Partial sums are written to an output buffer indexed by `blockIdx.y * gridDim.x + blockIdx.x`.\n2. `global_norm_aggregate_kernel` — A single block sums all partial block sums into `out[0]`.\n\n**Grid sizing:** The number of blocks is set to `maxThreadsPerSM * multiProcessorCount / block_size` to fill the GPU without over-subscribing. The `num_slices` dimension splits the grid via `dim3(CEIL_DIV(grid_size, num_slices), num_slices)`.\n\n**`get_max_num_block_sums`** — Helper to pre-allocate the output buffer. Must be kept in sync with `global_norm_squared`.\n\n---\n\n### LayerNorm + Residual (`layernorm.cuh`)\n\nImplements LayerNorm, residual addition, and their fused combination. The backward pass uses `+=` for parameter gradients (accumulation) and `=` for activation gradients (overwrite), except for residual stream activations which use `+=`.\n\n**Forward kernels:**\n\n| Kernel | Description |\n|--------|-------------|\n| `layernorm_forward_kernel6` | Shared-memory version. Loads weight/bias into shared memory, processes `blockDim.y` rows per block. Falls back to `layernorm_forward_kernel3` if shared memory allocation fails (>48 KiB requires `cudaFuncSetAttribute`). |\n| `fused_residual_forward_kernel5` | Fuses `residual = inp1 + inp2` with `normed = LayerNorm(residual)`. Stores the residual sum in shared memory for immediate normalization. Falls back to separate `residual_forward` + `layernorm_forward` if shared memory is insufficient. |\n| `layernorm_forward_kernel3` | No shared memory fallback. Each warp handles one row. |\n\n**Backward kernel (`layernorm_backward_kernel10`):**\n\nThis is the most complex kernel in the module. Key aspects:\n\n- **Shared memory layout:** First half for `dbias`, second half for `dweight`, with temporary buffers for cross-warp reduction.\n- **Two-pass reduction:** Warps 1..N write partial `dbias`/`dweight` to shared memory; warp 0 accumulates them. This avoids shared-memory bank conflicts.\n- **Multi-block coordination:** Each block writes partial sums to a scratch buffer. The last block to finish (determined via `atomicInc` on a flag) performs the final cross-block reduction and converts from FP32 to `floatX` with stochastic rounding.\n- **Input gradient:** `dinp` uses `+=` (residual stream accumulation). The formula per element is:\n  ```\n  dval = (weight * dout - dnorm_mean - norm * dnorm_norm_mean) * rstd\n  ```\n\n**Launcher functions:**\n\n- `layernorm_forward` — Tries shared-memory kernel first, falls back on allocation failure.\n- `fused_residual_forward5` — Same fallback pattern.\n- `layernorm_backward` — Resets the scratch flag to 0, launches with `2 * blocks_per_sm` grid size.\n\n---\n\n### Matmul (`matmul.cuh`)\n\nWraps cuBLASLt for all matrix multiplications, with support for bias fusion, GELU fusion, strided-batched GEMM, and gradient accumulation.\n\n**`matmul_cublaslt` — Core wrapper:**\n\nHandles:\n- Transpose configuration via `CUBLASLT_MATMUL_DESC_TRANSA/TRANSB`\n- Strided batched GEMM for attention (sets `CUBLASLT_MATRIX_LAYOUT_BATCH_COUNT` and stride attributes)\n- Epilogue fusion:\n  - `CUBLASLT_EPILOGUE_BIAS` — Forward with bias\n  - `CUBLASLT_EPILOGUE_GELU_AUX_BIAS` — Forward with GELU + bias\n  - `CUBLASLT_EPILOGUE_BGRADB` — Backward bias gradient\n  - `CUBLASLT_EPILOGUE_DGELU` — Backward through GELU\n- Accumulation mode (`beta = 1.0` for `+=`, `0.0` for overwrite)\n- FP8 special handling: forces bias to BF16 and accumulator to appropriate types\n\n**`matmul_forward_cublaslt`:**\n\nDispatches based on `gelu_fusion` flag:\n- `gelu_fusion >= 1` (default): cuBLASLt fuses GELU into the matmul epilogue.\n- `gelu_fusion < 1`: Separate `matmul_cublaslt` + `gelu_forward` calls.\n\n**`matmul_backward`:**\n\n1. **Bias gradient** — `matmul_backward_bias_kernel9` reduces `dout` over the `B*T` dimension. If only one grid block in Y, writes directly to `dbias`. Otherwise, writes to `dbias_buffer` and `reduce_add_sum_kernel` performs the final reduction.\n2. **Input gradient** — `matmul_cublaslt(dinp, weight, dout, ...)` with optional GELU backward fusion (`gelu_fusion >= 2`).\n3. **Weight gradient** — `matmul_cublaslt(dweight, inp, dout, ..., accumulate=true)` — always accumulates with `+=`.\n\n---\n\n### ZeRO / Multi-GPU (`zero.cuh`)\n\nMulti-GPU training infrastructure with ZeRO Stage 1 optimizer state sharding and NCCL-based communication.\n\n**`MultiGpuConfig` struct:**\n\n| Field | Description |\n|-------|-------------|\n| `process_rank` | Rank of this process (0 for single-GPU) |\n| `num_processes` | Total process count |\n| `local_device_idx` | GPU index on this machine |\n| `zero_stage` | 0=disabled, 1=optimizer state sharding |\n| `shard_num_parameters` | Parameters per shard after sharding |\n| `nccl_comm` | NCCL communicator |\n| `nccl_stream` | Dedicated stream for NCCL ops |\n| `compute_nccl_sync` | Event to synchronize compute → NCCL |\n| `unified_buffer` | Small managed-memory buffer for scalar reductions |\n\n**NCCL initialization methods:**\n\n| Method | Function | Description |\n|--------|----------|-------------|\n| TCP | `get_nccl_id_via_tcp` | Rank 0 acts as TCP server, distributes `ncclUniqueId` to clients. Supports Windows (`get_nccl_id_via_tcp_windows`). |\n| Filesystem | `get_nccl_id_via_fs` | Rank 0 writes `ncclUniqueId` to a shared filesystem file. Other ranks poll until the file appears. |\n| MPI | `multi_gpu_get_local_device_idx` | Uses `MPI_Allgather` of hostname hashes to assign local GPU indices. Broadcasts `ncclUniqueId` via `MPI_Bcast`. |\n\n**`multi_gpu_async_reduce_gradient<N>`:**\n\nTemplate function that reduces gradient tensors. Uses an event-based synchronization pattern:\n\n1. Record `compute_nccl_sync` event on the compute stream.\n2. Wait for that event on the NCCL stream (avoids host synchronization).\n3. Start an NCCL group, reducing all `N` pointer/size pairs:\n   - **ZeRO Stage 0:** `ncclAllReduce` with `ncclAvg`.\n   - **ZeRO Stage 1:** `ncclReduceScatter` with `ncclAvg`. Each process keeps only its shard at `pointers[i] + shard_offset`.\n\nThe sized-array syntax `floatX* const (&pointers)[N]` ensures compile-time size matching between pointers and sizes.\n\n**`multi_gpu_get_shard_offset`:**\n\nReturns `{offset, size}` for a tensor. When `zero_stage >= shard_at_stage`, the tensor is split evenly across processes. Otherwise, the full tensor is returned (offset=0, size=elements).\n\n**`set_zero_configs`:**\n\nConfigures ZeRO sharding. Currently only Stage 1 is implemented. Stage 2 and 3 are acknowledged but not yet supported. If parameters cannot be evenly divided by `num_processes`, ZeRO is silently disabled.\n\n---\n\n## Common Patterns\n\n### Vectorized Memory Access\n\nNearly all kernels use `x128` (128-bit vector) loads/stores for memory throughput. The `x128::size` constant varies by precision (8 for BF16, 4 for FP16, 2 for FP32). Load/store variants:\n\n| Function | Hint |\n|----------|------|\n| `load128` | Standard load |\n| `load128cs` | Cache-streaming load (data not reused soon) |\n| `store128` | Standard store |\n| `store128cs` | Cache-streaming store (reduce persistence) |\n| `store128cg` | Cache-global store (bypass L1, cache in L2) |\n\n### Stochastic Rounding\n\nWhen training in low precision, `stochastic_rounding(fp32_value, &floatX_ptr, seed)` converts FP32 accumulations back to `floatX` with randomized rounding. Seeds are deterministic per-parameter to guarantee reproducibility.\n\n### Warp/Block Reductions\n\n`warpReduceSum`, `warpReduceMax`, and their block-level wrappers `blockReduce<>` are used throughout for normalization statistics, softmax, and gradient accumulation.\n\n### NVTX Profiling\n\nAll launcher functions call `NVTX_RANGE_FN()` for NVIDIA Nsight profiling annotation.\n\n### Error Checking\n\n`cudaCheck`, `cublasCheck`, and `ncclCheck` macros wrap all API calls, printing file/line information on failure.","overview":"# llm.c — Wiki\n\n# llm.c\n\nllm.c trains GPT-2 and GPT-3 family language models in pure C and CUDA — no PyTorch, no Python runtime, no 245MB framework. The mainline CUDA implementation in `train_gpt2.cu` currently outperforms PyTorch Nightly by ~7%, while the CPU reference in `train_gpt2.c` fits in ~1,000 lines of clean, readable C. A parallel PyTorch reference (`train_gpt2.py`) is maintained for correctness validation and ground-truth artifact generation.\n\n## Architecture\n\n```mermaid\ngraph TD\n    Data[\"Data Processing<br/>& Datasets\"] -->|\".bin tokens\"| Train[\"GPT-2 Training<br/>(C / CUDA)\"]\n    Train -->|checkpoints| Export[\"Model Evaluation<br/>& Export\"]\n    Train --> Core[\"Core Utilities\"]\n    Train --> CUDAI[\"CUDA Infrastructure\"]\n    Train --> NN[\"Neural Network<br/>Operations\"]\n    Train --> Opt[\"CUDA Optimizer<br/>& Communication\"]\n    NN --> Kernels[\"CUDA Fwd/Bwd<br/>Kernels\"]\n    CUDAI --> Kernels\n    CPU[\"CPU Reference<br/>Kernels\"] -.->|validates| Kernels\n```\n\n## How It Works\n\nAt the top level is [GPT-2 Training](gpt-2-training.md) — the `train_gpt2.c` and `train_gpt2.cu` entry points that orchestrate the full pretraining loop. This layer depends heavily on [Core Utilities](core-utilities.md) for safe I/O wrappers, memory checking, a PyTorch-compatible Mersenne Twister RNG, data loading, learning rate scheduling, and GPU monitoring. Every other module in the codebase builds on these headers.\n\nBelow that sits the compute stack. [CUDA Infrastructure](cuda-infrastructure.md) provides the foundational GPU layer — cuBLAS/cuDNN wrappers, device management, and a development sandbox under `dev/cuda/` for kernel prototyping and benchmarking. [Neural Network Operations](neural-network-operations.md) implements each transformer layer (encoder embeddings, LayerNorm, attention, MLP with GELU) as self-contained `.cuh` headers with forward and backward kernel launchers targeting mixed-precision training with configurable `floatX` (BF16 by default, also FP16/FP32/FP8). The actual GPU kernel implementations live in [CUDA Forward Kernels](cuda-forward-kernels.md) and [CUDA Backward Kernels](cuda-backward-kernels.md), each shipping multiple variants — from naive CPU ports to fused, vectorized, low-precision kernels — so you can study each optimization step. Weight updates and multi-GPU communication are handled by [CUDA Optimizer & Communication](cuda-optimizer-and-communication.md), which provides hand-optimized AdamW, fused classifier loss, gradient norm, and all-reduce kernels.\n\nOn the data side, [Data Processing & Datasets](data-processing-and-datasets.md) handles downloading, tokenizing, and packaging datasets into binary `.bin` files consumed by the C training code. It supports both GPT-2 (tiktoken, `uint16`) and LLaMA 3 (`uint32`) tokenizer configurations.\n\nFor correctness, [CPU Reference Kernels](cpu-reference-kernels.md) provides ground-truth implementations against which all GPU kernels are validated. The [LayerNorm Tutorial](layernorm-tutorial.md) walks through the development workflow used across the entire codebase: derive the math, implement in PyTorch, verify against autograd, then port to C/CUDA.\n\nOnce a model is trained, [Model Evaluation & Export](model-evaluation-and-export.md) converts binary checkpoints into loadable HuggingFace models and evaluates them against the Open LLM Leaderboard benchmark suite. [LLaMA Training](llama-training.md) extends the project to LLaMA 3.1 training and inference in PyTorch, with weight export for a companion C implementation — distinguished from GPT-2 by RoPE embeddings, SwiGLU activation, and RMSNorm.\n\n## Key End-to-End Flows\n\n**Pretraining loop.** The dataloader (in Core Utilities) reads tokenized `.bin` shards, shuffles them via the Mersenne Twister RNG, and feeds batches into the training loop. The forward pass runs through encoder embeddings → LayerNorm → attention → residual → LayerNorm → MLP → residual, all in mixed precision with stochastic rounding. The backward pass reverses through these layers. AdamW updates the weights, gradient norms are computed for logging, and checkpoints are saved periodically as binary files.\n\n**Correctness validation.** The PyTorch reference (`train_gpt2.py`) generates ground-truth weight and gradient artifacts. The C test harness (`test_gpt2.c`) runs each layer in isolation, compares outputs against these artifacts, and reports numerical divergence. GPU kernels are additionally validated against their CPU reference counterparts.\n\n**Model evaluation.** Binary checkpoints are converted to HuggingFace format by `export_hf.py`, run through `lm-evaluation-harness` via `run_eval.sh`, and results are summarized by `summarize_eval.py`.\n\n## Getting Started\n\n**Prerequisites:** A C compiler (gcc/clang), CUDA toolkit (12.x recommended), and Python 3 with PyTorch (for data preparation and reference validation).\n\n1. **Prepare data** — Run the data preparation scripts to download and tokenize training data into `.bin` files\n2. **Train on CPU** — Compile and run the reference implementation: `gcc -O3 -o train_gpt2 train_gpt2.c -lm && ./train_gpt2`\n3. **Train on GPU** — Compile the CUDA version: `nvcc -O3 -o train_gpt2 train_gpt2.cu -lcublas -lcudnn -lcurand && ./train_gpt2`\n4. **Validate** — Run `test_gpt2.c` against PyTorch-generated reference artifacts to verify numerical equivalence\n5. **Evaluate** — Export checkpoints and run the evaluation pipeline"};

(function() {
  var activePage = 'overview';

  document.addEventListener('DOMContentLoaded', function() {
    mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose' });
    renderMeta();
    renderNav();
    document.getElementById('menu-toggle').addEventListener('click', function() {
      document.getElementById('sidebar').classList.toggle('open');
    });
    if (location.hash && location.hash.length > 1) {
      activePage = decodeURIComponent(location.hash.slice(1));
    }
    navigateTo(activePage);
  });

  function renderMeta() {
    if (!META) return;
    var el = document.getElementById('meta-info');
    var parts = [];
    if (META.generatedAt) {
      parts.push(new Date(META.generatedAt).toLocaleDateString());
    }
    if (META.model) parts.push(META.model);
    if (META.fromCommit) parts.push(META.fromCommit.slice(0, 8));
    el.textContent = parts.join(' \u00b7 ');
  }

  function renderNav() {
    var container = document.getElementById('nav-tree');
    var html = '<div class="nav-section">';
    html += '<a class="nav-item overview" data-page="overview" href="#overview">Overview</a>';
    html += '</div>';
    if (TREE.length > 0) {
      html += '<div class="nav-group-label">Modules</div>';
      html += buildNavTree(TREE);
    }
    container.innerHTML = html;
    container.addEventListener('click', function(e) {
      var target = e.target;
      while (target && !target.dataset.page) { target = target.parentElement; }
      if (target && target.dataset.page) {
        e.preventDefault();
        navigateTo(target.dataset.page);
      }
    });
  }

  function buildNavTree(nodes) {
    var html = '';
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      html += '<div class="nav-section">';
      html += '<a class="nav-item" data-page="' + escH(node.slug) + '" href="#' + encodeURIComponent(node.slug) + '">' + escH(node.name) + '</a>';
      if (node.children && node.children.length > 0) {
        html += '<div class="nav-children">' + buildNavTree(node.children) + '</div>';
      }
      html += '</div>';
    }
    return html;
  }

  function escH(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function navigateTo(page) {
    activePage = page;
    location.hash = encodeURIComponent(page);

    var items = document.querySelectorAll('.nav-item');
    for (var i = 0; i < items.length; i++) {
      if (items[i].dataset.page === page) {
        items[i].classList.add('active');
      } else {
        items[i].classList.remove('active');
      }
    }

    var contentEl = document.getElementById('content');
    var md = PAGES[page];

    if (!md) {
      contentEl.innerHTML = '<div class="empty-state"><h2>Page not found</h2><p>' + escH(page) + '.md does not exist.</p></div>';
      return;
    }

    contentEl.innerHTML = marked.parse(md);

    // Rewrite .md links to hash navigation
    var links = contentEl.querySelectorAll('a[href]');
    for (var i = 0; i < links.length; i++) {
      var href = links[i].getAttribute('href');
      if (href && href.endsWith('.md') && href.indexOf('://') === -1) {
        var slug = href.replace(/\.md$/, '');
        links[i].setAttribute('href', '#' + encodeURIComponent(slug));
        (function(s) {
          links[i].addEventListener('click', function(e) {
            e.preventDefault();
            navigateTo(s);
          });
        })(slug);
      }
    }

    // Convert mermaid code blocks into mermaid divs
    var mermaidBlocks = contentEl.querySelectorAll('pre code.language-mermaid');
    for (var i = 0; i < mermaidBlocks.length; i++) {
      var pre = mermaidBlocks[i].parentElement;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = mermaidBlocks[i].textContent;
      pre.parentNode.replaceChild(div, pre);
    }
    try { mermaid.run({ querySelector: '.mermaid' }); } catch(e) {}

    window.scrollTo(0, 0);
    document.getElementById('sidebar').classList.remove('open');
  }
})();
