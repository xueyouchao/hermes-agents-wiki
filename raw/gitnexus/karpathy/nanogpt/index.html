var PAGES = {"benchmarking":"# Benchmarking\n\n# Benchmarking Module\n\n## Overview\n\n`bench.py` is a lightweight, self-contained benchmarking script for measuring GPT training throughput. It strips down the full training loop in `train.py` to its essentials — forward pass, backward pass, optimizer step — and reports **time per iteration** and **MFU (Model FLOPs Utilization)**. This is the tool to reach for when evaluating hardware performance, comparing PyTorch compilation strategies, or validating that a code change hasn't introduced a regression in training speed.\n\n## Quick Start\n\n```bash\n# Default benchmark (compiled, bfloat16, real data, simple timing)\npython bench.py\n\n# With overrides via configurator\npython bench.py --compile=False --profile=True --batch_size=8\n\n# Profiled benchmark (writes TensorBoard traces to ./bench_log)\npython bench.py --profile=True\n```\n\n## Configuration\n\nAll configuration is set at the top of the file as module-level variables. The `configurator.py` mechanism (`exec(open('configurator.py').read())`) allows any of these to be overridden from the command line or a config file at runtime.\n\n| Variable | Default | Description |\n|---|---|---|\n| `batch_size` | `12` | Number of sequences per batch |\n| `block_size` | `1024` | Context length (sequence length in tokens) |\n| `bias` | `False` | Whether linear layers use bias (must match model config) |\n| `real_data` | `True` | Load from disk (`True`) or use synthetic random data (`False`) |\n| `seed` | `1337` | Random seed for reproducibility |\n| `device` | `'cuda'` | Compute device — `'cpu'`, `'cuda'`, `'cuda:0'`, etc. |\n| `dtype` | auto | `'bfloat16'` if supported, else `'float16'`. Also accepts `'float32'` |\n| `compile` | `True` | Apply `torch.compile` (PyTorch 2.0+) for kernel fusion |\n| `profile` | `False` | Enable PyTorch profiler output (vs. simple timing) |\n\n### dtype Auto-Detection\n\nThe script automatically selects the fastest supported precision:\n\n```python\ndtype = 'bfloat16' if torch.cuda.is_available() and torch.cuda.is_bf16_supported() else 'float16'\n```\n\nThis is resolved into a PyTorch dtype and used with `torch.amp.autocast` for mixed-precision training. On CPU, autocast is disabled (a `nullcontext` is used instead).\n\n## Data Loading\n\nTwo modes are available, controlled by `real_data`:\n\n### Real Data Mode (`real_data=True`)\n\nLoads the OpenWebText dataset from a memory-mapped file at `data/openwebtext/train.bin` (uint16 encoded tokens). Each batch is constructed by:\n\n1. Sampling `batch_size` random starting indices uniformly across the dataset.\n2. Slicing `block_size` tokens for input `x` and an offset-by-one slice for targets `y`.\n3. Transferring to GPU via `pin_memory().to(device, non_blocking=True)` for async host-to-device copies.\n\nThe `split` argument to `get_batch` is intentionally ignored — benchmarking only uses training data.\n\n### Synthetic Data Mode (`real_data=False`)\n\nGenerates fixed random tensors once at startup:\n\n```python\nx = torch.randint(50304, (batch_size, block_size), device=device)\ny = torch.randint(50304, (batch_size, block_size), device=device)\n```\n\nThe vocabulary size `50304` matches the GPT-2 tokenizer. Since the same `x` and `y` are reused every iteration, this eliminates data loading as a variable and isolates pure compute performance. Use this mode when you want to measure GPU throughput without I/O noise.\n\n## Model Setup\n\nThe benchmark uses a fixed GPT-2 Small configuration:\n\n```python\nGPTConfig(\n    block_size=1024,\n    n_layer=12,\n    n_head=12,\n    n_embd=768,\n    dropout=0,   # disabled for determinism\n    bias=False,\n)\n```\n\nThe model is instantiated from `model.GPT`, moved to the target device, and optionally compiled with `torch.compile(model)`. Compilation adds startup overhead but significantly improves iteration speed on modern GPUs.\n\nThe optimizer is configured identically to training:\n\n```python\nmodel.configure_optimizers(weight_decay=1e-2, learning_rate=1e-4, betas=(0.9, 0.95), device_type=device_type)\n```\n\n## Benchmarking Modes\n\n### Simple Timing (`profile=False`)\n\nThe default mode runs a two-stage loop:\n\n```mermaid\nflowchart LR\n    A[Burn-in\\n10 iters] --> B[Benchmark\\n20 iters]\n    B --> C[Report\\nms/iter + MFU]\n```\n\n1. **Burn-in** (10 iterations): Warms up the GPU, fills caches, and lets `torch.compile` finish any remaining JIT compilation. Results are discarded.\n2. **Benchmark** (20 iterations): Timed with `time.time()` and bracketed by `torch.cuda.synchronize()` to ensure all GPU work completes before the clock is read.\n\nAfter the benchmark stage, the script reports:\n\n- **Time per iteration**: `(dt / num_steps) * 1000` in milliseconds\n- **MFU**: Computed via `model.estimate_mfu(batch_size * num_steps, dt)`, which estimates the ratio of actual FLOPs achieved to theoretical peak hardware FLOPs\n\nEach iteration consists of the full training step:\n\n```\nforward  →  backward  →  optimizer.step  →  zero_grad\n```\n\n### PyTorch Profiler (`profile=True`)\n\nWhen enabled, the script uses `torch.profiler.profile` with a three-phase schedule:\n\n| Phase | Steps | Purpose |\n|---|---|---|\n| `wait` | 5 | Skip — lets the pipeline stabilize |\n| `warmup` | 5 | Warm up the profiler itself |\n| `active` | 5 | Record traces |\n\nThe profiler records both CPU and CUDA activities, computes FLOPs (`with_flops=True`), and writes TensorBoard-compatible traces to `./bench_log`. To view the results:\n\n```bash\ntensorboard --logdir=./bench_log\n```\n\nStack traces and memory profiling are disabled to reduce overhead. The `prof.step()` call at the end of each iteration advances the profiler's internal schedule.\n\n## Execution Flow\n\n```mermaid\nflowchart TD\n    A[Parse config / configurator overrides] --> B[Set seeds + TF32 flags]\n    B --> C{real_data?}\n    C -->|Yes| D[Load OpenWebText memmap]\n    C -->|No| E[Generate fixed random tensors]\n    D --> F[Create GPT model + optimizer]\n    E --> F\n    F --> G{compile?}\n    G -->|Yes| H[torch.compile model]\n    G -->|No| I[Use eager model]\n    H --> J{profile?}\n    I --> J\n    J -->|Yes| K[Run profiler schedule\\n15 steps → TensorBoard traces]\n    J -->|No| L[Run simple benchmark\\nburn-in 10 + measure 20 → print ms/iter + MFU]\n```\n\n## Key Design Decisions\n\n- **`torch.cuda.synchronize()`** is called before and after the timed section. Without this, CUDA kernel launches are asynchronous and `time.time()` would only measure launch overhead, not actual computation.\n- **`optimizer.zero_grad(set_to_none=True)`** is used instead of `zero_grad()` to avoid a memset — the gradient tensors are set to `None` instead of zeroed, which is slightly faster and matches production training.\n- **`dropout=0`** ensures deterministic, reproducible timing across runs.\n- **TF32 is enabled** (`allow_tf32 = True` for both matmul and cuDNN) to match production training behavior on Ampere+ GPUs.\n\n## Dependencies\n\n- `model.GPT` and `model.GPTConfig` — the model implementation being benchmarked\n- `configurator.py` — runtime configuration override mechanism\n- `data/openwebtext/train.bin` — required only when `real_data=True`\n- PyTorch 2.0+ for `torch.compile` support","configuration-utility":"# Configuration Utility\n\n# Configuration Utility\n\n## Overview\n\nThe Configuration Utility (`configurator.py`) is a minimalist, convention-over-configuration system for overriding script settings at runtime. It processes command-line arguments to either execute a Python config file or apply individual key-value overrides — all directly into the caller's global namespace.\n\nThis is **not** a standard Python module. It is designed to be `exec`'d by the calling script, meaning its code runs in the caller's `globals()` scope. This eliminates the need to prefix every configuration variable with `config.`.\n\n## How It Works\n\n```mermaid\nflowchart LR\n    A[sys.argv] --> B{Contains = ?}\n    B -->|No| C[Exec config file into globals]\n    B -->|Yes| D[Parse --key=value]\n    D --> E{Key in globals?}\n    E -->|Yes| F[literal_eval value]\n    F --> G{Type matches?}\n    G -->|Yes| H[Override globals key]\n    G -->|No| I[AssertionError]\n    E -->|No| J[ValueError: Unknown key]\n```\n\n### Execution Model\n\nFrom the calling script (e.g., `train.py`):\n\n```python\nexec(open('configurator.py').read())\n```\n\nBecause `exec` runs the configurator's code in the caller's scope, any variable assignments made by config files or CLI overrides are written directly to the caller's `globals()`. This is the core trade-off: simplicity at the cost of conventional module encapsulation.\n\n### Argument Processing\n\nThe configurator iterates over `sys.argv[1:]` and classifies each argument:\n\n| Argument Form | Interpretation | Example |\n|---|---|---|\n| `filename.py` | Path to a config file to execute | `config/base.py` |\n| `--key=value` | Inline override of a single config key | `--batch_size=32` |\n\n**Config file arguments** must not start with `--`. The file is opened, its contents are printed to stdout for transparency, and then `exec`'d — setting variables directly in the caller's globals.\n\n**Key-value arguments** must start with `--`. The value is parsed via `ast.literal_eval` to recover native Python types (ints, floats, bools, lists, etc.). If `literal_eval` fails (e.g., for plain strings), the raw string value is used instead. A type check then ensures the parsed value matches the type of the existing global variable before assignment.\n\n## Usage\n\n### Basic Override\n\n```bash\npython train.py --batch_size=32 --learning_rate=1e-4\n```\n\nThis requires that `batch_size` and `learning_rate` already exist as globals in `train.py` before the `exec` call.\n\n### Config File Override\n\n```bash\npython train.py config/experiment.py\n```\n\nWhere `config/experiment.py` might contain:\n\n```python\nbatch_size = 64\nlearning_rate = 3e-4\nblock_size = 256\nn_layer = 8\n```\n\n### Combined\n\n```bash\npython train.py config/experiment.py --batch_size=32\n```\n\nThe config file is processed first (based on argument order), then `--batch_size=32` overrides the value set by the file. Argument order matters — overrides are applied sequentially.\n\n## Value Parsing\n\nThe configurator uses `ast.literal_eval` to convert string arguments into Python objects:\n\n| CLI Input | Parsed Type | Result |\n|---|---|---|\n| `--batch_size=32` | `int` | `32` |\n| `--lr=0.001` | `float` | `0.001` |\n| `--use_gpu=True` | `bool` | `True` |\n| `--name=hello` | `str` (literal_eval fails, fallback) | `\"hello\"` |\n| `--layers=[4,8,12]` | `list` | `[4, 8, 12]` |\n\nIf `literal_eval` raises `SyntaxError` or `ValueError`, the raw string is used as-is.\n\n## Type Safety\n\nOverrides are guarded by a strict type check:\n\n```python\nassert type(attempt) == type(globals()[key])\n```\n\nThis means:\n\n- An `int` global cannot be overridden with a `float` (e.g., `--n_layer=8.0` will fail)\n- A `bool` global cannot be overridden with an `int` (e.g., `--use_gpu=1` will fail)\n- Subtypes are **not** accommodated — the check uses `type()` identity, not `isinstance()`\n\nThis is intentional: silent type coercion in configuration is a common source of subtle bugs.\n\n## Error Conditions\n\n| Condition | Exception | Message |\n|---|---|---|\n| Config file arg starts with `--` | `AssertionError` | — |\n| Key-value arg lacks `--` prefix | `AssertionError` | — |\n| Override key not in globals | `ValueError` | `Unknown config key: {key}` |\n| Override type doesn't match existing | `AssertionError` | — |\n\n## Design Rationale & Caveats\n\n**Why `exec` instead of a module?** The author explicitly dislikes the verbosity of `config.every_variable` patterns and the complexity of formal configuration frameworks. This approach lets calling scripts reference config values as bare names.\n\n**Security**: Config files are `exec`'d with full Python privileges. Only use config files from trusted sources. This is acceptable in a research/training context where the operator controls the config files, but would be unsafe for production-facing or multi-user systems.\n\n**No validation schema**: There is no declarative schema for valid keys or value ranges. The only validation is that the key already exists in `globals()` and the type matches. Defaults must be set in the calling script before the `exec` call.\n\n**No nested config**: The flat globals approach does not support hierarchical configuration. All config values are top-level variables.\n\n**Argument ordering**: Overrides are applied in the order they appear in `sys.argv`. A later argument always wins over an earlier one, regardless of whether it comes from a file or a CLI flag.","data-preparation":"# Data Preparation\n\n# Data Preparation Module\n\n## Overview\n\nThe Data Preparation module converts raw text datasets into memory-mapped binary files (`train.bin`, `val.bin`) containing token IDs stored as `np.uint16`. These binary files are consumed at training time for efficient random access without loading the entire dataset into memory.\n\nAll three preparation scripts share the same output contract: token ID arrays written via `np.memmap` or `np.ndarray.tofile`, readable later as:\n\n```python\nm = np.memmap('train.bin', dtype=np.uint16, mode='r')\n```\n\n## Datasets\n\n| Script | Dataset | Tokenizer | Vocab Size | Train Tokens | Val Tokens |\n|---|---|---|---|---|---|\n| `data/openwebtext/prepare.py` | OpenWebText (HuggingFace) | GPT-2 BPE (`tiktoken`) | 50,257 | ~9B | ~4M |\n| `data/shakespeare/prepare.py` | Tiny Shakespeare | GPT-2 BPE (`tiktoken`) | 50,257 | 301,966 | 36,059 |\n| `data/shakespeare_char/prepare.py` | Tiny Shakespeare | Character-level | 65 | 1,003,854 | 111,540 |\n\n## Pipeline\n\n```mermaid\nflowchart LR\n    A[Raw Text] --> B[Train/Val Split]\n    B --> C[Tokenize]\n    C --> D[\"Concatenate IDs\"]\n    D --> E[\"Write .bin files\"]\n    E --> F[\"np.memmap uint16\"]\n```\n\nEach script follows the same four stages: **load → split → tokenize → serialize**. The key difference is how tokenization is performed and how the data is sourced.\n\n---\n\n## OpenWebText — `data/openwebtext/prepare.py`\n\nPrepares the full OpenWebText corpus for BPE-level language modeling. This is the production-scale dataset (~9B tokens, ~17GB on disk).\n\n### Data Loading\n\nUses HuggingFace `datasets.load_dataset(\"openwebtext\")` with multi-process loading (`num_proc_load_dataset = 8`). The dataset downloads ~54GB into the HuggingFace cache directory and contains ~8M documents.\n\n### Train/Val Split\n\nOpenWebText ships with only a `train` split. The script creates a validation set by calling:\n\n```python\nsplit_dataset = dataset[\"train\"].train_test_split(test_size=0.0005, seed=2357, shuffle=True)\nsplit_dataset['val'] = split_dataset.pop('test')\n```\n\nThis yields ~8,009,762 training rows and ~4,007 validation rows.\n\n### Tokenization\n\nEach document is tokenized with `tiktoken.get_encoding(\"gpt2\")` using `encode_ordinary`, which ignores special tokens. An end-of-text token (`enc.eot_token`, value 50256) is **appended** to each document:\n\n```python\ndef process(example):\n    ids = enc.encode_ordinary(example['text'])\n    ids.append(enc.eot_token)  # 50256\n    return {'ids': ids, 'len': len(ids)}\n```\n\nThe `process` function is applied via `split_dataset.map()` with `num_proc=8` and `remove_columns=['text']`.\n\n### Serialization\n\nAll token IDs for each split are concatenated into a single flat array and written to a memory-mapped file:\n\n1. Compute total length: `arr_len = np.sum(dset['len'], dtype=np.uint64)`\n2. Create a `np.memmap` with `dtype=np.uint16` and `mode='w+'`\n3. Shard the dataset into 1024 contiguous batches, convert each to numpy, and write into the memmap\n4. Call `arr.flush()` to persist to disk\n\nThe `uint16` dtype is valid because `enc.max_token_value == 50256 < 2**16`.\n\n**Output files:** `train.bin` (~17GB), `val.bin` (~8.5MB)\n\n### Concurrency Tuning\n\nTwo parallelism knobs are exposed at the top of the script:\n\n- `num_proc` — worker count for `.map()` tokenization. Rule of thumb: `cpu_cores // 2`.\n- `num_proc_load_dataset` — worker count for `load_dataset()`. May differ from `num_proc` depending on network throughput.\n\n---\n\n## Shakespeare (BPE) — `data/shakespeare/prepare.py`\n\nA minimal script for the Tiny Shakespeare dataset, tokenized with the same GPT-2 BPE encoder. Useful for debugging and rapid iteration.\n\n### Data Loading\n\nDownloads `input.txt` from the char-rnn repository if not already present:\n\n```python\ndata_url = 'https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt'\n```\n\n### Train/Val Split\n\nSimple 90/10 character-position split (no shuffling):\n\n```python\ntrain_data = data[:int(n*0.9)]\nval_data = data[int(n*0.9):]\n```\n\n### Tokenization & Serialization\n\nEncodes with `enc.encode_ordinary()`, converts to `np.uint16`, and writes with `np.ndarray.tofile()`. No EOT token is appended between documents (the entire text is treated as one continuous sequence).\n\n**Output files:** `train.bin`, `val.bin`\n\n---\n\n## Shakespeare (Character-Level) — `data/shakespeare_char/prepare.py`\n\nPrepares Tiny Shakespeare for character-level modeling. Instead of BPE, each unique character maps to a unique integer.\n\n### Vocabulary Construction\n\nThe script builds the vocabulary from the data itself:\n\n```python\nchars = sorted(list(set(data)))\nvocab_size = len(chars)  # 65\nstoi = {ch: i for i, ch in enumerate(chars)}\nitos = {i: ch for i, ch in enumerate(chars)}\n```\n\nThe 65-character vocabulary includes letters, digits, punctuation, and whitespace.\n\n### Metadata Export\n\nUnlike the BPE scripts, this script saves a `meta.pkl` file alongside the binary data:\n\n```python\nmeta = {\n    'vocab_size': vocab_size,\n    'itos': itos,\n    'stoi': stoi,\n}\n```\n\nThis metadata is required at inference time to decode predictions back to characters, since the mapping is dataset-specific rather than a standard tokenizer.\n\n**Output files:** `train.bin`, `val.bin`, `meta.pkl`\n\n---\n\n## Binary File Format\n\nAll scripts produce the same on-disk format:\n\n- **Type:** Raw numpy array, little-endian `uint16`\n- **Layout:** Flat 1D array of token IDs, no headers or padding\n- **Reading:** `np.memmap(path, dtype=np.uint16, mode='r')`\n\nThe `uint16` choice works because all three tokenizers produce IDs below 65536. For the GPT-2 BPE encoder, the maximum value is 50256 (the EOT token). For character-level Shakespeare, the maximum is 64.\n\n### EOT Token Handling\n\n| Script | EOT Between Documents |\n|---|---|\n| `openwebtext/prepare.py` | Yes — appended after each document |\n| `shakespeare/prepare.py` | No — single continuous stream |\n| `shakespeare_char/prepare.py` | No — single continuous stream |\n\nThis distinction matters for the training data loader: when documents are separated by EOT tokens, the loader can respect document boundaries when constructing training sequences. When they are not, the loader treats the entire file as one unbroken stream.\n\n---\n\n## Adding a New Dataset\n\nTo prepare a new dataset, follow this checklist:\n\n1. Create a new directory under `data/<dataset_name>/`\n2. Implement `prepare.py` following the shared pattern:\n   - Load or download raw text\n   - Split into train and validation sets\n   - Tokenize (choose BPE via `tiktoken` or a custom scheme)\n   - Write `train.bin` and `val.bin` as flat `np.uint16` arrays\n   - If using a custom vocabulary, write `meta.pkl` with `vocab_size`, `stoi`, and `itos`\n3. Ensure all token IDs fit in `uint16` (max 65535)\n4. Decide whether to insert EOT tokens between documents and document this choice","inference":"# Inference\n\n# Inference Module\n\n## Overview\n\n`sample.py` is the standalone inference script for generating text from a trained GPT model. It handles model loading, tokenizer resolution, prompt encoding, and autoregressive sampling with configurable temperature and top-k filtering.\n\n## Execution Flow\n\n```mermaid\nflowchart TD\n    A[Parse Configuration] --> B[Setup PyTorch Device/Dtype]\n    B --> C{init_from?}\n    C -->|resume| D[Load checkpoint from out_dir/ckpt.pt]\n    C -->|gpt2-*| E[Load pretrained GPT-2 via from_pretrained]\n    D --> F[Resolve Tokenizer]\n    E --> F\n    F --> G{meta.pkl exists?}\n    G -->|yes| H[Use custom stoi/itos mappings]\n    G -->|no| I[Use tiktoken GPT-2 encoding]\n    H --> J[Encode Prompt]\n    I --> J\n    J --> K[Generate num_samples sequences]\n```\n\n## Configuration\n\nAll configuration is defined as module-level variables at the top of the script. Values can be overridden at runtime via `configurator.py`, which is executed with `exec(open('configurator.py').read())`. This allows command-line or config-file overrides without modifying the script itself.\n\n| Variable | Default | Description |\n|---|---|---|\n| `init_from` | `'resume'` | Model source: `'resume'` loads from a checkpoint directory, or a GPT-2 variant name (e.g. `'gpt2-xl'`) loads pretrained weights |\n| `out_dir` | `'out'` | Directory containing `ckpt.pt` (only used when `init_from='resume'`) |\n| `start` | `\"\\n\"` | Prompt string. Prefix with `FILE:` to load from a file (e.g. `\"FILE:prompt.txt\"`) |\n| `num_samples` | `10` | Number of independent samples to generate |\n| `max_new_tokens` | `500` | Maximum tokens generated per sample (beyond the prompt) |\n| `temperature` | `0.8` | Sampling temperature. `1.0` = no change, `< 1.0` = less random, `> 1.0` = more random |\n| `top_k` | `200` | Top-k filtering. Only the k most likely tokens are considered; others are zeroed out |\n| `seed` | `1337` | Random seed for reproducibility |\n| `device` | `'cuda'` | Compute device (`'cpu'`, `'cuda'`, `'cuda:0'`, etc.) |\n| `dtype` | auto | Floating point dtype. Auto-selects `bfloat16` if supported, otherwise `float16` |\n| `compile` | `False` | Whether to apply `torch.compile` for PyTorch 2.0 acceleration |\n\n## Model Loading\n\nTwo initialization paths are supported:\n\n### Resume from Checkpoint (`init_from='resume'`)\n\nLoads a training checkpoint from `{out_dir}/ckpt.pt`. The checkpoint must contain:\n\n- **`model_args`**: Dictionary of arguments passed to `GPTConfig` to reconstruct the model architecture.\n- **`model`**: The model `state_dict`.\n\nThe script strips the `_orig_mod.` prefix from state dict keys, which is an artifact of `torch.compile`. This ensures compatibility whether the saved model was compiled or not.\n\n### Pretrained GPT-2 (`init_from='gpt2'`, `'gpt2-xl'`, etc.)\n\nLoads a pretrained GPT-2 model using `GPT.from_pretrained()`, with dropout set to 0.0 for deterministic inference. This path does not require a local checkpoint.\n\n## Tokenizer Resolution\n\nThe tokenizer is resolved based on the model source and available metadata:\n\n1. **Custom tokenizer** — If `init_from='resume'` and the checkpoint contains `config.dataset`, the script looks for `data/{dataset}/meta.pkl`. This file must contain `stoi` (string-to-index) and `itos` (index-to-string) mappings, typically for character-level or custom BPE tokenizers.\n\n2. **GPT-2 tokenizer (fallback)** — If no `meta.pkl` is found, or when loading a pretrained GPT-2 model, the script uses `tiktoken` with the `\"gpt2\"` encoding. The special token `<|endoftext|>` is registered as an allowed special token.\n\nThe resolved `encode` and `decode` lambdas are used throughout the generation loop.\n\n## Prompt Encoding\n\nThe `start` variable supports two modes:\n\n- **Direct string**: `start = \"Once upon a time\"` — the string is encoded directly.\n- **File reference**: `start = \"FILE:prompt.txt\"` — the `FILE:` prefix is stripped and the file contents are read as the prompt string.\n\nThe encoded prompt is converted to a tensor of shape `[1, seq_len]` for batch dimension compatibility with `model.generate()`.\n\n## Generation Loop\n\nGeneration runs inside `torch.no_grad()` and the configured autocast context manager (mixed precision on CUDA, no-op on CPU). For each of `num_samples` iterations:\n\n1. `model.generate(x, max_new_tokens, temperature=temperature, top_k=top_k)` produces a tensor of shape `[1, prompt_len + max_new_tokens]`.\n2. The output tokens are decoded to a string and printed.\n3. Samples are separated by `---------------`.\n\nNote that each sample starts from the **same** prompt tensor `x` — the model state is not carried between iterations.\n\n## Hardware and Performance Setup\n\nThe script configures several PyTorch performance options:\n\n- **Seeding**: Both `torch.manual_seed` and `torch.cuda.manual_seed` are set for reproducibility.\n- **TF32**: Enabled for both `matmul` and `cudnn` operations on Ampere+ GPUs for faster matmuls with minimal accuracy loss.\n- **Autocast**: Uses `torch.amp.autocast` with the selected dtype on CUDA; falls back to `nullcontext` on CPU.\n- **Compilation**: When `compile=True`, `torch.compile` is applied to the model after loading and before generation.\n\n## Dependencies\n\n- `model.GPTConfig` and `model.GPT` — the model implementation being inferred from.\n- `tiktoken` — GPT-2 tokenizer (used as fallback).\n- `configurator.py` — runtime configuration overrides (executed via `exec`).\n- `pickle` — for loading custom tokenizer metadata from `meta.pkl`.","model-architecture":"# Model Architecture\n\n# Model Architecture\n\nA from-scratch PyTorch implementation of the GPT-2 language model. The module defines the full network — from configuration through tokenization-agnostic token/position embeddings, transformer blocks, and a language modeling head — in a single file. It supports both training from scratch and loading pretrained GPT-2 weights from HuggingFace.\n\n## Architecture Overview\n\n```mermaid\ngraph TD\n    IDX[\"idx (token indices)\"] --> WTE[\"wte (token embedding)\"]\n    POS[\"pos (position indices)\"] --> WPE[\"wpe (position embedding)\"]\n    WTE --> DROP[\"drop\"]\n    WPE --> DROP\n    DROP --> B1[\"Block 1\"]\n    B1 --> B2[\"Block 2\"]\n    B2 --> BN[\"Block ...N\"]\n    BN --> LNF[\"ln_f (final LayerNorm)\"]\n    LNF --> LMHEAD[\"lm_head (linear projection)\"]\n    LMHEAD --> LOGITS[\"logits\"]\n\n    subgraph \"Each Block\"\n        LN1[\"ln_1\"] --> ATTN[\"CausalSelfAttention\"]\n        ATTN --> R1[\"+ residual\"]\n        LN2[\"ln_2\"] --> MLP[\"MLP\"]\n        MLP --> R2[\"+ residual\"]\n    end\n```\n\nThe model follows the pre-norm transformer variant: LayerNorm is applied *before* each sub-layer (attention, MLP), and the sub-layer output is added back via a residual connection. This differs from the original GPT-2 post-norm design but matches modern best practice.\n\n## Configuration\n\n`GPTConfig` is a `@dataclass` controlling all model dimensions and hyperparameters:\n\n| Field | Default | Description |\n|---|---|---|\n| `block_size` | 1024 | Maximum sequence length (context window) |\n| `vocab_size` | 50304 | Vocabulary size. Padded to a multiple of 64 for hardware efficiency (GPT-2's 50257 + padding) |\n| `n_layer` | 12 | Number of transformer `Block` layers |\n| `n_head` | 12 | Number of attention heads per layer |\n| `n_embd` | 768 | Embedding / hidden dimension |\n| `dropout` | 0.0 | Dropout rate applied to attention weights, residuals, and embeddings |\n| `bias` | `True` | Whether to include bias terms in `nn.Linear` and `LayerNorm`. `False` is slightly faster and often equally effective |\n\nThe defaults correspond to the GPT-2 Small (124M parameter) configuration.\n\n## Core Components\n\n### LayerNorm\n\nA thin wrapper around `F.layer_norm` that supports an optional bias parameter. PyTorch's built-in `nn.LayerNorm` always includes bias; this version allows `bias=None` when `config.bias` is `False`, saving a small number of parameters.\n\n### CausalSelfAttention\n\nMulti-head causal (autoregressive) self-attention with two execution paths:\n\n- **Flash Attention** (default when PyTorch ≥ 2.0): Delegates to `F.scaled_dot_product_attention` with `is_causal=True`. This uses fused CUDA kernels for significant speedup.\n- **Manual fallback**: Computes scaled dot-product attention explicitly, applying a lower-triangular causal mask stored as a registered buffer (`self.bias`). Used when Flash Attention is unavailable.\n\n**Projection structure:**\n- `c_attn`: Single linear layer projecting input to concatenated Q, K, V (`3 * n_embd`), then split along the last dimension.\n- `c_proj`: Output projection back to `n_embd`.\n\n**Shape flow** (per head dimension `hs = n_embd // n_head`):\n```\ninput:  (B, T, n_embd)\n  → c_attn → split → (q, k, v) each (B, T, n_embd)\n  → reshape → (B, n_head, T, hs)\n  → attention → (B, n_head, T, hs)\n  → transpose + contiguous → (B, T, n_embd)\n  → c_proj → (B, T, n_embd)\n```\n\nDropout is applied to both attention weights (`attn_dropout`) and the output projection (`resid_dropout`).\n\n### MLP\n\nStandard position-wise feed-forward network with a 4× expansion factor:\n\n```\ninput → Linear(n_embd, 4*n_embd) → GELU → Linear(4*n_embd, n_embd) → Dropout\n```\n\nThe GELU activation matches the GPT-2 paper. The 4× expansion ratio is fixed and not configurable.\n\n### Block\n\nA single transformer block implementing pre-norm residual connections:\n\n```python\nx = x + self.attn(self.ln_1(x))\nx = x + self.mlp(self.ln_2(x))\n```\n\nLayerNorm is applied *before* the sub-layer, and the sub-layer output is added to the unmodified input. This is the pre-norm formulation, which stabilizes training for deep networks.\n\n## GPT Model\n\n### Initialization and Weight Tying\n\n**Weight initialization** follows the GPT-2 convention:\n- All `nn.Linear` weights: `N(0, 0.02)`\n- All `nn.Linear` biases: `0`\n- All `nn.Embedding` weights: `N(0, 0.02)`\n- **Residual projection scaling**: Any parameter named `c_proj.weight` is initialized with `N(0, 0.02 / sqrt(2 * n_layer))`. This compensates for the variance accumulation across residual additions as described in the GPT-2 paper.\n\n**Weight tying**: `self.transformer.wte.weight` and `self.lm_head.weight` share the same parameter tensor. The token embedding matrix doubles as the output projection, reducing parameter count and tying input/output representations. Note: `torch.compile()` may emit a deprecation warning about multiple values for tied weights; this is currently harmless.\n\n### Forward Pass\n\n```python\nlogits, loss = model(idx, targets=None)\n```\n\n- **`idx`**: `(B, T)` LongTensor of token indices.\n- **`targets`**: `(B, T)` LongTensor of target token indices, or `None` for inference.\n\n**Training path** (`targets` provided):\n1. Look up token embeddings (`wte`) and position embeddings (`wpe`), sum them, apply dropout.\n2. Pass through all `Block` layers sequentially.\n3. Apply final LayerNorm (`ln_f`).\n4. Project all positions through `lm_head` to get logits over the full sequence.\n5. Compute cross-entropy loss with `ignore_index=-1` (allows masking specific target positions).\n\n**Inference path** (`targets` is `None`):\nSame as training through step 3, but `lm_head` is only applied to the **last position** (`x[:, [-1], :]`), avoiding unnecessary computation for non-final tokens. The `[-1]` indexing (list, not integer) preserves the time dimension.\n\n### Loading Pretrained Weights\n\n```python\nmodel = GPT.from_pretrained('gpt2', override_args={'dropout': 0.1})\n```\n\nSupported model types: `gpt2`, `gpt2-medium`, `gpt2-large`, `gpt2-xl`.\n\nThe method:\n1. Creates a fresh `GPT` with the architecture matching the specified model type.\n2. Loads the corresponding `GPT2LMHeadModel` from HuggingFace `transformers`.\n3. Copies weights, **transposing** any `Conv1D`-style weights (the HuggingFace GPT-2 implementation uses `Conv1D` instead of `nn.Linear`, which stores weights transposed). The affected layers are: `attn.c_attn.weight`, `attn.c_proj.weight`, `mlp.c_fc.weight`, `mlp.c_proj.weight`.\n4. Only `dropout` can be overridden; all other architectural parameters are locked to the checkpoint values (`vocab_size=50257`, `block_size=1024`, `bias=True`).\n\n### Optimizer Configuration\n\n```python\noptimizer = model.configure_optimizers(weight_decay=0.1, learning_rate=3e-4, betas=(0.9, 0.95), device_type='cuda')\n```\n\nParameters are split into two groups based on dimensionality:\n- **2D+ tensors** (weight matrices, embeddings): receive the specified `weight_decay`.\n- **1D tensors** (biases, LayerNorm parameters): have `weight_decay=0.0`.\n\nThis avoids decaying bias and normalization parameters, which is standard practice. On CUDA, the fused AdamW implementation is used automatically when available.\n\n### Generation\n\n```python\noutput = model.generate(idx, max_new_tokens=100, temperature=0.8, top_k=40)\n```\n\nAutoregressive token generation loop:\n1. Crop the input to the last `block_size` tokens if it exceeds the context window.\n2. Forward pass to get logits for the last position.\n3. Apply temperature scaling: `logits /= temperature`.\n4. Optionally apply top-k filtering: set logits below the k-th highest value to `-inf`.\n5. Sample from the resulting distribution via `torch.multinomial`.\n6. Append the sampled token and repeat.\n\nThe method is decorated with `@torch.no_grad()`. Callers should ensure the model is in `eval()` mode for deterministic behavior of dropout layers.\n\n### Utility Methods\n\n**`crop_block_size(block_size)`**: Truncates the model to a shorter context window. Surgically resizes the position embedding table and the causal attention mask buffer. Useful when loading a 1024-token pretrained checkpoint but training/evaluating with a shorter sequence length.\n\n**`get_num_params(non_embedding=True)`**: Returns the parameter count. By default excludes position embeddings (since they're a fixed overhead), but includes token embeddings because they're tied with `lm_head` and actively used in the output computation.\n\n**`estimate_mfu(fwdbwd_per_iter, dt)`**: Estimates Model FLOPs Utilization as a fraction of A100 bfloat16 peak throughput (312 TFLOPS). Uses the approximation from the PaLM paper (Appendix B): `flops_per_token = 6*N + 12*L*H*Q*T`, where N is the non-embedding parameter count, L is layers, H is heads, Q is head dimension, and T is sequence length.\n\n## Design Decisions\n\n- **Pre-norm over post-norm**: More stable training for deep networks; matches modern transformer practice rather than the original GPT-2 paper.\n- **Optional bias**: Setting `config.bias=False` removes bias from all `nn.Linear` and `LayerNorm` layers, which is slightly faster and often equally effective (following PaLM and LLaMA).\n- **Vocab size padding**: 50304 (nearest multiple of 64 above GPT-2's 50257) ensures GPU-friendly tensor shapes without changing model semantics.\n- **Flash Attention auto-detection**: The model checks for `F.scaled_dot_product_attention` at construction time and falls back gracefully with a warning if unavailable.","other-config":"# Other — config\n\n# Config Module\n\nConfiguration files that define hyperparameters, evaluation settings, and runtime behavior for GPT-2 training, fine-tuning, and evaluation runs. Each file is a standalone Python script that sets module-level variables consumed by the main training loop.\n\n## Overview\n\nThe config files follow a simple convention: they declare plain Python variables at module scope. The training script (`train.py`) loads a config by passing its path as a command-line argument, then merges those variables into the runtime configuration object. This approach avoids rigid config schemas — any variable present in the config overrides the default.\n\n```bash\n# Example usage\ntorchrun --standalone --nproc_per_node=8 train.py config/train_gpt2.py\npython train.py config/train_shakespeare_char.py\n```\n\n## Config Categories\n\nThe configs fall into three categories based on their purpose:\n\n```mermaid\ngraph TD\n    A[config/] --> B[Evaluation]\n    A --> C[Training from scratch]\n    A --> D[Fine-tuning]\n    B --> B1[eval_gpt2]\n    B --> B2[eval_gpt2_medium]\n    B --> B3[eval_gpt2_large]\n    B --> B4[eval_gpt2_xl]\n    C --> C1[train_gpt2]\n    C --> C2[train_shakespeare_char]\n    D --> D1[finetune_shakespeare]\n```\n\n### Evaluation Configs\n\nFour configs for evaluating pretrained GPT-2 weights at each model scale. All share the same structure — they differ only in the `init_from` value, which selects which HuggingFace checkpoint to load.\n\n| Config | `init_from` | Parameters | Architecture |\n|---|---|---|---|\n| `eval_gpt2` | `gpt2` | 124M | 12 layers, 12 heads, 768 embed |\n| `eval_gpt2_medium` | `gpt2-medium` | 350M | 24 layers, 16 heads, 1024 embed |\n| `eval_gpt2_large` | `gpt2-large` | 774M | 36 layers, 20 heads, 1280 embed |\n| `eval_gpt2_xl` | `gpt2-xl` | 1558M | 48 layers, 25 heads, 1600 embed |\n\nCommon settings across all evaluation configs:\n\n- `batch_size = 8` — evaluation batch size\n- `eval_iters = 500` — number of iterations for loss estimation (higher than training for accuracy)\n- `eval_only = True` — skip training, only run evaluation\n- `wandb_log = False` — disable W&B logging for pure eval runs\n\n### Training Configs\n\n#### `train_gpt2.py`\n\nFull-scale training of GPT-2 (124M) from scratch on OpenWebText. Designed for a single 8×A100 40GB node, reaching ~2.85 validation loss over approximately 5 days.\n\nKey design decisions:\n\n- **Total batch size ~0.5M tokens**: `12 batch_size × 1024 block_size × 40 gradient_accumulation_steps (5×8 GPUs) = 491,520 tokens/step`\n- **300B total training tokens**: `600,000 max_iters × ~0.5M tokens/iter`\n- **Weight decay**: `1e-1` for regularization\n- **W&B logging enabled**: project `owt`, run name `gpt2-124M`\n\nLaunch command:\n```bash\ntorchrun --standalone --nproc_per_node=8 train.py config/train_gpt2.py\n```\n\n#### `train_shakespeare_char.py`\n\nA miniature character-level model for debugging and development on resource-constrained hardware (e.g., MacBooks). Intentionally overfits the small Shakespeare dataset.\n\nArchitecture is a \"baby GPT\":\n\n- `n_layer = 6`, `n_head = 6`, `n_embd = 384`\n- `dropout = 0.2` — higher than typical since the model easily overfits\n- `block_size = 256` — shorter context (characters, not subwords)\n- `batch_size = 64`, `gradient_accumulation_steps = 1`\n\nTraining specifics:\n\n- `learning_rate = 1e-3` — higher LR affordable with small networks\n- `min_lr = 1e-4` — floor for LR decay (typically `learning_rate / 10`)\n- `beta2 = 0.99` — slightly higher than default 0.999... wait, actually 0.99 is lower. This is adjusted because the number of tokens per iteration is small, making gradient estimates noisier; a lower beta2 means the optimizer adapts faster.\n- `warmup_iters = 100` — short warmup, noted as potentially unnecessary\n- `always_save_checkpoint = False` — only persist when validation loss improves, since overfitting is expected\n\nFor CPU-only runs, uncomment or add:\n```python\ndevice = 'cpu'\ncompile = False\n```\n\n### Fine-tuning Config\n\n#### `finetune_shakespeare.py`\n\nFine-tunes GPT-2 XL (1558M) on the Shakespeare dataset. Uses a constant learning rate with no decay, which is standard practice for fine-tuning.\n\nKey settings:\n\n- `init_from = 'gpt2-xl'` — start from the largest pretrained GPT-2\n- `learning_rate = 3e-5` — much lower than from-scratch training\n- `decay_lr = False` — constant LR throughout fine-tuning\n- `always_save_checkpoint = False` — only save on validation improvement\n- `max_iters = 20` — very few steps needed (dataset is ~302K tokens; at 32,768 tokens/iter, one epoch ≈ 9.2 iters)\n- `batch_size = 1`, `gradient_accumulation_steps = 32` — effective batch of 32 sequences to fit large model in memory\n\n## Common Variables Reference\n\nThese are the variables that the training script reads from config files. Not every config sets every variable — defaults are handled in the training code.\n\n| Variable | Type | Description |\n|---|---|---|\n| `init_from` | `str` | Checkpoint source: `'gpt2'`, `'gpt2-medium'`, `'gpt2-large'`, `'gpt2-xl'`, or a path |\n| `batch_size` | `int` | Micro-batch size per GPU |\n| `block_size` | `int` | Context length in tokens (or characters for char-level) |\n| `gradient_accumulation_steps` | `int` | Steps to accumulate before weight update |\n| `max_iters` | `int` | Total training iterations |\n| `learning_rate` | `float` | Peak learning rate |\n| `decay_lr` | `bool` | Whether to apply cosine LR decay |\n| `lr_decay_iters` | `int` | Iterations over which LR decays |\n| `min_lr` | `float` | Minimum LR after decay |\n| `warmup_iters` | `int` | Linear warmup iterations |\n| `beta2` | `float` | Adam beta2 parameter |\n| `weight_decay` | `float` | AdamW weight decay |\n| `dropout` | `float` | Residual dropout rate |\n| `eval_interval` | `int` | Iterations between evaluations |\n| `eval_iters` | `int` | Batches used for loss estimation |\n| `eval_only` | `bool` | If True, run evaluation and exit |\n| `always_save_checkpoint` | `bool` | If False, only save when val loss improves |\n| `log_interval` | `int` | Iterations between training log prints |\n| `out_dir` | `str` | Directory for checkpoints and logs |\n| `dataset` | `str` | Dataset name (e.g., `'shakespeare'`, `'shakespeare_char'`) |\n| `wandb_log` | `bool` | Enable Weights & Biases logging |\n| `wandb_project` | `str` | W&B project name |\n| `wandb_run_name` | `str` | W&B run identifier |\n| `n_layer` | `int` | Number of transformer blocks |\n| `n_head` | `int` | Number of attention heads |\n| `n_embd` | `int` | Embedding dimension |\n| `device` | `str` | Compute device (`'cpu'`, `'cuda'`) |\n| `compile` | `bool` | Whether to `torch.compile` the model |\n\n## Creating a Custom Config\n\nTo define a new run, create a Python file in `config/` and set only the variables you want to override:\n\n```python\n# config/my_experiment.py\nout_dir = 'out-my-experiment'\ndataset = 'openwebtext'\ninit_from = 'gpt2'  # start from pretrained\n\nbatch_size = 8\nblock_size = 1024\ngradient_accumulation_steps = 4\n\nlearning_rate = 6e-4\nmax_iters = 100000\nlr_decay_iters = 100000\n\neval_interval = 500\neval_iters = 200\n\nwandb_log = True\nwandb_project = 'my-project'\nwandb_run_name = 'experiment-1'\n```\n\nThen run:\n```bash\npython train.py config/my_experiment.py\n```","other-openwebtext":"# Other — openwebtext\n\n# OpenWebText Dataset Module\n\n## Overview\n\nThe `data/openwebtext` module provides preprocessing tooling for the [OpenWebText](https://skylion007.github.io/OpenWebTextCorpus/) corpus — an open-source reproduction of OpenAI's WebText dataset, which was introduced in the [GPT-2 paper](https://d4mucfpksywv.cloudfront.net/better-language-models/language_models_are_unsupervised_multitask_learners.pdf). The module converts raw documents into tokenized binary files suitable for training language models.\n\n## Preparation\n\nRun the preprocessing script to tokenize and split the raw corpus:\n\n```bash\npython data/openwebtext/prepare.py\n```\n\nThis reads the raw OpenWebText documents, tokenizes them, and writes the output splits to disk.\n\n## Output Files\n\nAfter `prepare.py` completes, two binary files are produced in the module directory:\n\n| File | Size | Token Count |\n|------|------|-------------|\n| `train.bin` | ~17 GB | 9,035,582,198 |\n| `val.bin` | ~8.5 MB | 4,434,897 |\n\nThe dataset is derived from **8,013,769 documents** in total. The validation split is intentionally small relative to training, reflecting the scale imbalance typical in large-scale language model training.\n\n## Token Format\n\nThe `.bin` files contain token IDs stored as packed binary data. Consumers of these files should read the token sequences and feed them into the model's input pipeline. The tokenization scheme matches the GPT-2 byte-level BPE vocabulary.\n\n## Integration\n\nThis module is a standalone data preparation step — it has no runtime dependencies on other modules in the codebase and is not invoked by any other module. It is run once offline to produce the training and validation binaries, which are then consumed by the training loop.\n\n## References\n\n- **GPT-2 Paper**: [Language Models are Unsupervised Multitask Learners](https://d4mucfpksywv.cloudfront.net/better-language-models/language_models_are_unsupervised_multitask_learners.pdf)\n- **OpenWebText Corpus**: [https://skylion007.github.io/OpenWebTextCorpus/](https://skylion007.github.io/OpenWebTextCorpus/)","other-readme-md":"# Other — README.md\n\n# nanoGPT — Project Overview & Developer Guide\n\n## Status\n\nnanoGPT is **deprecated** as of November 2025. Its successor, [nanochat](https://github.com/karpathy/nanochat), should be preferred for new work. This repository remains available for reference and posterity.\n\n## What It Is\n\nThe simplest, fastest codebase for training and finetuning medium-sized GPT models. A rewrite of [minGPT](https://github.com/karpathy/minGPT) that prioritizes practicality over pedagogy. The entire system is two core files:\n\n- **`train.py`** — ~300-line training loop with all boilerplate (data loading, optimization, checkpointing, logging, distributed training)\n- **`model.py`** — ~300-line GPT model definition, with optional loading of OpenAI GPT-2 pretrained weights\n\nThat's the entire model + trainer. The simplicity makes it straightforward to hack, extend, and adapt.\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[prepare.py] -->|tokenized .bin files| B[train.py]\n    C[config/*.py] -->|hyperparameters| B\n    B -->|checkpoints| D[out_dir]\n    D -->|--out_dir| E[sample.py]\n    F[OpenAI GPT-2] -->|init_from| B\n    F -->|init_from| E\n    B -->|uses| G[model.py]\n```\n\n### Core Components\n\n| Component | Role |\n|-----------|------|\n| `model.py` | GPT model definition (Transformer blocks, attention, MLP, weight loading) |\n| `train.py` | Training loop, DDP orchestration, checkpointing, evaluation, logging |\n| `sample.py` | Inference script — generates text from pretrained or trained checkpoints |\n| `bench.py` | Minimal benchmarking/profiling of the training step (no data loading, no logging) |\n| `config/` | Python config files that override default hyperparameters |\n| `data/` | Dataset preparation scripts, each in their own subdirectory |\n\n### Data Pipeline\n\nEach dataset lives under `data/<dataset_name>/` with a `prepare.py` script that:\n1. Downloads raw text\n2. Tokenizes it (character-level or BPE via `tiktoken`)\n3. Writes `train.bin` and `val.bin` as flat uint16 arrays of token IDs\n\nThe training script reads these binary files directly, no PyTorch Dataset class needed.\n\n### Configuration System\n\nConfigs are plain Python files (e.g., `config/train_shakespeare_char.py`) that define a dictionary of parameter overrides. All CLI flags in `train.py` correspond to config keys and can override them. Key parameters:\n\n| Parameter | Description |\n|-----------|-------------|\n| `--device` | `cpu`, `cuda`, or `mps` (Apple Silicon GPU) |\n| `--compile` | Enable `torch.compile()` (PyTorch 2.0). Default: `True` |\n| `--block_size` | Context length in tokens |\n| `--batch_size` | Examples per iteration |\n| `--n_layer` | Number of Transformer blocks |\n| `--n_head` | Number of attention heads per block |\n| `--n_embd` | Embedding dimension |\n| `--max_iters` | Total training iterations |\n| `--lr_decay_iters` | Iterations for learning rate decay schedule |\n| `--dropout` | Dropout probability |\n| `--init_from` | `scratch`, `gpt2`, `gpt2-medium`, `gpt2-large`, or `gpt2-xl` |\n| `--out_dir` | Directory for checkpoint writes |\n\n## Installation\n\n```sh\npip install torch numpy transformers datasets tiktoken wandb tqdm\n```\n\n| Dependency | Purpose |\n|------------|---------|\n| `torch` | Core framework (PyTorch 2.0+ recommended for `torch.compile`) |\n| `numpy` | Numerical utilities |\n| `transformers` | Loading OpenAI GPT-2 pretrained checkpoints |\n| `datasets` | Downloading and preprocessing HuggingFace datasets (e.g., OpenWebText) |\n| `tiktoken` | OpenAI's fast BPE tokenizer |\n| `wandb` | Optional experiment logging |\n| `tqdm` | Progress bars |\n\n## Workflows\n\n### 1. Train from Scratch (Character-Level, Shakespeare)\n\nPrepare data:\n```sh\npython data/shakespeare_char/prepare.py\n```\n\nTrain on GPU:\n```sh\npython train.py config/train_shakespeare_char.py\n```\n\nDefault config: context 256, 384 channels, 6 layers, 6 heads. ~3 min on A100, val loss ~1.47.\n\nTrain on CPU (scaled down):\n```sh\npython train.py config/train_shakespeare_char.py \\\n    --device=cpu --compile=False --eval_iters=20 --log_interval=1 \\\n    --block_size=64 --batch_size=12 --n_layer=4 --n_head=4 \\\n    --n_embd=128 --max_iters=2000 --lr_decay_iters=2000 --dropout=0.0\n```\n\n~3 min on CPU, val loss ~1.88. On Apple Silicon, use `--device=mps` for 2–3× speedup.\n\nSample:\n```sh\npython sample.py --out_dir=out-shakespeare-char\n```\n\n### 2. Reproduce GPT-2 (124M) on OpenWebText\n\nPrepare data:\n```sh\npython data/openwebtext/prepare.py\n```\n\nTrain (8× A100 40GB, ~4 days):\n```sh\ntorchrun --standalone --nproc_per_node=8 train.py config/train_gpt2.py\n```\n\nMulti-node (2 nodes example):\n```sh\n# Master node (IP: 123.456.123.456):\ntorchrun --nproc_per_node=8 --nnodes=2 --node_rank=0 \\\n    --master_addr=123.456.123.456 --master_port=1234 train.py\n# Worker node:\ntorchrun --nproc_per_node=8 --nnodes=2 --node_rank=1 \\\n    --master_addr=123.456.123.456 --master_port=1234 train.py\n```\n\nWithout Infiniband, prepend `NCCL_IB_DISABLE=1` — multinode will work but run slowly. Benchmark interconnect with `iperf3`.\n\nExpected result: val loss ~2.85 (matches GPT-2 finetuned on OWT; the raw GPT-2 checkpoint scores ~3.11 due to domain gap with original WebText).\n\n### 3. Finetune a Pretrained Model\n\nFinetuning is just training with `init_from` set to a GPT-2 variant and a smaller learning rate. Example on Shakespeare with BPE tokenization:\n\n```sh\npython data/shakespeare/prepare.py\npython train.py config/finetune_shakespeare.py\n```\n\nThe config sets `init_from` to a GPT-2 checkpoint and reduces the learning rate. If OOM, decrease model size (`gpt2` instead of `gpt2-xl`) or reduce `block_size`.\n\nSample:\n```sh\npython sample.py --out_dir=out-shakespeare\n```\n\n### 4. Inference / Sampling\n\nFrom a trained checkpoint:\n```sh\npython sample.py --out_dir=out-shakespeare-char\n```\n\nFrom an OpenAI pretrained model directly:\n```sh\npython sample.py \\\n    --init_from=gpt2-xl \\\n    --start=\"What is the answer to life, the universe, and everything?\" \\\n    --num_samples=5 --max_new_tokens=100\n```\n\nPrompt from a file:\n```sh\npython sample.py --start=FILE:prompt.txt\n```\n\n## Baselines (OpenAI GPT-2 on OpenWebText)\n\nEval configs: `config/eval_gpt2.py`, `eval_gpt2_medium.py`, `eval_gpt2_large.py`, `eval_gpt2_xl.py`.\n\n| Model | Params | Train Loss | Val Loss |\n|-------|--------|------------|----------|\n| gpt2 | 124M | 3.11 | 3.12 |\n| gpt2-medium | 350M | 2.85 | 2.84 |\n| gpt2-large | 774M | 2.66 | 2.67 |\n| gpt2-xl | 1558M | 2.56 | 2.54 |\n\nThese are zero-shot evaluations of OpenAI's checkpoints on OWT. The domain gap between WebText (original, closed) and OpenWebText means finetuning GPT-2 on OWT drops the 124M loss from 3.12 to ~2.85 — that's the true reproduction target.\n\n## Performance\n\n`torch.compile()` (PyTorch 2.0) is enabled by default and provides significant speedups — e.g., iteration time drops from ~250ms to ~135ms. Use `bench.py` for isolated profiling of the training step without data loading or logging overhead.\n\n## Troubleshooting\n\n| Issue | Fix |\n|-------|-----|\n| `torch.compile` errors (Windows, older PyTorch) | Add `--compile=False` |\n| Slow CPU training | Use `--device=mps` on Apple Silicon, or reduce model size / block_size / batch_size |\n| OOM during finetuning | Switch to smaller `init_from` model or reduce `--block_size` |\n| Slow multi-node training | Verify interconnect with `iperf3`; if no Infiniband, set `NCCL_IB_DISABLE=1` |\n\n## Known Limitations & TODOs\n\n- Uses DDP only — FSDP not yet integrated\n- No standard zero-shot eval benchmarks (LAMBADA, HELM, etc.)\n- Finetuning hyperparameters are not well-tuned\n- No linear batch size warmup schedule\n- Only standard positional embeddings (no rotary, ALiBi)\n- Optimizer buffers are not separated from model params in checkpoints\n- Limited network health logging (gradient clip events, magnitude tracking)\n- Initialization strategy could be improved\n\n## Resources\n\n- **Video walkthrough**: [Let's build GPT: from scratch, in code, spelled out](https://www.youtube.com/watch?v=kCc8FmEb1nY) (part of the [Zero To Hero series](https://karpathy.ai/zero-to-hero.html))\n- **Community**: `#nanoGPT` on [Discord](https://discord.gg/3zy8kqD9Cp)\n- **Compute sponsor**: [Lambda Labs](https://lambdalabs.com)","other-scaling-laws-ipynb":"# Other — scaling_laws.ipynb\n\n# Scaling Laws (scaling_laws.ipynb)\n\n## Purpose\n\nThis notebook reproduces key results from the [Chinchilla paper](https://arxiv.org/pdf/2203.15556.pdf) (Hoffmann et al., 2022). It provides utilities for calculating parameter counts and FLOPs for transformer language models, and fits the scaling law function L(N, D) to determine compute-optimal model configurations. The numbers don't match the paper exactly but serve as a practical guide.\n\n## Key Functions\n\n### `gpt_params(seq_len, vocab_size, d_model, num_heads, num_layers)`\n\nCalculates the total number of parameters in a GPT-style model. The FFN intermediate size is hardcoded to `4 * d_model` per GPT conventions.\n\n**Parameter breakdown per component:**\n\n| Component | Formula |\n|---|---|\n| Token + position embeddings | `d_model * vocab_size + d_model * seq_len` |\n| QKV projections (per layer) | `3 * d_model² + 3 * d_model` |\n| Output projection (per layer) | `d_model² + d_model` |\n| FFN up (per layer) | `d_model * ffw_size + ffw_size` |\n| FFN down (per layer) | `ffw_size * d_model + d_model` |\n| Layer norms (per layer) | `2 * 2 * d_model` |\n| Final layer norm | `2 * d_model` |\n| Output head (no bias) | `d_model * vocab_size` |\n\n**Important:** Embedding parameters are excluded from the total count. The function returns ~123.65M for GPT-2 small config, matching OpenAI's reported 124M.\n\n### `chinchilla_params(seq_len, vocab_size, d_model, num_heads, num_layers, ffw_size)`\n\nCalculates parameters for Chinchilla-family models. Unlike GPT, these use **relative positional embeddings** instead of learned position embeddings, and the FFN size is a separate argument rather than fixed at `4 * d_model`.\n\n**Key differences from `gpt_params`:**\n\n- No position embeddings (token embeddings only)\n- Additional relative position parameters per layer: `d_model² + 2 * d_model` (relative keys, content bias, relative bias)\n- `ffw_size` is configurable\n\nThe notebook validates this against all 50 Chinchilla model configurations from Table A9. The estimated counts closely match the reported values (within ~5% for most models, with larger deviations for a few).\n\n### `chinchilla_flops(seq_len, vocab_size, d_model, num_heads, num_layers, ffw_size)`\n\nCalculates total training FLOPs following Chinchilla Appendix F. The `key_size` is derived as `d_model // num_heads`.\n\n**FLOP breakdown:**\n\n| Component | Formula |\n|---|---|\n| Embeddings | `2 * seq_len * vocab_size * d_model` |\n| QKV projections (per layer) | `2 * 3 * seq_len * d_model * (key_size * num_heads)` |\n| Key × Query logits (per layer) | `2 * seq_len² * (key_size * num_heads)` |\n| Softmax (per layer) | `3 * num_heads * seq_len²` |\n| Softmax × Value (per layer) | `2 * seq_len² * (key_size * num_heads)` |\n| Output projection (per layer) | `2 * seq_len * (key_size * num_heads) * d_model` |\n| FFN (per layer) | `2 * seq_len * (d_model * ffw_size + d_model * ffw_size)` |\n| Logits | `2 * seq_len * d_model * vocab_size` |\n\n**Critical implementation detail:** Per author correspondence, there is a typo in the paper — embeddings and logits FLOPs are **not** counted when reproducing Table 4. The forward pass FLOPs are computed as:\n\n```\nforward_flops = num_layers * (attention_flops + ffn_flops)\n```\n\nBackward pass FLOPs are `2 * forward_flops` (per Kaplan et al. 2020), giving:\n\n```\ntotal_flops = 3 * forward_flops\n```\n\n## Approximate vs. Exact FLOPs\n\nThe notebook compares the exact FLOP calculation against the standard approximation:\n\n```\napprox_flops = 6 * D * N\n```\n\nwhere `D` is the dataset size (tokens) and `N` is the parameter count. Using the 6 models from Chinchilla Table A4 (with `vocab_size = 32000`, `seq_len = 2048`), the ratio of exact to approximate FLOPs ranges from ~0.99 to ~1.10, confirming the approximation is reasonable but not exact.\n\n## Chinchilla Model Data\n\nAll 50 model configurations from Table A9 are embedded as a JSON array. Each entry is:\n\n```\n[total_params, d_model, ffw_size, kv_size, num_heads, num_layers]\n```\n\nModels range from 44M to 16.2B parameters.\n\n## Scaling Laws: Approach 3\n\nThe notebook fits the Chinchilla Approach 3 loss function L(N, D), which approximates the final loss as a function of model size (N) and data size (D). This is the core scaling law used to determine compute-optimal allocations between model size and training data.\n\n## Usage Notes\n\n- The parameter count functions exclude embedding parameters from the total, consistent with the Chinchilla paper's convention.\n- The FLOP calculation intentionally omits embedding and logit layers to match the paper's Table 4 reproduction.\n- The `seq_len` parameter in `chinchilla_flops` effectively represents the number of tokens in a forward pass; for total training FLOPs, scale by `D / seq_len` where `D` is total training tokens.\n- Validation against GPT-2 small (124M params) and Chinchilla Table A9/A4 models confirms the calculations are approximately correct, though not pixel-perfect matches to the paper.","other-shakespeare-char":"# Other — shakespeare_char\n\n# shakespeare_char\n\nCharacter-level tokenization of the Tiny Shakespeare dataset, producing binary training and validation splits for language modeling.\n\n## Overview\n\nThis module prepares the classic **Tiny Shakespeare** corpus — a condensed collection of Shakespeare's works commonly used in character-level language modeling (dating back to the char-rnn era). It processes raw text into memory-mappable binary files where each token is a single UTF-8 character encoded as a byte-level integer.\n\n## Dataset\n\nThe source text is a concatenation of Shakespeare's plays, stripped down to plain text. After tokenization:\n\n| Split | File | Tokens |\n|-------|------|--------|\n| Train | `train.bin` | 1,003,854 |\n| Val | `val.bin` | 111,540 |\n\nThe train/val split is approximately 90/10. At the character level, \"tokens\" correspond to individual characters in the source text.\n\n## Usage\n\nRun the preparation script to generate the binary files:\n\n```bash\npython prepare.py\n```\n\nThis reads the raw Shakespeare text, encodes each character as a single byte (vocabulary size ≤ 256), and writes the resulting token sequences to `train.bin` and `val.bin` as raw `uint8` arrays — one byte per token.\n\n## Output Format\n\nBoth `.bin` files are flat binary buffers of `uint8` values. They can be loaded efficiently with NumPy or memory-mapped directly:\n\n```python\nimport numpy as np\n\n# Load entirely into memory\ndata = np.fromfile(\"train.bin\", dtype=np.uint8)\n\n# Or memory-map for large-scale or lazy access\ndata = np.memmap(\"train.bin\", dtype=np.uint8, mode=\"r\")\n```\n\nEach integer value maps directly to a character via Python's `chr()` (or the equivalent in your framework's decoder). The vocabulary is the set of unique characters present in the source text — no special tokens, no BPE, no merging.\n\n## Integration with Training\n\nThis module is a **data preparation step only**. It has no runtime dependencies on other modules and no downstream code calls into it during training. The generated `.bin` files are consumed by training scripts (typically in a `nanogpt`-style pipeline) that:\n\n1. Memory-map or load the binary files.\n2. Sample random chunks of a fixed context length.\n3. Feed `(input, target)` pairs — shifted by one position — into a character-level transformer or RNN.\n\nBecause the tokenization is trivial (one character = one token), no decoder or detokenization logic is needed beyond casting `uint8` → `chr`.\n\n## Design Notes\n\n- **Why character-level?** Simplicity and interpretability. Every prediction is a single character, making it easy to inspect model output and debug generation. The small vocabulary (≤ 256) also keeps the output projection layer tiny.\n- **Why raw binary?** Avoids the overhead of JSON/CSV parsing and enables memory-mapped training for arbitrarily large corpora. The `uint8` dtype is sufficient since the vocabulary fits in a single byte.\n- **No special tokens.** There are no `<BOS>`, `<EOS>`, or `<PAD>` tokens injected by this module. If your training loop requires them, add them downstream after loading.","other-shakespeare":"# Other — shakespeare\n\n# Tiny Shakespeare\n\nA minimal dataset module providing the classic **tiny shakespeare** text corpus, commonly used for training and benchmarking character-level language models.\n\n## Overview\n\nTiny Shakespeare is a compact excerpt of Shakespeare's works, originating from Andrej Karpathy's char-rnn experiments. It serves as a lightweight, fast-iteration dataset for developing and testing language model architectures without the overhead of large-scale corpora.\n\n## Dataset Statistics\n\n| Split | File | Tokens |\n|-------|------|--------|\n| Train | `train.bin` | 301,966 |\n| Val | `val.bin` | 36,059 |\n\nThe train/val split is approximately 89%/11%.\n\n## Data Preparation\n\nRun the preparation script to generate the binary token files:\n\n```bash\npython prepare.py\n```\n\nThis reads the raw Shakespeare text, tokenizes it at the character level, and writes two binary files:\n\n- **`train.bin`** — training split\n- **`val.bin`** — validation split\n\nThe `.bin` files contain token IDs stored as raw binary data (typically `uint16` or `int32` depending on the vocabulary size), ready to be memory-mapped or loaded directly during training.\n\n## Usage\n\nThe generated binary files are consumed by training loops elsewhere in the codebase. A typical pattern:\n\n```python\nimport numpy as np\n\ntrain_data = np.memmap(\"train.bin\", dtype=np.uint16, mode=\"r\")\nval_data = np.memmap(\"val.bin\", dtype=np.uint16, mode=\"r\")\n```\n\nFrom there, chunks are sampled to form training batches for autoregressive language modeling.\n\n## File Inventory\n\n| File | Purpose |\n|------|---------|\n| `prepare.py` | Tokenizes raw text and produces `train.bin` / `val.bin` |\n| `train.bin` | Tokenized training split (generated) |\n| `val.bin` | Tokenized validation split (generated) |\n\n## Notes\n\n- The module is self-contained with no runtime dependencies on other modules in the codebase. It serves purely as a **data source**.\n- Re-run `prepare.py` if the binary files are missing or corrupted.\n- The small size of this dataset makes it ideal for debugging, overfitting tests, and rapid prototyping — not for production-scale evaluation.","other-transformer-sizing-ipynb":"# Other — transformer_sizing.ipynb\n\n# Transformer Sizing Analysis\n\n## Purpose\n\nThis notebook provides a theoretical analysis toolkit for estimating the computational and memory characteristics of a GPT-2-style Transformer. It calculates parameter counts, FLOPs, checkpoint sizes, GPU memory footprint, and training time — all from the model's architectural hyperparameters alone, without needing to instantiate the model.\n\nUse this notebook when changing model configurations (e.g., scaling from GPT-2 to GPT-2-XL) to predict resource requirements before committing to a training run.\n\n## Configuration\n\nThe model is defined by six global variables at the top of the notebook:\n\n| Variable | Default (GPT-2) | Description |\n|---|---|---|\n| `block_size` | 1024 | Maximum sequence length (T) |\n| `vocab_size` | 50257 | Vocabulary size |\n| `n_layer` | 12 | Number of transformer blocks (L) |\n| `n_head` | 12 | Number of attention heads (H) |\n| `n_embd` | 768 | Embedding dimension |\n| `bias` | False | Whether linear layers use bias (must be `False` for this notebook's formulas) |\n\nCommented-out configurations for other GPT-2 variants are included for reference:\n\n- **gpt2-medium**: L=24, H=16, n_embd=1024 → ~350M params\n- **gpt2-large**: L=36, H=20, n_embd=1280 → ~774M params\n- **gpt2-xl**: L=48, H=25, n_embd=1600 → ~1558M params\n\n## Core Functions\n\n### `params()` → `OrderedDict`\n\nEstimates the total number of trainable parameters, broken down by component. Returns an ordered dictionary with keys at multiple granularity levels:\n\n**Embedding layer:**\n- `emebedding/position` — `n_embd × block_size` (positional embeddings)\n- `embedding/token` — `n_embd × vocab_size` (token embeddings)\n- `embedding` — sum of the above\n\n**Per-block attention:**\n- `attention/ln` — `n_embd` (LayerNorm weight, no bias)\n- `attention/kqv` — `n_embd × 3×n_embd` (fused QKV projection)\n- `attention/proj` — `n_embd²` (output projection)\n- `attention` — sum of the above\n\n**Per-block MLP:**\n- `mlp/ln` — `n_embd` (LayerNorm weight)\n- `mlp/ffw` — `n_embd × 4×n_embd` (up-projection)\n- `mlp/proj` — `4×n_embd × n_embd` (down-projection)\n- `mlp` — sum of the above\n\n**Aggregated:**\n- `block` — `attention + mlp` (per-layer total)\n- `transformer` — `n_layer × block`\n- `ln_f` — `n_embd` (final LayerNorm)\n- `dense` — `0` (weight-tied with token embedding, not counted separately)\n- `total` — `embedding + transformer + ln_f + dense`\n\nFor the default GPT-2 config, this yields **124,337,664** parameters, matching PyTorch's reported count exactly.\n\n### `flops()` → `OrderedDict`\n\nEstimates FLOPs for a single forward pass over a sequence of length `block_size`. Only matrix-multiply FLOPs are counted (LayerNorm, Softmax, etc. are considered negligible). The convention is **actual FLOPs** (not MACs): a matrix multiply `A(B×C) @ B(C×D)` costs `2×B×C×D` FLOPs.\n\n**Per-block attention:**\n- `attention/kqv` — `2 × T × (n_embd × 3×n_embd)` — QKV projections\n- `attention/scores` — `2 × T × T × n_embd` — dot-product attention scores\n- `attention/reduce` — `2 × H × (T × T × head_size)` — weighted value reduction\n- `attention/proj` — `2 × T × (n_embd × n_embd)` — output projection\n\n**Per-block MLP:**\n- `mlp/ffw1` — `2 × T × (n_embd × 4×n_embd)` — up-projection\n- `mlp/ffw2` — `2 × T × (4×n_embd × n_embd)` — down-projection\n\n**Aggregated:**\n- `block` — `attention + mlp`\n- `transformer` — `n_layer × block`\n- `dense` — `2 × T × (n_embd × vocab_size)` — output logits (weight-tied)\n- `forward_total` — `transformer + dense`\n- `backward_total` — `2 × forward_total` (standard approximation)\n- `total` — `forward_total + backward_total`\n\n### `palm_flops()` → `int`\n\nCross-validates the `flops()` estimate using the formula from the [PaLM paper](https://arxiv.org/abs/2204.02311):\n\n```\nN = total_params - position_embedding_params\nmf_per_token = 6N + 12 × L × H × Q × T\ntotal_flops = mf_per_token × T\n```\n\nWhere `Q = n_embd // n_head` (head dimension). The two methods agree to within 0.01%, confirming the correctness of the detailed breakdown.\n\n## Derived Calculations\n\n### Checkpoint Size\n\nAn AdamW checkpoint stores each parameter three times in fp32:\n- The parameter itself (4 bytes)\n- First moment estimate (4 bytes)\n- Second moment estimate (4 bytes)\n\n```\ncheckpoint_bytes = params_total × 4 × 3\n```\n\nFor GPT-2: ~1.49 GB estimated vs. 1.54 GB measured → ~3.4% overhead from non-parameter metadata.\n\n### GPU Memory Ratio\n\nOn a 40 GB A100, the parameters + optimizer buffers consume only ~3.7% of GPU memory for GPT-2. The vast majority of memory is consumed by activations (forward + backward). This ratio shifts dramatically for larger models.\n\n### Model Flops Utilization (MFU)\n\nMFU measures what fraction of a GPU's theoretical peak FLOPs the training loop achieves:\n\n```\nflops_achieved = total_flops × (batch_size / measured_time)\nMFU = flops_achieved / gpu_peak_flops\n```\n\nWith batch_size=100 (20 × 5 grad_accum) and 755ms/iteration on a single A100, the measured MFU is **~37%**. The target for well-optimized training is 50%+.\n\n### Training Time Estimation (6ND Rule)\n\nThe total training FLOPs follow the approximation:\n\n```\ntotal_flops = 6 × N × D\n```\n\nWhere N = parameter count, D = total training tokens. Training time on an 8×A100 node at 30% MFU:\n\n```\ntime = (6 × N × D) / (8 × 312 TFLOPS × 0.3)\n```\n\nFor GPT-2 (124M params, 300B tokens): **~3.46 days** estimated, matching the observed ~4 days.\n\n## Parameter Distribution\n\nThe parameter breakdown reveals where the model's capacity lives:\n\n```\nComponent              Ratio\n────────────────────────────\nToken embedding        31.0%\nTransformer blocks     68.3%\n  ├─ Attention (per L)   1.9%\n  └─ MLP (per L)         3.8%\nPosition embedding      0.6%\nFinal LayerNorm         ~0%\n```\n\nKey observations:\n- Token embeddings dominate at ~31% of all parameters\n- Each transformer block is ~2:1 MLP-to-attention ratio\n- The output head (`dense`) contributes 0 additional parameters due to weight tying with the token embedding\n\n## FLOPs Distribution\n\n```\nComponent              Ratio of forward\n────────────────────────────────────────\nTransformer blocks     72.9%\nOutput logits (dense)  27.1%\n  ├─ Per-block MLP       3.3%\n  └─ Per-block Attn      2.8%\n```\n\nThe output logits layer is the single most expensive operation (~27% of forward FLOPs) because of the large vocabulary size. Within each block, the MLP is slightly more expensive than attention.\n\n## Limitations\n\n- **`bias` must be `False`** — the formulas do not account for bias parameters in linear layers or LayerNorm\n- **Memory bandwidth** is not estimated — FLOPs are only one constraint; LOAD/STORE costs are noted as TODO\n- **Activation memory** is not computed — only parameter/optimizer memory is estimated\n- The backward-pass FLOPs use the `2× forward` approximation, which is exact only for elementwise operations and slightly overestimates for some fused ops","other":"# Other\n\n# Other — Supporting Resources\n\nSupplementary materials for the nanoGPT training pipeline: configuration, datasets, and analysis tooling.\n\n> **Note:** nanoGPT is **deprecated** as of November 2025. See the [project README](README.md) for details and the recommended successor.\n\n## What's Here\n\nThis module groups everything that isn't a core training/model file but is needed to configure, feed data into, or reason about a training run.\n\n| Category | Sub-module | Purpose |\n|----------|-----------|---------|\n| **Configuration** | [Config](config.md) | Python config files that define hyperparameters, evaluation settings, and runtime behavior. Consumed by `train.py` via command-line path. |\n| **Datasets** | [OpenWebText](openwebtext.md) | Large-scale preprocessing for the OpenWebText corpus (open-source WebText reproduction). |\n| | [Shakespeare](shakespeare.md) | Tiny Shakespeare at subword/token level — lightweight benchmark dataset (~302k train tokens). |\n| | [Shakespeare Char](shakespeare_char.md) | Tiny Shakespeare at character/byte level — lightweight benchmark dataset (~1M train tokens). |\n| **Analysis** | [Scaling Laws](scaling_laws.ipynb.md) | Reproduces Chinchilla scaling-law results; computes parameter counts, FLOPs, and fits L(N, D). |\n| | [Transformer Sizing](transformer_sizing.ipynb.md) | Estimates parameter counts, FLOPs, checkpoint size, GPU memory, and training time from architecture hyperparameters alone. |\n\n## How They Fit Together\n\nThe typical workflow chains these resources through `train.py`:\n\n1. **Prepare a dataset** — run the `prepare.py` script in a data sub-module to produce `train.bin` / `val.bin` tokenized splits.\n2. **Select or write a config** — pick an existing file in [Config](config.md) or create one; it sets the data path, model architecture, learning rate, and all other hyperparameters.\n3. **(Optional) Size the run** — use [Transformer Sizing](transformer_sizing.ipynb.md) to estimate GPU memory and training time before committing resources, or [Scaling Laws](scaling_laws.ipynb.md) to find a compute-optimal model/data configuration.\n4. **Launch training** — pass the config path to `train.py` (or `torchrun`).\n\n```mermaid\nflowchart LR\n    subgraph Data\n        OWT[OpenWebText]\n        SHK[Shakespeare]\n        SHC[Shakespeare Char]\n    end\n    subgraph Analysis\n        SL[Scaling Laws]\n        TS[Transformer Sizing]\n    end\n    CFG[Config] --> TRAIN[train.py]\n    Data -->|\"prepare.py → train.bin / val.bin\"| TRAIN\n    Analysis -.->|\"inform config choices\"| CFG\n```\n\nThe data modules and analysis notebooks are independent of each other and of the config system — they share no code. Their connection is purely at the workflow level: datasets produce the binary files that configs point to, and analysis notebooks inform the hyperparameter decisions that configs encode.","overview":"# nanoGPT — Wiki\n\n# nanoGPT\n\n> **⚠️ Deprecated** — nanoGPT is no longer actively maintained (as of November 2025). Its successor, [nanochat](https://github.com/karpathy/nanochat), is the recommended replacement. This repo remains available for reference.\n\nThe simplest, fastest repository for training and finetuning medium-sized GPTs. nanoGPT is a from-scratch PyTorch implementation of GPT-2 that reproduces the 124M-parameter model on OpenWebText in about four days on a single 8×A100 node. The entire codebase is roughly 600 lines: a [model definition](model-architecture.md) and a [training loop](training.md), both readable and easy to hack.\n\n## Architecture\n\nnanoGPT is intentionally flat — no deep package hierarchies, no abstraction layers, just a handful of scripts that each do one thing well.\n\n```mermaid\ngraph LR\n    DATA[\"Data Preparation<br/>(openwebtext, shakespeare…)\"] --> TRAIN[\"train.py\"]\n    CONFIG[\"configurator.py<br/>+ config files\"] --> TRAIN\n    MODEL[\"model.py<br/>(GPT)\"] --> TRAIN\n    TRAIN -->|checkpoint| INFER[\"sample.py\"]\n    MODEL --> INFER\n    TRAIN --> BENCH[\"bench.py\"]\n    MODEL --> BENCH\n```\n\n**Core modules:**\n\n- **[Model Architecture](model-architecture.md)** — The full GPT-2 network in a single file: token/position embeddings, transformer blocks, and a language modeling head. Supports training from scratch or loading pretrained GPT-2 weights from HuggingFace.\n- **[Training](training.md)** — A ~300-line training loop with DDP for multi-GPU/multi-node, mixed precision, gradient accumulation, cosine LR decay, and optional `torch.compile`.\n- **[Inference](inference.md)** — Autoregressive text generation from a trained or pretrained model, with temperature and top-k sampling.\n- **[Benchmarking](benchmarking.md)** — A stripped-down loop that measures time-per-iteration and MFU (Model FLOPs Utilization) for hardware or code-change validation.\n- **[Data Preparation](data-preparation.md)** — Scripts that convert raw text (OpenWebText, Shakespeare, etc.) into memory-mapped binary files for efficient random access at training time.\n- **[Configuration Utility](configuration-utility.md)** — A minimalist convention-over-configuration system that applies Python config files or CLI key-value overrides directly into the caller's global scope.\n\nSupporting resources — config presets, dataset references, and analysis tooling — are documented in [Other](other.md).\n\n## End-to-End Flows\n\n**Training a model from scratch:**\n\n1. **Prepare data** — Run a [Data Preparation](data-preparation.md) script on your raw text to produce `train.bin` and `val.bin`.\n2. **Configure** — Either edit a config file under `config/` or pass CLI overrides, processed by the [Configuration Utility](configuration-utility.md).\n3. **Train** — Launch `train.py` (single GPU for debugging, or `torchrun` for multi-GPU). The [Model Architecture](model-architecture.md) is instantiated, trained, and checkpointed to `out_dir/ckpt.pt`.\n4. **Benchmark** — Optionally run `bench.py` to verify throughput and MFU before committing to a long run.\n\n**Generating text from a trained model:**\n\n1. **Load** — `sample.py` reads a checkpoint (or loads a pretrained GPT-2 variant directly via `init_from=gpt2-*`).\n2. **Tokenize prompt** — The tokenizer is resolved automatically from checkpoint metadata.\n3. **Sample** — Autoregressive generation with configurable temperature and top-k filtering. See [Inference](inference.md) for details.\n\n## Quick Start\n\n```bash\n# Clone and enter the repo\ngit clone https://github.com/karpathy/nanoGPT.git\ncd nanoGPT\n\n# Install dependencies\npip install torch numpy transformers datasets tiktoken wandb\n\n# Prepare a tiny dataset (Shakespeare, ~1 MB)\ncd data/shakespeare && python prepare.py && cd ../..\n\n# Train on a single GPU (debug-friendly defaults)\npython train.py config/train_shakespeare_char.py\n\n# Generate text from the trained model\npython sample.py --out_dir=out-shakespeare-char\n```\n\nFor multi-GPU training, use `torchrun`:\n\n```bash\ntorchrun --nproc_per_node=8 train.py config/train_gpt2.py\n```\n\nFull configuration options and preset files are covered in [Training](training.md) and [Configuration Utility](configuration-utility.md).","training":"# Training\n\n# Training Module\n\n## Overview\n\n`train.py` is the main training entry point for GPT language models. It supports single-GPU debugging, multi-GPU single-node training, and multi-node distributed training via PyTorch's `torchrun` launcher and `DistributedDataParallel` (DDP). The script trains a GPT-2–scale model (124M parameters by default) on the OpenWebText dataset using mixed precision, gradient accumulation, cosine learning rate decay, and optional `torch.compile` optimization.\n\n## Quick Start\n\n```bash\n# Single GPU (debug mode)\npython train.py --batch_size=32 --compile=False\n\n# DDP on 4 GPUs, 1 node\ntorchrun --standalone --nproc_per_node=4 train.py\n\n# DDP on 8 GPUs across 2 nodes\n# Master node (IP 123.456.123.456):\ntorchrun --nproc_per_node=8 --nnodes=2 --node_rank=0 \\\n  --master_addr=123.456.123.456 --master_port=1234 train.py\n# Worker node:\ntorchrun --nproc_per_node=8 --nnodes=2 --node_rank=1 \\\n  --master_addr=123.456.123.456 --master_port=1234 train.py\n```\n\nIf your cluster lacks Infiniband, prepend `NCCL_IB_DISABLE=1`.\n\n## Architecture\n\n```mermaid\nflowchart TD\n    A[Config Defaults + configurator.py Overrides] --> B[DDP Detection & Init]\n    B --> C[Model Initialization]\n    C -->|scratch| C1[GPTConfig → GPT]\n    C -->|resume| C2[Load ckpt.pt → GPT]\n    C -->|gpt2*| C3[GPT.from_pretrained]\n    C1 & C2 & C3 --> D[Optimizer: model.configure_optimizers]\n    D --> E[Training Loop]\n    E --> F{eval_interval?}\n    F -->|yes, master| G[estimate_loss → checkpoint?]\n    F -->|no| H[Forward + Backward + Grad Accumulation]\n    H --> I[Grad Clip → Scaler Step → Zero Grad]\n    I --> J[get_lr → update param groups]\n    J --> E\n    G --> E\n```\n\n## Configuration\n\nAll configuration is defined as module-level variables at the top of `train.py`. These defaults are designed for training GPT-2 (124M) on OpenWebText. The script executes `configurator.py` via `exec()`, which can override any value from the command line or a config file. The full set of overridden values is captured in the `config` dict for logging.\n\n### Configuration Groups\n\n| Group | Key | Default | Description |\n|------|-----|---------|-------------|\n| **I/O** | `out_dir` | `'out'` | Directory for checkpoints |\n| | `eval_interval` | `2000` | Steps between evaluations |\n| | `log_interval` | `1` | Ste
