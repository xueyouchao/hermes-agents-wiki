var PAGES = {"checkpoint-tools":"# Checkpoint Tools\n\n# Checkpoint Tools\n\nTwo standalone command-line utilities for inspecting and converting model checkpoint files. These scripts operate on `.t7` serialized checkpoints produced during training.\n\n## Overview\n\n| Script | Purpose |\n|--------|---------|\n| `convert_gpu_cpu_checkpoint.lua` | Converts a GPU-trained checkpoint to a CPU-compatible format |\n| `inspect_checkpoint.lua` | Prints the training options and validation losses stored in a checkpoint |\n\nBoth scripts are run directly from the command line and share a common pattern: initialize the appropriate backend (CUDA, OpenCL, or CPU), load the checkpoint file, then perform their respective operation.\n\n## Checkpoint File Structure\n\nThe scripts expect checkpoints serialized with `torch.save` containing at minimum these fields:\n\n- **`protos`** — table of `nn.Module` networks (e.g., the language model components). Each key is a network name, each value is an `nn` module instance.\n- **`opt`** — table of training options/hyperparameters that were saved alongside the model.\n- **`val_losses`** — array of validation loss values recorded across training iterations.\n\n---\n\n## convert_gpu_cpu_checkpoint.lua\n\nConverts a GPU checkpoint into a CPU-compatible checkpoint by deserializing on the target GPU backend, then casting every network in `protos` to double-precision CPU tensors.\n\n### Usage\n\n```bash\nth convert_gpu_cpu_checkpoint.lua -model /path/to/model.t7 [-gpuid 0] [-opencl 0]\n```\n\n### Arguments\n\n| Argument | Required | Default | Description |\n|----------|----------|---------|-------------|\n| `-model` | Yes | — | Path to the GPU checkpoint file to convert |\n| `-gpuid` | No | `0` | GPU device index. Set to `-1` to force CPU-only loading |\n| `-opencl` | No | `0` | Set to `1` to use OpenCL instead of CUDA |\n\n### How It Works\n\n```mermaid\nflowchart LR\n    A[Load checkpoint] --> B[Iterate protos]\n    B --> C[\"net:double()\"]\n    C --> D[\"Save as model_cpu.t7\"]\n```\n\n1. **Backend initialization** — If `gpuid >= 0`, the script initializes the requested GPU backend (CUDA or OpenCL). This is necessary because the checkpoint's serialized tensors live on the GPU; the backend must be available to deserialize them. The script exits if the required packages (`cunn`/`cutorch` or `clnn`/`cltorch`) are not found.\n\n2. **Load checkpoint** — `torch.load(opt.model)` deserializes the full checkpoint, including all GPU-resident networks.\n\n3. **Convert networks** — Iterates over every entry in `checkpoint.protos` and calls `:double()` on each network. This recursively casts all parameters and gradients from GPU tensors to CPU double-precision tensors.\n\n4. **Save** — Writes the modified checkpoint to the same path with `_cpu.t7` appended. For example, `models/lm.t7` becomes `models/lm.t7_cpu.t7`.\n\n### Output\n\nThe converted file preserves the full checkpoint structure (`opt`, `val_losses`, `protos`) with all networks converted to CPU doubles. Use this file for inference on machines without a GPU or for further CPU-based training.\n\n> **Note:** This is described in the source as a temporary patch (\"until I implement a more long-term solution\"). The output filename convention appends `_cpu.t7` rather than replacing the `.t7` extension, resulting in names like `model.t7_cpu.t7`.\n\n---\n\n## inspect_checkpoint.lua\n\nLoads a checkpoint and prints its `opt` and `val_losses` fields. Useful for verifying training configuration or monitoring validation loss history without loading the full model into a training pipeline.\n\n### Usage\n\n```bash\nth inspect_checkpoint.lua -model /path/to/model.t7 [-gpuid 0] [-opencl 0]\n```\n\n### Arguments\n\n| Argument | Required | Default | Description |\n|----------|----------|---------|-------------|\n| `-model` | Yes | — | Path to the checkpoint file to inspect |\n| `-gpuid` | No | `0` | GPU device index. Set to `-1` for CPU-only |\n| `-opencl` | No | `0` | Set to `1` to use OpenCL instead of CUDA |\n\n### How It Works\n\n1. **Backend initialization** — Same GPU backend detection as the converter, but uses hard `require` calls rather than `pcall`. If `gpuid >= 0`, the corresponding backend packages must be installed; the script will error if they are missing.\n\n2. **Load and print** — Deserializes the checkpoint and prints two fields:\n   - `model.opt` — the full options table used during training\n   - `model.val_losses` — the recorded validation loss values\n\n### Output Example\n\n```\nopt:\n{\n  model : lstm\n  rnn_size : 128\n  num_layers : 2\n  ...\n}\nval losses:\n{\n  1 : 3.2145\n  2 : 2.9871\n  ...\n}\n```\n\n---\n\n## GPU Backend Selection\n\nBoth scripts support three execution modes controlled by the `-gpuid` and `-opencl` flags:\n\n| `-gpuid` | `-opencl` | Backend | Required Packages |\n|----------|-----------|---------|-------------------|\n| `-1` | any | CPU only | None (beyond base Torch) |\n| `≥ 0` | `0` | CUDA | `cunn`, `cutorch` |\n| `≥ 0` | `1` | OpenCL | `clnn`, `cltorch` |\n\nThe device index uses Lua's 1-based indexing internally (`gpuid + 1`), matching the convention used throughout the codebase.\n\n> **Important:** Even if you only want to inspect or convert a checkpoint for CPU use, you must have the original GPU backend available if the checkpoint was saved with GPU tensors. The backend is needed at load time to deserialize the tensor data. Once loaded, `convert_gpu_cpu_checkpoint.lua` casts everything to CPU, and the resulting `_cpu.t7` file no longer requires any GPU backend.\n\n## Dependencies\n\nBoth scripts depend on:\n\n- `torch`, `nn`, `nngraph` — core Torch packages\n- `util.OneHot`, `util.misc` — project utility modules (required for deserialization of checkpoints that reference these modules)\n- `lfs` — Lua file system library (converter only, though not actively used in the current code)","data-processing":"# Data Processing\n\n# Data Processing Module\n\nThe Data Processing module provides utilities for transforming raw text into batched, numerically-encoded tensors suitable for character-level language model training. It consists of two components: a minibatch loader that handles file I/O, preprocessing, and data splitting, and a one-hot encoding module for neural network integration.\n\n## Architecture\n\n```mermaid\nflowchart LR\n    A[\"input.txt\"] --> B[text_to_tensor]\n    B --> C[\"data.t7\"]\n    B --> D[\"vocab.t7\"]\n    C --> E[create]\n    D --> E\n    E --> F[\"x_batches / y_batches\"]\n    F --> G[next_batch]\n    G --> H[\"OneHot\"]\n    H --> I[\"RNN Input\"]\n```\n\n## CharSplitLMMinibatchLoader\n\nA stateful data loader that reads a text file, encodes characters as integers, reshapes the data into minibatches, and partitions it into train/val/test splits. It is designed as a factory — you call `create()` rather than constructing instances directly.\n\n### `create(data_dir, batch_size, seq_length, split_fractions)`\n\nFactory method that builds and returns a fully initialized loader instance.\n\n**Parameters:**\n\n| Parameter | Type | Description |\n|---|---|---|\n| `data_dir` | string | Directory containing `input.txt`. Preprocessed `vocab.t7` and `data.t7` files are also stored here. |\n| `batch_size` | number | Number of parallel sequences per batch. |\n| `seq_length` | number | Length of each sequence in timesteps. |\n| `split_fractions` | table | Three-element table `{train, val, test}` specifying the proportion of batches allocated to each split, e.g. `{0.9, 0.05, 0.05}`. |\n\n**Returns:** A loader instance with the following fields:\n\n| Field | Type | Description |\n|---|---|---|\n| `x_batches` | table of tensors | Input batches. Each tensor has shape `(batch_size, seq_length)`. |\n| `y_batches` | table of tensors | Target batches (inputs shifted by one character). Same shape as `x_batches`. |\n| `nbatches` | number | Total number of batches across all splits. |\n| `ntrain` | number | Number of batches in the training split. |\n| `nval` | number | Number of batches in the validation split. |\n| `ntest` | number | Number of batches in the test split. |\n| `vocab_mapping` | table | Character-to-integer mapping (e.g. `{a=1, b=2, ...}`). |\n| `vocab_size` | number | Number of unique characters in the vocabulary. |\n| `batch_ix` | table | Current batch index for each split `{train, val, test}`, indexed 1–3. |\n\n**Preprocessing logic:**\n\n1. Checks whether `vocab.t7` and `data.t7` already exist in `data_dir`.\n2. If they don't exist, or if `input.txt` has been modified since the last preprocessing run, calls `text_to_tensor()` to regenerate them.\n3. Loads the preprocessed tensor and vocabulary.\n4. Truncates the data so the total length is evenly divisible by `batch_size * seq_length`.\n5. Constructs `y_batches` by shifting `x_batches` by one position — the target for each timestep is the next character. The last target wraps around to the first character in the dataset.\n6. Reshapes the 1D data into a 2D tensor of shape `(batch_size, total_length / batch_size)` and splits it along the second dimension into chunks of `seq_length`.\n7. Partitions batches into train/val/test. When `split_fractions[3] == 0`, all remaining batches after the training set are assigned to validation (a common pattern when no test set is needed). Otherwise, test receives whatever batches remain after train and val are allocated, ensuring the counts sum to `nbatches` exactly.\n\n**Important:** The data is laid out so that consecutive characters fall in different batch rows rather than consecutive positions within a row. This means each row is an independent contiguous sequence from the corpus, and consecutive timesteps within a batch advance along the sequence dimension, not across batches.\n\n### `next_batch(split_index)`\n\nReturns the next input/target batch pair for the specified split, advancing the internal pointer. Wraps around to the beginning when the end of the split is reached.\n\n**Parameters:**\n\n| Parameter | Type | Description |\n|---|---|---|\n| `split_index` | number | `1` for train, `2` for val, `3` for test. |\n\n**Returns:** Two tensors — `x_batch` and `y_batch`, each of shape `(batch_size, seq_length)`.\n\nThe method computes the global batch index by offsetting within the combined batch array: validation batches start after training batches, and test batches start after training + validation batches.\n\n**Error handling:** If the requested split has zero batches (e.g. `split_fractions = {1.0, 0, 0}` and you request a val batch), the method prints an error and calls `os.exit()`.\n\n### `reset_batch_pointer(split_index, batch_index)`\n\nResets the internal batch pointer for a given split, useful for restarting an epoch.\n\n**Parameters:**\n\n| Parameter | Type | Default | Description |\n|---|---|---|---|\n| `split_index` | number | — | `1` for train, `2` for val, `3` for test. |\n| `batch_index` | number | `0` | The batch index to set. On the next `next_batch()` call, the pointer will increment to `batch_index + 1`. |\n\n### `text_to_tensor(in_textfile, out_vocabfile, out_tensorfile)`\n\nStatic method that performs one-time preprocessing of a raw text file into a numeric tensor and vocabulary file. Called automatically by `create()` when needed, but can also be invoked directly.\n\n**Parameters:**\n\n| Parameter | Type | Description |\n|---|---|---|\n| `in_textfile` | string | Path to the raw text file. |\n| `out_vocabfile` | string | Path where the vocabulary mapping (Lua table, saved via `torch.save`) will be written. |\n| `out_tensorfile` | string | Path where the encoded data tensor (`torch.ByteTensor`) will be written. |\n\n**Processing steps:**\n\n1. Reads the entire text file in chunks of 10,000 characters.\n2. Builds a set of unique characters, sorts them lexicographically, and assigns each a sequential integer ID starting from 1.\n3. Re-reads the file and maps each character to its integer ID, storing the result in a `ByteTensor`. This means the vocabulary size must not exceed 255 characters.\n4. Saves the vocabulary mapping and the data tensor to disk via `torch.save`.\n\n**Note:** The vocabulary mapping is sorted, so the ordering is deterministic across runs for the same input. However, if the input text changes (e.g. characters are added or removed), the integer assignments may shift, which is why `create()` checks file modification times and re-runs preprocessing when `input.txt` is newer than the cached files.\n\n## OneHot\n\nAn `nn.Module` subclass that converts a tensor of integer indices into a one-hot representation. This is typically inserted after the data loader in a neural network graph to convert character IDs into sparse binary vectors before feeding them into an RNN or other model.\n\n### `__init(outputSize)`\n\nConstructs the module and caches an identity matrix of size `outputSize × outputSize` for efficient row-indexing during the forward pass.\n\n| Parameter | Type | Description |\n|---|---|---|\n| `outputSize` | number | Size of the one-hot vector (should equal `vocab_size`). |\n\n### `updateOutput(input)`\n\nPerforms the forward pass. Takes a 1D tensor of integer indices and returns a 2D tensor where each row is the one-hot vector corresponding to that index.\n\n**Input shape:** `(N)` — a batch of `N` integer indices.\n\n**Output shape:** `(N, outputSize)` — each row is a one-hot vector.\n\n**Implementation:** The method indexes into the cached identity matrix using `torch.index` on dimension 1, which selects rows corresponding to the input indices. The input is cast to `long` to ensure valid indexing, and the identity matrix is cast to `float` to match the output type expected by downstream modules.\n\n## Usage Example\n\n```lua\n-- Create the data loader\nlocal loader = CharSplitLMMinibatchLoader.create(\n    'data/tinyshakespeare/',\n    50,          -- batch_size\n    50,          -- seq_length\n    {0.9, 0.05, 0.05}\n)\n\n-- Build a model with one-hot encoding\nlocal onehot = OneHot(loader.vocab_size)\nlocal rnn = nn.LSTM(loader.vocab_size, 128)\nlocal model = nn.Sequential():add(onehot):add(rnn)\n\n-- Training loop\nloader:reset_batch_pointer(1)  -- reset train split\nfor i = 1, loader.ntrain do\n    local x, y = loader:next_batch(1)  -- 1 = train\n    -- x and y are ByteTensors of shape (batch_size, seq_length)\n    -- onehot:convert(x) before feeding into model if needed\nend\n```\n\n## Caveats\n\n- **ByteTensor limitation:** `text_to_tensor` stores encoded data as `torch.ByteTensor`, limiting the vocabulary to 255 unique characters. For corpora with more unique symbols, the storage type must be changed (e.g. to `ShortTensor` or `IntTensor`).\n- **Data truncation:** The total data length is truncated to be evenly divisible by `batch_size × seq_length`. Characters at the end of the file are silently discarded.\n- **Circular target:** The last target character wraps to the first character in the dataset (`ydata[-1] = data[1]`). This creates an artificial transition that does not exist in the source text.\n- **No shuffling:** Batches are served in sequential order and wrap around. There is no shuffling between epochs, which is typical for language modeling but may be undesirable for other tasks.","other":"# Other\n\n# char-rnn: Multi-layer Character-Level Recurrent Neural Network\n\n## Overview\n\nchar-rnn implements multi-layer recurrent neural networks (RNN, LSTM, and GRU) for character-level language modeling. The model ingests a text file, trains a recurrent network to predict the next character in a sequence, and can then generate novel text that stylistically resembles the training data.\n\n> **Note:** The [torch-rnn](https://github.com/jcjohns/torch-rnn) project by Justin Johnson is now recommended as the default implementation. It offers a cleaner codebase, uses Adam optimization, and hard-codes RNN/LSTM forward/backward passes for improved space/time efficiency. This repository remains available but torch-rnn should be preferred for new work.\n\n## Architecture\n\n```mermaid\nflowchart LR\n    A[Input Text File] --> B[train.lua]\n    B --> C[Preprocessing & Cache]\n    C --> B\n    B --> D[Checkpoint Files<br/>cv/*.t7]\n    D --> E[sample.lua]\n    D --> F[convert_gpu_cpu<br/>_checkpoint.lua]\n    F --> G[CPU Checkpoint<br/>*_cpu.t7]\n    G --> E\n    E --> H[Generated Text]\n```\n\nThe system operates in two phases: **training** (learning character-level probabilities from data) and **sampling** (generating text from a trained model checkpoint).\n\n## Key Scripts\n\n| Script | Purpose |\n|--------|---------|\n| `train.lua` | Trains the RNN on input data, writes checkpoints to `cv/` |\n| `sample.lua` | Generates text from a saved checkpoint |\n| `convert_gpu_cpu_checkpoint.lua` | Converts a GPU-trained checkpoint for CPU sampling |\n\n## Requirements\n\n**Core dependencies** (installed via LuaRocks):\n\n- [Torch](http://torch.ch/) — the Lua-based scientific computing framework\n- `nngraph` — graph-based neural network construction\n- `optim` — optimization algorithms\n- `nn` — neural network modules\n\n**GPU support (optional):**\n\n- **CUDA:** Install the [CUDA Toolkit](https://developer.nvidia.com/cuda-toolkit), then `cutorch` and `cunn` via LuaRocks. Enabled by default (`-gpuid 0`).\n- **OpenCL:** Install `cltorch` and `clnn` via LuaRocks. Enabled with `-opencl 1` during training.\n\n## Data Preparation\n\nPlace your training text as a single file named `input.txt` inside a subfolder of `data/`:\n\n```\ndata/my_dataset/input.txt\n```\n\nOn first run, `train.lua` preprocesses the file and writes two cache files alongside it. Subsequent runs load the cache directly.\n\n**Dataset sizing guidelines:**\n\n| Dataset Size | Recommended `rnn_size` | Notes |\n|-------------|------------------------|-------|\n| < 1 MB | Default (128) | Considered very small; model may underfit |\n| ~2 MB | 128–256 | Default parameters reasonable |\n| ~6 MB | 300+ | Larger models work significantly better |\n| Large | Up to 700 with 3 layers | Bounded by GPU memory |\n\n## Training\n\nRun training with `train.lua`:\n\n```bash\n# CPU-only training on the included Tiny Shakespeare dataset\nth train.lua -gpuid -1\n\n# Custom dataset with a larger model\nth train.lua -data_dir data/my_dataset -rnn_size 512 -num_layers 2 -dropout 0.5\n```\n\nUse `th train.lua -help` for all available options.\n\n### Key Parameters\n\n**Model architecture:**\n\n- **`rnn_size`** — Number of hidden units per layer. Controls model capacity. Default: 128.\n- **`num_layers`** — Number of recurrent layers. Recommended: 2 or 3. Default: 2.\n- **`dropout`** — Dropout probability between layers (0–1). Helps prevent overfitting. Default: 0.\n- **`model`** — RNN variant: `lstm` (default), `rnn`, or `gru`.\n\n**Data layout:**\n\nThe input text (N characters) is split into chunks of size `batch_size × seq_length`, then allocated across train/validation/test splits.\n\n- **`batch_size`** (B) — Number of parallel data streams. Default: 50.\n- **`seq_length`** (S) — Length of each stream. Also the maximum backpropagation-through-time window. Default: 50.\n- **`train_frac`** — Fraction of chunks for training. Default: 0.95.\n- **`val_frac`** — Fraction of chunks for validation. Default: 0.05.\n\nIf your dataset is small, the total number of chunks may be insufficient. In that case, reduce `batch_size` or `seq_length` to create more, smaller chunks.\n\n**Continuing training:**\n\nUse `-init_from` to resume from a previous checkpoint, enabling further training or model fine-tuning.\n\n### Checkpoints\n\nCheckpoints are written to the `cv/` directory at intervals controlled by `eval_val_every`. Filenames encode the validation loss:\n\n```\nlm_lstm_epoch0.95_2.0681.t7\n                │       │\n                │       └── Validation loss (lower is better)\n                └── Training progress (epoch fraction)\n```\n\n**Always select the checkpoint with the lowest validation loss for sampling** — this may not be the final checkpoint if overfitting has occurred.\n\n## Sampling\n\nGenerate text from a trained checkpoint:\n\n```bash\nth sample.lua cv/lm_lstm_epoch30.00_1.3950.t7 -gpuid -1\n```\n\nThe `gpuid` must match the training device: GPU checkpoints require GPU sampling, and CPU checkpoints require CPU sampling. Use `th sample.lua -help` for all options.\n\n### Sampling Parameters\n\n- **`-temperature`** — Divides predicted log probabilities before softmax. Range: (0, 1]. Default: 1.\n  - **Low temperature** (e.g., 0.5): More conservative, likely predictions. Less diverse but fewer mistakes.\n  - **High temperature** (e.g., 1.0): More diverse, surprising predictions. Higher risk of incoherence.\n- **`-length`** — Number of characters to generate. Default: 2000.\n- **`-primetext`** — Initial text to warm up the RNN with context before generation. Example: `-primetext \"The meaning of life is \"`\n\n### GPU-to-CPU Checkpoint Conversion\n\nTo sample from a GPU-trained checkpoint on CPU, convert it first:\n\n```bash\nth convert_gpu_cpu_checkpoint.lua cv/lm_lstm_epoch30.00_1.3950.t7\n```\n\nThis creates `cv/lm_lstm_epoch30.00_1.3950.t7_cpu.t7`, which can be used with `-gpuid -1`.\n\n## Diagnosing Model Performance\n\n### Validation vs. Training Loss\n\n| Symptom | Diagnosis | Action |\n|---------|-----------|--------|\n| Training loss ≪ validation loss | Overfitting | Decrease `rnn_size`, increase `dropout` (try 0.5) |\n| Training loss ≈ validation loss | Underfitting | Increase `rnn_size` or `num_layers` |\n\n### Parameter Count vs. Data Size\n\nThe number of model parameters is printed at training start. As a rough heuristic, your parameter count and dataset size (in characters) should be the same order of magnitude:\n\n- **1 MB file ≈ 1 million characters**\n- If you have 100M characters but only 150K parameters → heavily underfitting → increase `rnn_size`.\n- If you have 10M characters but 10M parameters → risk of overfitting → monitor validation loss closely, increase `dropout` if needed.\n\n### Best Model Strategy\n\n1. Make the network as large as your compute budget allows.\n2. Sweep `dropout` values between 0 and 1.\n3. Select the checkpoint with the lowest validation loss.\n4. Ensure your validation set is large enough to produce a stable loss estimate.\n\n## Origins and References\n\nThis codebase originated from the Oxford University Machine Learning [practical 6](https://github.com/oxford-cs-ml-2015/practical6), which was based on Wojciech Zaremba's [learning to execute](https://github.com/wojciechz/learning_to_execute) code. Justin Johnson contributed to portions of the implementation.\n\n**Further reading on RNN language models:**\n\n- [The Unreasonable Effectiveness of Recurrent Neural Networks](http://karpathy.github.io/2015/05/21/rnn-effectiveness/) — the blog post describing this project's context\n- [Generating Sequences With Recurrent Neural Networks](http://arxiv.org/abs/1308.0850) — Alex Graves\n- [Generating Text with Recurrent Neural Networks](http://www.cs.utoronto.ca/~ilya/pubs/2011/LANG-RNN.pdf) — Ilya Sutskever\n- [Statistical Language Models Based on Neural Networks](http://www.fit.vutbr.cz/~imikolov/rnnlm/thesis.pdf) — Tomas Mikolov's thesis\n\n## License\n\nMIT","overview":"# char-rnn — Wiki\n\n# char-rnn\n\n**Multi-layer character-level recurrent neural network** for language modeling and text generation. char-rnn ingests a text corpus, trains an RNN to predict the next character in a sequence, and generates novel text that stylistically resembles the training data. It supports three architectures — vanilla RNN, LSTM, and GRU — with optional GPU acceleration via CUDA or OpenCL.\n\n> **Note:** The [torch-rnn](https://github.com/jcjohns/torch-rnn) project by Justin Johnson is now recommended as the default implementation. It offers a cleaner codebase, uses Adam optimization, and hard-codes sensible defaults.\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[\"Raw Text (input.txt)\"] --> B[Data Processing]\n    B --> C[Training Loop]\n    D[\"RNN / LSTM / GRU Cells\"] --> C\n    C --> E[\"Checkpoint (.t7)\"]\n    E --> F[Sampling]\n    G[Checkpoint Tools] -.-> E\n    H[Utility Functions] -.-> C\n    H -.-> D\n    H -.-> F\n```\n\n## How It Works\n\nThe system follows a straightforward pipeline:\n\n1. **Prepare data** — The [Data Processing](data-processing.md) module reads a raw text file, builds a character vocabulary, encodes the text into numerical tensors, and splits it into minibatches ready for training.\n\n2. **Train the model** — The [Training and Sampling](training-and-sampling.md) module unrolls one of the three [Recurrent Neural Networks](recurrent-neural-networks.md) cell types across time, feeds in the minibatches, and optimizes the network parameters. It periodically evaluates on a validation split and saves checkpoints.\n\n3. **Generate text** — The same module's `sample.lua` script loads a saved checkpoint and generates text by sampling from the model's output distribution one character at a time.\n\n4. **Inspect and convert** — The [Checkpoint Tools](checkpoint-tools.md) utilities let you convert GPU-trained checkpoints to CPU format and inspect stored training options or validation losses.\n\nThe [Utility Functions](utility-functions.md) module provides shared low-level routines — tensor cloning, parameter flattening, and network replication — used across training, cell construction, and sampling.\n\n## Getting Started\n\n### Prerequisites\n\n- [Torch](http://torch.ch/) (with `nngraph` and `optim` packages)\n- Optional: `cunn` for CUDA, `clnn`/`cunn` for OpenCL\n\n### Training\n\n```bash\nth train.lua -input_dir data/my_corpus/ -rnn_size 128 -num_layers 2 -gpuid 0\n```\n\nThis trains a default LSTM model on the text in `data/my_corpus/`, saving checkpoints periodically.\n\n### Sampling\n\n```bash\nth sample.lua checkpoint.t7 -length 2000 -temperature 0.7\n```\n\nLoads a checkpoint and generates 2000 characters of text.\n\n### Converting a GPU Checkpoint to CPU\n\n```bash\nth convert_gpu_cpu_checkpoint.lua checkpoint.t7\n```\n\n## Key Concepts\n\n- **One-hot encoding** — Characters are represented as one-hot vectors at the input layer; the network projects them into a dense embedding internally.\n- **Unrolling** — Each RNN cell function constructs a *single timestep*. The training loop handles unrolling across time steps.\n- **Inter-layer dropout** — Dropout is applied between recurrent layers, not within them.\n- **Checkpoint format** — Models are serialized as Torch `.t7` files containing the protos (network graphs), training options, and validation loss history.","recurrent-neural-networks":"# Recurrent Neural Networks\n\n# Recurrent Neural Networks Module\n\n## Overview\n\nThis module provides three recurrent neural network architectures — **vanilla RNN**, **LSTM**, and **GRU** — implemented as Torch/nngraph computation graphs. All three share a common multi-layer design with one-hot input encoding, inter-layer dropout, and a shared decoder structure. Each function constructs a single **timestep** of the recurrent cell; unrolling across time is handled externally by the training loop.\n\n## Common Architecture\n\nAll three cells follow the same structural pattern:\n\n```mermaid\ngraph TD\n    X[\"Input x (index)\"] --> OH[\"OneHot encoding\"]\n    OH --> L1[\"Layer 1\"]\n    L1 --> DR1[\"Dropout (if > 0)\"]\n    DR1 --> L2[\"Layer 2\"]\n    L2 --> DR2[\"Dropout (if > 0)\"]\n    DR2 --> LN[\"Layer N\"]\n    LN --> DRN[\"Dropout (if > 0)\"]\n    DRN --> DEC[\"Decoder: Linear → LogSoftMax\"]\n```\n\n**Shared characteristics:**\n\n| Feature | Detail |\n|---|---|\n| Input encoding | `OneHot(input_size)` on the raw input index |\n| Inter-layer dropout | Applied to the output of every hidden layer except the first, controlled by the `dropout` parameter |\n| Top-level dropout | Applied to the final layer's hidden state before decoding |\n| Decoder | `nn.Linear(rnn_size, input_size)` → `nn.LogSoftMax()` |\n| Output | `nn.gModule` containing the full computation graph |\n| Layer sizing | First layer takes `input_size` dimensions; all subsequent layers take `rnn_size` dimensions |\n\n### Input/Output Contract\n\nEach function returns a graph whose **inputs** are the current timestep's data and **outputs** include both the recurrent states and the prediction:\n\n- **Inputs**: `{x, prev_state_1, prev_state_2, ...}` — the input token followed by previous hidden states (and previous cell states for LSTM)\n- **Outputs**: `{next_state_1, next_state_2, ..., logsoft}` — updated states followed by log-probabilities over the vocabulary\n\n---\n\n## API Reference\n\nAll three functions share the same signature:\n\n```lua\nmodel.gru(input_size, rnn_size, n, dropout)\nmodel.lstm(input_size, rnn_size, n, dropout)\nmodel.rnn(input_size, rnn_size, n, dropout)\n```\n\n| Parameter | Type | Description |\n|---|---|---|\n| `input_size` | number | Vocabulary size / number of distinct input tokens. Also determines the decoder output dimension. |\n| `rnn_size` | number | Hidden state dimension for every layer. |\n| `n` | number | Number of stacked recurrent layers. |\n| `dropout` | number | Dropout probability between layers. Defaults to `0` (no dropout). |\n\n### Return Value\n\nAn `nn.gModule` — a compiled nngraph computation graph ready for use with Torch's `nn.Sequencer` or manual time-step unrolling.\n\n---\n\n## Model Details\n\n### RNN (`model/RNN.lua`)\n\nThe simplest recurrence. A single hidden state `h` is updated at each timestep:\n\n```\nh_t = tanh(W_ih * x_t + W_hh * h_{t-1})\n```\n\n**Graph inputs** (`n + 1` total): `x`, `prev_h[1]`, ..., `prev_h[n]`\n\n**Graph outputs** (`n + 1` total): `next_h[1]`, ..., `next_h[n]`, `logsoft`\n\n**Per-layer computation:**\n\n1. Compute input-to-hidden: `i2h = Linear(input_size_L, rnn_size)(x)`\n2. Compute hidden-to-hidden: `h2h = Linear(rnn_size, rnn_size)(prev_h)`\n3. Sum and apply nonlinearity: `next_h = Tanh(i2h + h2h)`\n\nNo gating mechanisms — gradient flow is uncontrolled, making this architecture prone to vanishing/exploding gradients on long sequences.\n\n---\n\n### LSTM (`model/LSTM.lua`)\n\nLong Short-Term Memory network with coupled input/forget gates (no bias terms). Maintains both a cell state `c` and a hidden state `h` per layer.\n\n**Graph inputs** (`2n + 1` total): `x`, `prev_c[1]`, `prev_h[1]`, ..., `prev_c[n]`, `prev_h[n]`\n\n**Graph outputs** (`2n + 1` total): `next_c[1]`, `next_h[1]`, ..., `next_c[n]`, `next_h[n]`, `logsoft`\n\n**Per-layer computation:**\n\nThe four gate/transform projections are computed as a single fused operation for efficiency:\n\n1. `all_input_sums = Linear(input_size_L, 4*rnn_size)(x) + Linear(rnn_size, 4*rnn_size)(prev_h)`\n2. Split into four chunks of size `rnn_size`: `n1`, `n2`, `n3`, `n4`\n3. Decode gates and transforms:\n   - `in_gate = σ(n1)` — input gate\n   - `forget_gate = σ(n2)` — forget gate\n   - `out_gate = σ(n3)` — output gate\n   - `in_transform = tanh(n4)` — candidate cell content\n4. Update cell state: `next_c = forget_gate ⊙ prev_c + in_gate ⊙ in_transform`\n5. Compute hidden output: `next_h = out_gate ⊙ tanh(next_c)`\n\nThe fused 4× projection is annotated with names `i2h_L` and `h2h_L` for each layer `L`, and the decoder is annotated as `decoder`.\n\n> **Note:** This implementation does not include peephole connections or bias terms.\n\n---\n\n### GRU (`model/GRU.lua`)\n\nGated Recurrent Unit as described in [Cho et al. (2014)](http://arxiv.org/pdf/1412.3555v1.pdf). Maintains a single hidden state `h` per layer, using update and reset gates.\n\n**Graph inputs** (`n + 1` total): `x`, `prev_h[1]`, ..., `prev_h[n]`\n\n**Graph outputs** (`n + 1` total): `next_h[1]`, ..., `next_h[n]`, `logsoft`\n\n**Per-layer computation:**\n\n1. Compute gates using a shared `new_input_sum` helper:\n   - `update_gate = σ(W_ih * x + W_hh * prev_h)`\n   - `reset_gate = σ(W_ih * x + W_hh * prev_h)`\n2. Compute candidate hidden state:\n   - `gated_hidden = reset_gate ⊙ prev_h`\n   - `hidden_candidate = tanh(W_ih * x + W_hh * gated_hidden)`\n3. Interpolate between previous and candidate states:\n   - `next_h = update_gate ⊙ hidden_candidate + (1 - update_gate) ⊙ prev_h`\n\nThe interpolation in step 3 is implemented as:\n```\nzh   = update_gate ⊙ hidden_candidate\nzhm1 = (1 - update_gate) ⊙ prev_h\nnext_h = zh + zhm1\n```\n\nWhere `(1 - update_gate)` is computed via `AddConstant(1)` after `MulConstant(-1)`.\n\n> **Note:** The update and reset gates use **separate** `Linear` modules (created by separate calls to `new_input_sum`), so their weights are not shared despite having identical input structure.\n\n---\n\n## Dropout Application\n\nDropout is applied at two points, both using `nn.Dropout(dropout)`:\n\n1. **Between layers**: Applied to the output of layer `L-1` before it feeds into layer `L` (for `L ≥ 2`). Not applied to the first layer's input.\n2. **Before the decoder**: Applied to the top hidden layer's output before the linear projection.\n\nWhen `dropout = 0` (the default), no dropout nodes are inserted into the graph.\n\n---\n\n## Integration Notes\n\n- **OneHot dependency**: All three models reference a global `OneHot` class for input encoding. This must be defined in the runtime environment before the graph is constructed.\n- **Sequencing**: Each function builds a single timestep. To process a sequence, wrap the returned `gModule` in `nn.Sequencer` or manually feed outputs back as inputs across timesteps.\n- **State initialization**: The caller is responsible for providing zero tensors or learned initial states for `prev_h` (and `prev_c` for LSTM) at the start of each sequence.\n- **Annotated nodes**: LSTM annotates `i2h_L`, `h2h_L` (per layer), and `decoder`. These names can be used to access specific parameters after construction, e.g., for weight regularization or custom initialization.","training-and-sampling":"# Training and Sampling\n\n# Training and Sampling Module\n\n## Overview\n\nThis module implements the full lifecycle of a character-level multi-layer recurrent neural network: training on text corpora and generating new text by sampling from a trained model. It supports LSTM, GRU, and vanilla RNN architectures with GPU acceleration via CUDA or OpenCL.\n\nThe module consists of two standalone scripts:\n\n- **`train.lua`** — Trains a language model on text data, periodically evaluating on a validation split and saving checkpoints.\n- **`sample.lua`** — Loads a saved checkpoint and generates text by sampling from the model one character at a time.\n\n---\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[train.lua] --> B[CharSplitLMMinibatchLoader]\n    A --> C[Model: LSTM / GRU / RNN]\n    A --> D[optim.rmsprop]\n    C --> E[Clone across seq_length timesteps]\n    E --> F[Forward pass → loss]\n    F --> G[Backward pass → gradients]\n    G --> D\n    A --> H[Checkpoint save]\n    H --> I[sample.lua]\n    I --> C\n    I --> J[Temperature sampling / argmax]\n```\n\n---\n\n## Training (`train.lua`)\n\n### Command-Line Options\n\nOptions are parsed via `torch.CmdLine` and organized into four groups:\n\n| Group | Key Options | Default |\n|---|---|---|\n| **Data** | `-data_dir` | `data/tinyshakespeare` |\n| **Model** | `-rnn_size`, `-num_layers`, `-model` | `128`, `2`, `lstm` |\n| **Optimization** | `-learning_rate`, `-learning_rate_decay`, `-learning_rate_decay_after`, `-decay_rate`, `-dropout`, `-seq_length`, `-batch_size`, `-max_epochs`, `-grad_clip`, `-train_frac`, `-val_frac` | `2e-3`, `0.97`, `10`, `0.95`, `0`, `50`, `50`, `50`, `5`, `0.95`, `0.05` |\n| **Bookkeeping** | `-seed`, `-print_every`, `-eval_val_every`, `-checkpoint_dir`, `-savefile`, `-accurate_gpu_timing` | `123`, `1`, `1000`, `cv`, `lstm`, `0` |\n| **GPU** | `-gpuid`, `-opencl` | `0`, `0` |\n\nThe `-model` flag accepts `lstm`, `gru`, or `rnn`. The `-init_from` flag allows resuming training from a checkpoint, which overrides `-rnn_size`, `-num_layers`, and `-model` to match the saved model.\n\n### Data Loading\n\n`CharSplitLMMinibatchLoader.create(data_dir, batch_size, seq_length, split_sizes)` loads and splits the input text into train/validation/test fractions. The test fraction is computed as `1 - train_frac - val_frac`. The loader exposes `vocab_size`, `vocab_mapping`, `ntrain`, and per-split batch iterators.\n\n### Model Construction\n\nWhen not resuming from a checkpoint, the script constructs a prototype network for a single timestep by calling the appropriate model module:\n\n```lua\nprotos.rnn = LSTM.lstm(vocab_size, rnn_size, num_layers, dropout)\n-- or\nprotos.rnn = GRU.gru(vocab_size, rnn_size, num_layers, dropout)\n-- or\nprotos.rnn = RNN.rnn(vocab_size, rnn_size, num_layers, dropout)\n```\n\nA `ClassNLLCriterion` is attached as `protos.criterion`. When resuming via `-init_from`, both `protos` and `opt` are loaded from the checkpoint, and the script asserts that the vocabulary is compatible.\n\n### State Initialization\n\n`init_state` is a table of zero tensors, one per hidden state per layer. For LSTM models, each layer contributes two tensors (cell state `c` and hidden state `h`), so the total length is `2 * num_layers`. For GRU and RNN, it is `num_layers`. All tensors have shape `(batch_size, rnn_size)` and are moved to GPU if applicable.\n\n### Parameter Handling\n\n`model_utils.combine_all_parameters(protos.rnn)` flattens all learnable parameters into a single 1D tensor `params`, with `grad_params` as its gradient counterpart. When randomly initialized, parameters are drawn from `Uniform(-0.08, 0.08)`.\n\n**LSTM forget gate bias initialization:** After random init, the script locates the `i2h_*` nodes in the computation graph and sets the forget gate bias slice to `1.0`. This encourages the model to remember early in training. The bias tensor is indexed as `[{{rnn_size+1, 2*rnn_size}}]`, corresponding to the second gate block in the `i, f, o, g` ordering.\n\n### Cloning Across Time\n\nThe prototype networks are cloned `seq_length` times to unroll the RNN in time:\n\n```lua\nclones[name] = model_utils.clone_many_times(proto, opt.seq_length, not proto.parameters)\n```\n\nThe third argument controls whether to share parameters — the `criterion` shares parameters (it's stateless), while the `rnn` does not (each timestep clone shares the same underlying weights but has independent graph nodes).\n\n### Preprocessing (`prepro`)\n\nTransposes input/target tensors from `(batch_size, seq_length)` to `(seq_length, batch_size)` for efficient timestep iteration, then transfers to GPU memory if applicable.\n\n### Validation Evaluation (`eval_split`)\n\nEvaluates the average cross-entropy loss over an entire data split:\n\n1. Resets the batch pointer for the given split.\n2. Iterates over all batches (or `max_batches` if specified).\n3. Runs a full forward pass through all `seq_length` timesteps per batch, accumulating loss.\n4. Carries the final RNN state forward across batches (truncated BPTT within a split).\n5. Returns `loss / seq_length / n` (average per-character loss).\n\nThe model is set to `evaluate()` mode before each forward pass to disable dropout.\n\n### Forward/Backward Pass (`feval`)\n\nThis is the closure passed to `optim.rmsprop`. It performs:\n\n1. **Minibatch fetch** — `loader:next_batch(1)` gets the next training batch.\n2. **Forward pass** — Iterates timesteps 1 through `seq_length`, feeding each input and previous state into `clones.rnn[t]`. Accumulates loss via `clones.criterion[t]`. The model is set to `training()` mode.\n3. **Backward pass** — Iterates timesteps `seq_length` down to 1. Backpropagates through the criterion first, then through the RNN. Gradient on the state at each timestep is accumulated from both the loss and the future timestep. The gradient on input (`k == 1`) is discarded.\n4. **State carry** — The final hidden state becomes `init_state_global` for the next minibatch (BPTT state carry).\n5. **Gradient clipping** — `grad_params:clamp(-grad_clip, grad_clip)` prevents exploding gradients.\n\nReturns `(loss / seq_length, grad_params)`.\n\n### Main Training Loop\n\n```lua\nfor i = 1, iterations do\n    -- i is the global iteration counter\n    -- epoch = i / loader.ntrain\n```\n\nEach iteration:\n\n| Step | Condition | Action |\n|---|---|---|\n| Optimize | Every iteration | `optim.rmsprop(feval, params, optim_state)` |\n| LR decay | `i % ntrain == 0` and `epoch >= learning_rate_decay_after` | Multiply `optim_state.learningRate` by `learning_rate_decay` |\n| Validate & checkpoint | `i % eval_val_every == 0` or last iteration | Call `eval_split(2)`, save checkpoint |\n| Print | `i % print_every == 0` | Log loss, gradient norm ratio, time |\n| GC | `i % 10 == 0` | `collectgarbage()` |\n| NaN check | Every iteration | Break if `loss ~= loss` |\n| Explosion check | Every iteration | Break if `loss > 3 * loss0` |\n\n**Checkpoint format:** Saved as a `.t7` file containing `protos`, `opt`, `train_losses`, `val_loss`, `val_losses`, `i`, `epoch`, and `vocab`. The filename encodes the model name, epoch, and validation loss: `lm_{savefile}_epoch{X}_{val_loss}.t7`.\n\n**Timing note:** By default, GPU timing is approximate because CUDA operations are asynchronous. Set `-accurate_gpu_timing 1` to call `cutorch.synchronize()` for precise timing at the cost of slight overhead.\n\n---\n\n## Sampling (`sample.lua`)\n\n### Command-Line Options\n\n| Option | Default | Description |\n|---|---|---|\n| `-model` (required) | — | Path to checkpoint `.t7` file |\n| `-seed` | `123` | Random seed |\n| `-sample` | `1` | `0` = argmax, `1` = stochastic sampling |\n| `-primetext` | `\"\"` | Seed text to warm up the hidden state |\n| `-length` | `2000` | Number of characters to generate |\n| `-temperature` | `1` | Sampling temperature (lower = more conservative) |\n| `-gpuid` | `0` | GPU device (`-1` for CPU) |\n| `-opencl` | `0` | Use OpenCL instead of CUDA |\n| `-verbose` | `1` | Print diagnostics (`0` = silent, text only) |\n\n### Sampling Procedure\n\n1. **Load checkpoint** — Restores `protos` and `opt`. The RNN is set to `evaluate()` mode.\n2. **Build inverse vocabulary** — `ivocab` maps integer indices back to characters.\n3. **Initialize state** — Zero tensors of shape `(1, rnn_size)` per state per layer (batch size 1 for sampling).\n4. **Prime (optional)** — If `-primetext` is provided, each character is fed through the RNN sequentially to warm up the hidden state. Each character is printed as it is processed. If no prime text is given, the initial prediction is a uniform distribution over all characters.\n5. **Generate loop** — For `length` iterations:\n   - **Select next character:**\n     - If `-sample 0`: argmax over log probabilities.\n     - If `-sample 1`: divide log probabilities by temperature, exponentiate, renormalize, then sample via `torch.multinomial`.\n   - **Forward pass** — Feed the selected character and current state into the RNN.\n   - **Print** — Output the sampled character via `io.write`.\n\nThe generated text is printed to stdout as it is produced, with a trailing newline at the end.\n\n### Temperature\n\nThe temperature parameter controls the sharpness of the output distribution:\n\n- **Temperature < 1** — Sharper distribution; the model favors high-probability characters. Approaches argmax as temperature → 0.\n- **Temperature = 1** — Unmodified distribution.\n- **Temperature > 1** — Flatter distribution; more random/diverse output.\n\n---\n\n## GPU Support\n\nBoth scripts support three compute backends, selected at startup:\n\n| Backend | Packages | Flag |\n|---|---|---|\n| CPU | (default) | `-gpuid -1` |\n| CUDA | `cunn`, `cutorch` | `-gpuid N -opencl 0` |\n| OpenCL | `clnn`, `cltorch` | `-gpuid N -opencl 1` |\n\nIf the requested GPU packages are not found, both scripts fall back to CPU mode and overwrite `opt.gpuid` to `-1`. The GPU device index uses Lua's 1-based indexing internally (`gpuid + 1`).\n\n**Important:** A checkpoint trained on GPU must be sampled on GPU, and vice versa. The sampling script prints a warning about this.\n\n---\n\n## Resuming Training\n\nTo resume from a checkpoint:\n\n```bash\nth train.lua -init_from cv/lm_lstm_epoch2.50_1.2345.t7\n```\n\nWhen `-init_from` is set:\n\n- The saved `protos` replace the newly constructed model.\n- `opt.rnn_size`, `opt.num_layers`, and `opt.model` are overwritten from the checkpoint to ensure architectural compatibility.\n- The vocabulary is checked for exact compatibility (same characters mapped to same indices).\n- Random parameter initialization is skipped; the checkpoint's parameters are used.\n- The optimizer state (`optim_state`) is **not** saved/restored, so RMSprop momentum resets. This is a known limitation.\n\n---\n\n## Key Design Decisions\n\n- **Truncated BPTT with state carry:** Hidden states persist across minibatch boundaries during both training and evaluation, providing temporal continuity. Gradients do not propagate across boundaries.\n- **Forget gate bias:** LSTM forget gates are initialized to 1.0, following Jozefowicz et al. (2015), to prevent early training instability where the network forgets too aggressively.\n- **Gradient clipping:** Element-wise clamping at `[-grad_clip, grad_clip]` prevents gradient explosions without rescaling.\n- **RMSprop:** The optimizer of choice, with per-epoch learning rate decay triggered after `learning_rate_decay_after` epochs.\n- **NaN/explosion guards:** Training halts if the loss becomes NaN or exceeds 3× the initial loss, preventing wasted compute on diverged runs.","utility-functions":"# Utility Functions\n\n# Utility Functions Module\n\nThe utility module provides low-level tensor and model manipulation routines used throughout the codebase. It is split across two files: `util/misc.lua` for general-purpose helpers and `util/model_utils.lua` for network parameter management.\n\n## Overview\n\n```mermaid\ngraph TD\n    A[util/misc.lua] --> B[clone_list]\n    C[util/model_utils.lua] --> D[combine_all_parameters]\n    C[util/model_utils.lua] --> E[clone_many_times]\n    D -->|Flattens params from| F[Multiple Networks]\n    E -->|Creates T shared-param copies of| G[Single Network]\n```\n\n---\n\n## `util/misc.lua`\n\nA small collection of standalone utility functions. Currently contains a single function.\n\n### `clone_list(tensor_list, zero_too)`\n\nCreates a deep copy of a list of tensors.\n\n**Parameters:**\n\n| Parameter | Type | Description |\n|---|---|---|\n| `tensor_list` | table | A key-value table of tensors to clone |\n| `zero_too` | bool | If truthy, each cloned tensor is zeroed out after cloning |\n\n**Returns:** A new table with the same keys, where each value is a cloned (and optionally zeroed) tensor.\n\n**Notes:**\n\n- Uses `pairs` for iteration, so both array-style and dictionary-style tables are supported.\n- The original tensors are never modified.\n\n---\n\n## `util/model_utils.lua`\n\nA module (`local model_utils = {}`) providing utilities for flattening parameters across multiple networks and cloning networks with shared parameters. Adapted from [wojciechz/learning_to_execute](https://github.com/wojciechz/learning_to_execute).\n\n### `model_utils.combine_all_parameters(...)`\n\nFlattens and concatenates all parameters and gradients from one or more network modules into single contiguous tensors. This is the multi-module equivalent of `module:getParameters()`.\n\n**Parameters:**\n\n| Parameter | Type | Description |\n|---|---|---|\n| `...` | nn.Module\\* | Variadic list of network modules |\n\n**Returns:** Two flat tensors:\n1. `flatParameters` — a 1D tensor containing all unique parameters\n2. `flatGradParameters` — a 1D tensor containing all unique gradients\n\n**How it works:**\n\nThe function handles **shared parameters** correctly — when two modules share underlying storage, the shared region is only counted once in the flat output.\n\nInternally, the `flatten` helper:\n\n1. **Collects unique storages.** Each parameter tensor is backed by a storage object. The function builds a set of unique storages (keyed by pointer address) and assigns each a running offset into a combined flat buffer.\n\n2. **Re-points parameters into a flat tensor.** Each parameter tensor is re-seated (`:set`) to reference the appropriate region of the combined flat storage, preserving its original size and stride.\n\n3. **Compacts away holes.** When storages overlap or have gaps, a mask/cumsum pass identifies unused slots (\"holes\") and produces a compact `flatUsedParameters` tensor. Parameters are re-seated a second time into this compact storage.\n\n4. **Copies original values.** The original storage data is copied into the flat tensor so that parameter values are preserved.\n\n**Usage:**\n\n```lua\nlocal model_utils = require 'util/model_utils'\nlocal flat_params, flat_grads = model_utils.combine_all_parameters(rnn, criterion, encoder)\n-- flat_params and flat_grads are now single flat tensors\n-- suitable for optimization routines like optim.rmsprop or optim.adam\n```\n\n**Important:** After calling this function, the original parameter tensors in each module are **views into** the returned flat tensors. Mutating the flat tensor mutates the module parameters, and vice versa.\n\n---\n\n### `model_utils.clone_many_times(net, T)`\n\nCreates `T` independent clones of a network that **share parameters** with the original. This is the standard pattern for unrolling recurrent networks across time steps.\n\n**Parameters:**\n\n| Parameter | Type | Description |\n|---|---|---|\n| `net` | nn.Module | The network to clone |\n| `T` | number | Number of clones to produce |\n\n**Returns:** A table of `T` cloned networks (indices 1 through T).\n\n**How it works:**\n\n1. Extracts the original network's parameters, gradients, and (if present) `parametersNoGrad`.\n2. Serializes the network to a `torch.MemoryFile` (in-memory binary).\n3. For each time step `t = 1..T`:\n   - Deserializes a fresh deep copy from the memory file.\n   - Re-points every parameter and gradient tensor in the clone to the **original** tensor's storage using `:set()`. This means all clones and the original share the same parameter values — updating one updates all.\n   - If the network has `parametersNoGrad`, those are also shared.\n4. Returns the array of clones.\n\n**Usage:**\n\n```lua\nlocal model_utils = require 'util/model_utils'\nlocal clones = model_utils.clone_many_times(rnn, seq_length)\n-- clones[1] through clones[seq_length] share parameters with rnn\nfor t = 1, seq_length do\n    local output = clones[t]:forward(inputs[t])\n    -- ...\nend\n```\n\n**Notes:**\n\n- `collectgarbage()` is called after each clone to free intermediate deserialization objects.\n- Each clone gets its own `MemoryFile` reader to avoid pointer aliasing issues during deserialization.\n- The memory file is closed after all clones are created.\n\n---\n\n## Design Rationale\n\n**Why `combine_all_parameters` instead of `getParameters`?** The standard `nn.Module:getParameters()` only works on a single module and doesn't handle the case where you need a single flat parameter vector spanning multiple independent networks (e.g., an RNN plus a criterion). This function generalizes that operation.\n\n**Why `clone_many_times` instead of simple deep copy?** A naive deep copy would duplicate parameter storage, breaking gradient accumulation across time steps. By re-pointing cloned parameters to the originals, backpropagation through any clone accumulates gradients into the shared gradient tensors — which is exactly what BPTT requires.\n\n**Why is `flatten` so complex?** The `flatten` helper accounts for shared storage between parameter tensors. If two parameters share the same underlying storage region, that region should appear only once in the flat output. The mask-and-cumsum compaction step removes duplicate slots that arise from overlapping storages, ensuring the returned flat tensor has no redundancy."};

    var parts = [];
    if (META.generatedAt) {
      parts.push(new Date(META.generatedAt).toLocaleDateString());
    }
    if (META.model) parts.push(META.model);
    if (META.fromCommit) parts.push(META.fromCommit.slice(0, 8));
    el.textContent = parts.join(' \u00b7 ');
  }

  function renderNav() {
    var container = document.getElementById('nav-tree');
    var html = '<div class="nav-section">';
    html += '<a class="nav-item overview" data-page="overview" href="#overview">Overview</a>';
    html += '</div>';
    if (TREE.length > 0) {
      html += '<div class="nav-group-label">Modules</div>';
      html += buildNavTree(TREE);
    }
    container.innerHTML = html;
    container.addEventListener('click', function(e) {
      var target = e.target;
      while (target && !target.dataset.page) { target = target.parentElement; }
      if (target && target.dataset.page) {
        e.preventDefault();
        navigateTo(target.dataset.page);
      }
    });
  }

  function buildNavTree(nodes) {
    var html = '';
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      html += '<div class="nav-section">';
      html += '<a class="nav-item" data-page="' + escH(node.slug) + '" href="#' + encodeURIComponent(node.slug) + '">' + escH(node.name) + '</a>';
      if (node.children && node.children.length > 0) {
        html += '<div class="nav-children">' + buildNavTree(node.children) + '</div>';
      }
      html += '</div>';
    }
    return html;
  }

  function escH(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function navigateTo(page) {
    activePage = page;
    location.hash = encodeURIComponent(page);

    var items = document.querySelectorAll('.nav-item');
    for (var i = 0; i < items.length; i++) {
      if (items[i].dataset.page === page) {
        items[i].classList.add('active');
      } else {
        items[i].classList.remove('active');
      }
    }

    var contentEl = document.getElementById('content');
    var md = PAGES[page];

    if (!md) {
      contentEl.innerHTML = '<div class="empty-state"><h2>Page not found</h2><p>' + escH(page) + '.md does not exist.</p></div>';
      return;
    }

    contentEl.innerHTML = marked.parse(md);

    // Rewrite .md links to hash navigation
    var links = contentEl.querySelectorAll('a[href]');
    for (var i = 0; i < links.length; i++) {
      var href = links[i].getAttribute('href');
      if (href && href.endsWith('.md') && href.indexOf('://') === -1) {
        var slug = href.replace(/\.md$/, '');
        links[i].setAttribute('href', '#' + encodeURIComponent(slug));
        (function(s) {
          links[i].addEventListener('click', function(e) {
            e.preventDefault();
            navigateTo(s);
          });
        })(slug);
      }
    }

    // Convert mermaid code blocks into mermaid divs
    var mermaidBlocks = contentEl.querySelectorAll('pre code.language-mermaid');
    for (var i = 0; i < mermaidBlocks.length; i++) {
      var pre = mermaidBlocks[i].parentElement;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = mermaidBlocks[i].textContent;
      pre.parentNode.replaceChild(div, pre);
    }
    try { mermaid.run({ querySelector: '.mermaid' }); } catch(e) {}

    window.scrollTo(0, 0);
    document.getElementById('sidebar').classList.remove('open');
  }
