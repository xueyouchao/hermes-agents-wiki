var PAGES = {"addition-project":"# Addition Project\n\n# Addition Project\n\nTrains a GPT model to perform n-digit addition by encoding arithmetic problems as flat digit sequences and learning to predict the result autoregressively.\n\n## Overview\n\nRather than teaching a model symbolic math, this project frames addition as a sequence completion task. Two n-digit numbers are concatenated into a token sequence, and the model must generate the digits of their sum. The key insight is that the sum's digits are **reversed** during encoding, aligning the causal generation order with the right-to-left carry propagation of manual addition — making the pattern far easier for an autoregressive model to learn.\n\n## Encoding Scheme\n\nFor `ndigit=2`, every example is a string of exactly `3 * ndigit + 1 - 1 = 6` tokens (input to the model) predicting 6 next-token targets, though only the result positions contribute to loss.\n\n**Example**: `85 + 50 = 135`\n\n| Component | Raw | Encoded | Notes |\n|-----------|-----|---------|-------|\n| First number (a) | 85 | `85` | Zero-padded to `ndigit` |\n| Second number (b) | 50 | `50` | Zero-padded to `ndigit` |\n| Sum (c) | 135 | `531` | Zero-padded to `ndigit+1`, then **reversed** |\n| Full sequence | — | `8550531` | Concatenation of a + b + reversed(c) |\n\n**Example**: `6 + 39 = 45` → encoded as `0639054` (padding ensures uniform length).\n\nAt inference, the first `2 * ndigit` digits are fed to the model, which generates the remaining `ndigit + 1` digits via greedy decoding. The generated digits are then reversed back to recover the sum in normal order.\n\n## Architecture\n\n```mermaid\nflowchart TD\n    A[AdditionDataset] -->|x, y batches| B[Trainer]\n    B -->|forward pass| C[GPT Model]\n    C -->|loss| B\n    B -->|on_batch_end| D[batch_end_callback]\n    D -->|every 500 iters| E[eval_split]\n    E -->|2n input digits| C\n    C -->|greedy generate| E\n    E -->|decode & compare| F[Score & Save Checkpoint]\n```\n\n## Configuration\n\n`get_config()` assembles a nested configuration from three sources:\n\n| Section | Source | Key Defaults |\n|---------|--------|-------------|\n| `system` | Inline | `seed=3407`, `work_dir='./out/adder'` |\n| `data` | `AdditionDataset.get_default_config()` | `ndigit=2` |\n| `model` | `GPT.get_default_config()` | `model_type='gpt-nano'` |\n| `trainer` | `Trainer.get_default_config()` | `learning_rate=5e-4` |\n\nConfig values can be overridden from the command line via `config.merge_from_args(sys.argv[1:])`.\n\n## AdditionDataset\n\n`AdditionDataset` is a `torch.utils.data.Dataset` that enumerates all possible n-digit addition problems and splits them into train/test sets.\n\n### Problem Space\n\nFor `ndigit=n`, there are `(10^n)^2` unique addition problems (every pair of n-digit numbers). A fixed random permutation (seed 1337) shuffles these, and the first 20% (capped at 500) become the test set. The remainder is training data.\n\n> **Note**: `ndigit` is limited to ≤ 3 because the full problem space is materialized in memory. At `ndigit=3`, this is 1,000,000 entries — manageable but approaching limits.\n\n### Key Methods\n\n| Method | Returns | Description |\n|--------|---------|-------------|\n| `get_vocab_size()` | `10` | Digits 0–9 |\n| `get_block_size()` | `3 * ndigit` | Sequence length minus 1 (no EOS token) |\n| `__len__()` | `int` | Number of examples in the split |\n| `__getitem__(idx)` | `(x, y)` | Input/target tensors for one problem |\n\n### `__getitem__` Details\n\nGiven a problem index from the permutation:\n\n1. Recover operands: `a = idx // (10^ndigit)`, `b = idx % (10^ndigit)`\n2. Compute sum: `c = a + b`\n3. Encode: zero-pad `a` and `b` to `ndigit` digits; zero-pad `c` to `ndigit+1` digits and reverse it\n4. Concatenate into a single digit list: `astr + bstr + cstr`\n5. Build `x` = all tokens except the last; `y` = all tokens except the first (standard next-token prediction)\n6. **Mask the input portion** of `y` with `-1`: positions `0` through `2*ndigit - 2` are set to `-1`, so the loss function ignores them. Only the result digits contribute to training.\n\nThis masking is critical — without it, the model would waste capacity predicting the input digits it already has.\n\n## Training Loop\n\nThe main script wires together the dataset, model, and trainer:\n\n1. **Setup**: Seed, logging, config resolution\n2. **Model construction**: `vocab_size` and `block_size` are set from the dataset before instantiating `GPT`\n3. **Trainer construction**: `Trainer` handles the optimization loop\n4. **Evaluation callback**: Registered via `trainer.set_callback('on_batch_end', batch_end_callback)`\n\n### Callback Behavior\n\n`batch_end_callback` runs after every training batch:\n\n- **Every 10 iterations**: Prints iteration time and training loss\n- **Every 500 iterations**: Runs full evaluation on both splits, saves checkpoint if score improves\n\n### Evaluation (`eval_split`)\n\n`eval_split(trainer, split, max_batches)` measures addition accuracy:\n\n1. Feeds the first `2 * ndigit` digits of each example to `model.generate()` with `do_sample=False` (greedy argmax)\n2. Extracts the generated `ndigit + 1` result digits and reverses them back to normal order\n3. Decodes all digit sequences back into integers using positional weighting (`10^i` factors)\n4. Compares predicted sum against ground truth `a + b`\n5. Prints up to 5 example mistakes for debugging\n6. Returns the count of correct predictions\n\nThe `max_batches` parameter limits evaluation cost for larger `ndigit` values (set to 5 batches for `ndigit=3`, unlimited for smaller values).\n\n### Checkpointing\n\nThe model is saved to `{work_dir}/model.pt` whenever the combined train + test correct count exceeds the previous best. Only the model's `state_dict` is saved.\n\n## Dependencies on minGPT\n\n| Component | Import | Role |\n|-----------|--------|------|\n| `GPT` | `mingpt.model` | Transformer model with `generate()` method |\n| `Trainer` | `mingpt.trainer` | Training loop with callback hooks |\n| `set_seed` | `mingpt.utils` | Reproducibility |\n| `setup_logging` | `mingpt.utils` | Logging configuration |\n| `CfgNode` | `mingpt.utils` | Hierarchical config system |\n\nThe primary integration points are `GPT.get_default_config()` for model defaults, `Trainer.get_default_config()` for trainer defaults, and `model.generate()` for autoregressive sampling during evaluation.\n\n## Running\n\n```bash\npython projects/adder/adder.py\n```\n\nCommand-line overrides follow the `CfgNode` convention (e.g., `--model.model_type gpt-micro --data.ndigit 3`).","character-level-gpt-project":"# Character-Level GPT Project\n\n# Character-Level GPT\n\nA training script that builds a character-level language model on top of the minGPT framework. It reads a raw text file, tokenizes it at the character level, and trains a GPT model to predict the next character in a sequence.\n\n## Architecture Overview\n\n```mermaid\ngraph TD\n    A[input.txt] --> B[CharDataset]\n    B --> C[DataLoader]\n    C --> D[Trainer]\n    D --> E[GPT Model]\n    D --> F[batch_end_callback]\n    F --> E\n    F --> G[model.pt checkpoint]\n    G -- load --> E\n```\n\n## Configuration\n\n### `get_config()`\n\nAssembles the full training configuration from defaults provided by each subsystem, with project-level overrides:\n\n| Section | Source | Key Overrides |\n|---------|--------|---------------|\n| `system` | Local | `seed=3407`, `work_dir='./out/chargpt'` |\n| `data` | `CharDataset.get_default_config()` | `block_size=128` |\n| `model` | `GPT.get_default_config()` | `model_type='gpt-mini'` |\n| `trainer` | `Trainer.get_default_config()` | `learning_rate=5e-4` |\n\nThe learning rate is raised from the Trainer default because `gpt-mini` is small enough to safely converge at a faster pace.\n\nAll values can be overridden from the command line via `config.merge_from_args(sys.argv[1:])`, which parses `--key=value` style arguments.\n\n## CharDataset\n\nA `torch.utils.data.Dataset` that converts a raw text string into fixed-length training examples for autoregressive modeling.\n\n### Construction\n\n```python\ntrain_dataset = CharDataset(config, data)\n```\n\n- **`config`** — A `CfgNode` containing at minimum `block_size` (the context window length in characters).\n- **`data`** — A single string of raw text (the entire corpus).\n\nOn construction, the dataset builds a sorted vocabulary from the unique characters in `data` and creates two lookup tables:\n\n| Attribute | Type | Description |\n|-----------|------|-------------|\n| `stoi` | `dict[str, int]` | Character → integer index |\n| `itos` | `dict[int, str]` | Integer index → character |\n| `vocab_size` | `int` | Number of unique characters |\n| `data` | `str` | The full raw text |\n\n### Key Methods\n\n- **`get_vocab_size()`** — Returns the vocabulary size. Called by the main script to set `config.model.vocab_size`.\n- **`get_block_size()`** — Returns `config.block_size`. Called by the main script to set `config.model.block_size`.\n- **`__len__()`** — Returns `len(data) - block_size`. Each valid starting index produces one training example.\n- **`__getitem__(idx)`** — Extracts a chunk of `block_size + 1` characters starting at `idx`, encodes them to integers, and returns `(x, y)` where:\n  - `x` = characters `[idx, idx + block_size)` — the input context\n  - `y` = characters `[idx + 1, idx + block_size + 1]` — the shifted targets\n\n  This is the standard next-token prediction setup: position `i` in `x` should predict position `i` in `y`.\n\n### Default Config\n\n```python\nCharDataset.get_default_config()\n# → CfgNode with block_size = 128\n```\n\n## Training Pipeline\n\nThe `__main__` block executes the following sequence:\n\n1. **Configuration** — `get_config()` builds defaults, then `merge_from_args` applies any CLI overrides.\n2. **Logging & Seed** — `setup_logging(config)` and `set_seed(config.system.seed)` for reproducibility.\n3. **Dataset** — Reads `input.txt`, constructs a `CharDataset`, then propagates `vocab_size` and `block_size` into the model config.\n4. **Model** — Instantiates `GPT(config.model)`. The model's `vocab_size` and `block_size` are now matched to the data.\n5. **Trainer** — Instantiates `Trainer(config.trainer, model, train_dataset)`.\n6. **Callback** — Registers `batch_end_callback` on the `on_batch_end` event.\n7. **Run** — `trainer.run()` starts the optimization loop.\n\n### Callback Behavior\n\nThe `batch_end_callback` is invoked after every training batch and handles two concerns:\n\n**Logging** (every 10 iterations): Prints the iteration number, wall-clock time per iteration (`iter_dt`), and training loss.\n\n**Sampling & Checkpointing** (every 500 iterations):\n- Switches the model to eval mode.\n- Generates 500 characters conditioned on the prompt `\"O God, O God!\"` using `model.generate()` with `temperature=1.0` and `top_k=10`.\n- Decodes the generated token indices back to a string via `train_dataset.itos`.\n- Saves the model state dict to `{work_dir}/model.pt`.\n- Switches the model back to training mode.\n\n## Integration Points\n\nThis module depends on three external minGPT components:\n\n| Component | Import | Usage |\n|-----------|--------|-------|\n| `GPT` | `mingpt.model` | The transformer model. Receives `config.model` and exposes `generate()` for sampling. |\n| `Trainer` | `mingpt.trainer` | Drives the training loop. Accepts `config.trainer`, the model, and the dataset. Exposes `iter_num`, `iter_dt`, `loss`, and `device`. Supports event callbacks via `set_callback`. |\n| `set_seed`, `setup_logging`, `CfgNode` | `mingpt.utils` | Reproducibility, logging setup, and hierarchical configuration objects. |\n\n## Running\n\n```bash\npython -m projects.chargpt.chargpt --model.model_type=gpt-mini --trainer.learning_rate=5e-4\n```\n\nThe input file `input.txt` must exist in the current working directory. Model checkpoints are written to `./out/chargpt/model.pt` by default (configurable via `--system.work_dir`).","model-architecture":"# Model Architecture\n\n# Model Architecture (`mingpt/model.py`)\n\nA complete GPT language model implementation in a single file, following the architecture of OpenAI's GPT-2 and HuggingFace's `GPT2LMHeadModel`. The design prioritizes clarity over abstraction — every component is explicit and auditable.\n\n## Architecture Overview\n\n```mermaid\ngraph TD\n    idx[\"Input token indices (B, T)\"]\n    wte[\"wte: Token Embedding\"]\n    wpe[\"wpe: Position Embedding\"]\n    drop[\"Dropout (embd_pdrop)\"]\n    blocks[\"N × Transformer Block\"]\n    ln_f[\"LayerNorm (ln_f)\"]\n    lm_head[\"lm_head: Linear → vocab\"]\n\n    idx --> wte\n    pos[\"Position indices (1, T)\"] --> wpe\n    wte --> add[\"+ (add embeddings)\"]\n    wpe --> add\n    add --> drop\n    drop --> blocks\n    blocks --> ln_f\n    ln_f --> lm_head\n\n    subgraph Block\n        ln1[\"LayerNorm (ln_1)\"] --> attn[\"CausalSelfAttention\"]\n        attn --> add1[\"+ (residual)\"]\n        add1 --> ln2[\"LayerNorm (ln_2)\"]\n        ln2 --> mlp[\"MLP (4× expansion)\"]\n        mlp --> add2[\"+ (residual)\"]\n    end\n```\n\nThe model uses **pre-norm** residual connections (LayerNorm before each sub-layer, not after), matching the GPT-2 convention. Each `Block` applies:\n\n```\nx = x + Attention(LayerNorm(x))\nx = x + MLP(LayerNorm(x))\n```\n\n## Configuration\n\n`GPT.get_default_config()` returns a `CfgNode` with all hyperparameters. You must provide **either** a `model_type` string **or** explicit `n_layer`/`n_head`/`n_embd` values — never both (enforced by XOR assertion).\n\n### Predefined Model Types\n\n| `model_type` | `n_layer` | `n_head` | `n_embd` | Approx. Params |\n|---|---|---|---|---|\n| `openai-gpt` | 12 | 12 | 768 | 117M |\n| `gpt2` | 12 | 12 | 768 | 124M |\n| `gpt2-medium` | 24 | 16 | 1024 | 350M |\n| `gpt2-large` | 36 | 20 | 1280 | 774M |\n| `gpt2-xl` | 48 | 25 | 1600 | 1558M |\n| `gopher-44m` | 8 | 16 | 512 | 44M |\n| `gpt-mini` | 6 | 6 | 192 | — |\n| `gpt-micro` | 4 | 4 | 128 | — |\n| `gpt-nano` | 3 | 3 | 48 | — |\n\nTwo parameters must always be set externally (they depend on your dataset):\n\n- **`vocab_size`** — number of tokens in your tokenizer vocabulary\n- **`block_size`** — maximum sequence length (context window)\n\n### Dropout Parameters\n\n| Parameter | Default | Applied To |\n|---|---|---|\n| `embd_pdrop` | 0.1 | After token + position embedding sum |\n| `resid_pdrop` | 0.1 | After attention output projection and after MLP output |\n| `attn_pdrop` | 0.1 | On attention weight matrix before value multiplication |\n\n## Key Components\n\n### `NewGELU`\n\nThe GELU activation used in the original GPT-2 and BERT implementations. This is the **approximate** form from the [GELU paper](https://arxiv.org/abs/1606.08415), not PyTorch's built-in `nn.GELU()` (which defaults to the exact erf-based form). The MLP in each `Block` uses this exclusively.\n\n### `CausalSelfAttention`\n\nA from-scratch multi-head causal self-attention layer. Key design choices:\n\n- **Fused QKV projection**: A single `nn.Linear(n_embd, 3 * n_embd)` produces query, key, and value in one batch, then `.split()` separates them. This matches the HuggingFace/OpenAI convention and is more efficient than three separate linear layers.\n- **Causal mask**: A lower-triangular buffer of shape `(1, 1, block_size, block_size)` is registered once. During forward, positions where `bias == 0` are filled with `-inf` before softmax, preventing attention to future tokens. The mask is sliced to the actual sequence length `T` at runtime.\n- **Scaled dot-product**: Attention scores are divided by `√(head_dim)` before softmax.\n- **Head reassembly**: After per-head attention, outputs are transposed back and concatenated along the embedding dimension, then passed through a linear projection + dropout.\n\nThe constraint `n_embd % n_head == 0` is enforced at construction time.\n\n### `Block`\n\nA single transformer block containing:\n\n1. `ln_1` → `attn` (CausalSelfAttention) → residual add\n2. `ln_2` → `mlp` → residual add\n\nThe MLP is stored as an `nn.ModuleDict` with keys `c_fc`, `c_proj`, `act`, `dropout`. The forward is composed as a lambda: `dropout(c_proj(act(c_fc(x))))`. The MLP expands to `4 * n_embd` internally (the standard 4× expansion factor from the original transformer paper).\n\n### `GPT`\n\nThe top-level model class. The full sub-module tree:\n\n```\nGPT\n├── transformer (ModuleDict)\n│   ├── wte        — Embedding(vocab_size, n_embd)\n│   ├── wpe        — Embedding(block_size, n_embd)\n│   ├── drop       — Dropout(embd_pdrop)\n│   ├── h          — ModuleList of N Blocks\n│   └── ln_f       — LayerNorm(n_embd)\n└── lm_head        — Linear(n_embd, vocab_size, bias=False)\n```\n\nNote that `lm_head` sits **outside** `self.transformer`. This matters: the parameter count printed at init only counts `self.transformer` parameters, excluding the decoder head. Weight-tied `lm_head` setups are not used here — `wte` and `lm_head` have independent weights.\n\n## Weight Initialization\n\n`_init_weights` is applied recursively via `self.apply()`:\n\n| Module Type | Weight Init | Bias Init |\n|---|---|---|\n| `nn.Linear` | Normal(0, 0.02) | Zeros |\n| `nn.Embedding` | Normal(0, 0.02) | — |\n| `nn.LayerNorm` | Ones | Zeros |\n\nAfter the recursive init, a **scaled residual projection** override is applied: any parameter whose name ends with `c_proj.weight` is re-initialized with `std = 0.02 / √(2 * n_layer)`. This is the GPT-2 paper's recommendation — it stabilizes training in deep transformers by reducing the variance growth through residual additions.\n\n## Forward Pass\n\n```python\nlogits, loss = model(idx, targets=None)\n```\n\n**Inputs:**\n- `idx` — LongTensor of shape `(B, T)` with token indices\n- `targets` — optional LongTensor of shape `(B, T)` with target token indices. Use `-1` for positions that should be ignored in loss computation.\n\n**Returns:**\n- `logits` — FloatTensor of shape `(B, T, vocab_size)`\n- `loss` — scalar cross-entropy loss, or `None` if no targets provided\n\n**Flow:**\n1. Token embeddings (`wte`) + position embeddings (`wpe`) are summed\n2. Embedding dropout is applied\n3. The sequence passes through all `Block` layers sequentially\n4. Final LayerNorm (`ln_f`) is applied\n5. `lm_head` projects to vocabulary logits\n6. If targets are given, `F.cross_entropy` computes loss with `ignore_index=-1`\n\nAn assertion enforces `T <= block_size` — sequences longer than the configured context window will raise an error.\n\n## Generation\n\n```python\noutput = model.generate(idx, max_new_tokens, temperature=1.0, do_sample=False, top_k=None)\n```\n\nAutoregressive token generation that feeds predictions back one step at a time:\n\n1. If the sequence exceeds `block_size`, it is cropped to the last `block_size` tokens (sliding window)\n2. Forward pass produces logits; only the **last timestep** logits are used\n3. Logits are divided by `temperature` (lower = sharper, higher = more random)\n4. If `top_k` is set, logits below the k-th highest value are masked to `-inf`\n5. Softmax converts logits to probabilities\n6. If `do_sample=True`, the next token is sampled via `torch.multinomial`; otherwise the greedy argmax is taken\n7. The new token is appended and the loop repeats\n\nCall `model.eval()` before generation to disable dropout.\n\n## Loading Pretrained Weights\n\n```python\nmodel = GPT.from_pretrained('gpt2')  # also: gpt2-medium, gpt2-large, gpt2-xl\n```\n\nThis class method downloads a HuggingFace `GPT2LMHeadModel` checkpoint and copies its weights into a freshly constructed minGPT model. The key complication is that OpenAI's checkpoints use a `Conv1D` module whose weight shape is transposed relative to `nn.Linear`. The method handles this by transposing weights for four specific parameter names:\n\n- `attn.c_attn.weight`\n- `attn.c_proj.weight`\n- `mlp.c_fc.weight`\n- `mlp.c_proj.weight`\n\nThe HuggingFace `attn.masked_bias` parameter is skipped (minGPT uses a registered buffer instead). All other parameters are copied directly after shape verification.\n\n## Optimizer Configuration\n\n`configure_optimizers(train_config)` separates parameters into two groups for proper weight decay:\n\n| Group | Modules | Weight Decay |\n|---|---|---|\n| **Decay** | `nn.Linear` weights | `train_config.weight_decay` |\n| **No decay** | All biases, `nn.LayerNorm` weights, `nn.Embedding` weights | 0.0 |\n\nThe method walks `named_modules()` and `named_parameters()` to classify each parameter by its parent module type and name suffix. It asserts that every parameter falls into exactly one group with no overlap. Returns a `torch.optim.AdamW` optimizer configured with `train_config.learning_rate` and `train_config.betas`.\n\n## Integration Points\n\nThe model module connects to the rest of the codebase through these entry points:\n\n- **`GPT.get_default_config()`** — called by project config builders (e.g., `projects/chargpt/chargpt.py`, `projects/adder/adder.py`) to obtain the default configuration node before overriding dataset-specific fields\n- **`GPT.from_pretrained()`** — called from test suites (`tests/test_huggingface_import.py`) to validate weight loading against HuggingFace checkpoints\n- **`GPT.generate()`** — called by training callbacks (`batch_end_callback` in adder, `batch_end_callback` in chargpt) and evaluation functions (`eval_split` in adder) to produce sample outputs during or after training","other":"# Other\n\n# Supporting Infrastructure — Demos, Projects, Tests & Packaging\n\nThis module covers the non-core supporting files in minGPT: the interactive demos, example projects, test suite, and package configuration. These components exercise and validate the core library (`mingpt.model`, `mingpt.trainer`, `mingpt.bpe`) and serve as reference implementations for common workflows.\n\n## Architecture Overview\n\n```mermaid\ngraph TD\n    A[setup.py] --> B[mingpt package]\n    C[tests/test_huggingface_import.py] --> D[GPT.from_pretrained]\n    C --> E[BPETokenizer.decode]\n    F[demo.ipynb] --> D\n    F --> G[Trainer]\n    H[generate.ipynb] --> D\n    H --> E\n    I[projects/adder] --> B\n    J[projects/chargpt] --> B\n```\n\n---\n\n## Package Setup (`setup.py`)\n\nThe package is configured as an editable install with minimal dependencies:\n\n- **Package name**: `minGPT`\n- **Version**: `0.0.1`\n- **Author**: Andrej Karpathy\n- **Required dependencies**: `torch` only\n\nInstall as an editable package so `import mingpt` works across projects:\n\n```bash\ngit clone https://github.com/karpathy/minGPT.git\ncd minGPT\npip install -e .\n```\n\nNo additional dependencies are declared — `transformers` is only needed for the HuggingFace compatibility test and the `generate.ipynb` comparison path, and must be installed separately.\n\n---\n\n## Demo Notebook (`demo.ipynb`)\n\nA self-contained walkthrough that trains a GPT model to sort sequences of digits. Runs in about a minute on a MacBook Air.\n\n### The Sorting Task\n\nThe `SortDataset` constructs input/output pairs where the model must sort a sequence of integers. For a problem of length 6 with 3 possible digit values (0, 1, 2):\n\n```\nInput:  0 0 2 1 0 1\nOutput: 0 0 0 1 1 2\n```\n\nThe input and output are concatenated into a single sequence fed to the transformer. The model predicts the next token at every position, but loss is only computed at output positions (input positions are masked with `-1`):\n\n```\nTransformer input:  0 0 2 1 0 1 0 0 0 1 1\nTarget:            I I I I I 0 0 0 1 1 2\n                   (I = -1, ignored in loss)\n```\n\n### SortDataset API\n\n| Method | Description |\n|--------|-------------|\n| `__init__(split, length=6, num_digits=3)` | `split` is `'train'` or `'test'`. Train/test split is deterministic via hashing — 25% of examples are held out as test. |\n| `get_vocab_size()` | Returns `num_digits` (the number of distinct token values). |\n| `get_block_size()` | Returns `length * 2 - 1` — the total sequence length minus one (since the transformer predicts one step ahead). |\n| `__getitem__(idx)` | Returns `(x, y)` tensors. `x` is the concatenated input-output offset by one; `y` has `-1` at input positions so loss is masked there. |\n\n**Rejection sampling**: 50% of the time, examples with too many unique digits are rejected to boost the frequency of repeated-digit patterns, which the model struggles with.\n\n### Training Flow\n\n1. Instantiate `GPT` with `model_type='gpt-nano'`, setting `vocab_size` and `block_size` from the dataset.\n2. Create a `Trainer` with `learning_rate=5e-4`, `max_iters=2000`.\n3. Register an `on_batch_end` callback to print loss every 100 iterations.\n4. Call `trainer.run()`.\n\n### Evaluation\n\nAfter training, evaluation uses `model.generate()` with `do_sample=False` (greedy decoding). The model receives only the input portion and must autoregressively produce the sorted output. Correctness is checked element-wise against the ground truth.\n\n---\n\n## Generation Notebook (`generate.ipynb`)\n\nDemonstrates conditional and unconditional text generation using either minGPT or HuggingFace's `GPT2LMHeadModel`, allowing side-by-side comparison.\n\n### Model Selection\n\nThe `use_mingpt` flag switches between the two backends:\n\n```python\nuse_mingpt = True   # uses GPT.from_pretrained() + BPETokenizer\nuse_mingpt = False  # uses GPT2LMHeadModel.from_pretrained() + GPT2Tokenizer\n```\n\nBoth paths support the same `model_type` values: `'gpt2'`, `'gpt2-medium'`, `'gpt2-large'`, `'gpt2-xl'`.\n\n### The `generate` Function\n\n```python\ngenerate(prompt='', num_samples=10, steps=20, do_sample=True)\n```\n\n| Parameter | Description |\n|-----------|-------------|\n| `prompt` | Text prompt. Empty string triggers unconditional generation (uses the `<|endoftext|>` token as seed). |\n| `num_samples` | Number of independent samples to produce in a single batch. |\n| `steps` | Number of new tokens to generate (`max_new_tokens`). |\n| `do_sample` | `True` for sampling with `top_k=40`; `False` for greedy argmax. |\n\n**Tokenization paths**:\n- **minGPT path**: `BPETokenizer` encodes the prompt. For unconditional generation, the `<|endoftext|>` token is manually extracted from `tokenizer.encoder.encoder` and used as the seed.\n- **HuggingFace path**: `GPT2Tokenizer` encodes the prompt. For unconditional generation, the string `'<|endoftext|>'` is passed (the tokenizer special-cases it).\n\nBoth paths call `model.generate(x, max_new_tokens=steps, do_sample=do_sample, top_k=40)` and decode the output token indices back to strings.\n\n---\n\n## Projects\n\n### `projects/adder`\n\nTrains a GPT model from scratch to perform n-digit addition, inspired by the addition task described in the GPT-3 paper. See `projects/adder/` for implementation details.\n\n### `projects/chargpt`\n\nTrains a character-level language model on a text file. Supports three configurations:\n\n| Setting | Description |\n|---------|-------------|\n| Custom `input.txt` | User-supplied text file (e.g. [tinyshakespeare](https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt), ~1.1MB). |\n| text8 | Wikipedia-derived benchmark, lowercased to 26 characters. |\n| enwik8 | Hutter Prize benchmark — first 100MB of Wikipedia XML dump, 205 unique tokens. |\n\n> **Note**: text8 and enwik8 benchmarks are listed as TODO and not yet implemented.\n\n---\n\n## Test Suite (`tests/`)\n\n### `test_huggingface_import.py`\n\nValidates that minGPT can load pretrained GPT-2 weights from HuggingFace and produce **identical** outputs to the reference `GPT2LMHeadModel`.\n\n**Test: `test_gpt2`**\n\nThe test performs three equivalence checks:\n\n1. **Logit equivalence**: Tokenize a prompt with both `BPETokenizer` and `GPT2Tokenizer`, forward through both models, and assert `torch.allclose` on the output logits.\n\n2. **Generation equivalence**: Run `model.generate()` with `do_sample=False` (greedy) for 20 new tokens on both models and assert `torch.equal` on the raw index sequences.\n\n3. **Decoded string equivalence**: Decode both output sequences to strings and assert exact equality.\n\nThis test is the primary correctness gate for the `GPT.from_pretrained()` weight-loading path and the `BPETokenizer` encoding/decoding path.\n\n**Running the tests**:\n\n```bash\npython -m unittest discover tests\n```\n\n---\n\n## Cross-Module Dependencies\n\n| Component | Depends on |\n|-----------|-----------|\n| `demo.ipynb` | `GPT`, `Trainer`, `mingpt.utils.set_seed` |\n| `generate.ipynb` | `GPT.from_pretrained`, `BPETokenizer`, `mingpt.utils.set_seed`, `transformers` (optional) |\n| `test_huggingface_import.py` | `GPT.from_pretrained`, `BPETokenizer.decode`, `transformers` (required) |\n| `projects/adder` | `mingpt` package |\n| `projects/chargpt` | `mingpt` package |\n\nThe `transformers` library is a test-time and demo-time dependency only — it is not required for core training or inference with minGPT's own components.","overview":"# minGPT — Wiki\n\n# minGPT\n\nA minimal, clean PyTorch re-implementation of GPT for both training and inference. minGPT strips the architecture down to its essentials — roughly 300 lines of model code — so you can actually read and understand every component. A sequence of indices goes in, a probability distribution over the next index comes out. That's the whole game.\n\n> **Note (Jan 2023):** minGPT is in a semi-archived state. For active development, see [nanoGPT](https://github.com/karpathy/nanoGPT).\n\n## Architecture at a Glance\n\n```mermaid\ngraph TD\n    RawText[\"Raw Text\"] --> Tokenization\n    Tokenization --> Model\n    Config[\"Config & Utilities\"] --> Model\n    Config --> Trainer\n    Model --> Trainer\n    Trainer --> Checkpoints[\"Saved Checkpoints\"]\n    Trainer --> Generation[\"Autoregressive Generation\"]\n    Adder[\"Addition Project\"] --> Model\n    Adder --> Trainer\n    CharGPT[\"Char-Level GPT Project\"] --> Model\n    CharGPT --> Trainer\n```\n\nThe core library lives in `mingpt/` and consists of three pieces: the [Model Architecture](model-architecture.md) (the GPT transformer itself), the [Trainer](training.md) (a generic training loop), and [Tokenization](tokenization.md) (a BPE encoder matching OpenAI's GPT-2). A shared [Utilities & Configuration](utilities-and-configuration.md) module provides reproducibility helpers and `CfgNode`, a lightweight hierarchical config system.\n\nTwo example projects demonstrate end-to-end workflows: the [Addition Project](addition-project.md) trains GPT to perform n-digit addition by framing it as sequence completion, and the [Character-Level GPT Project](character-level-gpt-project.md) trains a next-character predictor on raw text files. Both projects wire together the same core modules — they configure a GPT model, hand it to the Trainer, and use generation callbacks to inspect progress.\n\n## Key End-to-End Flows\n\n**Tokenization pipeline:** Raw text is pre-tokenized with a regex pattern, byte-encoded, and iteratively merged via BPE. The [BPETokenizer](tokenization.md) wraps this process and returns PyTorch tensors ready for the model. The flow descends through `encode_and_show_work → encode → bpe → get_pairs`.\n\n**Training loop:** The [Trainer](training.md) handles device placement, optimizer setup (delegated to the model via `configure_optimizers`), dataloader construction, gradient clipping, and iteration management. It calls a user-provided `batch_end_callback` after each step — this is where projects hook in evaluation and generation.\n\n**Generation (inference):** After training, the model's `generate` method performs autoregressive sampling. In the Addition Project, for example, the callback flow is `batch_end_callback → eval_split → generate`, producing digit-by-digit predictions of arithmetic results.\n\n## Getting Started\n\nInstall the package:\n\n```bash\npip install -e .\n```\n\nOr run the interactive `demo.ipynb` notebook, which walks through loading a pretrained GPT-2 model and generating text. See [Other / Supporting Infrastructure](other.md) for details on demos, tests, and package layout.\n\nTo train your own model, start from one of the two projects — they serve as ready-made templates. The [Character-Level GPT Project](character-level-gpt-project.md) is the simpler entry point if you just want to train on a text file.","tokenization":"# Tokenization\n\n# Tokenization Module\n\nThe BPE (Byte Pair Encoding) tokenizer converts between raw text strings and integer sequences suitable for transformer input. It is a reimplementation of OpenAI's GPT-2 encoder with added commentary and a PyTorch-friendly wrapper.\n\n## Architecture\n\nThe module has three layers: low-level byte mapping utilities, the core `Encoder` class that implements the BPE algorithm, and a `BPETokenizer` wrapper that produces PyTorch tensors.\n\n```mermaid\nflowchart TD\n    A[Raw Text] --> B[Pre-tokenize via regex]\n    B --> C[Byte-encode each chunk]\n    C --> D[Apply BPE merges]\n    D --> E[Lookup token IDs]\n    E --> F[\"torch.long tensor\"]\n    F --> BPETokenizer\n    BPETokenizer --> Encoder\n    Encoder --> bytes_to_unicode\n    Encoder --> get_pairs\n    Encoder --> bpe\n    get_encoder --> get_file\n```\n\n## Encoding Pipeline\n\nEncoding a string passes through four stages:\n\n### 1. Pre-tokenization\n\nThe regex pattern splits input text into chunks before BPE is applied. The pattern handles:\n\n| Pattern segment | What it matches | Example |\n|---|---|---|\n| `'s\\|'t\\|'re\\|'ve\\|'m\\|'ll\\|'d` | English contractions | `I'm` → `I`, `'m` |\n| ` ?\\p{L}+` | Optional space + letters | ` Hello` |\n| ` ?\\p{N}+` | Optional space + digits | ` 2022` |\n| ` ?[^\\s\\p{L}\\p{N}]+` | Optional space + punctuation/symbols | `!!`, ` :` |\n| `\\s+(?!\\S)` | Trailing whitespace (not before non-whitespace) | internal spaces |\n| `\\s+` | Remaining whitespace | trailing spaces |\n\nThis ensures BPE merges never cross word boundaries or mix letters with numbers.\n\n### 2. Byte Encoding\n\nEach pre-tokenized chunk is UTF-8 encoded into raw bytes, then every byte is mapped to a unicode character via `bytes_to_unicode()`. The 188 \"printable\" bytes (ASCII printable range, Latin-1 supplement) keep their `chr()` representation. The remaining 68 bytes (control characters, etc.) are shifted by 256 to avoid invisible or ambiguous characters. For example, the space byte (32) maps to `Ġ` (chr 288).\n\nThis guarantees every byte has a visible single-character representation and that the space character (` `) is never present in the encoded data — it is reserved as a delimiter within the BPE algorithm.\n\n### 3. BPE Merging\n\nThe `bpe()` method iteratively merges the highest-priority bigram in the token:\n\n1. Compute all adjacent character pairs (bigrams) via `get_pairs()`.\n2. Find the bigram with the lowest rank in `self.bpe_ranks`. If none is found, stop.\n3. Replace all occurrences of that `(first, second)` pair with the merged string `first+second`.\n4. Repeat until no mergeable bigrams remain or the token collapses to a single symbol.\n\nResults are memoized in `self.cache` keyed by the input token string.\n\n### 4. Token ID Lookup\n\nEach merged BPE symbol is looked up in `self.encoder` (loaded from `encoder.json`) to produce an integer. All integers across all pre-tokenized chunks are concatenated into the final output list.\n\n## Decoding Pipeline\n\nDecoding reverses the process:\n\n1. Map each integer back to its BPE string via `self.decoder`.\n2. Concatenate all BPE strings into one flat unicode string.\n3. Map each unicode character back to its original byte via `self.byte_decoder`.\n4. Decode the resulting `bytearray` as UTF-8.\n\n## API Reference\n\n### `bytes_to_unicode()`\n\nReturns `dict[int, str]` — a one-to-one mapping from every byte value (0–255) to a visible unicode character. The 188 printable bytes map to themselves; the remaining 68 map to `chr(256 + n)`.\n\n### `get_pairs(word: tuple) -> set[tuple[str, str]]`\n\nReturns the set of all adjacent character pairs in the input tuple. Used internally by `Encoder.bpe()`.\n\n### `Encoder`\n\nCore BPE encoder/decoder. Constructed with a token-to-index dictionary and a list of merge tuples.\n\n**Constructor:** `Encoder(encoder: dict[str, int], bpe_merges: list[tuple[str, str]])`\n\n| Attribute | Type | Description |\n|---|---|---|\n| `byte_encoder` | `dict[int, str]` | Byte value → unicode char |\n| `byte_decoder` | `dict[str, int]` | Unicode char → byte value |\n| `encoder` | `dict[str, int]` | BPE token string → integer ID |\n| `decoder` | `dict[int, str]` | Integer ID → BPE token string |\n| `bpe_ranks` | `dict[tuple[str,str], int]` | Merge priority (lower = merge first) |\n| `pat` | `re.Pattern` | Pre-tokenization regex |\n| `cache` | `dict[str, str]` | Memoized BPE results |\n\n**Methods:**\n\n- **`bpe(token: str) -> str`** — Applies all eligible BPE merges to a single pre-tokenized, byte-encoded chunk. Returns space-separated merged symbols. Memoized.\n- **`encode(text: str) -> list[int]`** — Full encoding pipeline: pre-tokenize → byte-encode → BPE merge → ID lookup.\n- **`encode_and_show_work(text: str) -> dict`** — Same as `encode` but returns all intermediate results for debugging. Output structure:\n  ```python\n  {\n      'bpe_idx': [15496, 3228, ...],   # final integer sequence\n      'tokens': ['Hello', '!!', ...], # pre-tokenized chunks\n      'parts': [                      # per-chunk intermediates\n          {\n              'token': ' Andrej',\n              'token_bytes': b' Andrej',\n              'token_translated': 'ĠAndrej',\n              'token_merged': ['ĠAndre', 'j'],\n              'token_ix': [10948, 73],\n          },\n          ...\n      ]\n  }\n  ```\n- **`decode(bpe_idx: list[int]) -> str`** — Reverses encoding: ID lookup → byte decode → UTF-8 string.\n\n### `get_encoder() -> Encoder`\n\nFactory function that downloads (if not cached) and loads the GPT-2 124M vocabulary files from OpenAI's blob storage, then constructs and returns an `Encoder`.\n\n- **`encoder.json`** — 50,257 entries (256 byte tokens + 50,000 merges + 1 special `<|endoftext|>` token).\n- **`vocab.bpe`** — 50,000 merge rules defining the BPE tree.\n\nFiles are cached at `~/.cache/mingpt/`.\n\n### `get_file(local_file: str, remote_file: str)`\n\nDownloads `remote_file` to `local_file` if the local file does not exist. Used by `get_encoder()`.\n\n### `BPETokenizer`\n\nPyTorch-aware wrapper around `Encoder`. Matches the HuggingFace `transformers` tokenizer interface.\n\n**Constructor:** `BPETokenizer()` — Internally calls `get_encoder()`.\n\n**`__call__(text: str, return_tensors='pt') -> torch.Tensor`** — Encodes a single string into a `torch.long` tensor with a batch dimension of 1 (shape `[1, seq_len]`). Only `return_tensors='pt'` is supported.\n\n**`decode(idx: torch.Tensor) -> str`** — Decodes a 1D tensor of token IDs back to a string.\n\n## Usage\n\n```python\nfrom mingpt.bpe import BPETokenizer\n\ntokenizer = BPETokenizer()\n\n# Encode text to a tensor\nidx = tokenizer(\"Hello world\", return_tensors='pt')\n# tensor([[15496,  1159]])\n\n# Decode back\ntext = tokenizer.decode(idx[0])\n# \"Hello world\"\n```\n\nFor debugging the intermediate steps:\n\n```python\nfrom mingpt.bpe import get_encoder\n\nenc = get_encoder()\nresult = enc.encode_and_show_work(\"Hello!! I'm Andrej\")\nprint(result['tokens'])       # pre-tokenized chunks\nprint(result['parts'])        # byte encoding, BPE merges, IDs per chunk\nprint(result['bpe_idx'])      # final integer sequence\n```\n\n## Integration with the Codebase\n\n`BPETokenizer` is the primary entry point used by the rest of minGPT. It is instantiated in model configuration and used to convert training text into `torch.long` tensors fed to the transformer, and to decode model output indices back to human-readable text. External tests (e.g., `test_gpt2`) call `Encoder.decode` directly to verify round-trip correctness against reference implementations.","training":"# Training\n\n# Trainer\n\nA generic, framework-agnostic training loop for PyTorch models. The `Trainer` class handles device placement, optimizer configuration, dataloader setup, gradient clipping, and iteration management. It is not GPT-specific — any model conforming to the expected interface can be trained with it.\n\n## Model Interface Contract\n\nThe `Trainer` expects the passed model to implement two things:\n\n1. **`model.configure_optimizers(config)`** — Must return a `torch.optim.Optimizer` instance. The trainer passes its full config object, so the model can read optimizer-relevant fields (e.g., `learning_rate`, `betas`, `weight_decay`).\n\n2. **`model(x, y)`** — Forward pass that accepts input `x` and target `y`, and returns a tuple of `(logits, loss)` where `loss` is a scalar tensor for backpropagation.\n\n## Configuration\n\n`Trainer.get_default_config()` returns a `CfgNode` with the following defaults:\n\n| Field | Default | Description |\n|---|---|---|\n| `device` | `'auto'` | `'auto'` selects CUDA if available, otherwise CPU. Pass `'cuda'` or `'cpu'` to force. |\n| `num_workers` | `4` | Number of DataLoader worker processes. |\n| `max_iters` | `None` | Maximum training iterations. `None` means train forever (must be stopped via callback or external interruption). |\n| `batch_size` | `64` | Batch size per iteration. |\n| `learning_rate` | `3e-4` | Learning rate. Consumed by `model.configure_optimizers`, not directly by the trainer. |\n| `betas` | `(0.9, 0.95)` | Adam beta parameters. Also consumed by the model's optimizer config. |\n| `weight_decay` | `0.1` | Weight decay, applied only on matmul weights (model-side logic). |\n| `grad_norm_clip` | `1.0` | Maximum gradient norm for `clip_grad_norm_`. |\n\nThese config values are typically merged into a larger project config. Projects like `chargpt` and `adder` call `Trainer.get_default_config()` and incorporate it into their own `CfgNode` hierarchy.\n\n## Initialization\n\n```python\nTrainer(config, model, train_dataset)\n```\n\n- Moves the model to the resolved device.\n- Prints the selected device.\n- Initializes iteration counters to zero: `iter_num`, `iter_time`, `iter_dt`.\n- Creates an empty callback registry.\n\nThe optimizer is **not** created at init time — it is deferred to `run()` so that the model can configure it with access to the full config.\n\n## Training Loop\n\n```python\ntrainer.run()\n```\n\nThe core training loop follows this flow each iteration:\n\n```mermaid\nflowchart TD\n    A[Fetch batch from DataLoader] --> B[Move batch to device]\n    B --> C[Forward pass: model x y]\n    C --> D[Zero gradients]\n    D --> E[Backward pass]\n    E --> F[Clip gradient norm]\n    F --> G[Optimizer step]\n    G --> H[Trigger on_batch_end callbacks]\n    H --> I{max_iters reached?}\n    I -- No --> A\n    I -- Yes --> J[Exit loop]\n```\n\n### DataLoader Strategy\n\nThe trainer uses `RandomSampler` with `replacement=True` and `num_samples=int(1e10)`. This creates an effectively infinite stream of randomly sampled batches, which:\n\n- Avoids epoch boundaries and the need for epoch-level logic.\n- Means the `StopIteration` handler in the loop is a safety net — in practice the iterator should never exhaust given the 10 billion sample cap.\n- `shuffle=False` is set because `RandomSampler` already handles randomization.\n\n### Per-Iteration Steps\n\n1. **Batch fetch** — Gets the next `(x, y)` pair from the dataloader iterator. On `StopIteration`, re-creates the iterator.\n2. **Device transfer** — Moves all tensors in the batch to the training device.\n3. **Forward** — Calls `model(x, y)`, storing `self.loss` as the returned loss scalar.\n4. **Backward** — Zeros gradients (`set_to_none=True` for memory efficiency), calls `loss.backward()`, clips gradients to `config.grad_norm_clip`, and steps the optimizer.\n5. **Callbacks** — Fires the `on_batch_end` event.\n6. **Bookkeeping** — Increments `iter_num`, computes `iter_dt` (wall time for this iteration) and updates `iter_time`.\n\n### Termination\n\nThe loop exits only when `config.max_iters` is set and `iter_num >= max_iters`. If `max_iters` is `None`, the loop runs indefinitely. To stop training without `max_iters`, use a callback that raises an exception or otherwise interrupts execution.\n\n## Callback System\n\nThe trainer provides a lightweight event-based callback mechanism for extending training behavior (logging, checkpointing, early stopping, etc.).\n\n### API\n\n```python\n# Append a callback to an event (multiple callbacks can stack)\ntrainer.add_callback('on_batch_end', my_callback)\n\n# Replace all callbacks for an event with a single one\ntrainer.set_callback('on_batch_end', my_callback)\n```\n\n### Callback Signature\n\nEvery callback receives the `Trainer` instance as its sole argument:\n\n```python\ndef my_callback(trainer):\n    # Access trainer.loss, trainer.iter_num, trainer.iter_dt, etc.\n    if trainer.iter_num % 100 == 0:\n        print(f\"iter {trainer.iter_num}, loss {trainer.loss.item():.4f}\")\n```\n\n### Available Events\n\n| Event | When it fires |\n|---|---|\n| `on_batch_end` | After optimizer step, before iteration bookkeeping |\n\nThe event system uses a `defaultdict(list)`, so any arbitrary event name can be used — but `on_batch_end` is the only one triggered by the built-in training loop. Custom events can be triggered manually via `trainer.trigger_callbacks('my_event')`.\n\n## Trainer State Attributes\n\nThese attributes are useful for callbacks and monitoring:\n\n| Attribute | Type | Description |\n|---|---|---|\n| `iter_num` | `int` | Current iteration count (0-indexed, incremented after each batch). |\n| `iter_time` | `float` | Wall-clock timestamp of the most recent iteration start. |\n| `iter_dt` | `float` | Wall-clock duration of the most recent iteration (seconds). |\n| `loss` | `Tensor` | Loss scalar from the most recent forward pass. Available after forward, readable in `on_batch_end`. |\n| `optimizer` | `Optimizer` | Set during `run()`. `None` before training starts. |\n\n## Integration with Projects\n\nProjects integrate the trainer by merging its default config and constructing it with a compatible model and dataset:\n\n```python\nfrom mingpt.trainer import Trainer\n\n# In project config setup\nC = CN()\nC.trainer = Trainer.get_default_config()\nC.trainer.max_iters = 5000\n\n# At training time\ntrainer = Trainer(config.trainer, model, train_dataset)\ntrainer.run()\n```\n\nThe model's `configure_optimizers` method reads the trainer config fields it needs (learning rate, betas, weight decay) and returns an optimizer — keeping model-specific optimizer logic (e.g., weight decay filtering) in the model where it belongs.","utilities-configuration":"# Utilities & Configuration\n\n# Utilities & Configuration\n\nThis module provides foundational infrastructure for the minGPT project: deterministic reproducibility via seed management, experiment logging, and a lightweight hierarchical configuration system.\n\n## Configuration with `CfgNode`\n\n`CfgNode` is a lightweight, nestable configuration object inspired by [yacs](https://github.com/rbgirshick/yacs). It allows you to define structured, hierarchical configs that can be overridden from the command line.\n\n### Creating a Config\n\n`CfgNode` accepts keyword arguments and stores them as attributes:\n\n```python\nfrom mingpt.utils import CfgNode\n\nconfig = CfgNode(\n    system=CfgNode(\n        work_dir=\"./output\",\n        seed=42,\n    ),\n    model=CfgNode(\n        n_layer=8,\n        n_head=8,\n        n_embd=512,\n    ),\n    trainer=CfgNode(\n        batch_size=64,\n        learning_rate=3e-4,\n    ),\n)\n```\n\nNested `CfgNode` instances form a tree. Leaf values can be any Python type (int, float, bool, str, list, None, etc.).\n\n### Accessing Values\n\nStandard attribute access works at any depth:\n\n```python\nconfig.model.n_layer  # 8\nconfig.trainer.batch_size  # 64\n```\n\n### Pretty Printing\n\n`str(config)` produces an indented representation of the full hierarchy:\n\n```\nsystem:\n    work_dir: ./output\n    seed: 42\nmodel:\n    n_layer: 8\n    n_head: 8\n    n_embd: 512\ntrainer:\n    batch_size: 64\n    learning_rate: 0.0003\n```\n\nThis is driven by `_str_helper`, which recursively indents nested `CfgNode` instances.\n\n### Serialization\n\n**`to_dict()`** recursively converts the entire config tree into a plain `dict`:\n\n```python\nconfig.to_dict()\n# {'system': {'work_dir': './output', 'seed': 42}, ...}\n```\n\nThis is used by `setup_logging` to write the config as JSON.\n\n### Merging Configs\n\n**`merge_from_dict(d)`** updates the config from a flat dict via `__dict__.update`. Note that this operates on the top-level object's namespace — it does not recursively merge nested `CfgNode` instances.\n\n**`merge_from_args(args)`** parses a list of command-line-style strings (typically `sys.argv[1:]`) and overwrites matching config attributes. This is the primary mechanism for experiment overrides.\n\n#### Command-Line Override Syntax\n\nArguments must follow the form `--key=value`, where `key` uses dot notation to traverse nested attributes:\n\n```\n--model.n_layer=10 --trainer.batch_size=32\n```\n\nThe method:\n\n1. Splits each argument on `=` to extract key and value.\n2. Uses `ast.literal_eval` to parse the value into a Python object. This means `3` becomes an int, `3.14` a float, `True`/`False`/`None` their respective types, and `[1,2,3]` a list. If `literal_eval` raises `ValueError` (i.e., the value is a plain string), the raw string is kept.\n3. Traverses the dot-separated path to find the parent `CfgNode`, then sets the leaf attribute.\n4. Asserts that the target attribute already exists in the config — you cannot add new keys via command-line overrides, only change existing ones.\n\nEach override prints a confirmation: `command line overwriting config attribute model.n_layer with 10`.\n\n```mermaid\nflowchart TD\n    A[\"sys.argv[1:]\"] --> B[\"merge_from_args\"]\n    B --> C[\"Split on '='\"]\n    C --> D[\"literal_eval value\"]\n    D --> E{\"ValueError?\"}\n    E -- Yes --> F[\"Keep as string\"]\n    E -- No --> G[\"Use parsed object\"]\n    F --> H[\"Traverse dot-path to parent CfgNode\"]\n    G --> H\n    H --> I{\"Attribute exists?\"}\n    I -- No --> J[\"AssertionError\"]\n    I -- Yes --> K[\"setattr override + print\"]\n```\n\n## Utility Functions\n\n### `set_seed(seed)`\n\nSets the random seed across all sources for reproducibility:\n\n- `random.seed(seed)` — Python's built-in RNG\n- `np.random.seed(seed)` — NumPy RNG\n- `torch.manual_seed(seed)` — PyTorch CPU RNG\n- `torch.cuda.manual_seed_all(seed)` — PyTorch RNG on all CUDA devices\n\nCall this once at the start of any experiment before any random operations occur.\n\n### `setup_logging(config)`\n\nPrepares the experiment output directory and writes two log files:\n\n| File | Contents |\n|------|----------|\n| `{work_dir}/args.txt` | The full `sys.argv` command line, joined by spaces |\n| `{work_dir}/config.json` | The complete config serialized as pretty-printed JSON |\n\n`work_dir` is read from `config.system.work_dir`. The directory is created with `exist_ok=True`, so re-runs into the same directory will overwrite the log files but won't fail.\n\n## Integration with the Codebase\n\nThis module is imported by the training scripts and model setup code throughout minGPT. The typical flow is:\n\n1. Define a default `CfgNode` hierarchy.\n2. Call `set_seed(config.system.seed)`.\n3. Call `setup_logging(config)` to create the output directory and persist the config.\n4. Call `config.merge_from_args(sys.argv[1:])` to apply any command-line overrides.\n5. Pass the config to model constructors and trainer setup.\n\n## Known Limitations\n\n- **No freezing.** `CfgNode` attributes can be modified freely after creation. There is no mechanism to lock the config, so accidental mutation is possible.\n- **No existence checks on `merge_from_dict`.** Unlike `merge_from_args`, `merge_from_dict` does not validate that keys already exist — it can silently introduce new attributes.\n- **Shallow merge only.** `merge_from_dict` calls `__dict__.update`, which replaces top-level keys rather than recursively merging nested `CfgNode` instances."};

    renderMeta();
    renderNav();
    document.getElementById('menu-toggle').addEventListener('click', function() {
      document.getElementById('sidebar').classList.toggle('open');

    if (location.hash && location.hash.length > 1) {
      activePage = decodeURIComponent(location.hash.slice(1));
    }
    navigateTo(activePage);
  });

  function renderMeta() {
    if (!META) return;
    var el = document.getElementById('meta-info');
    var parts = [];
    if (META.generatedAt) {
      parts.push(new Date(META.generatedAt).toLocaleDateString());
    }
    if (META.model) parts.push(META.model);
    if (META.fromCommit) parts.push(META.fromCommit.slice(0, 8));
    el.textContent = parts.join(' \u00b7 ');
  }

  function renderNav() {
    var container = document.getElementById('nav-tree');
    var html = '<div class="nav-section">';
    html += '<a class="nav-item overview" data-page="overview" href="#overview">Overview</a>';
    html += '</div>';
    if (TREE.length > 0) {
      html += '<div class="nav-group-label">Modules</div>';
      html += buildNavTree(TREE);
    }
    container.innerHTML = html;
    container.addEventListener('click', function(e) {
      var target = e.target;
      while (target && !target.dataset.page) { target = target.parentElement; }
      if (target && target.dataset.page) {
        e.preventDefault();
        navigateTo(target.dataset.page);
      }
    });
  }

  function buildNavTree(nodes) {
    var html = '';
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      html += '<div class="nav-section">';
      html += '<a class="nav-item" data-page="' + escH(node.slug) + '" href="#' + encodeURIComponent(node.slug) + '">' + escH(node.name) + '</a>';
      if (node.children && node.children.length > 0) {
        html += '<div class="nav-children">' + buildNavTree(node.children) + '</div>';
      }
      html += '</div>';
    }
    return html;
  }

  function escH(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function navigateTo(page) {
    activePage = page;
    location.hash = encodeURIComponent(page);

    var items = document.querySelectorAll('.nav-item');
    for (var i = 0; i < items.length; i++) {
      if (items[i].dataset.page === page) {
        items[i].classList.add('active');
      } else {
        items[i].classList.remove('active');
      }
    }

    var contentEl = document.getElementById('content');
    var md = PAGES[page];

    if (!md) {
      contentEl.innerHTML = '<div class="empty-state"><h2>Page not found</h2><p>' + escH(page) + '.md does not exist.</p></div>';
      return;
    }

    contentEl.innerHTML = marked.parse(md);

    // Rewrite .md links to hash navigation
    var links = contentEl.querySelectorAll('a[href]');
    for (var i = 0; i < links.length; i++) {
      var href = links[i].getAttribute('href');
      if (href && href.endsWith('.md') && href.indexOf('://') === -1) {
        var slug = href.replace(/\.md$/, '');
        links[i].setAttribute('href', '#' + encodeURIComponent(slug));
        (function(s) {
          links[i].addEventListener('click', function(e) {
            e.preventDefault();
            navigateTo(s);
          });
        })(slug);
      }
    }

    // Convert mermaid code blocks into mermaid divs
    var mermaidBlocks = contentEl.querySelectorAll('pre code.language-mermaid');
    for (var i = 0; i < mermaidBlocks.length; i++) {
      var pre = mermaidBlocks[i].parentElement;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = mermaidBlocks[i].textContent;
      pre.parentNode.replaceChild(div, pre);
    }
    try { mermaid.run({ querySelector: '.mermaid' }); } catch(e) {}

    window.scrollTo(0, 0);
    document.getElementById('sidebar').classList.remove('open');
  }
